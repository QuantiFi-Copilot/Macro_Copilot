# =============================================================================
# Macro Copilot — Continuous Integration
# =============================================================================
#
# Two jobs run on every PR and on every push to main:
#
#   1. lint   — ruff check (lint).  Always required.
#   2. test-substrate — pytest over the substrate-level test surface
#                       (artifacts, lineage, tool/operator config,
#                        bridge adapters).  These tests have no external
#                        dependencies (no DB, no MCP servers, no LLM
#                        calls), so they run cleanly with a minimal
#                        pip install.
#
# What CI deliberately does NOT do in PR 1:
#
#   - It does not run `ruff format --check`.  Existing code has not been
#     formatter-passed; tightening to format-check is a follow-up once
#     the format pass has landed.
#   - It does not run the wiring / SQL-validation tests.  Those require
#     a running Postgres + TimescaleDB instance and MCP subprocesses;
#     they belong to a future integration-test job (Phase 0, week 3+).
#   - It does not run the multi-agent prompt gauntlet.  That calls the
#     real Anthropic API and is gauntlet-marked; it runs by hand.
#
# Hash-stability cross-version testing on Python 3.11 + 3.12 lands in
# PR 2 alongside the hash-determinism fix.  PR 1's test-substrate job
# runs on a single Python (3.12, matching environment.yml).
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch when a new commit arrives —
# saves CI minutes and gives faster feedback on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint — ruff over the whole Python tree
  # ---------------------------------------------------------------------------
  lint:
    name: ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.5"

      - name: ruff version
        run: ruff --version

      - name: ruff check
        run: ruff check .

  # ---------------------------------------------------------------------------
  # Test — pytest over the substrate-level subset (no external deps)
  # ---------------------------------------------------------------------------
  test-substrate:
    name: pytest (substrate)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        # Minimal set sufficient for the substrate-level tests.  The
        # runtime stack (langchain, fastapi, mcp, prefect, google-cloud,
        # xbbg/blpapi) is not needed here because these tests exercise
        # pure-Python data structures (typed artifacts, lineage steps,
        # YAML config, the bridge adapter).
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest>=8.0" \
            "pytest-asyncio>=0.23" \
            "pydantic>=2.5" \
            "pandas>=2.0" \
            "numpy>=1.26" \
            "pyarrow>=14.0" \
            "scipy>=1.11" \
            "sqlalchemy>=2.0" \
            "pyyaml>=6.0"

      - name: pytest collection sanity
        # Verify the full test tree collects without import errors.  This
        # catches stale imports / missing modules before we try to run
        # the actual subset.
        run: pytest --collect-only -q

      - name: pytest (substrate subset)
        # The subset below is pure-substrate: typed artifacts, lineage
        # steps, tool / operator config validators, and the primitive
        # -> operator bridge adapter.  None of these reach the DB, the
        # MCP layer, or the LLM.  As we mark tests with the
        # `@pytest.mark.integration` marker in subsequent PRs, this
        # list expands toward `-m "not integration"` over the full
        # suite.
        run: |
          pytest \
            Macro_Copilot/tests/test_artifacts.py \
            Macro_Copilot/tests/test_tool_config.py \
            Macro_Copilot/tests/test_tool_config_lint.py \
            Macro_Copilot/tests/test_operator_config.py \
            Macro_Copilot/tests/test_adapter_from_time_series.py
