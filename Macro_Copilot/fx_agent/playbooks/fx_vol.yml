playbook_name: "fx_vol"
playbook_version: "2.0"
asset_class: "fx"
dataset_name: "fx_vol"
description: "Daily G10 FX at-the-money (ATM) implied volatility across the standard tenor strip (1W, 1M, 3M, 6M, 12M). Smile points (risk reversals, butterflies) are NOT in this playbook — they will land in a future smile-specific playbook when Phase E ships. The `smile_point: ATM` attribute on every row makes that future split clean."

extraction:
  start_date: "2000-01-01"
  incremental_window_days: 14

target_metrics:
  - metric_id: "atm_vol"
    bloomberg_field: "PX_LAST"

reference_metrics:
  - column_name: "security_name"
    bloomberg_field: "SECURITY_DES"

universe:
  # ============================================================
  # EUR/USD ATM vol strip
  # ============================================================
  - ticker: "EURUSDV1W Curncy"
    instrument_type: "fx_vol"
    fx_family: "G10_FX_VOL"
    market_scope: "G10"
    region: "Global"
    pair: "EURUSD"
    tenor: "1W"
    smile_point: "ATM"

  - ticker: "EURUSDV1M Curncy"
    instrument_type: "fx_vol"
    fx_family: "G10_FX_VOL"
    market_scope: "G10"
    region: "Global"
    pair: "EURUSD"
    tenor: "1M"
    smile_point: "ATM"

