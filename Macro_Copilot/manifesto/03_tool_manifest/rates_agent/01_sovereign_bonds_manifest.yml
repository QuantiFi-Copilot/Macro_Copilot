    one_liner: >-
      Ornstein-Uhlenbeck / AR(1) fit on a supplied series.  Returns
      half-life of mean reversion (trading days), long-run mean,
      current deviation, OU β with confidence interval, and a
      delta-method CI on the half-life itself.

    bucket_rationale: >-
      Statistical fit on the full supplied series (not rolling).  OLS
      on the AR(1) form with a β-floor and CI math; deterministic
      outcome on same input.  Surfaces a single-number diagnostic, not
      a regime detector.

    pm_overridable: []

