# =============================================================================
# calculate_ois_butterfly — tool configuration
# =============================================================================
# Canonical record of the same-curve OIS butterfly (3-point curvature on
# a SINGLE OIS curve family) tool's conventions and methodology.  Loaded
# by ``shared.config.load_tool_config`` at compute() time.  Shared
# convention names (z_score_window_days, z_score_min_periods,
# z_score_ddof, z_score_buffer_multiplier, daily_change_offset_rows,
# trailing_range_window_days, ffill_limit_days, bps_round_decimals,
# z_score_round_decimals) carry the same numeric value as every sibling
# rates tool (sovereign curve_spread / butterfly / cross_market_spread /
# OIS rate_level / curve_spread / forward_rate / cross_market_spread /
# swap_spread / the linker + ZCIS families) — the cross-config lint
# enforces value-agreement across every tool that declares the same
# convention name.  Drift on any of those is caught at lint time.
#
# The OIS-specific Bloomberg field convention is
# ``default_swap_rate_field`` (= 'PX_LAST') — distinct from sovereign
# ``default_field_name`` (= 'YLD_YTM_MID') — to keep the cross-config
# lint clean across the two families.  This mirrors the existing OIS
# rate_level / curve_spread / forward_rate / cross_market_spread
# convention exactly.
#
# Concept honesty
# ---------------
# This tool returns the CURVATURE of a single OIS swap curve family —
# i.e. the same-curve 3-point butterfly between three pillars of the
# same OIS curve family (e.g. USD_SOFR_OIS 2s5s10s, EUR_ESTR_OIS
# 2s5s10s, GBP_SONIA_OIS 2s5s10s).  The arithmetic stays in raw OIS
# par-swap-rate space — there is NO conversion to a bond-equivalent
# yield, NO subtraction of a model-derived basis, and NO routing
# through a fitted curve object.  Each endpoint OIS rate is the raw
# par-rate the Overnight Index Swap pays for fixing on the underlying
# overnight index (SOFR / ESTR / SONIA / etc.) over the swap tenor;
# the butterfly inherits the index-family of the curve and is
# interpretable under THAT curve's convention only.  Cross-curve
# butterflies (e.g. mixing USD_SOFR_OIS and EUR_ESTR_OIS pillars) are
# out of scope of this primitive (and a different concept).
#
# Butterfly formula
# -----------------
# Per-trade-date, the displayed OIS butterfly is the FIXED simple-
# butterfly weighting (a.k.a. "50-50 wings" — equal weight on the
# short and long wings, NOT DV01-neutral):
#
#   butterfly_bps = (2 * belly_rate_pct
#                    - short_rate_pct
#                    - long_rate_pct) * 100
#
# Equivalent weight tuple ``(-1, +2, -1)`` applied to
# ``(short, belly, long)`` in raw OIS par-rate space.  Sign convention:
# POSITIVE = belly cheap (i.e. belly OIS rate HIGH relative to the
# linear interpolation of the wings); NEGATIVE = belly rich.  Matches
# the sovereign sovereign_bonds/butterfly,
# inflation_indexed_bonds/real_yield_butterfly,
# inflation_indexed_bonds/breakeven_butterfly, and
# inflation_swaps/inflation_swap_butterfly sign convention.
#
# The output is reported in BPS (matching every other rates curve-shape
# view in the repo); the underlying OIS rates flow through in PERCENT.
#
# In V1 deterministic mode there is NO LLM-facing override path for
# conventions or weights.  The fixed 50-50 weights are a PR8 central
# methodology knob locked in this YAML — DV01-neutral / duration-
# weighted / PCA-weighted variants are listed under planned_extensions
# below and would ship as separate primitives.  See
# docs/architecture/tool_architecture.md.
# =============================================================================

tool:
  name: calculate_ois_butterfly_tool
  domain: ois
  category: desk_invariant_primitive
  description: |
    Same-curve 3-point butterfly (curvature) on a single OIS par-swap
    curve (e.g. USD_SOFR_OIS 2s5s10s, EUR_ESTR_OIS 2s5s10s,
    GBP_SONIA_OIS 2s5s10s).  Computed via the FIXED simple-butterfly
    weighting:

      butterfly_bps = (2 * belly_rate_pct
                       - short_rate_pct
                       - long_rate_pct) * 100

    Sign convention: POSITIVE = belly cheap (belly OIS rate HIGH
    relative to the linear interpolation of the wings); NEGATIVE =
    belly rich.  Matches the sovereign butterfly sign convention.
    Returns the current OIS butterfly with daily change, rolling
    252-day z-score, trailing 252-day high/low/percentile, the two
    component wing spreads (belly - short, long - belly) AND each
    leg's latest OIS par-swap rate, plus the bespoke wire-frozen
    butterfly time series for charting AND the two canonical
    ``shared.schemas.time_series.TimeSeries`` payloads (BPS for the
    butterfly, Z_SCORE for the rolling z-score) so the workflow /
    operator layer can compose without per-tool custom shapes.

conventions:

  # ---------------------------------------------------------------------------
  # Z-score window length (trading days)
  # ---------------------------------------------------------------------------
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading-day count for a 1-year rolling window.  Same convention
      as sovereign butterfly / curve_spread / cross_market_spread /
      yield_levels / curve_move_classifier, and every OIS / linker /
      ZCIS tool — the cross-config lint enforces the match.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Minimum observations before the rolling stat is emitted
  # ---------------------------------------------------------------------------
  z_score_min_periods:
    value: 60
    source: team_judgment_pending_review
    rationale: >-
      ~3 months of observations before the rolling mean / std are
      deemed trustworthy.  Matches every sibling rates tool.
    valid_range: [20, 252]

  # ---------------------------------------------------------------------------
  # Standard deviation degrees of freedom
  # ---------------------------------------------------------------------------
  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Sample standard deviation (Bessel-corrected, ddof=1).  Matches
      pandas' default and the convention every other rates tool uses.

  # ---------------------------------------------------------------------------
  # Calendar-day buffer for the fetch window
  # ---------------------------------------------------------------------------
  z_score_buffer_multiplier:
    value: 1.5
    source: derived_from_window
    rationale: >-
      Calendar-day buffer added to the fetch window so the rolling
      z-score AND the trailing range stat are both fully populated
      from the first displayed trading day.  1.5x trading-day window
      covers weekends + holidays.  Matches every other rates tool.
    valid_range: [1.2, 2.0]

  # ---------------------------------------------------------------------------
  # Daily-change row offset
  # ---------------------------------------------------------------------------
  daily_change_offset_rows:
    value: 2
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-2] = 1 trading day back.  Butterfly's daily
      change is a plain subtraction (the series is already in bps).
      Matches the sovereign butterfly's daily-change offset.
    valid_range: [2, 5]

  # ---------------------------------------------------------------------------
  # Trailing range / percentile window — LOCKED at 252 in V1
  # ---------------------------------------------------------------------------
  # The output schema's field names (high_252d_bps, low_252d_bps,
  # percentile_252d) embed the number; compute() raises
  # NotImplementedError if this is set to anything else.  Same wire-
  # freeze as sovereign butterfly / OIS cross_market_spread /
  # inflation_swap_butterfly.
  trailing_range_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      1Y trailing for high/low/percentile.  Locked at 252 in V1
      because the wire field names embed the number.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Forward-fill limit for missing observations
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Bridge up to one trading week of missing data across holiday
      gaps.  Matches every other rates tool; the consistency lint
      enforces the match where declared.
    valid_range: [1, 10]

  # ---------------------------------------------------------------------------
  # Output rounding precision — bps
  # ---------------------------------------------------------------------------
  bps_round_decimals:
    value: 2
    source: team_judgment_pending_review
    rationale: >-
      Round bps output (current butterfly, daily change, wing
      spreads, trailing high/low) to 0.01 bps.  Display precision;
      matches sovereign butterfly / OIS cross_market_spread / every
      other curve-shape tool.  Passed explicitly to delta_bps so
      daily_change_bps respects the YAML — see compute.py for the
      routing.
    valid_range: [0, 6]

  # ---------------------------------------------------------------------------
  # Output rounding precision — z-score
  # ---------------------------------------------------------------------------
  z_score_round_decimals:
    value: 4
    source: team_judgment_pending_review
    rationale: >-
      Round z-score output to 4 decimals.  Display precision; further
      decimals are noise given the underlying rate precision.  Matches
      every other rates tool.  Threaded to safe_float at the output
      boundary so a YAML override above 4 isn't silently truncated by
      safe_float's own default of 4 — same boundary-shadowing
      discipline as the sovereign butterfly fix from commit b2605ee.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Default Bloomberg observation field — OIS-specific name
  # ---------------------------------------------------------------------------
  # Sovereign tools use ``default_field_name: YLD_YTM_MID`` (mid
  # yield-to-maturity).  OIS quotes are par swap rates, so the
  # canonical Bloomberg observation is ``PX_LAST`` (mid par-swap
  # rate).  The two values are semantically distinct, so the
  # convention is named ``default_swap_rate_field`` here — matches
  # OIS rate_level / curve_spread / forward_rate / cross_market_spread
  # so the OIS-side cross-tool lint stays meaningful.
  default_swap_rate_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: >-
      Mid par-swap rate is the canonical OIS observation.  LLM/HTTP
      wrappers must use the empty/None sentinel so this default flows
      through — see the wrapper-shadowing fix from sovereign
      curve_move_classifier (commit b2605ee).

methodology:
  what_it_does: |
    Fetches three (curve_family, tenor) OIS par-swap-rate series —
    short wing, belly, long wing — on a SINGLE OIS curve family via
    ``fetch_tenor_group``, pivots them into a wide frame, ffills
    holiday gaps (limit = ffill_limit_days), and computes the
    butterfly as ``(2 * belly_rate_pct - short_rate_pct -
    long_rate_pct) * 100`` (bps).  Returns a snapshot with the
    current butterfly, 1-day change, rolling 252-day z-score,
    trailing 252-day high/low/percentile, the two component wing
    spreads (belly - short, long - belly), and each leg's latest OIS
    par-swap rate (percent), plus the full butterfly + z-score time
    series for charting AND the two canonical TimeSeries payloads
    (BPS butterfly + Z_SCORE z-score) for the primitive-to-operator
    bridge.

  assumptions:
    - "OIS par swap rates are stored as percent in the source DB
       (e.g. 4.25 = 4.25%); butterfly output is in bps."
    - "Same z-score conventions (window, min_periods, ddof) as every
       other rates tool — the cross-config lint enforces value
       agreement on shared convention names."
    - "FIXED simple-butterfly weighting: weight tuple (-1, +2, -1)
       on (short, belly, long) in raw OIS rate space — a.k.a. '50-50
       wings'.  This is a desk-standard fixed-weight curvature view,
       NOT a DV01-neutral or PCA-neutral butterfly.  The choice is a
       PR8 central knob locked in this YAML; the LLM cannot ask for
       non-standard weights.  DV01-neutral / duration-weighted /
       PCA-neutral variants are listed under planned_extensions and
       would ship as SEPARATE primitives if/when desk demand
       justifies them."
    - "Same-curve construction only: all three endpoints share a
       single ``curve_family`` (one of the OIS playbook families).
       Cross-curve butterflies (e.g. mixing USD_SOFR_OIS and
       EUR_ESTR_OIS pillars) are forbidden at the input schema layer
       and would be a different primitive entirely (the OIS sub-
       domain already exposes ``cross_market_spread`` for two-curve
       same-tenor comparisons; a cross-curve 3-point curvature
       primitive would compose on top of that)."
    - "Raw OIS par-swap-rate space: the arithmetic is performed on
       raw OIS par rates, NOT on a bond-equivalent yield, NOT on a
       fitted curve object, and NOT after any basis adjustment.  No
       LIBOR / OIS basis subtraction, no convexity adjustment, no
       term-premium decomposition.  This is wire-locked in the
       methodology disclosure so a downstream operator cannot misread
       the output as a cleaner expected-policy-path curvature."
    - "Daily change uses delta_bps with the bps_round_decimals
       convention threaded explicitly so the YAML is authoritative
       (same boundary-shadowing discipline as the sovereign butterfly
       fix from commit b2605ee).  The butterfly series is already in
       bps so the daily change is a plain subtraction (no *100
       multiplier)."
    - "lookback_days controls the *display* window, NOT the rolling
       z-score window or the trailing range window — those are
       independent conventions in this YAML."
    - "Observation cutoff is anchored to the data's latest observation
       date (not date.today()), matching OIS curve_spread /
       cross_market_spread / forward_rate.  The DB can be 1-3 days
       stale over weekends / holidays and wall-clock anchoring would
       produce inconsistent history."

  citations:
    - "industry_standard_1y_window (registered in
       docs/architecture/methodology_sources.md)."
    - "industry_standard_sample_std (registered in
       docs/architecture/methodology_sources.md)."
    - "bloomberg_field_convention (registered in
       docs/architecture/methodology_sources.md)."
    - "derived_from_window (registered in
       docs/architecture/methodology_sources.md)."
    - "team_judgment_pending_review (registered in
       docs/architecture/methodology_sources.md)."
    - "trading_day_convention (registered in
       docs/architecture/methodology_sources.md)."

  planned_extensions:
    - "DV01-neutral / duration-weighted OIS butterfly.  Today: fixed
       simple-butterfly weighting (-1, +2, -1) on (short, belly,
       long) in raw OIS rate space.  Some desks prefer duration-
       neutral weights so the butterfly P&L is insensitive to
       parallel curve shifts; that requires a DV01 metadata wiring
       for OIS pillars that the repo does not yet ingest.  When that
       lands, the DV01-neutral variant ships as a SEPARATE primitive
       (different concept), NOT as a config knob on this one.  The
       methodology disclosure ABOVE wire-locks the weight choice so a
       downstream operator cannot misread the output as a DV01-
       neutral butterfly."
    - "PCA-weighted OIS butterfly (statistical neutrality vs the
       first two PCA factors).  Same separate-primitive treatment as
       the DV01-neutral variant — a methodologically distinct
       curvature measure, not a config knob."
    - "trailing_range_window_days: configurable.  Currently locked
       at 252 because the output fields high_252d_bps /
       low_252d_bps / percentile_252d embed the number on the wire.
       Path to configurability: rename schema fields to
       high_window_bps / low_window_bps / percentile_window + add
       trailing_window_days to the output; remove the
       NotImplementedError guard in compute().  Same wire-freeze
       discipline as sovereign butterfly / OIS cross_market_spread /
       inflation_swap_butterfly."
    - "Closed-enum extension: the OIS curve_family whitelist on this
       primitive's input schema enumerates the curve families
       currently in rates_agent/playbooks/ois.yml (USD_SOFR_OIS,
       EUR_ESTR_OIS, GBP_SONIA_OIS, JPY_OIS, AUD_OIS, CAD_OIS).
       The catalog concept_summary references the longer overnight-
       index-suffixed labels (JPY_TONA_OIS, AUD_AONIA_OIS,
       CAD_CORRA_OIS); the playbook uses the shorter form today.
       Honest disclosure: this primitive uses the playbook's actual
       names — adding the longer suffixes would require a paired
       edit to rates_agent/playbooks/ois.yml AND the
       ``CURVE_FAMILY_TO_CURRENCY`` mapping in
       rates_agent/ois/tools/swap_spread/schemas.py.  Until those
       ship, the longer labels do not exist in the substrate and
       this primitive does not silently relabel them."
