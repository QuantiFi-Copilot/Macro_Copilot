tool:
  name: get_fx_implied_yield_differential_tool
  domain: fx_forwards
  description: |
    Single-(pair, tenor) FX implied yield differential snapshot — the
    LOCAL-minus-USD rate spread implied from forward points via
    Covered Interest Parity (CIP). PM-friendly framing of the same
    math fx_carry uses internally (carry_annualized_pct = quote-base
    rate). Pair must contain a USD leg; non-USD G10 crosses fail-
    loud V1. Sign convention HARD-LOCKED to local_minus_usd (no fake
    PR8 knob — sign-flipping is presentation, not methodology).
    Quoted in PERCENT, annualized at 252 trading days/year.
  category: desk_invariant_primitive

conventions:
  default_fx_spot_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: >-
      Bloomberg PX_LAST is the canonical spot observation used as the
      denominator. Matches fx_carry / forward_curve.

  default_fx_forward_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: >-
      Bloomberg PX_LAST is the canonical forward-points observation.
      Matches fx_carry / forward_curve.

  default_tenor:
    value: 1M
    source: team_judgment_pending_review
    rationale: >-
      1M is the standard monitor tenor across the FX vol / forwards
      tooling family.

  tenor_1w_days:
    value: 5
    source: trading_day_convention
    rationale: Approximate one FX trading week.
    valid_range: [3, 10]

  tenor_1m_days:
    value: 21
    source: trading_day_convention
    rationale: Approximate one FX trading month.
    valid_range: [15, 30]

  tenor_3m_days:
    value: 63
    source: trading_day_convention
    rationale: Approximate three FX trading months.
    valid_range: [45, 90]

  tenor_6m_days:
    value: 126
    source: trading_day_convention
    rationale: Approximate six FX trading months.
    valid_range: [90, 180]

  tenor_12m_days:
    value: 252
    source: trading_day_convention
    rationale: >-
      One FX trading year. Coherent with annualization_days for the
      12M / 252 = 1 collapse.
    valid_range: [240, 270]

  annualization_days:
    value: 252
    source: industry_standard_trading_year
    rationale: >-
      Trading-day annualization. Coherent with fx_carry / forward_curve
      so a cross-tool identity check holds:
      |local_minus_usd_differential| == |fx_carry.carry_annualized_pct|
      for every (pair, tenor) with USD leg.

  jpy_forward_points_divisor:
    value: 100
    source: bloomberg_field_convention
    rationale: >-
      JPY pairs quote forward points in hundredths of one spot unit.
      Same convention as fx_carry / forward_curve via the shared
      points_to_spot_units helper.
    valid_range: [1, 10000]

  default_forward_points_divisor:
    value: 10000
    source: bloomberg_field_convention
    rationale: >-
      Non-JPY pairs quote forward points in ten-thousandths of one
      spot unit. Same convention as fx_carry / forward_curve.
    valid_range: [1, 100000]

  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      One trading year of rolling history on the differential series.
      Matches every other FX vol / level / curve tool so cross-asset
      readers see comparable z-scores.
    valid_range: [60, 504]

  z_score_min_periods:
    value: 60
    source: industry_standard_1y_window
    rationale: >-
      Minimum observations before a z-score is emitted; below this
      the rolling stat is too noisy.
    valid_range: [20, 252]

  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: Sample (Bessel-corrected) standard deviation.
    valid_range: [0, 1]

  trailing_range_window_days:
    value: 252
    source: legacy_default_pre_pilot
    rationale: >-
      Locked at 252 in V1; the schema field names (high_252d / low_252d
      / percentile_252d) embed the number — a convention change without
      renaming would silently lie (PR14).
    valid_range: [252, 252]

  daily_change_periods:
    value: 1
    source: industry_standard_daily_changes
    rationale: One trading-day offset for the daily change calculation.
    valid_range: [1, 3]

  weekly_change_periods:
    value: 5
    source: industry_standard_daily_changes
    rationale: One trading-week offset (5 trading days).
    valid_range: [5, 10]

  monthly_change_periods:
    value: 21
    source: industry_standard_daily_changes
    rationale: Approximate one trading month (21 trading days).
    valid_range: [20, 30]

  ffill_limit_days:
    value: 5
    source: legacy_default_pre_pilot
    rationale: >-
      Forward-fill window for missing daily observations before a gap
      is treated as a true NA. 5 trading days covers standard holiday
      clusters. Matches fx_carry / forward_curve.
    valid_range: [0, 10]

  spot_round_decimals:
    value: 6
    source: legacy_default_pre_pilot
    rationale: Six decimals preserves major-pair spot precision.
    valid_range: [2, 8]

  forward_points_round_decimals:
    value: 3
    source: legacy_default_pre_pilot
    rationale: Three decimals matches the monitor display precision.
    valid_range: [0, 6]

  yield_pct_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals for the yield differential in PERCENT. Aligns with
      the platform-wide 4-decimal rule for rate / vol pct outputs.
    valid_range: [2, 6]

  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: Four decimals for z-score (platform-wide convention).
    valid_range: [2, 6]

  percentile_round_decimals:
    value: 2
    source: legacy_default_pre_pilot
    rationale: Two decimals for percentile rank (0-100 scale).
    valid_range: [0, 4]

methodology:
  what_it_does: |
    For one (pair, tenor) with a USD leg:
      1. Fetch spot and forward-points history over the lookback window.
      2. Inner-join by trade_date.
      3. Convert forward points to spot units (JPY-aware divisor).
      4. Compute outright = spot + fp_spot_units per date.
      5. Compute the raw CIP differential:
            raw_diff_pct = (outright / spot - 1) * (252 / tenor_days) * 100
         which equals (rate_quote - rate_base) per CIP.
      6. Apply usd_leg_position sign convention:
            USDxxx (USD = base):       local_minus_usd = +raw_diff_pct
            xxxUSD (USD = quote):      local_minus_usd = -raw_diff_pct
      7. Snapshot + 1/5/21-day changes + rolling 252-day z-score /
         percentile / high / low on the differential series.

    The local_minus_usd convention is HARD-LOCKED — no PR8 knob to
    flip the sign at runtime (presentation choice, not methodology).
  assumptions:
    - "Implied yield differential = LOCAL minus USD rate, where 'local' is the non-USD leg of the pair (EURUSD → EUR; USDMXN → MXN; USDJPY → JPY). Positive = local rate exceeds USD rate; negative = local rate below USD rate."
    - "CIP math: (F/S - 1) * (annual/tenor_days) ≈ rate_quote - rate_base for small spreads. Sign-adjusted via usd_leg_position to always express LOCAL minus USD regardless of quote convention. Exact identity vs fx_carry.carry_annualized_pct: |diff| equal within rounding for the same (pair, tenor)."
    - "Pair MUST contain a USD leg. Non-USD G10 crosses (EURJPY, GBPCHF, EURGBP, ...) raise ValueError at compute time. 'Local vs USD' is undefined when no leg is USD; a future quote-aware cross variant would land as a separate tool."
    - "Annualization at 252 trading days / year — same as fx_carry / forward_curve / vol_risk_premium so any cross-tool identity / drift check holds."
    - "JPY-aware divisor handling via shared.fx_agent.forwards._shared.points_to_spot_units — JPY pairs use 100, non-JPY use 10000."
  citations: []
  planned_extensions:
    - "Add quote-aware variant for non-USD crosses (EURJPY, GBPCHF, ...) once a downstream consumer needs it. Would need a 'numerator_currency' selector replacing the implicit USD."
    - "Add CIP-violation primitive (cross-currency basis = FX-implied yield - OIS reference) once Phase C CIP work lands and the rates OIS substrate is ready to join."
