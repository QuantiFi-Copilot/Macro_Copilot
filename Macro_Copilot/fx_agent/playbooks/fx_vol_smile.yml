playbook_name: "fx_vol_smile"
playbook_version: "2.0"
asset_class: "fx"
dataset_name: "fx_vol_smile"
description: "Daily FX implied volatility SMILE points (risk reversals + butterflies, 25-delta + 10-delta). Combined G10 + EM in a single playbook per Codex (discriminator is market_scope, not file). v1.0 seeded 156 instruments at tenors 1M / 3M / 1Y (72 G10 + 84 EM). v2.0 (Warehouse seeding 2026-05-25) adds USDCNH + USDINR smile at 1M / 3M / 1Y (24 new entries, fills the v1.0 EM-coverage gap) and EXTENDED tenors 1W + 6M for 13 pairs (6 G10 + 7 EM core MXN/BRL/ZAR/TRY/PLN/HUF/KRW; IDR/PHP excluded — sparse at 1W/6M per discovery) = 104 new entries. Total: 284 instruments. Same unit family as fx_vol.yml (ATM) — vol points in percent for ATM-equivalent, signed for RR. BBG convention 1Y is aliased to internal '12M' to match fx_vol convention; 1W / 6M kept verbatim. Phase E smile tools will consume this substrate."

extraction:
  start_date: "2000-01-01"
  incremental_window_days: 14

target_metrics:
  - metric_id: "smile_vol"
    bloomberg_field: "PX_LAST"

reference_metrics:
  - column_name: "security_name"
    bloomberg_field: "SECURITY_DES"

universe:

