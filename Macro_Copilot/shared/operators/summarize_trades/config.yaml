operator:
  name: summarize_trades
  method_family: trade_summary
  version: "1.0.0"
  description: >-
    Compute summary metrics over a per-trade P&L Panel.  Output is
    a single-row Panel whose columns are hit rate, mean P&L, Sharpe,
    max drawdown, and P&L distribution percentiles.

defaults:
  trading_days_per_year:
    value: 252
    source: industry_standard_252_business_days
    rationale: >-
      Standard business-day convention for annualisation
      (sqrt(252 / holding_window)).  Configurable for non-rates
      asset classes (e.g. 260 for some FX conventions), though
      Phase 1 V1 is rates-only.

  pnl_aggregation_method:
    value: final_pnl
    source: operator_v1_default
    rationale: >-
      V1 summarises trades by their FINAL P&L (last non-NaN value
      in each trade's column).  ``cumulative_max`` and
      ``time_weighted`` are declared values for forward-compat
      but raise NotImplementedError in V1.
    valid_values: [final_pnl, cumulative_max, time_weighted]

  empty_tradeset_policy:
    value: nan_metrics
    source: operator_v1_default
    rationale: >-
      When the input P&L Panel has zero trade columns (the
      upstream TradeSet was empty), V1 emits a single-row Panel
      with every metric set to NaN and a ``notes`` entry on the
      lineage step explaining the empty-set case.  This keeps
      downstream code from special-casing the empty TradeSet.
    valid_values: [nan_metrics, raise]

methodology:
  what_it_does: >-
    For each trade column ``trade_<i>_pnl``, the operator takes
    the FINAL non-NaN value as that trade's realised P&L.  Across
    trades it computes hit_rate (fraction >= 0), mean_pnl, Sharpe
    (annualised by sqrt(trading_days_per_year / holding_window) —
    holding_window is read from the upstream TradeSet's lineage),
    max_drawdown over the cumulative trade-realised series, and
    the P&L distribution at p10/p50/p90.  The output Panel has
    ONE row whose timestamp is the latest exit date in the P&L
    Panel, and one column per metric.  Units: hit_rate / Sharpe /
    drawdown → RATIO (Sharpe + drawdown can be negative; the
    artifact-store's RATIO unit allows the sign).  Mean + p10 /
    p50 / p90 inherit the asset's native units from the input
    Panel.
  planned_extensions:
    - "ScalarMetric closed-family artifact for the metric values (vs the current Panel-with-one-row encoding)"
    - "Per-trade win/loss attribution columns (carry vs price decomposition)"
    - "Information ratio / Calmar / Omega for richer return statistics"
    - "Cumulative-curve emission alongside the summary scalars"
    - "cumulative_max and time_weighted pnl_aggregation_method options"
