playbook_name: "fx_forwards_1m"
playbook_version: "1.0"
asset_class: "fx"
dataset_name: "fx_forwards_1m"
description: "Daily G10 FX 1M forward points for carry and relative value analysis."

extraction:
  start_date: "2005-01-01"
  incremental_window_days: 14

target_metrics:
  - metric_id: "forward_points_1m"
    bloomberg_field: "PX_LAST"

reference_metrics:
  - column_name: "security_name"
    bloomberg_field: "SECURITY_DES"

universe:
  - ticker: "EURUSD1M Curncy"
    instrument_type: "fx_forward"
    fx_family: "G10_1M_FORWARDS"
    market_scope: "G10"
    region: "Global"
    pair: "EURUSD"
    tenor: "1M"
    base_ccy: "EUR"
    quote_ccy: "USD"

  - ticker: "GBPUSD1M Curncy"
    instrument_type: "fx_forward"
    fx_family: "G10_1M_FORWARDS"
    market_scope: "G10"
    region: "Global"
