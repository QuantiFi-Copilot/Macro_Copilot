operator:
  name: summarize_series
  method_family: aggregation
  version: "1.1.0"
  description: >-
    Collapse a typed Series to ONE scalar summary statistic
    (mean / median / std / sum / count / last / first / quantile),
    emitted as a ScalarMetric carrying the input's units.  This is
    the canonical "what is the average / std / current value /
    percentile of X" terminal.  Always reports dispersion in
    lineage.  Finance-blind.  v1.1.0 added statistic='quantile'
    (the q-th full-sample empirical quantile, type-7 linear
    interpolation, in the input's units) per the OPR4
    extend-don't-add ruling.

defaults:
  statistic:
    value: mean
    source: operator_v1_default
    rationale: >-
      Default ``mean`` matches the canonical desk summary (the average
      of X over the period).  ``median`` is the robust alternative;
      ``std``/``sum``/``count`` cover the dispersion / aggregation
      cases when the central tendency is not the deliverable; ``last``
      returns the latest finite observation (the "current value" of
      the series) and ``first`` the earliest.  ``quantile`` (v1.1.0)
      returns the ``q``-th full-sample empirical quantile — LINEAR
      INTERPOLATION between order statistics (Hyndman–Fan type 7, the
      pandas default; this materially affects small-sample tail
      reads and is named here rather than silently inherited) — the
      dimensionful percentile/tail read, in the input's units (a
      quantile of a BPS series is a BPS number, never a ratio).
    valid_values: [mean, median, std, sum, count, last, first, quantile]

  q:
    value: 0.5
    source: operator_v1_default
    rationale: >-
      Quantile level for ``statistic='quantile'`` only (nulled in
      lineage otherwise — the ddof doctrine).  0.5 (the median) is
      the canonical central quantile; tail studies override at the
      call site (0.05 for the downside tail — the desk's historical-
      VaR-style read — 0.95 for the upside).  Open interval (0, 1):
      the endpoints are degenerate (min/max, not quantiles).

  dispersion:
    value: std
    source: operator_v1_default
    rationale: >-
      Always report dispersion alongside the central tendency —
      mirrors the ``conditional_aggregate`` discipline so per-regime
      summaries have parity with event-study summaries.  Default
      ``std`` is the canonical sample standard deviation; ``mad``
      (median-absolute-deviation) is the robust alternative for
      heavy-tailed distributions; ``none`` opts out (rare; only when
      the caller has a methodology reason to suppress the
      dispersion record).
    valid_values: [std, mad, none]

methodology:
  what_it_does: >-
    Given a typed ``Series``, the operator:

      1. Drops NaN cells from the payload (the rolling-fit warmup
         and any per-regime no-coverage gaps would otherwise bias
         the statistic).
      2. Applies the chosen ``statistic`` — mean / median / std /
         sum / count / last / first / quantile (the q-th full-sample
         empirical quantile, computed by linear interpolation between
         order statistics — Hyndman–Fan type 7, the pandas default;
         v1.1.0) — on the cleaned payload.
      3. Computes the chosen ``dispersion`` (std / mad) on the
         same cleaned payload, OR records "none" when dispersion
         is suppressed.
      4. Returns a ``ScalarMetric``: a single finite scalar with
         ``metric_key`` equal to the statistic name
         ("quantile_<q>" for quantiles, so the scalar is
         self-describing) and units inherited 1:1 from the input.
         Lineage records the central-tendency value, dispersion
         value, n_observations, n_dropped, and the consumed q/ddof
         (each nulled when its statistic does not use it — OPR14).
  planned_extensions:
    - "weighted aggregations (weighted mean / weighted median)"
    - "trimmed-mean and winsorized statistics for tail-robust summaries"

# ============================================================================
# CARD — the L3 Composer's view of this operator (PR-2 of open-DAG PoC).
# ============================================================================
card:
  one_line: >-
    THE single-number summary operator: collapse a whole Series to ONE
    full-sample statistic (mean / median / std / sum / count / last /
    first / quantile) as a ScalarMetric — a single scalar answer, NOT
    a time series.
  when_to_use:
    - "Mean / average, std / volatility, median, sum, or count of a Series over the full sample → statistic='mean'|'std'|'median'|'sum'|'count'. ONE number out."
    - "CURRENT / LATEST value ('what is the current / latest X', e.g. 'the current US 10Y yield') → statistic='last' (latest finite point as a ScalarMetric); statistic='first' for the earliest."
    - "MEAN AND STD together → statistic='mean', dispersion='std' (mean is the value; std rides in lineage) — the sanctioned single node for 'mean and std of X'."
    - "A full-sample PERCENTILE LEVEL ('the 5th-percentile level of the spread') → statistic='quantile' with q.  ONE number in the input's units."
  when_not_to_use:
    - "ROLLING / time-varying stat (moving average / rolling vol AS A SERIES, one value per date) → rolling_statistic, not this. summarize_series emits ONE value."
    - "Where today's value sits vs its own history (z-score / percentile) → rolling_zscore or percentile_rank."
    - "Per-offset summary of an event-window panel → conditional_aggregate (Panel → Series-by-offset)."
    - "THREE+ distinct stats, or min / max (unsupported): pick the single most important stat, or refuse naming the limit."
  upstream_requirements:
    - "One Series.  No alignment needed (single input)."
  downstream_pattern:
    - "Output is a ScalarMetric (one finite scalar, input's units, metric_key = the statistic name).  summarize_series IS the terminal node for any single-number summary — no further wiring."
  knobs_quick_ref:
    statistic: "mean (default) | median | std | sum | count | last (current value) | first | quantile (set q).  No min/max — use rolling_statistic."
    q: "0.5 default — quantile level in (0, 1), statistic='quantile' only; 0.05/0.95 = tail reads."
    dispersion: "std (DEFAULT, recorded in lineage) | mad (robust) | none (strictly one number out)."
  example_shapes:
    - description: "Average over the full sample — summarize_series IS the terminal."
      shape: "Series -> summarize_series(statistic='mean') -> ScalarMetric(mean)  [terminal]"
    - description: "Current / latest value ('the current US 10Y yield')."
      shape: "Series -> summarize_series(statistic='last') -> ScalarMetric(last)  [terminal]"
    - description: "Mean AND std in one node (mean is the value; std in lineage)."
      shape: "Series -> summarize_series(statistic='mean', dispersion='std') -> ScalarMetric  [terminal]"
  sibling_operators:
    - rolling_statistic: "TIME-VARYING sibling — the stat AS A SERIES over time (moving average / rolling vol), not one number."
    - conditional_aggregate: "Per-offset sibling — use when input is WindowedPanel, not Series."
  intent_hints: [transform, lookup]
