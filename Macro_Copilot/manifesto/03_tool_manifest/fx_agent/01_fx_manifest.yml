# =============================================================================
# FX Agent — tool manifest
# =============================================================================
# Canonical source of truth for the first FX-agent tool catalogue entries.
# Same schema as the Rates manifests. Each built entry must resolve to:
# implementation code, Pydantic schema, compute function, and config.yaml
# unless config is explicitly N/A for a scanner-style batch surface.
# =============================================================================

tools:
  # ---------------------------------------------------------------------------
  # SPOT SNAPSHOTS
  # ---------------------------------------------------------------------------

  - name: get_fx_spot_level
    domain: fx
    sub_agent: spot
    bucket: 1A
    category: snapshots
    status: built

    implementation:
      mcp_server: fx_agent/mcp_server.py
      tool_function: get_fx_spot_level_tool
      schema: fx_agent/spot/tools/spot_levels/schemas.py::FXSpotLevelInput
      compute: fx_agent/spot/tools/spot_levels/compute.py::get_fx_spot_level
      config: fx_agent/spot/tools/spot_levels/config.yaml

    one_liner: >-
      Single-pair FX spot snapshot — latest spot, daily / weekly /
      monthly percentage change, rolling 252-day z-score, trailing
      252-day high / low / percentile, and observation count.

    bucket_rationale: >-
      Deterministic arithmetic over stored FX spot observations.
      Methodology and display precision are YAML-locked; no model
      inference and no LLM-facing override path in V1.

    pm_overridable: []

    related_tools:
      - scan_fx_spot_tool
      - calculate_fx_carry_tool

    workflows:
      - fx_monitor_card
      - fx_spot_workspace

    references: []

    built_date: 2026-05-20
    validation_status: >-
      Structurally aligned; Bloomberg ingestion / parity validation pending.

  # ---------------------------------------------------------------------------
  # SPOT SCREENING
  # ---------------------------------------------------------------------------

  - name: scan_fx_spot
    domain: fx
    sub_agent: spot
    bucket: 1A
    category: screening
    status: built

    implementation:
      mcp_server: fx_agent/mcp_server.py
      tool_function: scan_fx_spot_tool
      schema: fx_agent/spot/tools/schemas/__init__.py::FXScannerInput
      compute: fx_agent/spot/tools/scanner.py::run_fx_scanner
      config: N/A

    one_liner: >-
      Scans FX spot pairs in the database, ranks the top-N by absolute
      rolling 252-day z-score, and returns spot, momentum, z-score, and
      a deterministic signal label per row.

    bucket_rationale: >-
      Deterministic batch screen over stored FX spot observations.
      Ranking and labels are pure arithmetic / rules; no model state.

    pm_overridable:
      - market_scope
      - top_n

    related_tools:
      - get_fx_spot_level_tool
      - calculate_fx_carry_tool

    workflows:
      - fx_monitor_card
      - fx_extremes_workspace

    references: []

    built_date: 2026-05-20
    validation_status: >-
      Structurally aligned; scanner config extraction pending.

  # ---------------------------------------------------------------------------
  # FORWARDS / CARRY
  # ---------------------------------------------------------------------------

  - name: calculate_fx_carry
    domain: fx
    sub_agent: forwards
    bucket: 1A
    category: forwards_classify
    status: built

    implementation:
      mcp_server: fx_agent/mcp_server.py
      tool_function: calculate_fx_carry_tool
      schema: fx_agent/forwards/tools/fx_carry/schemas.py::FXCarryInput
      compute: fx_agent/forwards/tools/fx_carry/compute.py::get_fx_carry
      config: fx_agent/forwards/tools/fx_carry/config.yaml

    one_liner: >-
      Cross-sectional FX carry scanner over the G10 forward universe at a
      given tenor. Joins per-date spot and forward-points history, converts
      points into spot units with the JPY-aware divisor, annualises by a
      trading-day basis, and per pair computes a rolling 252-day z-score /
      percentile / range on the carry_annualized_pct series. Rows are
      ranked by signed carry, absolute carry, or absolute carry z-score
      and optionally capped to top-N.

    bucket_rationale: >-
      Deterministic forward-points arithmetic over stored spot and forward
      observations, joined per date so no historical row uses today's
      spot. Tenor-day, annualization, points-divisor, z-score window, and
      trailing-range window conventions are YAML-locked. The rolling-stat
      computation delegates to shared.analytics.levels.compute_level_metrics
      (the same generic operator the rates yield_levels tool uses).

    pm_overridable:
      - tenor
      - rank_by
      - top_n
      - lookback_days

    related_tools:
      - get_fx_spot_level_tool
      - scan_fx_spot_tool
      - get_fx_forward_curve_tool

    workflows:
      - fx_carry_monitor
      - fx_forwards_workspace
      - fx_carry_scanner

    references: []

    built_date: 2026-05-20
    validation_status: >-
      Phase A scanner extension shipped 2026-05-24 — 12M annualisation
      bug fixed, lookahead-free historical z-score on carry_annualized_pct,
      latest-common-date snapshot alignment. Targeted regression tests
      pending in the same step-7 PR slice.

  # ---------------------------------------------------------------------------
  # FORWARDS / TERM STRUCTURE
  # ---------------------------------------------------------------------------

  - name: get_fx_forward_curve
    domain: fx
    sub_agent: forwards
    bucket: 1A
    category: forwards_classify
    status: built

    implementation:
      mcp_server: fx_agent/mcp_server.py
      tool_function: get_fx_forward_curve_tool
      schema: fx_agent/forwards/tools/forward_curve/schemas.py::FXForwardCurveInput
      compute: fx_agent/forwards/tools/forward_curve/compute.py::get_fx_forward_curve
      config: fx_agent/forwards/tools/forward_curve/config.yaml

    one_liner: >-
      For one G10 pair, returns the full forward-curve term structure
      across 1W / 1M / 3M / 6M / 12M tenors with raw forward points,
      spot-unit forward points, outright forward, carry in basis points,
      annualised carry %, and a rolling 252-day z-score / percentile /
      range on the spot-unit forward points. Numerically consistent with
      calculate_fx_carry at any given (pair, tenor).

    bucket_rationale: >-
      Deterministic per-tenor SQL fetch + the shared per-pair divisor and
      tenor-day conventions, joined per date. Z-score / percentile / range
      delegate to shared.analytics.levels.compute_level_metrics. Tenor
      set, divisor, annualization and rolling-window conventions are all
      YAML-locked.

    pm_overridable:
      - pair
      - lookback_days
      - field_name

    related_tools:
      - calculate_fx_carry_tool
      - get_fx_spot_level_tool
      - scan_fx_spot_tool

    workflows:
      - fx_forwards_workspace
      - fx_carry_monitor

    references: []

    built_date: 2026-05-24
    validation_status: >-
      Cross-tool consistency verified: every (EURUSD, tenor) returns
      identical carry_annualized_pct via calculate_fx_carry and
      get_fx_forward_curve. Targeted compute / wiring tests pending in
      the same step-7 PR slice.

  # ---------------------------------------------------------------------------
  # CROSS-SECTIONAL PANEL (Phase B cornerstone primitive)
  # ---------------------------------------------------------------------------

  - name: calculate_fx_panel
    domain: fx
    sub_agent: spot
    bucket: 1A
    category: cross_sectional_panel
    status: built

    implementation:
      mcp_server: fx_agent/mcp_server.py
      tool_function: calculate_fx_panel_tool
      schema: fx_agent/spot/tools/fx_panel/schemas.py::FXPanelInput
      compute: fx_agent/spot/tools/fx_panel/compute.py::calculate_fx_panel
      config: fx_agent/spot/tools/fx_panel/config.yaml

    one_liner: >-
      Cross-sectional Panel of FX spot levels for a market_scope subset
      (G10 = 9 majors, EM = 9 EM majors, G10_CROSSES = 11 G10 crosses,
      ALL = 29 fx_spot instruments). Returns a typed Panel artifact
      (rows = dates, columns = pair names, units = PRICE) ready for
      downstream cross-sectional operators (returns, drawdown, realized
      vol, correlation matrix, carry basket, factor decomposition,
      regime classifier).

    bucket_rationale: >-
      Deterministic pivot of stored market_data_daily into a wide
      Panel with pair-name columns. Filter (market_scope → fx_family)
      and missing-data / calendar / ffill conventions are YAML-locked.
      Substrate-primitive discipline: fail-loud on empty fetch /
      unknown scope / fully-empty pair / strict-policy NaN residual —
      downstream code cannot mistake a degraded fetch for a valid
      empty Panel.

    pm_overridable:
      - market_scope
      - start_date
      - end_date
      - missing_data_policy
      - field_name

    related_tools:
      - get_fx_spot_level_tool
      - scan_fx_spot_tool
      - calculate_fx_carry_tool

    workflows:
      - fx_panel_workspace
      - fx_correlation_monitor
      - fx_carry_basket_screen

    references:
      - rates_agent/sovereign_bonds/tools/sovereign_yield_panel
      - shared/analytics/fx_fetch.py

    built_date: 2026-05-25
    validation_status: >-
      Smoke-tested live: G10 returns 9 pairs, EM returns 9 pairs,
      G10_CROSSES returns 11 pairs, ALL returns 29 pairs. Typed Panel
      round-trips cleanly via FXPanelOutput.model_validate. Empty
      window + invalid scope correctly raise ValueError /
      ValidationError. Targeted compute / wiring / sql_validation tests
      included.
