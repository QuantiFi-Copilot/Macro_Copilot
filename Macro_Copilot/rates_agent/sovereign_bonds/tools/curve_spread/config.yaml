# =============================================================================
# calculate_curve_spread_tool — tool configuration
# =============================================================================
# This file is the canonical record of the tool's conventions and methodology.
# It is loaded by `shared.config.load_tool_config` at compute() time; the
# parameter resolution path is:
#
#   query-time inputs    → CurveSpreadInput (Pydantic, LLM-facing)
#   conventions          → this YAML
#
# In V1 deterministic mode there is NO LLM-facing override path for
# conventions; the LLM cannot ask for a non-standard z-score window.
# That changes in advanced mode (commit 6+).  See
# architecture/tool_architecture.md.
#
# Bumping any value in `conventions:` is a deliberate methodology change.
# It must come with a regenerated parity fixture (see
# tests/fixtures/curve_spread_v1/README.md) AND a rationale in the PR
# message.  Do not edit casually.
# =============================================================================

tool:
  name: calculate_curve_spread_tool
  domain: sovereign_bonds
  description: |
    Basis-point spread between two tenors on the same sovereign yield
    curve, plus a rolling z-score and the underlying time series.

conventions:

  # ---------------------------------------------------------------------------
  # Z-score window length (trading days)
  # ---------------------------------------------------------------------------
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading-day count for a 1-year rolling window.  Matches Bloomberg's
      default rolling window for percentile and z-score metrics; consistent
      with desk convention across UST, Bund, and Gilt curves.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Minimum observations before the rolling stat is emitted
  # ---------------------------------------------------------------------------
  z_score_min_periods:
    value: 60
    source: team_judgment_pending_review
    rationale: >-
      ~3 months of observations before the rolling mean / std are deemed
      trustworthy.  Smaller min_periods would emit noisy z-scores at the
      start of a series; larger would suppress legitimate early signal.
    valid_range: [20, 252]

  # ---------------------------------------------------------------------------
  # Standard deviation degrees of freedom
  # ---------------------------------------------------------------------------
  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Sample standard deviation (Bessel-corrected, ddof=1).  Matches
      pandas' default and the industry convention for finite-sample
      rolling z-scores.  Switching to population std (ddof=0) would
      tighten z-score magnitudes and is a deliberate methodology
      decision that requires fixture regeneration.

  # ---------------------------------------------------------------------------
  # Calendar-day buffer for the fetch window
  # ---------------------------------------------------------------------------
  z_score_buffer_multiplier:
    value: 1.5
    source: derived_from_window
    rationale: >-
      Calendar-day buffer added to the fetch window so the rolling
      z-score is fully populated from the first displayed trading day.
      1.5x the trading-day window covers weekends, holidays, and the
      occasional missing observation without over-fetching.
    valid_range: [1.2, 2.0]

  # ---------------------------------------------------------------------------
  # Forward-fill limit for missing observations
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Bridge up to one trading week of missing data across holiday gaps.
      Larger values would silently extrapolate stale prices into active
      trading days; smaller values would leave many holidays unfilled
      and shrink the comparable observation set.
    valid_range: [1, 10]

  # ---------------------------------------------------------------------------
  # Output rounding precision — bps
  # ---------------------------------------------------------------------------
  spread_bps_round_decimals:
    value: 2
    source: team_judgment_pending_review
    rationale: >-
      Round bps output to 0.01 bps.  Display precision; matches the
      precision Bloomberg / DLib quotes use for sovereign curve spreads.
    valid_range: [0, 6]

  # ---------------------------------------------------------------------------
  # Output rounding precision — z-score
  # ---------------------------------------------------------------------------
  z_score_round_decimals:
    value: 4
    source: team_judgment_pending_review
    rationale: >-
      Round z-score output to 4 decimals.  Display precision; further
      decimals are noise given the underlying price precision.
    valid_range: [0, 8]

methodology:
  what_it_does: |
    Computes the basis-point spread between two tenors on the same
    sovereign yield curve as `(long_tenor_yield - short_tenor_yield) * 100`,
    plus a rolling z-score over the spread series.  Returns the current
    value, daily change, z-score, and the full time series for charting.

  assumptions:
    - "Yields are stored as percent in the source DB (e.g. 4.25 = 4.25%)."
    - "Same-date matching after up-to-5d ffill across holiday gaps."
    - "Sample standard deviation (ddof=1) for the rolling z-score."
    - "Z-score window is fixed regardless of the user's display lookback."
    - "User-input lookback_days controls *display* window, not z-score window."

  citations: []
