# =============================================================================
# Macro Copilot — Continuous Integration
# =============================================================================
#
# Two jobs run on every PR and on every push to main:
#
#   1. lint   — ruff check (lint).  Always required.
#   2. test-substrate — pytest over the substrate-level test surface
#                       (artifacts, lineage, tool/operator config,
#                        bridge adapters).  These tests have no external
#                        dependencies (no DB, no MCP servers, no LLM
#                        calls), so they run cleanly with a minimal
#                        pip install.
#
# What CI deliberately does NOT do in PR 1:
#
#   - It does not run `ruff format --check`.  Existing code has not been
#     formatter-passed; tightening to format-check is a follow-up once
#     the format pass has landed.
#   - It does not run the wiring / SQL-validation tests.  Those require
#     a running Postgres + TimescaleDB instance and MCP subprocesses;
#     they belong to a future integration-test job (Phase 0, week 3+).
#   - It does not run the multi-agent prompt gauntlet.  That calls the
#     real Anthropic API and is gauntlet-marked; it runs by hand.
#
# Cross-version hash-stability testing on Python 3.11 + 3.12 lives in
# the test-substrate matrix below.  The new
# `tests/state/test_hash_stability.py` file pins specific hash values
# for both the lineage layer (`shared.artifacts.lineage._compute_step_hash`)
# and the ingestion layer (`ingestion.hashing.compute_normalized_data_hash`).
# If either recipe drifts between Python versions, the pinned values
# stop matching on the affected matrix leg and CI fails.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch when a new commit arrives —
# saves CI minutes and gives faster feedback on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint — ruff over the whole Python tree
  # ---------------------------------------------------------------------------
  lint:
    name: ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.5"

      - name: ruff version
        run: ruff --version

      - name: ruff check
        run: ruff check .

  # ---------------------------------------------------------------------------
  # Test — pytest over the substrate-level subset (no external deps),
  # matrixed on Python 3.11 and 3.12 to enforce cross-version determinism
  # for the new tests/state/test_hash_stability.py pinned hashes.
  # ---------------------------------------------------------------------------
  test-substrate:
    name: pytest (substrate, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # Minimal set sufficient for the substrate-level tests.  The
        # runtime stack (langchain, fastapi, mcp, prefect, google-cloud,
        # xbbg/blpapi) is not needed here because these tests exercise
        # pure-Python data structures (typed artifacts, lineage steps,
        # YAML config, the bridge adapter, the ingestion hash module).
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest>=8.0" \
            "pytest-asyncio>=0.23" \
            "pydantic>=2.5" \
            "pandas>=2.0" \
            "numpy>=1.26" \
            "pyarrow>=14.0" \
            "scipy>=1.11" \
            "sqlalchemy>=2.0" \
            "pyyaml>=6.0"

      - name: pytest collection sanity
        # Verify the full test tree collects without import errors.  This
        # catches stale imports / missing modules before we try to run
        # the actual subset.
        run: pytest --collect-only -q

      - name: pytest (substrate subset)
        # The subset below is pure-substrate: typed artifacts, lineage
        # steps, tool / operator config validators, the primitive ->
        # operator bridge adapter, and the cross-version hash-stability
        # gate (PR 2: pinned hashes for both lineage and ingestion).
        # None of these reach the DB, the MCP layer, or the LLM.  As we
        # mark tests with @pytest.mark.integration in subsequent PRs,
        # this list expands toward `-m "not integration"` over the full
        # suite.
        run: |
          pytest \
            Macro_Copilot/tests/test_artifacts.py \
            Macro_Copilot/tests/test_tool_config.py \
            Macro_Copilot/tests/test_tool_config_lint.py \
            Macro_Copilot/tests/test_operator_config.py \
            Macro_Copilot/tests/test_adapter_from_time_series.py \
            Macro_Copilot/tests/state/test_hash_stability.py \
            Macro_Copilot/tests/state/test_transactional_ingestion.py

  # ---------------------------------------------------------------------------
  # Migrations — alembic round-trip against a real Postgres service.
  #
  # Phase 0 PR 4 introduced this job alongside the `copilot_state` schema
  # and its initial Alembic revision.  The job verifies that:
  #
  #   1. `alembic upgrade head` creates all expected tables in
  #      `copilot_state`.
  #   2. `alembic downgrade base` undoes every migration.
  #   3. A second `alembic upgrade head` is idempotent.
  #   4. The round-trip + schema-invariant test suite passes
  #      (`tests/state/test_migrations.py`).
  #
  # Postgres 14 is sufficient for the copilot_state schema (no
  # TimescaleDB features used).  The macro_data schema in the project
  # uses TimescaleDB but that schema is NOT Alembic-managed and lives
  # outside this CI job's concern.
  # ---------------------------------------------------------------------------
  migrations:
    name: alembic migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # Health check ensures the service is accepting connections
        # before the job's steps start.
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: test_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "alembic>=1.13" \
            "sqlalchemy>=2.0" \
            "psycopg2-binary>=2.9" \
            "pytest>=8.0" \
            "pytest-asyncio>=0.23"

      - name: alembic upgrade head (forward)
        run: alembic upgrade head

      - name: alembic downgrade base (backward)
        run: alembic downgrade base

      - name: alembic upgrade head (idempotence)
        run: alembic upgrade head

      - name: pytest migration round-trip + schema invariants
        run: pytest Macro_Copilot/tests/state/test_migrations.py -v
