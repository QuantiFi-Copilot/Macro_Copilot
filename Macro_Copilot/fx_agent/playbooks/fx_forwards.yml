    instrument_type: "fx_forward"
    fx_family: "G10_FORWARDS"
    market_scope: "G10"
    region: "Global"
    pair: "EURUSD"
    tenor: "1W"
    base_ccy: "EUR"
    quote_ccy: "USD"

