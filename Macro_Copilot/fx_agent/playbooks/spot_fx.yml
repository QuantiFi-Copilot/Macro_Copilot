  # ============================================================
  # v4.0 additions — APAC NDF-currency spot references (3 pairs)
  # ------------------------------------------------------------
  # Mini BBG top-up 2026-05-25 to close a Phase D gap: NDF tools
  # (calculate_ndf_implied_carry) need a spot reference for the
  # underlying currency. We had NDFs for CCN+ (CNY) and IRN+ (INR)
  # but no spot for those underlyings. These 3 spots fill the gap.
  #
  # Conventions (Codex nuance — these are NOT all the same tradability):
  # - USDCNH: free offshore tradable spot for CNH. Primary spot ref
  #   for CCN+ NDF carry. Data starts 2010-08-23 (CNH offshore
  #   market launched late 2010).
  # - USDINR: USD-INR composite cross-rate. Standard reference for
  #   IRN+ NDF carry analysis. Full 2000+ history.
  # - USDCNY: ONSHORE PBOC fix-style reference, NOT a freely
  #   tradable spot. Useful for NDF-vs-onshore-fix gap analysis but
  #   downstream tools that need "tradable spot only" should filter
  #   fx_family != 'EM_SPOT_REFERENCE'. Full 2000+ history.
  # ============================================================

  - ticker: "USDCNH Curncy"
    instrument_type: "fx_spot"
    fx_family: "EM_SPOT"
    market_scope: "EM"
    region: "APAC"
    pair: "USDCNH"
    base_ccy: "USD"
    quote_ccy: "CNH"
    spot_convention: "offshore_tradable"

  - ticker: "USDINR Curncy"
    instrument_type: "fx_spot"
    fx_family: "EM_SPOT"
    market_scope: "EM"
    region: "APAC"
    pair: "USDINR"
    base_ccy: "USD"
    quote_ccy: "INR"
    spot_convention: "composite_reference"

  - ticker: "USDCNY Curncy"
    instrument_type: "fx_spot"
    fx_family: "EM_SPOT_REFERENCE"
    market_scope: "EM"
    region: "APAC"
    pair: "USDCNY"
    base_ccy: "USD"
    quote_ccy: "CNY"
    spot_convention: "onshore_pboc_fix"

  # ============================================================
  # v5.0 additions — Warehouse seeding 2026-05-25 (6 EM pairs)
  # ------------------------------------------------------------
  # APAC liquid EM (USDSGD, USDTWD, USDTHB) and LATAM liquid EM
  # (USDCLP, USDCOP, USDPEN). All 6 verified Phase 1 discovery
  # with full 2000-01-03 onward PX_LAST history (6622-6883 rows).
  # All tradable; market_scope='EM', fx_family='EM_SPOT'. Adding
  # them brings the EM_SPOT family from 11 → 17 pairs, broadening
  # APAC + LATAM coverage for scanners and panels. Forwards-side
  # coverage is uneven: SGD/THB deliverable forwards extracted in
  # the warehouse-seed batch (extends fx_em_forwards.yml); TWD has
  # NDFs (extends fx_ndf.yml via NTN+); CLP/COP/PEN forwards
  # convention unresolved in discovery (USDCLP1M sparse,
  # USDCOP1M / USDPEN1M ticker formats invalid) — spot-only for
  # this wave, deferred for follow-up BBG session.
  # ============================================================

  - ticker: "USDSGD Curncy"
    instrument_type: "fx_spot"
    fx_family: "EM_SPOT"
    market_scope: "EM"
    region: "APAC"
    pair: "USDSGD"
