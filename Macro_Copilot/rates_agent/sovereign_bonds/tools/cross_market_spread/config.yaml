# =============================================================================
# calculate_cross_market_spread_tool — tool configuration
# =============================================================================
# Canonical record of the cross-market spread tool's conventions and
# methodology.  Loaded by `shared.config.load_tool_config` at compute()
# time AND by api/routes/rates/cards.py for the batch /cross-market
# surface.  That batch surface is a thin per-pair caller (no parallel
# methodology reimplementation), so routing both call sites through this
# YAML keeps the methodology authoritative across them.
#
# In V1 deterministic mode there is NO LLM-facing override path for
# conventions.  See architecture/tool_architecture.md.
#
# Cross-config consistency
# ------------------------
# The cross-config lint (shared.config.lint) enforces value-agreement on
# the conventions that 2+ tools declare.  z_score_window_days,
# z_score_min_periods, z_score_ddof, z_score_buffer_multiplier,
# ffill_limit_days, and default_field_name are declared by multiple
# tools — value drift on any of those is caught.  Lint does NOT enforce
# declaration-completeness; a tool may legitimately omit a convention
# it doesn't use.
# =============================================================================

tool:
  name: calculate_cross_market_spread_tool
  domain: sovereign_bonds
  description: |
    Cross-market yield differential between the same tenor on two
    different sovereign curves (e.g. UST 10Y − DE_BUND 10Y, or
    IT_BTP 10Y − DE_BUND 10Y).  spread = (cf1_yield - cf2_yield) * 100
    in bps.  Returns the current spread, daily/weekly/monthly bps
    changes, rolling 252-day z-score, trailing 252-day high/low/
    percentile, each leg's latest yield, plus the full spread+z_score
    time series for charting.

conventions:

  # ---------------------------------------------------------------------------
  # Z-score window length (trading days)
  # ---------------------------------------------------------------------------
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading-day count for a 1-year rolling window.  Same convention
      as curve_spread / yield_levels / butterfly — the consistency lint
      enforces the match where declared.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Minimum observations before the rolling stat is emitted
  # ---------------------------------------------------------------------------
  z_score_min_periods:
    value: 60
    source: team_judgment_pending_review
    rationale: >-
      ~3 months of observations before the rolling mean / std are
      deemed trustworthy.  Matches the other rates tools.
    valid_range: [20, 252]

  # ---------------------------------------------------------------------------
  # Standard deviation degrees of freedom
  # ---------------------------------------------------------------------------
  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Sample standard deviation (Bessel-corrected, ddof=1).  Matches
      pandas' default and the convention every other rates tool uses.

  # ---------------------------------------------------------------------------
  # Calendar-day buffer for the fetch window
  # ---------------------------------------------------------------------------
  z_score_buffer_multiplier:
    value: 1.5
    source: derived_from_window
    rationale: >-
      Calendar-day buffer added to the fetch window so the rolling
      z-score AND the trailing range stat are both fully populated
      from the first displayed trading day.  1.5x trading-day window
      covers weekends + holidays.  Matches the other rates tools.
    valid_range: [1.2, 2.0]

  # ---------------------------------------------------------------------------
  # Period-change offsets (in trading-day rows after ffill)
  # ---------------------------------------------------------------------------
  daily_change_offset_rows:
    value: 2
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-2] = 1 trading day back.  The spread series is
      already in bps so changes go through period_changes(already_bps=True),
      i.e. plain subtraction (no *100 multiplier).
    valid_range: [2, 5]

  weekly_change_offset_rows:
    value: 6
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-6] = 5 trading days back ≈ 1 calendar week.
    valid_range: [5, 10]

  monthly_change_offset_rows:
    value: 22
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-22] = ~1 calendar month of trading days.
    valid_range: [20, 30]

  # ---------------------------------------------------------------------------
  # Trailing range / percentile window — LOCKED at 252 in V1
  # ---------------------------------------------------------------------------
  # The output schema's field names (high_252d_bps, low_252d_bps,
  # percentile_252d) are wire-frozen for frontend backward-compat —
  # CrossMarketView.tsx reads them by name.  compute() raises
  # NotImplementedError if this is set to anything other than 252;
  # see methodology.planned_extensions for the path to make it
  # configurable.
  trailing_range_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      1Y trailing for high/low/percentile.  Locked at 252 in V1
      because the wire field names embed the number.

  # ---------------------------------------------------------------------------
  # Forward-fill limit for missing observations
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Bridge up to one trading week of missing data across holiday
      gaps.  Same as the other rates tools; the consistency lint
      enforces the match where declared.
    valid_range: [1, 10]

  # ---------------------------------------------------------------------------
  # Output rounding precision — bps
  # ---------------------------------------------------------------------------
  bps_round_decimals:
    value: 2
    source: team_judgment_pending_review
    rationale: >-
      Round bps output (current spread, daily/weekly/monthly changes,
      trailing high/low) to 0.01 bps.  Display precision; matches the
      precision Bloomberg / DLib use for sovereign curve metrics.
      This value is also threaded into period_changes(decimals=...)
      so daily/weekly/monthly_change_bps respect the YAML — the
      delta_bps default of 2 would otherwise silently shadow this
      override.  Same boundary-shadowing fix class as butterfly.
    valid_range: [0, 6]

  # ---------------------------------------------------------------------------
  # Output rounding precision — z-score
  # ---------------------------------------------------------------------------
  z_score_round_decimals:
    value: 4
    source: team_judgment_pending_review
    rationale: >-
      Round z-score output to 4 decimals.  Display precision; further
      decimals are noise given the underlying price precision.  Threaded
      to safe_float at the output boundary so a value above 4 is not
      silently truncated by safe_float's own default of 4 (the P2 fix
      from the butterfly migration's Codex review).
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Default Bloomberg observation field
  # ---------------------------------------------------------------------------
  default_field_name:
    value: YLD_YTM_MID
    source: bloomberg_field_convention
    rationale: >-
      Mid yield-to-maturity is the canonical sovereign-yield
      observation.  LLM/HTTP wrappers must use the empty/None
      sentinel so this default flows through — see the wrapper
      shadowing fix from the curve_move_classifier migration
      (commit b2605ee).

methodology:
  what_it_does: |
    Fetches two (curve_family, tenor) yield series — one per market —
    pivots them into a wide frame, ffills holiday gaps, and computes
    the spread as `(cf1_yield - cf2_yield) * 100` (bps).  Returns a
    snapshot with the current spread, daily / weekly / monthly bps
    changes, rolling 252d z-score, trailing 252d high / low /
    percentile, each leg's latest yield, plus the full spread+z_score
    time series for charting.

  assumptions:
    - "Yields stored as percent (4.25 = 4.25%); spread output in bps."
    - "Same z-score conventions as the other rates tools."
    - "Spread direction convention: cf1 - cf2 (e.g. for BTP-Bund pass
       cf1='IT_BTP', cf2='DE_BUND').  Documented under
       planned_extensions because the choice is a desk-style call,
       not derivable from the data."
    - "Daily / weekly / monthly bps changes use period_changes with
       already_bps=True (plain subtraction; the spread series is
       already in bps).  bps_round_decimals is threaded through
       explicitly so the YAML is authoritative."
    - "lookback_days controls the *display* window, NOT the rolling
       z-score window or the trailing range window — those are
       independent conventions in this YAML."

  citations: []

  planned_extensions:
    - "trailing_range_window_days: configurable.  Currently locked at
       252 because the output fields high_252d_bps / low_252d_bps /
       percentile_252d embed the number.  Path to configurability:
       rename schema fields to high_window_bps / low_window_bps /
       percentile_window + add trailing_window_days to the output;
       update CrossMarketView.tsx to read the new names; remove the
       NotImplementedError guard in compute()."
    - "Effective trailing-range clipping by lookback_days.  Today
       compute() trims the series to lookback_days BEFORE computing
       the trailing high/low/percentile, so when lookback_days
       corresponds to fewer than 252 trading days the '252d' fields
       are actually min(252, available)-day stats.  The SQL parity
       fixture (tests/test_cross_market_sql_validation.py) encodes
       the same behaviour, so flipping it now would silently re-target
       the parity check.  Fix in a separate PR: compute the trailing
       stats on the FULL fetched-and-cleaned series (pre-trim),
       regenerate the SQL parity fixture, and bump the methodology
       citation.  Same shape as the butterfly clipping bug."
    - "Sovereign-vs-OIS cutoff anchoring divergence.  Sovereign
       cross_market_spread anchors the lookback cutoff to date.today();
       the OIS twin (rates_agent/ois/tools/cross_market_spread.py:164)
       anchors to the latest data observation (wide.index[-1].date()).
       The OIS approach is more correct — the DB can be 1-3 days stale
       over weekends / holidays, and wall-clock anchoring produces
       inconsistent history — but unifying them is a behaviour change,
       not a config one.  Deferred to a separate PR alongside the
       matching yield_levels observation_count anchoring fix.  Both
       should land together to keep the 'sovereign vs OIS' parity
       story coherent."
    - "Spread direction convention (cf1 - cf2, not cf2 - cf1).  Today
       the validator only enforces cf1 != cf2; the DIRECTION is the
       caller's responsibility.  An alternative would be to canonicalise
       the order based on a desk-conventional pair table (e.g. BTP-Bund,
       OAT-Bund, BONO-Bund — peripheral - core; UST as the global
       reference).  Subjective methodology choice; documented so future
       readers know it was considered and deferred."
