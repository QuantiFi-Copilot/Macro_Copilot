playbook_name: "bond_futures"
playbook_version: "1.6"
asset_class: "rates"
dataset_name: "bond_futures"
description: "Daily rolling government bond futures data across core macro markets for liquid expression, activity monitoring, and positioning proxies."

extraction:
  start_date: "2005-01-01"
  incremental_window_days: 14

target_metrics:
  - metric_id: "last_price"
    bloomberg_field: "PX_LAST"
  - metric_id: "open_interest"
    bloomberg_field: "OPEN_INT"
  - metric_id: "volume"
    bloomberg_field: "PX_VOLUME"

# Static/reference fields validated across the selected rolling futures universe.
reference_metrics:
  - column_name: "expiry_date"
    bloomberg_field: "LAST_TRADEABLE_DT"
  - column_name: "maturity_date"
    bloomberg_field: "FUT_DLV_DT_LAST"
  - column_name: "security_name"
    bloomberg_field: "SECURITY_DES"
  - column_name: "contract_size"
    bloomberg_field: "FUT_CONT_SIZE"
  - column_name: "quote_units"
    bloomberg_field: "QUOTE_UNITS"

# ----------------------------------------------------------------------------
# VERIFIED metadata_history section (ADR 0002, playbook contract v1.2).
#
# Drives `--mode metadata-history` extraction. Reads only universe rows whose
# `is_rolling_contract: true` (all 19 rows below).
#
# All Bloomberg mnemonics below were verified on 2026-05-19 via
#   scripts/futures_metadata_history_check.py
# against a live Bloomberg terminal. The verification report exercised:
#   * bds(FUT_CHAIN, INCLUDE_EXPIRED_CONTRACTS="Y") for every generic
#     (chain enumeration validated; INCLUDE_EXPIRED_CONTRACTS override
#     extends history substantially — e.g. TY1: 3 -> 179, US1: 3 -> 197)
#   * bdp() for every static field on a representative sample of 5
#     contracts per chain (oldest, latest, 3 evenly spaced)
#   * full-chain bdp() of FUT_NOTICE_FIRST and FUT_FIRST_TRADE_DT
#     (returned valid dates for every contract in every chain)
#   * validate_no_overlaps over every generic's window set
#     (zero overlap conflicts across ~2,000 windows total)
#
# Roll-convention rationale for bond futures:
#   * Market convention rolls BEFORE last-tradeable. FUT_NOTICE_FIRST is the
#     short-side first-notice date (~1 wk before delivery), which is when
#     the market actually rolls. Verified non-null and consistent across
#     all 19 bond generics including UST, DE, UK, JP, FR, IT, ES, CA, AU.
#   * LAST_TRADEABLE_DT was tested as the fallback and produced identical
#     window counts with zero overlap conflicts — usable as a swap if
#     ever needed for a market that drops FUT_NOTICE_FIRST.
#
# Mnemonic-level notes from verification:
#   * UNDL_SPOT_TICKER was tested and returned NULL across every
#     bond-futures contract sampled (UST/DE/UK/JP). Dropped from this
#     section — not the right mnemonic for listed bond futures.
#   * FUT_TICK_VAL is populated by Bloomberg only for the currently-listed
#     Australian YM/XM contract; older AU history returns NULL. Kept in
#     the playbook (the typed column will land NULL in DB for old AU
#     contracts, which the schema allows).
#   * RX1 chain has 1 contract out of 145 with an internal date-ordering
#     anomaly. The window-validation gate still passes for RX1 (145/145
#     non-overlapping windows). Follow-up to identify the specific
#     contract is tracked separately.
# ----------------------------------------------------------------------------
metadata_history:
  enabled: true
  chain_field: "FUT_CHAIN"                       # VERIFIED 2026-05-19
  chain_overrides:
    INCLUDE_EXPIRED_CONTRACTS: "Y"               # VERIFIED 2026-05-19 — override
                                                 # extends chain to full history
  roll_convention:
    type: "expiry_roll"                          # only value supported in PR A1
    roll_field: "FUT_NOTICE_FIRST"               # VERIFIED 2026-05-19 — non-null
                                                 # across every bond-futures
                                                 # contract in every chain tested
    first_trade_field: "FUT_FIRST_TRADE_DT"      # VERIFIED 2026-05-19 — non-null
                                                 # across every chain tested
  static_fields:
    - column_name: "contract_code"
      bloomberg_field: "TICKER"                  # VERIFIED 2026-05-19 (returns stem,
                                                 # e.g. "TUU90"; yellow-key-stripped form)
    - column_name: "expiry_date"
      bloomberg_field: "LAST_TRADEABLE_DT"       # VERIFIED 2026-05-19
    - column_name: "maturity_date"
      bloomberg_field: "FUT_DLV_DT_LAST"         # VERIFIED 2026-05-19
    - column_name: "security_name"
      bloomberg_field: "SECURITY_DES"            # VERIFIED 2026-05-19
    - column_name: "settlement_date"
      bloomberg_field: "FUT_DLV_DT_FIRST"        # VERIFIED 2026-05-19 (equal to
                                                 # FUT_DLV_DT_LAST for single-day-
                                                 # delivery markets: Eurex, OSE,
                                                 # SFE — by design)
    - column_name: "tick_size"
      bloomberg_field: "FUT_TICK_SIZE"           # VERIFIED 2026-05-19
    - column_name: "tick_value"
      bloomberg_field: "FUT_TICK_VAL"            # VERIFIED 2026-05-19 (partial for
                                                 # historical AU contracts — typed
                                                 # col will be NULL pre-2026 for YM/XM,
                                                 # schema allows it)
    - column_name: "contract_size"
      bloomberg_field: "FUT_CONT_SIZE"           # VERIFIED 2026-05-19
    - column_name: "exchange_code"
      bloomberg_field: "FUT_EXCH_NAME_SHRT"      # VERIFIED 2026-05-19 — returns
                                                 # CBT/EUX/ICF/OSE/MSE/SFE/CME
                                                 # consistently across all markets

# ----------------------------------------------------------------------------
# CANDIDATE deliverables section (ADR 0011, work order C4).
#
# Drives ``--mode deliverables`` extraction. Reads ONLY the universe rows
# whose ticker is in ``include_tickers`` (a strict whitelist exact-match
# against the universe — ADR 0011 v3, Codex finding 2). v1 scopes to the
# six UST bond-future generics (TU/FV/TY/UXY/US/WN); non-US deliverable
# baskets (DE/UK/JP/FR/IT/ES/CA/AU) are explicitly DEFERRED per P2/P5 —
# their basket schemas may not be CUSIP-shaped under FUT_DLVRBL_BNDS_CUSIPS
# and a separate operator probe per-market is required before scope-in.
# A follow-up data PR will probe and finalise non-US in v2.
#
# CANDIDATE state — every Bloomberg mnemonic and every basket-frame column
# name below is UNVERIFIED until ``scripts/deliverables_bloomberg_check.py``
# returns a clean per-generic report against a live Bloomberg terminal.
# Operator runs the check, returns the FINAL SUMMARY + per-contract CSV;
# this section is then finalised to VERIFIED (or any field that does not
# verify is documented as a deferral).
#
# What IS already VERIFIED via the metadata_history flow on this same
# playbook (2026-05-19, see the section above):
#   * chain_field = "FUT_CHAIN"                — chain enumeration works
#   * chain_overrides INCLUDE_EXPIRED_CONTRACTS="Y"
#                                              — extends history to the
#                                                full chain (e.g. TY1:
#                                                3 → 179 contracts)
#   * FUT_DLV_DT_FIRST / FUT_DLV_DT_LAST       — non-null per-contract
#                                                across every bond-future
#                                                in the universe; used as
#                                                metadata_history's
#                                                settlement_date /
#                                                maturity_date
#   * FUT_NOTICE_FIRST                         — non-null per-contract
#                                                across every chain
#                                                tested; used as
#                                                metadata_history's
#                                                roll_field
#
# What is STILL CANDIDATE (probed by deliverables_bloomberg_check.py):
#   * basket_field = "FUT_DLVRBL_BNDS_CUSIPS"  — does bds return a frame
#                                                of CUSIP + factor rows
#                                                per contract? UST-only
#                                                in v1.
#   * basket_cusip_column / basket_factor_column
#                                              — the EXACT column names
#                                                Bloomberg returns inside
#                                                that frame. Casing and
#                                                spelling unverified.
#   * basket_isin_column                       — present in UST baskets?
#                                                Or omit and rely on
#                                                deliverable_cusip only?
#   * FUT_NOTICE_LAST                          — symmetric companion to
#                                                FUT_NOTICE_FIRST;
#                                                spelling unverified;
#                                                non-null per-contract
#                                                rate unverified.
# ----------------------------------------------------------------------------
deliverables:
  enabled: true
  # Chain enumeration — VERIFIED 2026-05-19 via the metadata_history flow on
  # this same playbook (re-used identically, deliberate; ADR 0011 §Design).
  chain_field: "FUT_CHAIN"                          # VERIFIED 2026-05-19
  chain_overrides:
    INCLUDE_EXPIRED_CONTRACTS: "Y"                  # VERIFIED 2026-05-19
  # Deliverable basket — CANDIDATE. The check script probes
  # FUT_DLVRBL_BNDS_CUSIPS as the primary candidate; if Bloomberg returns a
  # frame the operator reports its actual columns and we finalise the
  # column-name fields below.
  basket_field: "FUT_DLVRBL_BNDS_CUSIPS"            # CANDIDATE — verify via
                                                    # scripts/deliverables_bloomberg_check.py
  basket_cusip_column: "CUSIP"                      # CANDIDATE — exact column
                                                    # name unverified; the
                                                    # check script reports
                                                    # what bds actually
                                                    # returns. Casing is
                                                    # matched case-insensitively
                                                    # by the extractor.
  basket_factor_column: "Conversion Factor"         # CANDIDATE — exact column
                                                    # name unverified.
                                                    # Conversion factor is
                                                    # core source data
                                                    # (ADR 0011 v4); a
                                                    # missing column or
                                                    # missing per-row value
                                                    # aborts the contract.
  basket_isin_column: "ISIN"                        # CANDIDATE — operator
                                                    # decides whether to
                                                    # keep this key or omit
                                                    # it based on what bds
                                                    # actually returns for
                                                    # UST. Omitting → all
                                                    # rows get
                                                    # deliverable_isin NULL.
  # Per-contract static date fields (denormalised across every row of the
  # basket — ADR 0011 §Alternatives). Every entry's column_name MUST be in
  # the allowed set {first_delivery_date, last_delivery_date,
  # first_notice_date, last_notice_date} — these are the only typed
  # per-contract date columns on macro_data.futures_deliverables (ADR 0011
  # v4 §_ALLOWED_DELIVERABLES_STATIC_COLUMNS).
  static_fields:
    - column_name: "first_delivery_date"
      bloomberg_field: "FUT_DLV_DT_FIRST"           # VERIFIED 2026-05-19 via
                                                    # metadata_history.settlement_date
    - column_name: "last_delivery_date"
      bloomberg_field: "FUT_DLV_DT_LAST"            # VERIFIED 2026-05-19 via
                                                    # metadata_history.maturity_date
    - column_name: "first_notice_date"
      bloomberg_field: "FUT_NOTICE_FIRST"           # VERIFIED 2026-05-19 via
                                                    # metadata_history.roll_field
    - column_name: "last_notice_date"
      bloomberg_field: "FUT_NOTICE_LAST"            # CANDIDATE — spelling
                                                    # symmetric with
                                                    # FUT_NOTICE_FIRST but
                                                    # not yet probed; the
                                                    # check script confirms
                                                    # per-contract presence.
  # Scope: v1 UST only (ADR 0011 v2/v3 explicit deferral pattern). Every
  # entry MUST exactly match a rolling-contract ticker in the universe
  # below; the extractor aborts on any unmatched entry (ADR 0011 v3, Codex
  # finding 2). Non-US bond-future deliverable baskets (DE/UK/JP/FR/IT/
  # ES/CA/AU) are deferred to a follow-up data PR.
  include_tickers:
    - "TU1 Comdty"   # UST 2Y T-Note futures
    - "FV1 Comdty"   # UST 5Y T-Note futures
    - "TY1 Comdty"   # UST 10Y T-Note futures
    - "UXY1 Comdty"  # UST Ultra 10Y T-Note futures
    - "US1 Comdty"   # UST Classic Long Bond (30Y) futures
    - "WN1 Comdty"   # UST Ultra Bond futures

