tool:
  name: get_fx_vol_term_structure_tool
  domain: fx_vol
  description: |
    Single-pair FX ATM vol term structure snapshot — one row per
    standard tenor (1W / 1M / 3M / 6M / 12M, short to long) with
    current vol, absolute period changes, rolling 252-day z-score,
    trailing 252-day high/low/percentile. Mirror of get_fx_forward_
    curve for the ATM vol substrate.
  category: desk_invariant_primitive

conventions:
  default_vol_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: Bloomberg PX_LAST is the canonical ATM vol observation.

  z_score_window_days:
    value: 252
    source: industry_standard_trading_year
    rationale: One trading year of rolling history.
    valid_range: [60, 504]

  z_score_min_periods:
    value: 60
    source: industry_standard
    rationale: Min observations before z-score is emitted.
    valid_range: [20, 252]

  z_score_ddof:
    value: 1
    source: industry_standard
    rationale: Sample (Bessel-corrected) standard deviation.
    valid_range: [0, 1]

  trailing_range_window_days:
    value: 252
    source: wire_frozen_v1
    rationale: Locked at 252 in V1; field names embed the number.
    valid_range: [252, 252]

  daily_change_periods:
    value: 1
    source: industry_standard
    rationale: One trading-day offset.
    valid_range: [1, 3]

  weekly_change_periods:
    value: 5
    source: industry_standard
    rationale: One trading-week offset (5 trading days).
    valid_range: [5, 10]

  monthly_change_periods:
    value: 21
    source: industry_standard
    rationale: Approximate one trading month.
    valid_range: [20, 30]

  vol_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: Four decimals preserves precision for ATM vol values.
    valid_range: [2, 6]

  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: Four decimals for z-score.
    valid_range: [2, 6]

  percentile_round_decimals:
    value: 2
    source: legacy_default_pre_pilot
    rationale: Two decimals for percentile rank.
    valid_range: [0, 4]

methodology:
  what_it_does: |
    For the requested pair, runs the atm_vol_level compute (or its
    equivalent inline) for every standard tenor (1W/1M/3M/6M/12M) and
    returns one row per tenor in tenor-ascending order. Tenors without
    DB data are silently skipped (returned rows list shorter than 5).
  assumptions:
    - "Each tenor's z-score is computed on its OWN historical vol series — tenors are independent."
    - "Tenor order on the wire is 1W -> 1M -> 3M -> 6M -> 12M (short to long)."
    - "Same vol-units / vol-points / z-score / percentile semantics as get_fx_atm_vol_level."
  citations: []
  planned_extensions:
    - "Add term-structure-level metrics (slope, curvature) once Phase E2 smile tools land."
