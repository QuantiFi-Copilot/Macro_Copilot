    ]
# ─────────────────────────────────────────────────────────────
################################################################################
# DATABASE GUI stack
################################################################################
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: quantdata
      MB_DB_PORT: 5432
      MB_DB_USER: quantuser
      MB_DB_PASS: myStrongPass
      MB_DB_HOST: tsdb
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Kolkata"
    depends_on:
      tsdb:
        condition: service_healthy

    # --------------------------------------------------
  superset:
    image: apache/superset:latest
    container_name: superset
    ports:
      - "8088:8088"
    depends_on:
      tsdb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      # This tells Superset where to find the configuration file inside the container
      SUPERSET_CONFIG_PATH: "/app/superset_config.py"
    volumes:
      # ▼▼▼ THIS PATH HAS BEEN UPDATED ▼▼▼
      - ./docker/superset_config.py:/app/superset_config.py
      - superset-data:/app/superset_home
    command: >
      bash -c "
        pip install psycopg2-binary &&
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@superset.com --password admin &&
        superset init &&
        /usr/bin/run-server.sh
      "
  redis:
    image: redis:latest
    container_name: superset_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
################################################################################
# TOOLS
################################################################################
  normalization-reviewer-ui:
    image: quantfinanceproject:latest  # <-- USE THE SAME IMAGE
    container_name: normalization_reviewer_ui
    restart: unless-stopped
    depends_on:
      tsdb:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./.env:/app/.env
    ports:
      - "8501:8501" # Expose the Streamlit port
    environment:
      - EARNINGS_DB_HOST=tsdb
      - EARNINGS_DB_USER=${EARNINGS_DB_USER}
      - EARNINGS_DB_PASSWORD=${EARNINGS_DB_PASSWORD}
      - EARNINGS_DB_NAME=${EARNINGS_DB_NAME}
      - TZ=Asia/Kolkata
    # The command to run the Streamlit app from its new location
    command: [
      "micromamba", "run", "-n", "quant-env",
      "streamlit", "run", "tools/earnings_normalization_reviewer/app.py", 
      "--server.port=8501", "--server.address=0.0.0.0"
    ]
