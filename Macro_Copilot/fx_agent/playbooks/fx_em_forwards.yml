playbook_name: "fx_em_forwards"
playbook_version: "1.0"
asset_class: "fx"
dataset_name: "fx_em_forwards"
description: "Daily EM deliverable FX forward points for the 6 EM pairs that have liquid onshore/deliverable forward markets (USDMXN, USDZAR, USDTRY, USDPLN, USDHUF, USDPHP), across the standard tenor strip (1W, 1M, 3M, 6M, 12M). Same forward-points unit as fx_forwards.yml (G10) — separated as a distinct playbook to keep the G10 forwards substrate clean and to let Phase B+ build EM-aware carry/basket tools as an explicit, separate decision (calculate_em_carry, scan_em_carry_basket). The 3 NON-deliverable EM forwards (USDBRL, USDKRW, USDIDR) live in the fx_ndf.yml substrate with the outright convention. Created in Phase B BBG batch 2026-05-25."

extraction:
  start_date: "2000-01-01"
  incremental_window_days: 14

target_metrics:
  - metric_id: "forward_points"
    bloomberg_field: "PX_LAST"

reference_metrics:
  - column_name: "security_name"
    bloomberg_field: "SECURITY_DES"

