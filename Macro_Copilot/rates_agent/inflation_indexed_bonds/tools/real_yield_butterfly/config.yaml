# =============================================================================
# calculate_real_yield_butterfly_tool — tool configuration
# =============================================================================
# This file is the canonical record of the same-country linker real-yield
# butterfly (curvature) tool's conventions and methodology.  Loaded by
# ``shared.config.load_tool_config`` at compute() time.  Every shared
# convention (z_score_window_days, z_score_min_periods, z_score_ddof,
# z_score_buffer_multiplier, ffill_limit_days, period offsets, trailing
# range window, yield/z-score/bps/window_years rounding, default_field_name)
# carries the same numeric value as the sibling level / curve-spread
# primitives in this domain (real_yield_level / real_yield_curve_spread)
# and as the sovereign + OIS rate-level / curve-spread / butterfly tools —
# the cross-config lint enforces value-agreement across every tool that
# declares the same convention name.  Drift on any of those is caught.
#
# Concept honesty
# ---------------
# This tool returns the same-country linker real-yield BUTTERFLY
# (curvature) — i.e. the 3-point curvature on a SINGLE sovereign linker
# curve (e.g. USD_TIPS 5s10s30s real-yield butterfly, GBP_LINKER 2s10s30s
# real-yield butterfly).  Distinct from:
#   - a same-country real-yield CURVE SPREAD (2-point difference), and
#   - the nominal sovereign butterfly (which differences three nominal-
#     sovereign yields and reports in BPS).
# Cross-country / cross-curve butterflies are not expressible by this
# primitive's input shape (single ``curve_family``) and would be a
# different concept anyway.
#
# Butterfly formula
# -----------------
# Per-trade-date, the displayed real-yield butterfly is the FIXED
# simple-butterfly weighting:
#
#   butterfly_pct = belly_real_yield_pct
#                 - 0.5 * (short_real_yield_pct + long_real_yield_pct)
#
# Equivalent to 0.5 * (2 * belly - short - long).  Sign convention:
# POSITIVE = belly is CHEAP versus the simple half-weighted average of
# the two wings; NEGATIVE = belly is RICH.  Same sign convention as the
# sovereign sovereign_bonds/butterfly tool.  The endpoint real yields
# come from ``get_real_yield_level`` (one per tenor) under the
# instrument_type='inflation_linker' filter; the butterfly stays in
# PERCENT (same units as the underlying real yields) — distinct from
# the BPS convention the sovereign butterfly uses, because real yields
# are NOT multiplied by 100.  The three endpoint series are aligned
# per-trade-date via a strict pandas inner-join AFTER each is computed
# independently — no synthetic butterfly points are produced on dates
# where any endpoint has no data.
#
# In V1 deterministic mode there is NO LLM-facing override path for
# conventions.  See docs/architecture/tool_architecture.md.
# =============================================================================

tool:
  name: calculate_real_yield_butterfly_tool
  domain: inflation_indexed_bonds
  category: desk_invariant_primitive
  description: |
    Same-country linker real-yield butterfly (curvature) on a single
    sovereign linker curve (e.g. USD_TIPS 5s10s30s real-yield, GBP_LINKER
    2s10s30s real-yield, EUR_FR_LINKER 2s10s15s real-yield, CAD_RRB
    5s10s30s real-yield).  Composes three real-yield levels computed by
    ``get_real_yield_level`` (one at ``short_tenor``, one at
    ``belly_tenor``, one at ``long_tenor``) into a per-trade-date FIXED
    simple-butterfly weighting:

      butterfly_pct = belly_real_yield_pct
                    - 0.5 * (short_real_yield_pct + long_real_yield_pct)

    Sign convention: POSITIVE = belly is CHEAP versus the simple half-
    weighted wings average; NEGATIVE = belly is RICH.  Matches the
    sovereign_bonds/butterfly sign convention (which uses the
    mathematically-equivalent doubled form 2*belly - short - long in
    BPS).  Returns the current real-yield butterfly (in PERCENT), daily/
    weekly/monthly BPS changes, rolling 252-day z-score (on the percent-
    units butterfly), trailing 252-day high/low/percentile (in PERCENT),
    the rolling-window length, plus the two component wing spreads
    (belly - short, long - belly) AND the three endpoint real yields
    and year fractions used to form the butterfly so the desk can
    sanity-check the decomposition.  Also emits a bespoke wire-frozen
    ``time_series`` history of the butterfly (in PERCENT) over the
    displayed ``lookback_days`` window AND the canonical
    ``shared.schemas.time_series.TimeSeries`` payloads (PERCENT for the
    butterfly, Z_SCORE for the rolling z-score) so the workflow /
    operator layer can compose without per-tool custom shapes.

    Same-country / same-curve-family invariant
    ------------------------------------------
    The three legs share a single linker ``curve_family``.  The input
    shape forbids cross-curve combinations; compute additionally
    re-asserts that the resolved instrument_master rows for that
    curve_family map to instrument_type='inflation_linker' AND a
    single (country, currency) tuple (using the same DISTINCT
    country/currency lookup the curve-spread / breakeven primitives
    use to enforce the same-country invariant on a single leg) — a
    mismatch surfaces a controlled error envelope rather than a
    silently averaged or papered-over snapshot.

    Wire honesty: the output's ``methodology_label`` field is sourced
    from ``methodology.what_it_does`` below — NOT a hardcoded literal
    — so a YAML edit to the disclosure flows through to runtime.

conventions:

  # ---------------------------------------------------------------------------
  # Z-score window length (trading days)
  # ---------------------------------------------------------------------------
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading-day count for a 1-year rolling window.  Matches every
      sovereign rates tool (yield_levels, curve_spread, butterfly,
      curve_move_classifier, cross_market_spread), the OIS rate-level /
      curve-spread / swap-spread tools, and the linker real_yield_level
      / real_yield_curve_spread / breakeven tools — the cross-config
      lint enforces the match.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Minimum observations before the rolling stat is emitted
  # ---------------------------------------------------------------------------
  z_score_min_periods:
    value: 60
    source: team_judgment_pending_review
    rationale: >-
      ~3 months of observations before the rolling mean / std are
      deemed trustworthy.  Matches every sibling level / spread /
      butterfly tool.
    valid_range: [20, 252]

  # ---------------------------------------------------------------------------
  # Standard-deviation degrees of freedom
  # ---------------------------------------------------------------------------
  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Sample standard deviation (Bessel-corrected, ddof=1).  Matches
      pandas' default and the convention every other rates tool uses.

  # ---------------------------------------------------------------------------
  # Calendar-day buffer for the fetch window
  # ---------------------------------------------------------------------------
  z_score_buffer_multiplier:
    value: 1.5
    source: derived_from_window
    rationale: >-
      Calendar-day buffer added to the fetch window so the rolling
      z-score AND the trailing range stat are both fully populated
      from the first displayed trading day.  1.5x trading-day window
      covers weekends + holidays.  Matches every other rates tool.
    valid_range: [1.2, 2.0]

  # ---------------------------------------------------------------------------
  # Period-change offsets (in trading-day rows after ffill)
  # ---------------------------------------------------------------------------
  daily_change_offset_rows:
    value: 2
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-2] = 1 trading day back.  The real-yield
      butterfly series is in PERCENT so changes go through
      period_changes(already_bps=False), i.e. (current - prior) *
      100 — produces BPS change of a PERCENT-units butterfly.
    valid_range: [2, 5]

  weekly_change_offset_rows:
    value: 6
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-6] = 5 trading days back ≈ 1 calendar week.
    valid_range: [5, 10]

  monthly_change_offset_rows:
    value: 22
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-22] = ~1 calendar month of trading days.
    valid_range: [20, 30]

  # ---------------------------------------------------------------------------
  # Trailing range / percentile window — LOCKED at 252 in V1
  # ---------------------------------------------------------------------------
  # The output schema's field names (high_252d_pct, low_252d_pct,
  # percentile_252d) embed the number; compute() raises
  # NotImplementedError if this is set to anything else.  Same
  # wire-freeze as real_yield_curve_spread / real_yield_level /
  # sovereign butterfly / sovereign curve_spread.
  trailing_range_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      1Y trailing for high/low/percentile.  Locked at 252 in V1
      because the wire field names embed the number.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Forward-fill limit for missing observations
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Bridge up to one trading week of missing data across holiday
      gaps.  Matches every other rates tool; the consistency lint
      enforces the match where declared.  Applies inside the
      composed level primitive's clean step at each endpoint; the
      butterfly layer itself uses a strict inner join on trade_date
      to avoid synthesising butterfly points.
    valid_range: [1, 10]

  # ---------------------------------------------------------------------------
  # Output rounding precision — yields / pct (butterfly, endpoint
  # real yields, wing spreads, high/low)
  # ---------------------------------------------------------------------------
  yield_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches the legacy hardcoded default in
      ``shared.analytics.levels.compute_level_metrics`` and every
      sovereign / OIS / linker level tool.  Threaded through the
      butterfly compute so the snapshot's current_butterfly_pct,
      the bespoke time_series rows' butterfly_pct, and the canonical
      TimeSeries rows all agree byte-for-byte at the latest aligned
      trade_date.  Also used for the endpoint short/belly/long
      real_yield_pct display fields, the wing_short_pct /
      wing_long_pct component spreads, and the trailing
      high_252d_pct / low_252d_pct fields.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Output rounding precision — bps (period changes)
  # ---------------------------------------------------------------------------
  bps_round_decimals:
    value: 2
    source: team_judgment_pending_review
    rationale: >-
      Round bps period-change output (daily/weekly/monthly changes of
      the PERCENT-units butterfly) to 0.01 bps.  Display precision;
      matches every sibling level / curve-spread tool.  Threaded
      explicitly into period_changes(decimals=...) so the
      delta_bps default of 2 cannot silently shadow a YAML override.
    valid_range: [0, 6]

  # ---------------------------------------------------------------------------
  # Output rounding precision — z-score
  # ---------------------------------------------------------------------------
  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches the legacy default in
      ``shared.analytics.spreads.rolling_zscore`` and every other
      rates tool that exposes this convention.  Threaded to
      safe_float at the output boundary so a YAML override above 4
      is not silently truncated by safe_float's own default of 4.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Per-window-year display rounding (short_years, belly_years,
  # long_years)
  # ---------------------------------------------------------------------------
  window_years_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Display-precision rounding for the short_years / belly_years /
      long_years fields in current_metrics.  4 decimals matches the
      sibling tool values the cross-config lint enforces; this tool
      reuses the same convention name + value.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Trailing range high / low rounding precision (passed to the
  # composed level primitive's compute_level_metrics)
  # ---------------------------------------------------------------------------
  high_low_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches the legacy default in
      ``compute_level_metrics`` for the trailing high / low /
      percentile stats.  Matches the real_yield_level / sibling level
      tools — required because this primitive's ToolConfig is
      threaded into the level primitive's compute.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Default Bloomberg observation field for all three endpoint legs
  # ---------------------------------------------------------------------------
  # Linkers publish their real yield-to-maturity under the same
  # Bloomberg ``YLD_YTM_MID`` mnemonic that nominal sovereigns use —
  # see the linker playbook's ``target_metrics``.  Reusing the
  # convention name + value keeps the cross-config lint clean.
  # LLM/HTTP wrappers MUST use the empty/None sentinel so this
  # default flows through.  This default is passed unchanged to ALL
  # three inner get_real_yield_level calls.
  default_field_name:
    value: YLD_YTM_MID
    source: bloomberg_field_convention
    rationale: >-
      Linker real yield-to-maturity is published under the same
      Bloomberg ``YLD_YTM_MID`` mnemonic that nominal sovereigns use
      — the difference is the underlying instrument_type (linker
      tickers from rates_agent/playbooks/inflation_indexed_bonds.yml),
      not the field code.  The instrument-type discriminator is
      enforced in code on the DB read for all three endpoints
      (inherited from the level primitive's no-proxy guard); this
      default applies to each endpoint unless the caller explicitly
      overrides per query.

methodology:
  what_it_does: |
    Same-country linker real-yield butterfly (curvature) on a single
    sovereign linker curve (e.g. USD_TIPS 5s10s30s real-yield,
    GBP_LINKER 2s10s30s real-yield, EUR_FR_LINKER 2s10s15s real-yield,
    CAD_RRB 5s10s30s real-yield).  Computed per-trade-date via the
    FIXED simple-butterfly weighting:

      butterfly_pct = belly_real_yield_pct
                    - 0.5 * (short_real_yield_pct + long_real_yield_pct)

    where ``short_real_yield_pct`` / ``belly_real_yield_pct`` /
    ``long_real_yield_pct`` are the linker real-yield levels at
    ``short_tenor`` / ``belly_tenor`` / ``long_tenor`` respectively
    (each computed by ``get_real_yield_level`` filtered by
    ``instrument_type='inflation_linker'`` AND ``curve_family=?``
    AND ``tenor=?`` AND ``field_name=?`` — the no-proxy guard
    inherited transitively).  The three endpoint series are aligned
    per-trade-date via a strict pandas inner-join on calendar
    trade_date AFTER each is computed independently; the butterfly
    is computed only on dates where ALL THREE endpoints exist (no
    synthetic butterfly points are produced).

    Fixed simple-butterfly weighting (-0.5, +1.0, -0.5 on
    short/belly/long).  Equivalent to
    ``0.5 * (2 * belly - short - long)``.  Sign convention:
    POSITIVE = belly is CHEAP versus the half-weighted wings;
    NEGATIVE = belly is RICH.  Matches sovereign_bonds/butterfly's
    sign convention (which uses the mathematically-equivalent
    doubled form ``2*belly - short - long`` in BPS).

    Same-country / same-curve-family construction only: the input
    layer accepts a single linker ``curve_family`` field so cross-
    curve combinations cannot be expressed.  Compute additionally
    re-asserts that the resolved instrument_master rows for that
    curve_family map to a single (country, currency) tuple under
    ``instrument_type='inflation_linker'`` (a defensive guard
    against an instrument_master inconsistency), surfacing a
    controlled error envelope on mismatch.

    The output is the curvature of the REAL-YIELD curve, distinct
    from a real-yield curve spread (2-point difference) and from a
    nominal sovereign butterfly (3-point curvature of nominal
    yields, reported in BPS).  Real yields are quoted in PERCENT and
    the butterfly is reported in PERCENT — same units as the
    underlying — NOT in BPS.  Daily / weekly / monthly *changes* of
    the butterfly are reported in BPS, matching the desk convention
    for change reporting on any rate level.

  assumptions:
    - "Same-country / same-curve-family invariant: all three
       endpoints share a single linker ``curve_family`` (e.g.
       USD_TIPS / GBP_LINKER / EUR_FR_LINKER / CAD_RRB).  Cross-
       curve real-yield butterflies would be a sovereign-credit /
       regime-hybrid object, not a pure real-yield curve-shape
       object; they are not expressible by this primitive's input
       shape."
    - "Each endpoint real yield is computed by composing
       ``get_real_yield_level`` once per endpoint tenor, passing
       the same ``ToolConfig`` so methodology stays consistent.
       This inherits the level primitive's no-proxy guard
       (instrument_type='inflation_linker' filter on the DB read)
       for free — passing a nominal sovereign curve_family at any
       endpoint returns a controlled error envelope from the inner
       level call which this tool surfaces with the offending
       endpoint named."
    - "Three-tenor ordering is structural: short_tenor must map to
       a strictly smaller year fraction than belly_tenor, and
       belly_tenor strictly smaller than long_tenor, computed via
       ``shared.analytics.curve_bootstrap.tenor_to_years``.  A
       caller passing inverted or duplicate tenors is rejected at
       the schema layer; the tool does NOT silently swap them."
    - "Per-trade-date alignment: the three endpoint real-yield
       series are aligned via a strict pandas inner-join on
       trade_date AFTER each is computed independently from the
       level primitive.  No ffill across the join — dates where ANY
       endpoint has no data are dropped from the butterfly series."
    - "The real yields from the inner level primitive arrive in
       PERCENT (rounded to ``yield_round_decimals`` upstream); the
       butterfly stays in PERCENT (no *100 multiplier) and is
       rounded to ``yield_round_decimals`` at compute time.  Daily
       / weekly / monthly changes use
       ``period_changes(already_bps=False)`` which multiplies the
       percent-units change by 100 to produce a BPS delta;
       ``bps_round_decimals`` is threaded through explicitly so
       the YAML is authoritative."
    - "The snapshot's ``current_butterfly_pct`` equals
       ``time_series[-1].butterfly_pct`` and
       ``time_series_butterfly.rows[-1].value`` bit-for-bit at the
       YAML's ``yield_round_decimals``; same boundary-rounding
       discipline as real_yield_level / real_yield_curve_spread."
    - "lookback_days controls the *display* window (and the
       bespoke time_series row count + canonical TimeSeries
       length), NOT the rolling z-score window or the trailing
       range window — those are independent conventions in this
       YAML."
    - "Latest-observation cutoff for the displayed window is
       anchored to the data's latest aligned trade_date (matching
       real_yield_level / real_yield_curve_spread / OIS
       rate_level).  Linker daily series can lag wall-clock by
       several business days; anchoring to the data's latest
       aligned trade_date avoids silently shrinking the displayed
       window when data is stale."
    - "Real-yield butterflies can be negative across parts of the
       post-2008 / 2020-21 history (when the belly outperformed
       the wings).  The math is unchanged; the wire types tolerate
       negative values."

  citations:
    - "trading_day_convention (registered in
       docs/architecture/methodology_sources.md)."
    - "industry_standard_1y_window (registered in
       docs/architecture/methodology_sources.md)."
    - "industry_standard_sample_std (registered in
       docs/architecture/methodology_sources.md)."
    - "bloomberg_field_convention (registered in
       docs/architecture/methodology_sources.md)."
    - "derived_from_window (registered in
       docs/architecture/methodology_sources.md)."
    - "team_judgment_pending_review (registered in
       docs/architecture/methodology_sources.md)."
    - "legacy_default_pre_pilot (registered in
       docs/architecture/methodology_sources.md)."

  planned_extensions:
    - "trailing_range_window_days: configurable.  Currently locked
       at 252 because the output fields high_252d_pct /
       low_252d_pct / percentile_252d embed the number.  Path to
       configurability mirrors sibling level / curve-spread tools'
       planned_extensions: rename schema fields to high_window_pct
       / low_window_pct / percentile_window + add
       trailing_window_days to the output; remove the
       NotImplementedError guard in compute()."
    - "Duration-neutral / DV01-weighted butterfly weights.  Today:
       fixed simple-butterfly weighting (-0.5/+1.0/-0.5 on
       short/belly/long via the half-wings form).  Some desks
       prefer 50-50 weights or duration-neutral weights for
       hedging analysis.  Subjective methodology choice;
       documented here so future readers know it was considered
       and deferred — would ship as a separate primitive when the
       DV01 metadata is wired."
    - "Cross-country real-yield butterfly (e.g. comparing
       USD_TIPS 2s10s30s curvature to GBP_LINKER 2s10s30s
       curvature) — a separate primitive when the catalog gets to
       it.  Different concept than this primitive (which is a
       same-curve curvature object)."
