tool:
  name: get_fx_ndf_outright_tool
  domain: fx_ndf
  description: |
    Single-(ndf, tenor) NDF outright snapshot — latest value, daily /
    weekly / monthly percent changes, rolling 252-day z-score, trailing
    252-day high / low / percentile, and observation count. Mirrors
    get_fx_spot_level but for the NDF outright substrate (CCN+, IRN+,
    BCN+, KWN+, IHN+, NTN+ x 5 tenors = 30 instruments).
  category: desk_invariant_primitive

conventions:
  default_ndf_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: >-
      Bloomberg PX_LAST is the canonical observation for NDF outrights.
      Bid/ask available via PX_BID / PX_ASK overrides.

  default_tenor:
    value: 1M
    source: team_judgment_pending_review
    rationale: >-
      One-month tenor is the standard NDF carry monitor tenor (matches
      the deliverable-forward fx_carry convention).

  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      One trading year of rolling history. Matches every other FX
      level/curve tool so cross-asset readers see comparable z-scores.
    valid_range: [60, 504]

  z_score_min_periods:
    value: 60
    source: industry_standard_1y_window
    rationale: >-
      Minimum observations before a z-score is emitted. Below this the
      rolling stat is too noisy; z_score is set to None instead.
    valid_range: [20, 252]

  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Sample (Bessel-corrected) standard deviation. Same convention as
      every other FX level tool.
    valid_range: [0, 1]

  trailing_range_window_days:
    value: 252
    source: legacy_default_pre_pilot
    rationale: >-
      Locked at 252 in V1; the output schema's field names
      (high_252d / low_252d / percentile_252d) embed the number on
      the wire so changing the convention without renaming the fields
      would silently lie about what the percentile is computed against.
    valid_range: [252, 252]

  daily_change_periods:
    value: 1
    source: industry_standard_daily_changes
    rationale: >-
      One trading-day offset for the daily change calculation.
    valid_range: [1, 3]

  weekly_change_periods:
    value: 5
    source: industry_standard_daily_changes
    rationale: >-
      One trading-week offset (5 trading days).
    valid_range: [5, 10]

  monthly_change_periods:
    value: 21
    source: industry_standard_daily_changes
    rationale: >-
      Approximate one trading month (21 trading days).
    valid_range: [20, 30]

  outright_round_decimals:
    value: 6
    source: legacy_default_pre_pilot
    rationale: >-
      Six decimals preserves precision across NDF outright magnitudes
      (USDCNY ~7, USDIDR ~16000, USDKRW ~1300, USDTWD ~32).
    valid_range: [2, 8]

  pct_change_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals on percentage changes — same as fx_spot_level.
    valid_range: [2, 6]

  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals for z-score. Matches every other FX level tool.
    valid_range: [2, 6]

  percentile_round_decimals:
    value: 2
    source: legacy_default_pre_pilot
    rationale: >-
      Two decimals for percentile rank (0-100 scale).
    valid_range: [0, 4]

methodology:
  what_it_does: |
    For one (ndf_code, tenor) pair, fetches the NDF outright observation
    history from macro_data.market_data_daily (instrument_type =
    fx_ndf, vendor_ticker = f'{ndf_code}{tenor} Curncy') over the
    lookback window, then computes: latest value, daily/weekly/monthly
    percent changes, rolling 252-day z-score, trailing 252-day
    high/low/percentile.
  assumptions:
    - "NDF outrights are quoted in spot-equivalent units (USD per local currency), NOT as forward points."
    - "Daily/weekly/monthly change semantics: % change of the OUTRIGHT level, not of the implied carry. For carry analysis, use calculate_fx_ndf_implied_carry."
    - "Z-score min_periods (60) and window (252) are calendar conventions; sparse history (< 60 observations) returns None for z_score / percentile to fail loud rather than emit misleading stats."
    - "The underlying spot pair is reported in the output for joinability with fx_spot tools; no spot data is fetched by THIS tool — see calculate_fx_ndf_implied_carry for the spot-vs-outright comparison."
  citations: []
  planned_extensions:
    - "Add bid/ask spread metrics in the output once PR #228 bid/ask substrate is consumed downstream."
    - "Add 'methodology_label' field so cross-asset comparators can sanity-check the convention assumption."
