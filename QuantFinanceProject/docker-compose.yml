# ─────────────────────────────────────────────────────────────
# docker-compose.yml  –  QuantFinanceProject
# One image powers both worker & streamer; credentials unified
# ─────────────────────────────────────────────────────────────

volumes:
  tsdata:
  pgadmin-data:
  grafana-storage:
  metabase-data:

services:
# ─────────────────────────────────────────────────────────────
  tsdb:
    image: timescale/timescaledb:latest-pg14
    container_name: tsdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: quantdata
      POSTGRES_USER: quantuser
      POSTGRES_PASSWORD: myStrongPass        # ← single hard-coded password
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data
      - ./docker/00_set_timezone.sql:/docker-entrypoint-initdb.d/00_tz.sql:ro
      - ./market_data_agent/storage/schema.sql:/docker-entrypoint-initdb.d/10_market_data_schema.sql:ro
      - ./earnings_agent/storage/schema.sql:/docker-entrypoint-initdb.d/20_earnings_data_schema.sql:ro
# ─────────────────────────────────────────────────────────────
  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: prefect-server
    restart: unless-stopped
    depends_on:
      - tsdb
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: "postgresql+asyncpg://quantuser:myStrongPass@tsdb:5432/quantdata"
      TZ: Asia/Kolkata
    ports:
      - "4200:4200"
    command: "prefect server start --host 0.0.0.0"

# ─────────────────────────────────────────────────────────────
  # Build the project image (micromamba + Prefect + Chromium)
  project-image:
    build:
      context: .
      dockerfile: Dockerfile         # ← the Dockerfile I sent earlier
    image: quantfinanceproject:latest
    # no container; just produces the image used below

# ─────────────────────────────────────────────────────────────
  prefect-worker:
    image: quantfinanceproject:latest
    container_name: prefect-worker
    restart: unless-stopped
    depends_on:
      - prefect-server
    working_dir: /app
    volumes:
      - .:/app
      - ./.env:/app/.env                      
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      TZ: Asia/Kolkata
    command: >
      bash -c "
        micromamba run -n quant-env prefect work-pool create default-agent-pool --type process || true &&
        micromamba run -n quant-env prefect worker start --pool default-agent-pool --type process
      "

# ─────────────────────────────────────────────────────────────
  market-streamer:
    image: quantfinanceproject:latest
    container_name: market-streamer
    restart: unless-stopped
    depends_on:
      - tsdb
    working_dir: /app
    volumes:
      - .:/app
      - ./.env:/app/.env
    environment:
      MARKET_DB_NAME: quantdata
      MARKET_DB_USER: quantuser
      MARKET_DB_PASSWORD: myStrongPass
      MARKET_DB_HOST: tsdb
      MARKET_DB_PORT: "5432"
      TZ: Asia/Kolkata
    command: >
      micromamba run -n quant-env python -m market_data_agent.ingestion.stream_intraday_1m
################################################################################
# GUI stack
################################################################################
  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      PGADMIN_DEFAULT_EMAIL: saivenkatsriram@google.com
      PGADMIN_DEFAULT_PASSWORD: changeme123
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on: [ tsdb ]

  grafana:
    image: grafana/grafana-oss:11.0.0
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on: [ tsdb ]

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3001:3000"          # web UI on http://localhost:3001
    environment:
      MB_DB_FILE: /metabase-data/metabase.db   # stores Metabase’s own metadata
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Kolkata"   # server TZ
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      - tsdb    

