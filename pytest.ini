# =============================================================================
# Macro Copilot — pytest configuration
# =============================================================================
#
# This file is the project-wide pytest config.  Per-directory `conftest.py`
# files (notably `Macro_Copilot/tests/conftest.py`) handle:
#
#   - sys.path setup so tests can `import api`, `import orchestrator`,
#     `import rates_agent`, `import shared` etc. without each test file
#     manipulating sys.path itself.
#   - `collect_ignore` for the CLI helper scripts (test_ws_chat.py and the
#     `*_sql_validation.py` runners) that are not pytest tests.
#
# pytest.ini owns project-wide concerns: where the tests live, which
# patterns count as tests, what addopts apply, the marker registry, and
# warning policy.
#
# Invocation: run `pytest` from the worktree root.  The `testpaths` below
# is relative to this file.
# =============================================================================

[pytest]
minversion = 8.0
testpaths = Macro_Copilot/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Standard run options:
#   --strict-markers: any @pytest.mark.X that isn't registered below fails.
#                     Prevents silent marker typos.
#   -ra            : show extra summary info for skipped / failed / xfailed.
#   --tb=short     : short tracebacks (full ones bury the failure point).
#   --showlocals   : show local variables on failures (helps diagnose math).
addopts =
    --strict-markers
    -ra
    --tb=short
    --showlocals

# Registered markers.  Anything not on this list raises under strict-markers.
markers =
    integration: integration tests requiring external services (DB, MCP, network)
    slow: tests that take >5s to run; deselect with `-m 'not slow'` for fast loops
    bridge: tests for the primitive -> operator bridge
    workflow: tests for the workflow template substrate
    gauntlet: end-to-end multi-agent gauntlet (calls real Anthropic API — never in CI)
    sql_validation: tests that cross-check primitives against an independent SQL oracle

# pytest-asyncio mode.  The orchestrator + WebSocket layer is async-first;
# `auto` lets async test functions work without per-function decorators.
asyncio_mode = auto

# Warning filters.  Deliberately permissive for V0: third-party libraries
# (pandas, pydantic, langchain) emit DeprecationWarnings on minor version
# bumps and we don't want every CI run failing on those.  A later PR can
# tighten this to `error` once we audit the warning surface and either fix
# them or pin them in this list.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Logging during test runs.  Disabled by default to keep CI logs readable;
# enable per-run with `-o log_cli=true -o log_cli_level=INFO` when debugging.
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
