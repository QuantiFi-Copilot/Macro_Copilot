catalog_name: primitive_automation_initial_remaining_instruments
catalog_version: "1.0"
branch: primitive_automation
execution_mode: one_primitive_at_a_time
status_policy:
  allowed_statuses:
    - todo
    - in_progress
    - changes_required
    - waiting_quota
    - blocked
    - done
runtime_managed_fields:
  - status
  - active_step
  - review_round
  - human_action_required
  - last_error
  - last_review_heading
  - block_reason
selection_principles:
  - Include only primitives from the three remaining instrument families selected for the first automation batch.
  - Include only primitives whose required market data and reference metadata already exist in the current repo playbooks or already-built upstream tool surfaces.
  - Exclude anything that would require proxies, hidden assumptions, or missing CTD / conversion-factor / repo inputs.
  - Keep the initial batch biased toward desk-recognizable standard primitives rather than Bucket 2 research models.
notes:
  - Bond futures contributes only three buildable entries from the earlier top-five shortlist because current playbook data do not support CTD or implied-repo primitives honestly.
  - The repo currently contains an explicit technical-debt blocker that says futures-specific analytics tools must wait until the rolling-contract metadata issue is fixed, so the three bond_futures entries are catalog-blocked until that repo contradiction is resolved deliberately.
  - Inflation swap basis is included because the required inflation swap, linker, and nominal data already exist in the repo, but it depends on earlier linker primitives being built first.
  - The orchestrator must resume unfinished work before starting new `todo` items.
  - The orchestrator may continue through the whole catalog in one run, stopping only for quota, blocker, hard error, or catalog exhaustion.

