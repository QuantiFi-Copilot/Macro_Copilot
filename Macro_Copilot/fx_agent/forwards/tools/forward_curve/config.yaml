tool:
  name: get_fx_forward_curve_tool
  domain: fx_forwards
  description: |
    For one G10 pair, returns a snapshot of the full forward curve term
    structure (1W / 1M / 3M / 6M / 12M) with raw forward points,
    spot-unit forward points, outright forward, annualised carry, and
    rolling 252-day z-score / percentile / range on the spot-unit
    forward points. Numerically consistent with calculate_fx_carry for
    any given (pair, tenor).
  category: desk_invariant_primitive

conventions:
  default_fx_spot_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: >-
      Bloomberg PX_LAST is the canonical spot observation used as the
      denominator for forward-points carry.

  default_fx_forward_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: >-
      Bloomberg PX_LAST is the canonical forward-points observation
      for the FX forward tickers in fx_agent/playbooks/fx_forwards.yml.

  # Tenor-day conventions. Trading-day approximation, consistent with
  # annualization_days below. Mirrors fx_carry/config.yaml — these two
  # tools share fx_agent/forwards/_shared.py::tenor_days_from_config
  # which reads exactly these keys. Adding a new tenor = update the
  # _shared constant, both Literal schemas, and both config.yamls.

  tenor_1w_days:
    value: 5
    source: trading_day_convention
    rationale: >-
      Approximate one FX trading week.
    valid_range: [3, 10]

  tenor_1m_days:
    value: 21
    source: trading_day_convention
    rationale: >-
      Approximate one FX trading month.
    valid_range: [15, 30]

  tenor_3m_days:
    value: 63
    source: trading_day_convention
    rationale: >-
      Approximate three FX trading months.
    valid_range: [45, 90]

  tenor_6m_days:
    value: 126
    source: trading_day_convention
    rationale: >-
      Approximate six FX trading months.
    valid_range: [90, 180]

  tenor_12m_days:
    value: 252
    source: trading_day_convention
    rationale: >-
      One FX trading year. Uses the trading-day approximation, NOT
      calendar 365, to stay consistent with ``annualization_days``
      below. With 12M / 252 = 1, the 12M annualised carry equals the
      raw 12M carry — which is what a trader expects.
    valid_range: [240, 270]

  annualization_days:
    value: 252
    source: industry_standard_trading_year
    rationale: >-
      Trading-day annualization convention used across the macro
      stack. Matches fx_carry, OIS forward-rate, and yield-level
      conventions so cross-asset reads at the same horizon stay
      numerically aligned.
    valid_range: [240, 366]

  jpy_forward_points_divisor:
    value: 100
    source: bloomberg_field_convention
    rationale: >-
      JPY forward points are quoted in hundredths of one JPY spot
      unit. Same divisor as fx_carry.
    valid_range: [1, 10000]

  default_forward_points_divisor:
    value: 10000
    source: bloomberg_field_convention
    rationale: >-
      Non-JPY G10 forward points are quoted in ten-thousandths of one
      spot unit. Same divisor as fx_carry.
    valid_range: [1, 100000]

  # Rolling-statistic conventions — mirror the rates yield_levels
  # tool's defaults. The trailing range / percentile / high / low are
  # wire-frozen at 252 in V1; the output schema field names embed the
  # number so changing it would silently lie about what the percentile
  # is computed against. See methodology.planned_extensions for the
  # path to making the trailing window configurable.

  z_score_window_days:
    value: 252
    source: industry_standard_trading_year
    rationale: >-
      One trading year of rolling history. Matches the rates and OIS
      yield-level tools so a cross-asset reader sees comparable
      z-scores at the same horizon.
    valid_range: [60, 504]

  z_score_min_periods:
    value: 60
    source: industry_standard
    rationale: >-
      Minimum observations before a z-score is emitted. Below this the
      rolling stat is too noisy to be informative; the output row's
      z_score field is set to None instead.
    valid_range: [20, 252]

  z_score_ddof:
    value: 1
    source: industry_standard
    rationale: >-
      Sample (Bessel-corrected) standard deviation. Same convention
      as rates yield_levels.
    valid_range: [0, 1]

  trailing_range_window_days:
    value: 252
    source: wire_frozen_v1
    rationale: >-
      Locked at 252 in V1; the output schema's field names
      (``high_252d``, ``low_252d``, ``percentile_252d``) embed the
      number on the wire so changing the convention without renaming
      the fields would silently lie about what the percentile is
      computed against.
    valid_range: [252, 252]

  ffill_limit_days:
    value: 5
    source: industry_standard
    rationale: >-
      Maximum forward-fill window for missing daily observations
      before a gap is treated as a true NA. Five trading days covers
      every standard market holiday cluster (Christmas week, Easter
      week, the GBP-USD Whit Monday gap, …).
    valid_range: [0, 10]

  daily_change_offset_rows:
    value: 2
    source: industry_standard
    rationale: >-
      One trading-day offset for the period change calculation
      (current vs t-1). Two rows back because ffilled series carry
      forward weekend / holiday rows.
    valid_range: [1, 3]

  weekly_change_offset_rows:
    value: 6
    source: industry_standard
    rationale: >-
      One trading-week offset (current vs t-5). Six rows back because
      of the same ffill semantics.
    valid_range: [5, 10]

  monthly_change_offset_rows:
    value: 22
    source: industry_standard
    rationale: >-
      One trading-month offset (current vs t-21).
    valid_range: [20, 30]

  spot_round_decimals:
    value: 6
    source: legacy_default_pre_pilot
    rationale: >-
      Six decimals preserves major-pair spot precision. Matches
      fx_carry.
    valid_range: [2, 8]

  forward_points_round_decimals:
    value: 3
    source: legacy_default_pre_pilot
    rationale: >-
      Three decimals matches the current monitor display precision
      for forward points.
    valid_range: [0, 6]

  carry_bps_round_decimals:
    value: 2
    source: legacy_default_pre_pilot
    rationale: >-
      Two decimals is sufficient for carry in basis points of spot.
    valid_range: [0, 6]

  carry_pct_round_decimals:
    value: 2
    source: legacy_default_pre_pilot
    rationale: >-
      Two decimals is sufficient for annualised carry percentage.
    valid_range: [0, 6]

  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals for z-score and percentile. Matches the rates
      yield_levels rounding.
    valid_range: [2, 6]

methodology:
  what_it_does: |
    For one pair, queries the FX spot and forward-points history over
    a configurable lookback window, joins per-day, converts forward
    points into spot units using the JPY-aware divisor, computes the
    annualised carry and the rolling z-score / percentile / range of
    the spot-unit forward points, and returns one row per supported
    tenor (1W / 1M / 3M / 6M / 12M) ordered short → long.
  assumptions:
    - "Forward tickers store forward points, not outright forwards."
    - "JPY pairs use a 100 divisor; non-JPY G10 pairs use 10000."
    - "Carry annualisation uses a trading-day basis (252 days), consistent with annualization_days and the rates / OIS conventions."
    - "Z-score / percentile / range are computed on the spot-unit forward points (not raw points) so the statistics are comparable across pairs with different divisors."
    - "The trailing-range window is wire-frozen at 252 trading days in V1; the output schema field names embed the number."
  citations: []
  planned_extensions:
    - "Make the trailing-range window configurable once the output field names are decoupled from the number (would require a wire-format bump)."
    - "Surface a methodology_label per row so cross-asset tools can sanity-check carry annualisation matches OIS differentials at the same horizon."
    - "NDF-aware branch when NDF substrate lands — NDFs are quoted as outrights and need a different (outright - spot) / spot formula."
