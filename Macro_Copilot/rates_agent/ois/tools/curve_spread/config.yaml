# =============================================================================
# calculate_ois_curve_spread_tool — tool configuration
# =============================================================================
# This file is the canonical record of the OIS curve-spread tool's
# conventions and methodology.  Loaded by
# ``shared.config.load_tool_config`` at compute() time.  Mirrors the
# sovereign ``curve_spread`` tool's config structure 1:1 — every
# convention with the same name carries the same numeric value, so
# ``shared.config.lint`` cross-tool check stays clean as the OIS
# domain comes online.
#
# In V1 deterministic mode there is NO LLM-facing override path for
# conventions.  The LLM cannot ask for a non-standard z-score window.
# See docs/architecture/tool_architecture.md.
# =============================================================================

tool:
  name: calculate_ois_curve_spread_tool
  domain: ois
  description: |
    Basis-point spread between two tenors on the same OIS curve
    (e.g. SOFR 2s10s, ESTR 1s5s, SONIA 5s30s) — emits both:

      - ``current_metrics``: snapshot of the latest observation
        (current spread, daily bps change, 252-day rolling z-score,
        plus the latest short-leg / long-leg par swap rates).

      - bespoke wire-frozen ``time_series`` (List[
        OISCurveSpreadTimeSeriesRow]) for backward-compat with any
        future OIS REST/UI surface, AND two canonical
        ``shared.schemas.time_series.TimeSeries`` fields for the
        upcoming primitive-to-operator bridge:

        * ``time_series_spread`` (units = BPS)   — the spread series
        * ``time_series_zscore`` (units = Z_SCORE) — the rolling z-score

    All three series are built from the same display DataFrame so
    they cannot drift.  "Rate" rather than "yield" terminology
    because OIS quotes are par swap rates, not bond yields — see
    ``current_metrics.short_tenor_rate`` / ``long_tenor_rate``.

conventions:

  # ---------------------------------------------------------------------------
  # Z-score window length (trading days)
  # ---------------------------------------------------------------------------
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading-day count for a 1-year rolling window.  Matches every
      sovereign rates tool (curve_spread, yield_levels, butterfly,
      cross_market_spread, curve_move_classifier) AND OIS rate_level
      — the cross-config lint enforces the match.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Minimum observations before the rolling stat is emitted
  # ---------------------------------------------------------------------------
  z_score_min_periods:
    value: 60
    source: team_judgment_pending_review
    rationale: >-
      ~3 months of observations before the rolling mean / std are
      deemed trustworthy.  Matches sovereign curve_spread / OIS
      rate_level.
    valid_range: [20, 252]

  # ---------------------------------------------------------------------------
  # Standard-deviation degrees of freedom
  # ---------------------------------------------------------------------------
  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Sample standard deviation (Bessel-corrected, ddof=1).  Matches
      pandas' default and the convention every other rates tool uses.

  # ---------------------------------------------------------------------------
  # Calendar-day buffer for the fetch window
  # ---------------------------------------------------------------------------
  z_score_buffer_multiplier:
    value: 1.5
    source: derived_from_window
    rationale: >-
      Calendar-day buffer added to the fetch window so the rolling
      z-score is fully populated from the first displayed trading day.
      1.5x trading-day window covers weekends + holidays.  Matches
      every sovereign rates tool.
    valid_range: [1.2, 2.0]

  # ---------------------------------------------------------------------------
  # Forward-fill limit for missing observations
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Bridge up to one trading week of missing data across holiday
      gaps.  Matches sovereign curve_spread / OIS rate_level — the
      cross-config lint enforces the match.
    valid_range: [1, 10]

  # ---------------------------------------------------------------------------
  # Output rounding precision — bps
  # ---------------------------------------------------------------------------
  spread_bps_round_decimals:
    value: 2
    source: team_judgment_pending_review
    rationale: >-
      Round bps output to 0.01 bps.  Matches sovereign curve_spread —
      same precision Bloomberg / DLib quotes use for swap-curve
      spreads.
    valid_range: [0, 6]

  # ---------------------------------------------------------------------------
  # Output rounding precision — z-score
  # ---------------------------------------------------------------------------
  z_score_round_decimals:
    value: 4
    source: team_judgment_pending_review
    rationale: >-
      Round z-score output to 4 decimals.  Matches sovereign
      curve_spread / OIS rate_level.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Default Bloomberg observation field — OIS-specific name
  # ---------------------------------------------------------------------------
  # Sovereign tools use ``default_field_name: YLD_YTM_MID`` (mid
  # yield-to-maturity).  OIS quotes are par swap rates, so the
  # canonical Bloomberg observation is ``PX_LAST`` (mid par-swap
  # rate).  The two values are semantically distinct, so the
  # convention is named ``default_swap_rate_field`` here — otherwise
  # the cross-config lint would flag a value disagreement between
  # sovereign tools (YLD_YTM_MID) and OIS tools (PX_LAST) on the
  # same convention name.  Matches OIS rate_level's naming so the
  # OIS-side cross-tool lint stays meaningful.
  default_swap_rate_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: >-
      Mid par-swap rate is the canonical OIS observation.  LLM/HTTP
      wrappers must use the empty/None sentinel so this default
      flows through — see the wrapper-shadowing fix from sovereign
      curve_move_classifier (commit b2605ee).

methodology:
  what_it_does: |
    Computes the basis-point spread between two tenors on the same
    OIS swap curve as ``(long_tenor_rate − short_tenor_rate) × 100``,
    plus a rolling z-score over the spread series.  Returns the
    current value, daily change, z-score, the bespoke wire-frozen
    time_series, AND the two canonical TimeSeries payloads
    (spread + z-score) for the primitive-to-operator bridge.

  assumptions:
    - "OIS par swap rates are stored as percent in the source DB (e.g. 4.25 = 4.25%)."
    - "Same-date matching after up-to-5d ffill across holiday gaps."
    - "Sample standard deviation (ddof=1) for the rolling z-score."
    - "Z-score window is fixed regardless of the user's display lookback."
    - "User-input lookback_days controls the *display* window, not the z-score window."
    - "Observation cutoff is anchored to the data's latest observation
       date (not date.today()), matching the legacy single-file OIS
       curve_spread tool.  Sovereign curve_spread anchors to
       date.today() — the inconsistency mirrors yield_levels vs
       rate_level and will be reconciled in a separate PR."

  citations: []
