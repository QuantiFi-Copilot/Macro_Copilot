tool:
  name: get_fx_vol_calendar_spread_tool
  domain: fx_vol
  description: |
    Single-(pair, short_tenor, long_tenor) FX vol calendar-spread
    snapshot — the ATM implied-vol differential between two standard
    tenors, signed per spread_direction. Captures vol term-structure
    carry: positive (long - short > 0) = contango; negative =
    backwardation. Quoted in absolute vol points. Central methodology
    knob: spread_direction (PR8).
  category: desk_invariant_primitive

conventions:
  default_vol_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: >-
      Bloomberg PX_LAST is the canonical ATM observation; bid/ask
      override available via field_name.

  default_short_tenor:
    value: 1M
    source: team_judgment_pending_review
    rationale: >-
      1M is the desk-standard front-end vol monitor (matches every
      other Phase E1/E2 default).

  default_long_tenor:
    value: 3M
    source: team_judgment_pending_review
    rationale: >-
      3M is the desk-standard belly tenor on the term structure;
      1M-3M spread is the most-watched calendar pair.

  default_spread_direction:
    value: long_minus_short
    source: team_judgment_pending_review
    rationale: >-
      long_minus_short matches the canonical contango sign — positive
      when the curve is upward sloping. Aligns with how the desk reads
      a calendar trade ("long the back end, short the front").

  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      One trading year of rolling history on the SPREAD series.
      Matches every other FX vol tool so cross-asset readers see
      comparable z-scores.
    valid_range: [60, 504]

  z_score_min_periods:
    value: 60
    source: industry_standard_1y_window
    rationale: >-
      Minimum observations before a z-score is emitted; below this
      the rolling stat is too noisy and z_score is set to None.
    valid_range: [20, 252]

  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: Sample (Bessel-corrected) standard deviation.
    valid_range: [0, 1]

  trailing_range_window_days:
    value: 252
    source: legacy_default_pre_pilot
    rationale: >-
      Locked at 252 in V1; the schema field names (high_252d /
      low_252d / percentile_252d) embed the number — a convention
      change without renaming would silently lie (PR14).
    valid_range: [252, 252]

  daily_change_periods:
    value: 1
    source: industry_standard_daily_changes
    rationale: One trading-day offset for the daily change calculation.
    valid_range: [1, 3]

  weekly_change_periods:
    value: 5
    source: industry_standard_daily_changes
    rationale: One trading-week offset (5 trading days).
    valid_range: [5, 10]

  monthly_change_periods:
    value: 21
    source: industry_standard_daily_changes
    rationale: Approximate one trading month (21 trading days).
    valid_range: [20, 30]

  vol_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals preserves spread precision (typical 1M-3M spreads
      between -2 and +2 vol points). Platform-wide rule.
    valid_range: [2, 6]

  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: Four decimals for z-score (platform-wide convention).
    valid_range: [2, 6]

  percentile_round_decimals:
    value: 2
    source: legacy_default_pre_pilot
    rationale: Two decimals for percentile rank (0-100 scale).
    valid_range: [0, 4]

methodology:
  what_it_does: |
    For one (pair, short_tenor, long_tenor):
      1. Fetch implied ATM vol histories at both tenors from fx_vol
         substrate.
      2. Inner-join by trade_date — only dates where BOTH tenors have
         a non-null value contribute to the spread series.
      3. Compute spread_t per spread_direction:
            long_minus_short:  spread = long - short  (contango +ve)
            short_minus_long:  spread = short - long  (backwardation +ve)
      4. Snapshot + 1/5/21-day changes + rolling 252-day z-score /
         percentile / high / low on the spread series.

    short_tenor must be strictly < long_tenor (Pydantic-enforced) so
    the spread label is unambiguous.
  assumptions:
    - "Both legs are ATM implied vols quoted in PERCENT — subtraction yields ABSOLUTE vol points (e.g. long=6.6pct, short=5.9pct → spread=+0.7 vol pts under long_minus_short)."
    - "spread_direction default = long_minus_short matches the contango / upward-sloping-curve sign convention."
    - "Inner-join on trade_date means observation_count reflects the date intersection — slightly shorter than either raw fetch window when the two tenors have different update lags."
    - "Z-score / percentile are computed on the spread series, not the underlying vols — measures extremeness of the term-structure differential, NOT of either leg in isolation."
  citations: []
  planned_extensions:
    - "Add a calendar-spread scanner across pairs once the snapshot stabilises."
    - "Add a 3-point calendar butterfly (1M - 2*3M + 6M) once the V1 calendar primitive is bedded in."
