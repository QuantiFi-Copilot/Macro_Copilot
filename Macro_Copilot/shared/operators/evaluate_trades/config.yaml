operator:
  name: evaluate_trades
  method_family: trade_evaluation
  version: "1.0.0"
  description: >-
    Compute per-trade P&L over each trade's holding window from a
    TradeSet plus a price/yield Panel.  Frictionless V1: mid prices
    only, no transaction costs, no financing.

defaults:
  pricing_convention:
    value: mid
    source: operator_v1_default
    rationale: >-
      Phase 1 V1 prices every leg at mid.  bid/ask spreads and
      slippage are deferred — raising ``NotImplementedError`` if
      the caller tries to override.  The mid-price disclosure
      surfaces on the workspace methodology card so a reader
      knows V1's P&L is upper-bound vs a real-world execution.
    valid_values: [mid, bid, ask]

  frictionless:
    value: true
    source: operator_v1_default
    rationale: >-
      No transaction costs, no bid/ask, no borrow availability.
      Hard-coded ``true`` in V1; the operator raises if a caller
      tries ``frictionless=false`` because the friction model is
      not yet built.  The disclosure surfaces on the workspace
      methodology card.

  financing_assumption:
    value: none
    source: operator_v1_default
    rationale: >-
      PR 12 default ``none``.  PR 19 (financing_rate primitive)
      adds ``external_series`` — caller passes a financing-rate
      Panel produced by ``compute_financing_rate_tool`` and the
      per-trade P&L includes the per-day financing accrual.
      ``constant_rate`` + ``overnight_repo_curve`` were declared
      placeholders in PR 12 and still raise NotImplementedError
      (the proper path is to build the rate Series upstream via
      the primitive and pass it through ``external_series``).
    valid_values: [none, constant_rate, overnight_repo_curve, external_series]

  financing_basis:
    value: act_360
    source: industry_standard_sovereign_repo_usd_money_market
    rationale: >-
      Day-count basis for the per-day accrual fraction.  Allowed:
      act_360 (sovereign repo + USD money-market default), act_365
      (Gilt repo), act_act_isda (ISDA accrual; V1 approximates as
      365.0 and discloses).  Used only when financing_assumption
      = ``external_series``; ignored otherwise.

methodology:
  what_it_does: >-
    For each Trade in the input TradeSet, the operator looks up
    each leg's instrument_key in the price/yield Panel, computes
    per-date P&L contributions as ``leg.weight * (price[t] -
    price[entry])``, and aggregates leg contributions into a
    per-trade total.  The output Panel has one row per date in
    the union of trade-holding windows (intersected with the
    price Panel's calendar) and one column per trade named
    ``trade_<i>_pnl``.  P&L is denominated in the asset's native
    units (e.g. yield-change bps for a yield series; price-
    change for a price series).
  planned_extensions:
    - "Multi-component P&L decomposition (carry vs price vs financing) with columns ``trade_<i>__carry``, ``trade_<i>__price``, ``trade_<i>__financing``"
    - "bid/ask pricing (requires per-instrument bid/ask data in the price Panel)"
    - "Transaction costs (basis points per leg, asymmetric by side)"
    - "Borrow-availability constraints for short legs"
    - "Financing-rate integration (consumes the financing_rate primitive landing in Phase 1 PR 13)"
