playbook_name: "fx_ndf"
playbook_version: "1.0"
asset_class: "fx"
dataset_name: "fx_ndf"
description: "Daily NDF (Non-Deliverable Forward) outrights for the 5 canonical NDF currency pairs (USDCNY, USDINR, USDBRL, USDKRW, USDIDR) across the standard tenor strip (1W, 1M, 3M, 6M, 12M). Unit is OUTRIGHT (not forward points like deliverable G10 forwards): the value is the implied USD/XXX rate at the forward date, same order of magnitude as spot. Convention discovered in BBG Phase 1 (2026-05-25). Created in Phase B BBG batch; substrate parallel to fx_forwards.yml but with different unit + different ticker family (`<NDF_CODE>+<TENOR> Curncy` vs `<PAIR><TENOR> Curncy`). Phase D will build tools on top of this substrate (calculate_ndf_implied_carry, scan_ndf_carry)."

extraction:
  start_date: "2000-01-01"
  incremental_window_days: 14

target_metrics:
  - metric_id: "ndf_outright"
    bloomberg_field: "PX_LAST"

reference_metrics:
  - column_name: "security_name"
    bloomberg_field: "SECURITY_DES"

universe:
  # ============================================================
  # CNY NDF — CCN+ family (China yuan offshore NDF)
  # Underlying pair: USDCNY. Distinct from USDCNH which is the
  # deliverable offshore CNY — see fx_vol.yml for CNH ATM vol.
  # ============================================================
  - ticker: "CCN+1W Curncy"
    instrument_type: "fx_ndf"
    fx_family: "EM_NDF"
    market_scope: "EM"
    region: "APAC"
    pair: "USDCNY"
    tenor: "1W"
    base_ccy: "USD"
    quote_ccy: "CNY"
    ndf_code: "CCN+"

  - ticker: "CCN+1M Curncy"
    instrument_type: "fx_ndf"
    fx_family: "EM_NDF"
    market_scope: "EM"
    region: "APAC"
    pair: "USDCNY"
    tenor: "1M"
    base_ccy: "USD"
    quote_ccy: "CNY"
    ndf_code: "CCN+"

