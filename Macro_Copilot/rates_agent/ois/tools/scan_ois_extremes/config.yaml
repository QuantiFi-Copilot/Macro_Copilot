# =============================================================================
# scan_ois_extremes_tool — tool configuration
# =============================================================================
# This file is the canonical record of the tool's conventions and methodology.
# Loaded by `shared.config.load_tool_config` at compute() time.
#
# Sibling configuration for the OIS half of the deterministic z-score
# scanner pair.  The sovereign sibling lives at
# `rates_agent/sovereign_bonds/tools/scan_extremes/config.yaml` — both
# share the same z_score_* convention values (the cross-config lint
# enforces value-agreement).  The DIFFERENT field is `instrument_type`
# (`ois_swap` here vs `sovereign_benchmark` there).
#
# Migration provenance
# --------------------
# Migrated 2026-06-10 from the legacy flat file
# `rates_agent/ois/tools/scanner.py` as part of PR-10G gap-#4 closure.
# Convention default values reproduce the legacy hardcoded constants
# bit-for-bit.
# =============================================================================

tool:
  name: scan_ois_extremes_tool
  domain: ois
  category: scanner
  description: |
    Sweeps every OIS curve in the database and returns the most
    statistically stretched (curve_family, tenor) observations by
    absolute 252-day z-score.  Symmetric with the sovereign scanner —
    same shared analytics primitives, different instrument-type
    filter.

methodology:
  what_it_does: |
    For every (curve_family, tenor) group in the OIS universe,
    computes a rolling 252-day z-score, daily bps change, trailing
    252-day range stats, and an EXTREME_HIGH / EXTREME_LOW signal
    label based on the sign of the z-score.  Output rows are
    thresholded by `min_abs_z_score`, ranked by absolute z-score, and
    truncated to top `top_n`.  Pure z-score screen at the per-(curve,
    tenor) leaf — no curve-shape or cross-curve attribution.
  assumptions:
    - "Universe is the set of ois_swap instruments loaded into the
       substrate for the requested `field_name` (default PX_LAST)."
    - "Per-group history must reach at least `z_score_min_periods`
       observations or the group is dropped."
    - "Signal labels are mechanical (sign of z-score) — they do not
       encode policy-path bull/bear conviction or economic interpretation."

conventions:

  # ---------------------------------------------------------------------------
  # Instrument-type filter passed to fetch_scan_universe
  # ---------------------------------------------------------------------------
  ois_scan_instrument_type:
    value: ois_swap
    source: tool_design_intent
    rationale: >-
      The OIS scanner's universe is ``ois_swap`` rows in the substrate.
      The sovereign-domain sibling at
      ``rates_agent.sovereign_bonds.tools.scan_extremes`` reuses the
      same fetch_scan_universe helper with ``sovereign_benchmark``
      instead.  Named domain-qualified (not plain ``instrument_type``)
      per PR13: the cross-config lint compares same-named conventions
      globally, and each scanner's universe value legitimately differs
      by design.

  # ---------------------------------------------------------------------------
  # Z-score window length (trading days)
  # ---------------------------------------------------------------------------
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading-day count for a 1-year rolling window.  Matches
      Bloomberg's default rolling window for percentile and z-score
      metrics; consistent with the sibling sovereign scanner and the
      per-instrument OIS rate_level tool.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Minimum observations before the rolling stat is emitted
  # ---------------------------------------------------------------------------
  z_score_min_periods:
    value: 60
    source: team_judgment_pending_review
    rationale: >-
      ~3 months of observations before the rolling mean / std are
      deemed trustworthy.
    valid_range: [20, 252]

  # ---------------------------------------------------------------------------
  # Calendar-day buffer multiplier for the fetch window
  # ---------------------------------------------------------------------------
  z_score_buffer_multiplier:
    value: 1.5
    source: derived_from_window
    rationale: >-
      Calendar-day buffer for full z-score warm-up.  1.5x trading-day
      window covers weekends, holidays, and missing observations.
    valid_range: [1.2, 2.0]

  # ---------------------------------------------------------------------------
  # Forward-fill limit for missing observations
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Bridge up to one trading week of missing data across holiday
      gaps without extrapolating stale rates.
    valid_range: [1, 10]

  # ---------------------------------------------------------------------------
  # Trailing range rounding precision (decimals)
  # ---------------------------------------------------------------------------
  trailing_range_round_decimals:
    value: 4
    source: shared_analytics_default
    rationale: >-
      Round trailing 252-day high/low/percentile to 4 decimals
      (percent-scale values honest to 1 bp).
    valid_range: [2, 6]
