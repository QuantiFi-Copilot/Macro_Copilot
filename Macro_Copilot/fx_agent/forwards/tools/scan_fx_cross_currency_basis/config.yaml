tool:
  name: scan_fx_cross_currency_basis_tool
  domain: fx_forwards
  description: |
    Cross-sectional CIP basis scanner over the V1 closed pair
    set {EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD}. Pure
    composition primitive: consumes fx_basis_panel and ranks
    by basis level / |basis| / |z-score|. Sign convention
    inherited (Bloomberg BCRX-style, NEGATIVE = USD scarcity).
  category: desk_invariant_primitive

conventions:
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: 1-year trailing window for normalised richness signal.

  z_score_min_periods:
    value: 60
    source: industry_standard_1y_window
    rationale: At least 60 obs required for stable z-score.

  z_score_ddof:
    value: 1
    source: numpy_default
    rationale: Sample std (ddof=1) for unbiased rolling estimator.

  trailing_range_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: 1-year trailing range for percentile_252d.

  basis_bps_round_decimals:
    value: 2
    source: bloomberg_convention
    rationale: Basis points to 2 decimals.

  z_score_round_decimals:
    value: 3
    source: numerical_convention
    rationale: 3 decimals for z-score reporting.

  percentile_round_decimals:
    value: 1
    source: numerical_convention
    rationale: 1 decimal on 0-100 percentile.

methodology:
  what_it_does: |
    1. Compose fx_basis_panel(market_scope='G10_BASIS_V1', tenor,
       start_date=today-lookback_days).
    2. For each column (pair): current = last value, z-score =
       (current - mean_trailing_252d) / std_trailing_252d (ddof=1,
       min_periods=60), percentile_252d on the 252d range.
    3. Sort by rank_by descending (or ascending for basis_signed
       so most-negative ranks first).
    4. Truncate to top_n if specified; assign 1-based rank.
  assumptions:
    - "Sign convention inherited from cross_currency_basis / fx_basis_panel: NEGATIVE basis = USD scarcity."
    - "Pure composition primitive — does NOT compute basis math itself."
    - "V1 closed pair set {EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD}."
  citations:
    - "cross_currency_basis PR #239 (sign convention validated FROZEN 2026-05-27)."
  planned_extensions: []
