tool:
  name: get_fx_vol_z_score_tool
  domain: fx_vol
  description: |
    Rolling 252-day z-score TIME SERIES for a single (pair, tenor) ATM
    vol — useful for visualizing the vol-regime trajectory rather than
    just the current snapshot. Analog of get_fx_returns_series for the
    vol substrate. For a current-snapshot single value, prefer
    get_fx_atm_vol_level (its z_score field IS the last point of this
    series).
  category: desk_invariant_primitive

conventions:
  default_vol_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: Bloomberg PX_LAST is the canonical ATM vol observation.

  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: One trading year of rolling history.
    valid_range: [60, 504]

  z_score_min_periods:
    value: 60
    source: industry_standard_1y_window
    rationale: Min observations before z-score is emitted.
    valid_range: [20, 252]

  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: Sample (Bessel-corrected) standard deviation.
    valid_range: [0, 1]

  vol_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: Four decimals preserves precision for ATM vol values.
    valid_range: [2, 6]

  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: Four decimals for z-score on the wire.
    valid_range: [2, 6]

methodology:
  what_it_does: |
    Fetches the ATM vol history for one (pair, tenor) over the lookback
    window, then computes a rolling 252-day z-score per trading day
    via pandas .rolling().mean() / .std(ddof=1). Emits only rows where
    the trailing window has at least z_score_min_periods observations.
    Summary stats (mean / min / max / current) computed on the emitted
    series.
  assumptions:
    - "Uses the SAME 252-day window / 60-min-periods convention as get_fx_atm_vol_level so the last emitted z-score in this series matches the snapshot z-score from atm_vol_level."
    - "Lookback default 730 days (2 years) is wider than the standard 365 so the rolling series has ~1 year of valid emitted z-scores."
    - "Rows with insufficient trailing observations are EXCLUDED from the output (rather than emitted as None) to reduce consumer-side filtering."
  citations: []
  planned_extensions:
    - "Add an optional regime-classifier output field (high-vol / low-vol / neutral) once a regime spec is locked."
