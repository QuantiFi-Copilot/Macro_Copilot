tool:
  name: scan_fx_vol_skew_tool
  domain: fx_vol
  description: |
    Cross-sectional FX vol skew (risk-reversal / butterfly)
    scanner. Composes fx_vol_panel at the requested
    smile_point (25R / 10R / 25B / 10B) and ranks pairs by
    signed skew / |skew| / |z-score|. Pure composition
    primitive — does NOT duplicate the smile-point math
    (that lives in risk_reversal / butterfly per-pair
    primitives + fx_vol_panel substrate routing).
  category: desk_invariant_primitive

conventions:
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: 1-year trailing window for normalised richness signal.

  z_score_min_periods:
    value: 60
    source: industry_standard_1y_window
    rationale: At least 60 obs required for stable z-score.

  z_score_ddof:
    value: 1
    source: numpy_default
    rationale: Sample std (ddof=1).

  trailing_range_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: 1-year trailing range for percentile_252d.

  skew_round_decimals:
    value: 3
    source: numerical_convention
    rationale: 3 decimals on skew vol pct.

  z_score_round_decimals:
    value: 3
    source: numerical_convention
    rationale: 3 decimals for z-score.

  percentile_round_decimals:
    value: 1
    source: numerical_convention
    rationale: 1 decimal on 0-100 percentile.

methodology:
  what_it_does: |
    1. Compose fx_vol_panel(market_scope, tenor, smile_point)
       — the panel routes to instrument_type='fx_vol_smile'
       for 25R/25B/10R/10B smile points.
    2. Per-pair: current = last value, z-score on 252d trailing
       (ddof=1, min_periods=60), percentile_252d on the 252d
       range.
    3. Sort cross-section by rank_by descending; truncate to
       top_n.
  assumptions:
    - "Pure composition primitive — vol math lives in fx_vol_panel + per-pair primitives (risk_reversal / butterfly)."
    - "Values are in vol PERCENT (inherited from fx_vol_panel units)."
    - "For risk-reversal smile points (25R, 10R): POSITIVE = calls priced above puts; NEGATIVE = puts priced above calls."
    - "For butterfly smile points (25B, 10B): POSITIVE = smile wings rich vs ATM."
  citations:
    - "risk_reversal / butterfly per-pair primitives (PR #235)."
  planned_extensions: []
