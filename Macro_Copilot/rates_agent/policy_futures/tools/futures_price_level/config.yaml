# =============================================================================
# policy_futures.get_futures_price_level_tool — tool configuration
# =============================================================================
# Strip-position price level + implied-rate level + 252d range / z-score for
# ONE policy-futures strip slot (SFR1, ER2, SFI1, ...) on ONE curve_family
# (SOFR_FUT / EUR_SHORT_RATE_FUT / SONIA_FUT).
#
# V1 monitor (per ADR 0011 — `policy_futures` ships strip-position-keyed
# monitors). The output card disclosure makes the scope-limited reading
# explicit (P5):
#
#   "Rolling-generic strip read at strip_position N — NOT a CTD-of-futures-
#    of-OIS curve. The CTD-implied-OIS path is not yet a primitive in this
#    build (ADR 0011 V1 scope)."
#
# In V1 deterministic mode there is NO LLM-facing override path for
# conventions. The LLM cannot ask for non-standard windows / thresholds.
# The implied-rate conversion rule (raw_price → implied_rate_pct) is
# driven OFF METADATA (``instrument_master.attributes->>'inverse_pricing'``
# read by fetch_strip_position_reference) — NOT off a hardcoded list in
# compute.py. That keeps the methodology choice in metadata, not in code
# (PR8 / P6 — no hidden methodology choice in code).
# =============================================================================

tool:
  name: policy_futures_get_futures_price_level_tool
  domain: policy_futures
  description: |
    Single policy-futures strip-position price level — emits a
    ``current_metrics`` snapshot for the latest observation:

      - ``raw_price``: latest price in the contract's native quote
        space (for SFR / ER / SFI: ``100 - rate``). The snapshot
        carries ``quote_units`` and ``inverse_priced`` alongside the
        level so downstream consumers cannot misread a raw price as
        a rate.

      - ``implied_rate_pct``: desk-recognised implied rate in
        PERCENT, derived from ``raw_price`` per the per-strip
        ``inverse_priced`` flag (when inverse:
        ``implied_rate_pct = 100 - raw_price``).

      - daily raw-price + implied-rate changes (raw subtraction; NOT
        bps multiplication).

      - rolling 252-day z-score of the implied-rate LEVEL (the z
        lives on the rate axis — see schemas docstring).

      - trailing 252-day high / low / mid range on BOTH the implied-
        rate AND the raw-price axis.

      - percentile rank of the current implied rate within the
        trailing 252-day implied-rate range (0-100).

      - the SCD2-rotated per-strip disclosure block
        (``underlying_contract_code``, ``security_name``,
        ``expiry_date``, ``contract_size``, ``tick_size``,
        ``tick_value``) for the as_of-bounded SCD2 window.

      - ``time_series``: per-row ``{date, raw_price,
        implied_rate_pct}`` history over the displayed window.
        Bespoke list shape — not canonical
        ``shared.schemas.TimeSeries`` — because each row carries two
        unit spaces side-by-side and ``TimeSeriesUnits`` has no
        PRICE member in V1 (ADR-gated extension per P8). Per-row
        rounding agrees with the snapshot's rounding so the snapshot
        equals ``time_series[-1]`` strictly at the latest row.

conventions:

  # ---------------------------------------------------------------------------
  # Z-score window length (trading days) — applied to the IMPLIED-RATE level
  # series (not the raw-price level series; see schemas docstring for why).
  # ---------------------------------------------------------------------------
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading-day count for a 1-year rolling window. Same convention
      as yield_levels / ois rate_level / bond_futures
      futures_price_level so cross-tool z-score reads are
      comparable. Disclosed verbatim on every methodology card per
      P5 + ADR 0011.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Minimum observations before the rolling stat is emitted
  # ---------------------------------------------------------------------------
  z_score_min_periods:
    value: 60
    source: team_judgment_pending_review
    rationale: >-
      ~3 months of observations before the rolling mean / std are
      deemed trustworthy. Matches yield_levels / ois rate_level /
      bond_futures futures_price_level.
    valid_range: [20, 252]

  # ---------------------------------------------------------------------------
  # Standard deviation degrees of freedom
  # ---------------------------------------------------------------------------
  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Sample standard deviation (Bessel-corrected, ddof=1). Matches
      pandas' default and every other rates tool in this codebase.

  # ---------------------------------------------------------------------------
  # Calendar-day buffer for the fetch window
  # ---------------------------------------------------------------------------
  z_score_buffer_multiplier:
    value: 1.5
    source: derived_from_window
    rationale: >-
      Calendar-day buffer added to the fetch window so the rolling
      z-score is fully populated from the first displayed trading
      day. 1.5x trading-day window covers weekends + holidays.
      Matches every other rates level primitive in this codebase.
    valid_range: [1.2, 2.0]

  # ---------------------------------------------------------------------------
  # Daily-change offset (in trading-day rows after ffill)
  # ---------------------------------------------------------------------------
  daily_change_offset_rows:
    value: 2
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-2] = 1 trading day back. Matches the daily-
      change convention used by every rates level primitive.
    valid_range: [2, 5]

  # ---------------------------------------------------------------------------
  # Trailing range / percentile window — LOCKED at 252 in V1
  # ---------------------------------------------------------------------------
  # The output schema's field names (high_252d_implied_rate_pct,
  # low_252d_implied_rate_pct, mid_252d_implied_rate_pct,
  # high_252d_raw_price, low_252d_raw_price, mid_252d_raw_price,
  # percentile_252d) are wire-frozen and embed the 252 number. compute()
  # raises NotImplementedError if this is set to anything other than 252;
  # see methodology.planned_extensions for the path to making it
  # configurable.
  trailing_range_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      1Y trailing for high / low / mid / percentile. Locked at 252 in
      V1 because the wire field names embed the number. Mirrors the
      same wire-freeze in yield_levels / ois rate_level / bond_futures
      futures_price_level.

  # ---------------------------------------------------------------------------
  # Forward-fill limit for missing observations
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Bridge up to one trading week of missing data across holiday
      gaps. Same as every other rates level primitive in this
      codebase.
    valid_range: [1, 10]

  # ---------------------------------------------------------------------------
  # Default Bloomberg observation field
  # ---------------------------------------------------------------------------
  default_price_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: >-
      Last-traded price is the canonical front-month price
      observation. Maps onto the playbook's ``last_price`` metric
      (bloomberg_field PX_LAST). LLM/HTTP wrappers MUST use the
      empty-string / None sentinel so this default flows through —
      see the shadowing fix pattern from the curve_move_classifier
      migration (commit b2605ee) / yield_levels / bond_futures
      futures_price_level.

  # ---------------------------------------------------------------------------
  # Short-rate regime map per curve_family — methodology disclosure (P5).
  # ---------------------------------------------------------------------------
  # RFR = compounded risk-free rate (SOFR daily compounding for SOFR_FUT;
  # SONIA daily compounding for SONIA_FUT). IBOR = unsecured term IBOR
  # (3M Euribor for EUR_SHORT_RATE_FUT). The regime label is carried on
  # the methodology disclosure string so a desk reader knows the
  # underlying rate object behind the implied-rate level. NOT a load-
  # bearing computation choice (the implied-rate conversion is driven
  # off ``inverse_priced``; the regime label is disclosure-only) — but
  # P5 (honest disclosure) requires it on every response. Storing in
  # YAML keeps a future curve_family addition (e.g. TIIE_FUT direct-
  # priced) a YAML edit rather than a code change. PR9 / PR10 —
  # methodology in YAML, invariants in code.
  short_rate_regime_map:
    value: "SOFR_FUT=RFR,SONIA_FUT=RFR,EUR_SHORT_RATE_FUT=IBOR"
    source: team_judgment_pending_review
    rationale: >-
      Disclosure-only mapping (P5 — does NOT alter computation). RFR
      vs IBOR labels the underlying short-rate object so a desk
      reader knows what the implied rate means: a compounded daily
      RFR (SOFR / SONIA) vs an unsecured 3M term IBOR (Euribor).
      Stored as a CSV of ``KEY=VALUE`` pairs because
      ``Convention.value`` is scalar; compute parses it into a dict
      at load time. New families added to the playbook are added
      here in the same PR — no hidden defaults.

  # ---------------------------------------------------------------------------
  # Boundary rounding — applied to raw_price, implied_rate_pct, each
  # time_series row, high/low/mid, percentile, and z-score. Two
  # separate precisions because raw_price (futures-price space) and
  # implied_rate_pct (percent space) have structurally different
  # display contracts. ``raw_price_round_decimals`` /
  # ``raw_price_high_low_round_decimals`` /
  # ``implied_rate_round_decimals`` /
  # ``implied_rate_high_low_round_decimals`` are kept as distinct
  # convention names (rather than shared with the bond_futures
  # ``price_round_decimals`` / ``price_high_low_round_decimals``)
  # because the policy-futures raw-price space (``100 - rate``) has a
  # structurally different precision contract from the bond-futures
  # raw-price space (``points`` / ``% of par``); forcing the two to
  # share a precision via the cross-config lint would silently degrade
  # one universe to satisfy the other. Same naming-discipline pattern
  # bond_futures uses to disambiguate from sovereign / OIS yield-space
  # precision (see bond_futures/futures_price_level/config.yaml's
  # ``price_high_low_round_decimals`` rationale).
  # ---------------------------------------------------------------------------
  raw_price_round_decimals:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Five decimals safely covers every quoted tick across the
      policy-futures universe (SFR tick_size = 0.0025 / 0.005; ER /
      SFI ticks 0.005). Threaded through both the snapshot's
      ``raw_price`` and every row of the bespoke ``time_series``
      output so the snapshot equals ``time_series[-1].raw_price``
      strictly at the latest row.
    valid_range: [0, 8]

  implied_rate_round_decimals:
    value: 4
    source: team_judgment_pending_review
    rationale: >-
      Four decimals for the implied rate in PERCENT (≈ 0.01 bp
      precision). Matches the precision desks use to read STIR
      implied rates without losing tick-derived resolution
      (100 - 96.12345 = 3.87655 rounds cleanly to 3.8766).
    valid_range: [0, 8]

  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches yield_levels / ois rate_level /
      bond_futures futures_price_level.
    valid_range: [0, 8]

  raw_price_high_low_round_decimals:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Five decimals for trailing high / low / mid on the raw-price
      axis so they round at the same precision as ``raw_price``
      (avoids snapshot's ``raw_price`` equalling neither high nor
      low because of rounding asymmetry on a single observation).
      Distinct from the implied-rate precision; bound the two
      axes independently.
    valid_range: [0, 8]

  implied_rate_high_low_round_decimals:
    value: 4
    source: team_judgment_pending_review
    rationale: >-
      Four decimals for trailing high / low / mid on the implied-
      rate axis so they round at the same precision as
      ``implied_rate_pct`` (same reason as
      ``raw_price_high_low_round_decimals`` on the price axis).
    valid_range: [0, 8]

  percentile_round_decimals:
    value: 1
    source: team_judgment_pending_review
    rationale: >-
      One decimal on percentile (0.0 - 100.0). Matches yield_levels /
      ois rate_level / bond_futures futures_price_level.
    valid_range: [0, 4]

methodology:
  what_it_does: |
    Fetches one (curve_family, strip_position) policy-futures
    strip-slot price series, cleans it (ffill bridges holidays up to
    5 trading days), and returns a snapshot: current raw_price +
    implied_rate_pct, 1-day raw-price + implied-rate changes, rolling
    252-day z-score of the implied rate, trailing 252-day high / low
    / mid on BOTH unit axes, percentile rank of the current implied
    rate, observation count over the lookback_days window, plus the
    as_of-bounded SCD2 disclosure block (underlying_contract_code,
    security_name, expiry_date, contract_size, tick_size, tick_value).

    The implied-rate conversion rule is driven off the per-strip
    ``inverse_priced`` flag from ``instrument_master.attributes`` —
    NOT a hardcoded list in compute.py. For inverse-priced strips
    (SFR / ER / SFI in V1), ``implied_rate_pct = 100 - raw_price``;
    for direct-priced strips (if any added in future),
    ``implied_rate_pct = raw_price``. The methodology card discloses
    the underlying short-rate regime (RFR / IBOR per curve_family)
    so a desk reader knows what the implied rate represents.

  assumptions:
    - "Policy-futures strip slots are keyed by
       ``(curve_family, strip_position)``. The desk-recognised
       instrument identity is the strip slot, NOT a master contract
       stem and NOT a calendar tenor. Strip position 1 is the front
       contract; higher positions are quarterly forwards down the
       strip (whites = positions 1-4, reds = positions 5-8 in the
       V1 universe)."
    - "The per-strip ``inverse_priced`` flag on
       ``instrument_master.attributes`` drives the raw_price →
       implied_rate_pct conversion. SOFR_FUT / SONIA_FUT /
       EUR_SHORT_RATE_FUT all carry ``inverse_pricing: true`` in
       the V1 playbook (verified via DB inspection) — so
       ``implied_rate_pct = 100 - raw_price`` for every strip slot
       in the V1 universe. A future direct-priced policy-futures
       family would just flip the metadata flag; no code change."
    - "The short-rate regime (RFR vs IBOR) is METHODOLOGY
       DISCLOSURE — NOT a load-bearing computation choice. SOFR /
       SONIA reference a compounded daily RFR (3-month look-back
       at expiry); Euribor (EUR_SHORT_RATE_FUT) references an
       unsecured 3M term IBOR. The methodology card surfaces the
       regime label inline so consumers cannot mistake one for the
       other. The regime map lives in this YAML (PR9 / PR10 —
       methodology in YAML)."
    - "The z-score lives on the IMPLIED-RATE axis (not the raw-
       price axis). For inverse-priced strips the two axes are
       monotone inversions, so z-scoring the raw price would flip
       the sign of every 'extreme' reading relative to the rate.
       Desks read the implied rate; the z follows the rate."
    - "ADR 0011 V1 scope: this primitive is the rolling-generic
       STRIP-READ at the requested strip_position. The CTD-of-
       futures-of-OIS curve (mapping the strip onto the OIS forward
       curve) is NOT yet a primitive in this build — that requires
       the CTD identification + OIS-curve interpolation stack
       (Phase-4 per ADR 0011)."
    - "lookback_days controls the fetch window and the
       observation_count cutoff. The rolling z-score window
       (z_score_window_days) and trailing range window
       (trailing_range_window_days) are independent conventions
       fixed in this YAML."

  citations:
    - "ADR 0011 (docs_revamped/05_decisions/0011-futures-domain-agents.md)"
    - "Catalog v2.1 PR14 (frozen field-name discipline: implied_rate_pct)"

  planned_extensions:
    - "trailing_range_window_days: configurable. Currently locked at
       252 because the output fields high_252d_implied_rate_pct /
       low_252d_implied_rate_pct / mid_252d_implied_rate_pct /
       high_252d_raw_price / low_252d_raw_price / mid_252d_raw_price
       / percentile_252d embed the number. Path to configurability:
       rename schema fields to high_window_*/low_window_*/
       mid_window_* / percentile_window + add trailing_window_days
       to the output; remove the NotImplementedError guard in
       compute()."
    - "Add a canonical TimeSeries-per-axis output (one for raw_price,
       one for implied_rate_pct) once TimeSeriesUnits gains a PRICE
       member (ADR-gated extension per P8). Until that ADR lands,
       the bespoke ``time_series: List[FuturesPriceLevelTimeSeriesRow]``
       shape is the honest export."
    - "CTD-of-futures-of-OIS primitive (Phase-4 per ADR 0011). Maps
       the strip's implied rates onto a calibrated OIS forward
       curve. Gated on the CTD identification + OIS-curve
       interpolation stack landing as primitives. Until then this
       primitive's methodology card carries the rolling-generic-
       strip-read caveat verbatim."
    - "Add direct-priced policy-futures family support (TIIE_FUT,
       etc.) by adding the family + inverse_pricing=false to the
       playbook universe. No code change required here — the
       implied-rate conversion is metadata-driven; the regime map
       gets a YAML edit to add the disclosure label."
