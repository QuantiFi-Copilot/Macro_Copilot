tool:
  name: scan_fx_calendar_spread_tool
  domain: fx_vol
  description: |
    Cross-sectional ATM vol calendar-spread scanner. Composes
    fx_vol_panel at (front_tenor, ATM) and (back_tenor, ATM),
    inner-joins by (date, pair), computes spread = front - back,
    and ranks pairs by signed spread / |spread| / |z-score|.
    Identifies dislocations in the vol term structure across the
    cross-section.
  category: desk_invariant_primitive

conventions:
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: 1-year trailing window for normalised richness signal.

  z_score_min_periods:
    value: 60
    source: industry_standard_1y_window
    rationale: At least 60 obs required for stable z-score.

  z_score_ddof:
    value: 1
    source: numpy_default
    rationale: Sample std (ddof=1).

  trailing_range_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: 1-year trailing range for percentile_252d.

  vol_round_decimals:
    value: 3
    source: numerical_convention
    rationale: 3 decimals on vol pct.

  z_score_round_decimals:
    value: 3
    source: numerical_convention
    rationale: 3 decimals for z-score.

  percentile_round_decimals:
    value: 1
    source: numerical_convention
    rationale: 1 decimal on 0-100 percentile.

methodology:
  what_it_does: |
    1. Compose fx_vol_panel(market_scope, front_tenor, smile_point=
       'ATM') and fx_vol_panel(market_scope, back_tenor, smile_point=
       'ATM') over lookback_days.
    2. Inner-join the two panels on (date, pair) — keep only pairs
       present in BOTH tenors.
    3. spread_series(pair) = front_vol_series - back_vol_series.
    4. Per-pair: current = last spread, z-score = (current - mean) /
       std (252d, ddof=1, min_periods=60), percentile_252d on the
       252d range.
    5. Sort cross-section by rank_by descending; truncate to top_n.
  assumptions:
    - "Pure composition primitive — does NOT compute vol math itself."
    - "front_tenor < back_tenor is conventional but not enforced (the Pydantic guard rules out front=back; user is responsible for tenor ordering)."
    - "Vol values are in PERCENT (inherited from fx_vol_panel units)."
  citations:
    - "vol_calendar_spread per-pair primitive (PR #236) — single-pair math reference."
  planned_extensions:
    - "3-tenor butterfly variant (front - 2*mid + back) once a consumer needs it."
