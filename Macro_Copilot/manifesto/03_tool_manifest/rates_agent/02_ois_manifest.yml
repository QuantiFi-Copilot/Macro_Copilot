  # ---------------------------------------------------------------------------
  # IMPLIED FORWARDS
  # ---------------------------------------------------------------------------

  - name: calculate_ois_forward_rate
    domain: rates
    sub_agent: ois
    bucket: 1A
    category: forwards_classify
    status: built

    implementation:
      mcp_server: rates_agent/ois/mcp_server.py
      tool_function: calculate_ois_forward_rate_tool
      schema: rates_agent/ois/tools/forward_rate/schemas.py::OISForwardRateInput
      compute: rates_agent/ois/tools/forward_rate/compute.py::calculate_ois_forward_rate
      config: rates_agent/ois/tools/forward_rate/config.yaml

    one_liner: >-
      Implied forward rate between two points on an OIS curve via a
      dual-compounding bootstrap (simple interest for T ≤ 1Y, annual
      compounding for T > 1Y).  Two input modes — tenor-based or
      date-based — both returning forward rate, daily change, rolling
      z-score, trailing range, and time series.

    bucket_rationale: >-
      Deterministic bootstrap math on par OIS rates.  No model fit;
      year fractions re-anchor per trade date in date-based mode;
      z-score window and conventions YAML-locked.  OIS-native atomic
      unit not shared with the sovereign tools.

    pm_overridable: []

    related_tools:
      - calculate_ois_rate_level_tool
      - calculate_ois_curve_spread_tool
      - calculate_ois_cross_market_spread_tool

    workflows:
      - ois_forward_workspace
      - ois_prompt_gauntlet

