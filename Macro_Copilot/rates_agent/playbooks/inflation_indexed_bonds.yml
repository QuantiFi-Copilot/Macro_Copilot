playbook_name: inflation_indexed_bonds
playbook_version: "1.0"
asset_class: rates
dataset_name: inflation_indexed_bonds
description: "Daily sovereign inflation-indexed bond benchmark points for US TIPS, UK linkers, France OATi/OATei linkers, and Canadian RRBs, using Bloomberg real-yield series for curve analysis and breakeven construction."

extraction:
  start_date: "2005-01-01"
  incremental_window_days: 14

target_metrics:
  - metric_id: "yield_mid"
    bloomberg_field: "YLD_YTM_MID"

reference_metrics:
  - column_name: "maturity_date"
    bloomberg_field: "MATURITY"
  - column_name: "security_name"
    bloomberg_field: "SECURITY_DES"

universe:
