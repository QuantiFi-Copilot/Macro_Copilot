# =============================================================================
# FX Agent — tool manifest
# =============================================================================
# Canonical source of truth for the first FX-agent tool catalogue entries.
# Same schema as the Rates manifests. Each built entry must resolve to:
# implementation code, Pydantic schema, compute function, and config.yaml
# unless config is explicitly N/A for a scanner-style batch surface.
# =============================================================================

tools:
  # ---------------------------------------------------------------------------
  # SPOT SNAPSHOTS
  # ---------------------------------------------------------------------------

  - name: get_fx_spot_level
    domain: fx
    sub_agent: spot
    bucket: 1A
    category: snapshots
    status: built

    implementation:
      mcp_server: fx_agent/mcp_server.py
      tool_function: get_fx_spot_level_tool
      schema: fx_agent/spot/tools/spot_levels/schemas.py::FXSpotLevelInput
      compute: fx_agent/spot/tools/spot_levels/compute.py::get_fx_spot_level
      config: fx_agent/spot/tools/spot_levels/config.yaml

    one_liner: >-
      Single-pair FX spot snapshot — latest spot, daily / weekly /
      monthly percentage change, rolling 252-day z-score, trailing
      252-day high / low / percentile, and observation count.

    bucket_rationale: >-
      Deterministic arithmetic over stored FX spot observations.
      Methodology and display precision are YAML-locked; no model
      inference and no LLM-facing override path in V1.

    pm_overridable: []

    related_tools:
      - scan_fx_spot_tool
      - calculate_fx_carry_tool

    workflows:
      - fx_monitor_card
      - fx_spot_workspace

    references: []

    built_date: 2026-05-20
    validation_status: >-
      Structurally aligned; Bloomberg ingestion / parity validation pending.

  # ---------------------------------------------------------------------------
  # SPOT SCREENING
  # ---------------------------------------------------------------------------

  - name: scan_fx_spot
    domain: fx
    sub_agent: spot
    bucket: 1A
    category: screening
    status: built

    implementation:
      mcp_server: fx_agent/mcp_server.py
      tool_function: scan_fx_spot_tool
      schema: fx_agent/spot/tools/schemas/__init__.py::FXScannerInput
      compute: fx_agent/spot/tools/scanner.py::run_fx_scanner
      config: N/A

    one_liner: >-
      Scans FX spot pairs in the database, ranks the top-N by absolute
      rolling 252-day z-score, and returns spot, momentum, z-score, and
      a deterministic signal label per row.

    bucket_rationale: >-
      Deterministic batch screen over stored FX spot observations.
      Ranking and labels are pure arithmetic / rules; no model state.

    pm_overridable:
      - market_scope
      - top_n

    related_tools:
      - get_fx_spot_level_tool
      - calculate_fx_carry_tool

    workflows:
      - fx_monitor_card
      - fx_extremes_workspace

    references: []

    built_date: 2026-05-20
    validation_status: >-
      Structurally aligned; scanner config extraction pending.

  # ---------------------------------------------------------------------------
  # FORWARDS / CARRY
  # ---------------------------------------------------------------------------

  - name: calculate_fx_carry
    domain: fx
    sub_agent: forwards
    bucket: 1A
    category: forwards_classify
    status: built

    implementation:
      mcp_server: fx_agent/mcp_server.py
      tool_function: calculate_fx_carry_tool
      schema: fx_agent/forwards/tools/fx_carry/schemas.py::FXCarryInput
      compute: fx_agent/forwards/tools/fx_carry/compute.py::get_fx_carry
      config: fx_agent/forwards/tools/fx_carry/config.yaml

    one_liner: >-
      Cross-sectional FX carry scanner over the deliverable-forward
      universe at a given tenor. Universe controlled by market_scope:
      'G10' (default, 6 majors), 'EM' (6 EM deliverable: MXN/ZAR/TRY/
      PLN/HUF/PHP), or 'ALL' (12 = G10 + EM). NDFs (BRL/KRW/IDR/CNY/INR)
      are NOT included — outright vs points unit, separate compute path
      (Phase D's calculate_ndf_implied_carry). Joins per-date spot and
      forward-points history, converts points into spot units with the
      JPY-aware divisor, annualises by a trading-day basis, and per pair
      computes a rolling 252-day z-score / percentile / range on the
      carry_annualized_pct series. Rows are ranked by signed carry,
      absolute carry, or absolute carry z-score and optionally capped
      to top-N.

    bucket_rationale: >-
      Deterministic forward-points arithmetic over stored spot and forward
      observations, joined per date so no historical row uses today's
      spot. Tenor-day, annualization, points-divisor, z-score window, and
      trailing-range window conventions are YAML-locked. The rolling-stat
      computation delegates to shared.analytics.levels.compute_level_metrics
      (the same generic operator the rates yield_levels tool uses).
      market_scope filter applied on the forwards side via fx_family
      ANY(:fx_families) — closed set in compute.py mirrors the closed
      Pydantic Literal in schemas.py so callers fail-loud at both
      boundaries.

    pm_overridable:
      - tenor
      - market_scope
      - rank_by
      - top_n
      - lookback_days

    related_tools:
      - get_fx_spot_level_tool
      - scan_fx_spot_tool
      - get_fx_forward_curve_tool

    workflows:
      - fx_carry_monitor
      - fx_forwards_workspace
      - fx_carry_scanner

    references: []

    built_date: 2026-05-20
    validation_status: >-
      Phase A scanner extension shipped 2026-05-24 — 12M annualisation
      bug fixed, lookahead-free historical z-score on carry_annualized_pct,
      latest-common-date snapshot alignment. Targeted regression tests
      pending in the same step-7 PR slice.

  # ---------------------------------------------------------------------------
  # FORWARDS / TERM STRUCTURE
  # ---------------------------------------------------------------------------

  - name: get_fx_forward_curve
    domain: fx
    sub_agent: forwards
    bucket: 1A
    category: forwards_classify
    status: built

    implementation:
      mcp_server: fx_agent/mcp_server.py
      tool_function: get_fx_forward_curve_tool
      schema: fx_agent/forwards/tools/forward_curve/schemas.py::FXForwardCurveInput
      compute: fx_agent/forwards/tools/forward_curve/compute.py::get_fx_forward_curve
      config: fx_agent/forwards/tools/forward_curve/config.yaml

    one_liner: >-
      For one G10 pair, returns the full forward-curve term structure
      across 1W / 1M / 3M / 6M / 12M tenors with raw forward points,
      spot-unit forward points, outright forward, carry in basis points,
      annualised carry %, and a rolling 252-day z-score / percentile /
      range on the spot-unit forward points. Numerically consistent with
      calculate_fx_carry at any given (pair, tenor).

    bucket_rationale: >-
      Deterministic per-tenor SQL fetch + the shared per-pair divisor and
      tenor-day conventions, joined per date. Z-score / percentile / range
      delegate to shared.analytics.levels.compute_level_metrics. Tenor
      set, divisor, annualization and rolling-window conventions are all
      YAML-locked.

    pm_overridable:
      - pair
      - lookback_days
      - field_name

    related_tools:
      - calculate_fx_carry_tool
      - get_fx_spot_level_tool
      - scan_fx_spot_tool

    workflows:
      - fx_forwards_workspace
      - fx_carry_monitor

    references: []

    built_date: 2026-05-24
    validation_status: >-
      Cross-tool consistency verified: every (EURUSD, tenor) returns
      identical carry_annualized_pct via calculate_fx_carry and
      get_fx_forward_curve. Targeted compute / wiring tests pending in
      the same step-7 PR slice.

  # ---------------------------------------------------------------------------
  # CROSS-SECTIONAL PANEL (Phase B cornerstone primitive)
  # ---------------------------------------------------------------------------

  - name: calculate_fx_panel
    domain: fx
    sub_agent: spot
    bucket: 1A
    category: cross_sectional_panel
    status: built

    implementation:
      mcp_server: fx_agent/mcp_server.py
      tool_function: calculate_fx_panel_tool
      schema: fx_agent/spot/tools/fx_panel/schemas.py::FXPanelInput
      compute: fx_agent/spot/tools/fx_panel/compute.py::calculate_fx_panel
      config: fx_agent/spot/tools/fx_panel/config.yaml

    one_liner: >-
      Cross-sectional Panel of FX spot levels for a market_scope subset
      (G10 = 9 majors, EM = 9 EM majors, G10_CROSSES = 11 G10 crosses,
      ALL = 29 fx_spot instruments). Returns a typed Panel artifact
      (rows = dates, columns = pair names, units = PRICE) ready for
      downstream cross-sectional operators (returns, drawdown, realized
      vol, correlation matrix, carry basket, factor decomposition,
      regime classifier).

    bucket_rationale: >-
      Deterministic pivot of stored market_data_daily into a wide
      Panel with pair-name columns. Filter (market_scope → fx_family)
      and missing-data / calendar / ffill conventions are YAML-locked.
      Substrate-primitive discipline: fail-loud on empty fetch /
      unknown scope / fully-empty pair / strict-policy NaN residual —
      downstream code cannot mistake a degraded fetch for a valid
      empty Panel.

    pm_overridable:
      - market_scope
      - start_date
      - end_date
      - missing_data_policy
      - field_name

    related_tools:
      - get_fx_spot_level_tool
      - scan_fx_spot_tool
      - calculate_fx_carry_tool

    workflows:
      - fx_panel_workspace
      - fx_correlation_monitor
      - fx_carry_basket_screen

    references:
      - rates_agent/sovereign_bonds/tools/sovereign_yield_panel
      - shared/analytics/fx_fetch.py

    built_date: 2026-05-25
    validation_status: >-
      Smoke-tested live: G10 returns 9 pairs, EM returns 9 pairs,
      G10_CROSSES returns 11 pairs, ALL returns 29 pairs. Typed Panel
      round-trips cleanly via FXPanelOutput.model_validate. Empty
      window + invalid scope correctly raise ValueError /
      ValidationError. Targeted compute / wiring / sql_validation tests
      included.

  # ---------------------------------------------------------------------------
  # DERIVED SINGLE-PAIR SERIES (Phase B follow-up)
  # ---------------------------------------------------------------------------

  - name: get_fx_returns_series
    domain: fx
    sub_agent: spot
    bucket: 1A
    category: derived_series
    status: built

    implementation:
      mcp_server: fx_agent/mcp_server.py
      tool_function: get_fx_returns_series_tool
      schema: fx_agent/spot/tools/returns_series/schemas.py::FXReturnsSeriesInput
      compute: fx_agent/spot/tools/returns_series/compute.py::get_fx_returns_series
      config: fx_agent/spot/tools/returns_series/config.yaml

    one_liner: >-
      Single-pair FX log-returns time series at a chosen horizon
      (daily / weekly / monthly). Returns a clean TimeSeries
      (closed-enum RATIO) plus a snapshot summary (current return,
      mean / std / min / max over the lookback window).

    bucket_rationale: >-
      Deterministic log(P_t) - log(P_t-h) on a single-pair PX_LAST
      series loaded via shared.analytics.fx_fetch.fetch_fx_spot_series.
      Horizon mapping (1 / 5 / 22 trading days) is YAML-locked.
      Closed Literal enforces the horizon vocabulary at the schema
      layer.

    pm_overridable:
      - pair
      - horizon
      - lookback_days
      - field_name

    related_tools:
      - get_fx_spot_level_tool
      - calculate_fx_drawdown_tool
      - get_fx_realized_vol_tool

    workflows:
      - fx_returns_workspace
      - fx_carry_basket_screen

    references:
      - rates_agent/sovereign_bonds/tools/yield_levels
      - shared/analytics/fx_fetch.py

    built_date: 2026-05-25
    validation_status: >-
      9/9 PASS on targeted compute test: 3 horizons run end-to-end;
      snapshot == time_series.rows[-1].value (strict); log-return
      math verified against direct spot fetch; observation_count
      matches non-None row count; unknown pair and invalid horizon
      both fail-loud; units == 'ratio'.

  - name: calculate_fx_drawdown
    domain: fx
    sub_agent: spot
    bucket: 1A
    category: derived_series
    status: built

    implementation:
      mcp_server: fx_agent/mcp_server.py
      tool_function: calculate_fx_drawdown_tool
      schema: fx_agent/spot/tools/drawdown/schemas.py::FXDrawdownInput
      compute: fx_agent/spot/tools/drawdown/compute.py::calculate_fx_drawdown
      config: fx_agent/spot/tools/drawdown/config.yaml

    one_liner: >-
      Running drawdown of an FX spot rate vs its trailing peak over
      a lookback window. Returns the drawdown TimeSeries (RATIO,
      always <= 0) plus a snapshot summary (current drawdown, max
      drawdown, peak / trough dates, recovery date, time-to-recovery
      in trading days).

    bucket_rationale: >-
      Deterministic (P_t / running_max(P_0..P_t)) - 1 on a single-
      pair PX_LAST series loaded via the shared FX fetcher. Running
      max anchors on the first row of the display window
      (documented assumption — pre-window peaks are NOT carried in).
      Sign is raw — no position-direction interpretation.

    pm_overridable:
      - pair
      - lookback_days
      - field_name

    related_tools:
      - get_fx_spot_level_tool
      - get_fx_returns_series_tool
      - get_fx_realized_vol_tool

    workflows:
      - fx_risk_workspace
      - fx_drawdown_alert

    references:
      - rates_agent/sovereign_bonds/tools/yield_levels
      - shared/analytics/fx_fetch.py

    built_date: 2026-05-25
    validation_status: >-
      9/9 PASS on targeted compute test: all drawdown values <= 0;
      snapshot current_drawdown == time_series.rows[-1].value
      (strict); max_drawdown == min(time_series) (strict);
      max_drawdown_date row matches snapshot value; recovery
      invariants hold when recovery_date is non-None;
      observation_count matches row count; unknown pair fails
      loud; units == 'ratio'.

  - name: get_fx_realized_vol
    domain: fx
    sub_agent: spot
    bucket: 1A
    category: derived_series
    status: built

    implementation:
      mcp_server: fx_agent/mcp_server.py
      tool_function: get_fx_realized_vol_tool
      schema: fx_agent/spot/tools/realized_vol/schemas.py::FXRealizedVolInput
      compute: fx_agent/spot/tools/realized_vol/compute.py::get_fx_realized_vol
      config: fx_agent/spot/tools/realized_vol/config.yaml

    one_liner: >-
      Rolling annualized realized vol of an FX spot pair (default
      30 trading days, range 5-504). Daily log-returns to rolling
      std (ddof=1) * sqrt(252) * 100, expressed in PERCENT (8.0 =
      8% / year). Returns the vol TimeSeries plus a snapshot
      summary (current vol, mean / min / max over the lookback).

    bucket_rationale: >-
      Deterministic std-of-log-returns annualized via the locked
      sqrt(252) convention. Window and lookback are caller-tunable;
      annualization factor and ddof are YAML-locked. Output unit
      PERCENT matches the trader convention (and the unit ATM
      implied vol will use when Phase E lands).

    pm_overridable:
      - pair
      - window_days
      - lookback_days
      - field_name

    related_tools:
      - get_fx_returns_series_tool
      - calculate_fx_drawdown_tool
      - get_fx_spot_level_tool

    workflows:
      - fx_vol_monitor
      - fx_realized_vs_implied_carry

    references:
      - rates_agent/sovereign_bonds/tools/yield_levels
      - shared/analytics/fx_fetch.py

    built_date: 2026-05-25
    validation_status: >-
      9/9 PASS on targeted compute test: default args run end-to-end;
      vol values >= 0; EURUSD mean vol in plausible 2-25 % range
      (sanity vs accidental ratio output); snapshot ==
      time_series.rows[-1].value (strict); observation_count
      matches non-None row count; math verified by hand recompute
      of std(log-rets) * sqrt(252) * 100; unknown pair fails loud;
      short lookback + long window works (buffer absorbs); units
      == 'percent'.

  # ---------------------------------------------------------------------------
  # NDF TOOLS (Phase D — 2026-05-26)
  # ---------------------------------------------------------------------------

  - name: get_fx_ndf_outright
    domain: fx
    sub_agent: ndf
    bucket: 1A
    category: snapshots
    status: built

    implementation:
      mcp_server: fx_agent/mcp_server.py
      tool_function: get_fx_ndf_outright_tool
      schema: fx_agent/ndf/tools/ndf_outright/schemas.py::FXNDFOutrightInput
      compute: fx_agent/ndf/tools/ndf_outright/compute.py::get_fx_ndf_outright
      config: fx_agent/ndf/tools/ndf_outright/config.yaml

    one_liner: >-
      Single-(NDF family, tenor) outright snapshot — latest outright
      value (USD per local CCY, NOT forward points), daily / weekly /
      monthly % change, rolling 252-day z-score, trailing 252-day
      high / low / percentile. Mirror of get_fx_spot_level but for the
      NDF outright substrate (CCN+ / IRN+ / BCN+ / KWN+ / IHN+ /
      NTN+ x 5 tenors = 30 instruments).

    bucket_rationale: >-
      Deterministic arithmetic over stored NDF observations. Window /
      annualization YAML-locked; no model inference and no LLM-facing
      override path in V1.

    pm_overridable:
      - ndf_code
      - tenor
      - lookback_days
      - field_name

    related_tools:
      - calculate_fx_ndf_implied_carry_tool
      - scan_fx_ndf_carry_tool
      - get_fx_spot_level_tool

    workflows:
      - fx_ndf_monitor

    references:
      - fx_agent/playbooks/fx_ndf.yml
      - fx_agent/spot/tools/spot_levels

    built_date: 2026-05-26
    validation_status: >-
      6/6 NDF families return clean data on smoke test (CCN+/IRN+/BCN+/
      KWN+/IHN+/NTN+) at 1M tenor; non-zero z-scores; observation
      counts >= 250 trading days for each.

  - name: calculate_fx_ndf_implied_carry
    domain: fx
    sub_agent: ndf
    bucket: 1A
    category: derived_series
    status: built

    implementation:
      mcp_server: fx_agent/mcp_server.py
      tool_function: calculate_fx_ndf_implied_carry_tool
      schema: fx_agent/ndf/tools/ndf_implied_carry/schemas.py::FXNDFImpliedCarryInput
      compute: fx_agent/ndf/tools/ndf_implied_carry/compute.py::calculate_fx_ndf_implied_carry
      config: fx_agent/ndf/tools/ndf_implied_carry/config.yaml

    one_liner: >-
      Cross-sectional FX NDF implied carry — for one tenor, joins the
      latest underlying-spot and same-tenor NDF outright (per
      trade_date — no lookahead), computes implied annualized carry
      as (outright/spot - 1) * (252/tenor_days) * 100, and ranks the
      cross-section. Each row carries a rolling 252-day z-score /
      percentile / range on its own implied-carry series. Supports
      'settlement' (textbook) and 'offshore_tradable' (USDCNH for
      CCN+) spot conventions.

    bucket_rationale: >-
      Deterministic spot+outright arithmetic over the NDF substrate.
      No divisor (outright unit), no points-to-spot conversion.
      Convention switch (spot_convention) is closed-enum; rank_by is
      closed-enum.

    pm_overridable:
      - tenor
      - spot_convention
      - rank_by
      - top_n
      - lookback_days
      - field_name

    related_tools:
      - get_fx_ndf_outright_tool
      - scan_fx_ndf_carry_tool
      - calculate_fx_carry_tool

    workflows:
      - fx_ndf_monitor
      - fx_ndf_carry_screen

    references:
      - fx_agent/playbooks/fx_ndf.yml
      - fx_agent/forwards/tools/fx_carry
      - shared/analytics/levels

    built_date: 2026-05-26
    validation_status: >-
      6/6 NDF families return data at 1M settlement convention; CCN+
      successfully swaps USDCNY -> USDCNH under offshore_tradable mode
      with the carry differential surfaced; scanner mode (top_n=3,
      rank_by=abs_z_score) ranks consistently with the full table.

  - name: scan_fx_ndf_carry
    domain: fx
    sub_agent: ndf
    bucket: 1A
    category: screening
    status: built

    implementation:
      mcp_server: fx_agent/mcp_server.py
      tool_function: scan_fx_ndf_carry_tool
      schema: fx_agent/ndf/tools/ndf_implied_carry/schemas.py::FXNDFImpliedCarryInput
      compute: fx_agent/ndf/tools/ndf_implied_carry/compute.py::calculate_fx_ndf_implied_carry
      config: fx_agent/ndf/tools/ndf_implied_carry/config.yaml

    one_liner: >-
      Scanner-mode wrapper around calculate_fx_ndf_implied_carry —
      returns the top-N most extreme NDF carry rows by absolute z-score
      at a given tenor. Curated defaults (top_n=5, rank_by='abs_z_score',
      spot_convention='settlement') for the 'what's the most extreme
      NDF carry today?' use case. Same compute path as the parent tool.

    bucket_rationale: >-
      Thin scanner over the same deterministic compute — different
      surface for a different question (executive summary vs full
      table).

    pm_overridable:
      - tenor
      - top_n
      - spot_convention
      - lookback_days

    related_tools:
      - calculate_fx_ndf_implied_carry_tool
      - get_fx_ndf_outright_tool
      - scan_fx_spot_tool

    workflows:
      - fx_ndf_monitor
      - fx_extremes_workspace

    references:
      - fx_agent/playbooks/fx_ndf.yml

    built_date: 2026-05-26
    validation_status: >-
      Default top_n=5 + abs_z_score returns the most extreme rows
      consistently with the full implied-carry compute.
