      config: rates_agent/inflation_swaps/tools/inflation_swap_rate_level/config.yaml

    one_liner: >-
      Single-pillar zero-coupon inflation swap (ZCIS) rate snapshot —
      current rate, daily / weekly / monthly change in bps, rolling
      252-day z-score, trailing 252-day high / low / percentile, and a
      full chartable time series. ZCIS analogue of get_ois_rate_level.

    bucket_rationale: >-
      Deterministic rolling z-score over stored daily ZCIS rates.
      Fixed 252-day window; conventions YAML-locked; no model inference
      and no LLM-facing override path in V1.

    pm_overridable: []

    related_tools:
