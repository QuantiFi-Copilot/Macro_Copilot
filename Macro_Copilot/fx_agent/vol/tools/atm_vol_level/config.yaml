tool:
  name: get_fx_atm_vol_level_tool
  domain: fx_vol
  description: |
    Single-(pair, tenor) FX ATM implied vol snapshot — latest vol,
    daily / weekly / monthly absolute vol-point changes, rolling
    252-day z-score, trailing 252-day high / low / percentile,
    observation count. Mirror of get_fx_spot_level for the ATM vol
    substrate (115 standard-tenor instruments: 23 pairs x 5 tenors).
  category: desk_invariant_primitive

conventions:
  default_vol_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: >-
      Bloomberg PX_LAST is the canonical ATM vol observation.
      PX_BID / PX_ASK available for the std-tenor 115 instruments
      ingested in PR #228.

  default_tenor:
    value: 1M
    source: desk_default
    rationale: >-
      1M is the standard vol monitor tenor. Matches the deliverable-
      forwards fx_carry / NDF implied carry conventions.

  z_score_window_days:
    value: 252
    source: industry_standard_trading_year
    rationale: >-
      One trading year of rolling history. Matches every other FX
      level/curve/carry tool so cross-asset readers see comparable
      z-scores at the same horizon.
    valid_range: [60, 504]

  z_score_min_periods:
    value: 60
    source: industry_standard
    rationale: >-
      Minimum observations before a z-score is emitted; below this the
      rolling stat is too noisy and z_score is set to None to fail loud.
    valid_range: [20, 252]

  z_score_ddof:
    value: 1
    source: industry_standard
    rationale: >-
      Sample (Bessel-corrected) standard deviation. Same convention
      everywhere.
    valid_range: [0, 1]

  trailing_range_window_days:
    value: 252
    source: wire_frozen_v1
    rationale: >-
      Locked at 252 in V1; the schema's field names (high_252d /
      low_252d / percentile_252d) embed the number on the wire so a
      convention change without renaming would silently lie.
    valid_range: [252, 252]

  daily_change_periods:
    value: 1
    source: industry_standard
    rationale: One trading-day offset for the daily change calculation.
    valid_range: [1, 3]

  weekly_change_periods:
    value: 5
    source: industry_standard
    rationale: One trading-week offset (5 trading days).
    valid_range: [5, 10]

  monthly_change_periods:
    value: 21
    source: industry_standard
    rationale: Approximate one trading month (21 trading days).
    valid_range: [20, 30]

  vol_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals preserves precision for ATM vol values (~5-25%
      range typical).
    valid_range: [2, 6]

  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: Four decimals for z-score. Matches every other FX level tool.
    valid_range: [2, 6]

  percentile_round_decimals:
    value: 2
    source: legacy_default_pre_pilot
    rationale: Two decimals for percentile rank (0-100 scale).
    valid_range: [0, 4]

methodology:
  what_it_does: |
    Fetches the ATM vol observation history for one (pair, tenor) from
    macro_data.market_data_daily (instrument_type='fx_vol', tenor as
    given, attributes.pair = pair) over the lookback window, then
    computes: latest vol, daily/weekly/monthly absolute vol-point
    changes, rolling 252-day z-score, trailing 252-day high/low/
    percentile.
  assumptions:
    - "ATM vol values are in PERCENT (8.0 = 8% / year), matching the Bloomberg trader convention and the realized_vol tool."
    - "Vol changes are in ABSOLUTE vol points, not percent of the vol level — trader convention. For relative changes, divide by the previous level."
    - "Z-score min_periods (60) and window (252) match every other FX level tool so cross-asset extremeness comparisons are at the same horizon."
    - "Bloomberg ticker convention asymmetry: 1Y stored internally as '12M' (matches fx_em_forwards tenor convention) but BBG ticker is V1Y. The converter resolves this; the tool accepts '12M' as input."
  citations: []
  planned_extensions:
    - "Add bid/ask spread metrics surfaced in the output (current substrate has PX_BID/PX_ASK for 115 std-tenor instruments since PR #228)."
    - "Add realized-vs-implied gap surface once Phase E3 vol_carry tool lands."
