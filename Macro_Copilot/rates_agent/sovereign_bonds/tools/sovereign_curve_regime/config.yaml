# =============================================================================
# calculate_sovereign_curve_regime_tool — tool configuration
# =============================================================================
# The FIRST Bucket-2 model-state primitive (plan §7-B).  Assembles four
# curve features [level, 2s10s slope, curvature, realized-vol] from one
# sovereign curve and feeds them to the finance-blind `fit_regime_hmm`
# operator (a Gaussian HMM regime labeller).  The primitive carries THE
# FINANCE — which features, what the regimes MEAN (it names them by their
# realized-vol mean) — and ZERO statistical math: the HMM fit (Baum-Welch
# + Viterbi) lives entirely in shared/quant/hmm.py behind the operator.
#
# Bucket-2 model-state pattern: the fitted model (transition matrix,
# per-state means, loglik) rides in the operator's lineage; this primitive
# reads it back out and surfaces "the fit, not just a snapshot" in
# current_metrics.  No new artifact type — lineage IS the model-state
# persistence substrate.
#
# DESCRIBE, NOT FORECAST: a full-sample HMM read of which regime each
# historical date sat in (fit_scope='full_sample', disclosed).  It never
# predicts the next regime nor recommends a trade.
#
# Cross-config consistency (shared.config.lint): default_field_name and
# ffill_limit_days MUST agree with the other sovereign tools (curve_spread
# / butterfly / sovereign_yield_panel).
# =============================================================================

tool:
  name: calculate_sovereign_curve_regime_tool
  domain: sovereign_bonds
  category: quant_standard_analytic
  description: |
    Fit a Gaussian HMM to one sovereign curve's [level, 2s10s slope,
    curvature, realized-vol] features and label each date's regime.
    Surfaces the current regime, its name (by realized-vol: low /
    intermediate / high volatility), its persistence (the fitted
    transition-matrix diagonal), the per-regime feature means, and the
    full regime time series.  Descriptive full-sample read — which regime
    history sat in, never a forecast.

conventions:

  # ---------------------------------------------------------------------------
  # Bloomberg observation field (cross-config consistency-linted)
  # ---------------------------------------------------------------------------
  default_field_name:
    value: YLD_YTM_MID
    source: bloomberg_field_convention
    rationale: >-
      Mid yield-to-maturity is the standard sovereign-curve observation
      field.  Same value as curve_spread / butterfly / sovereign_yield_panel
      — the consistency lint enforces the match.

  # ---------------------------------------------------------------------------
  # Holiday-gap forward-fill limit (cross-config consistency-linted)
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Maximum consecutive missing days bridged by forward-fill when
      assembling the feature panel.  Matches every other rates tool.
    valid_range: [0, 10]

  # ---------------------------------------------------------------------------
  # Realized-vol feature: rolling-window length (trading days)
  # ---------------------------------------------------------------------------
  realized_vol_window:
    value: 21
    source: team_judgment_pending_review
    rationale: >-
      ~1 trading month of daily yield CHANGES for the realized-volatility
      feature.  Short enough to react to stress onsets that drive a
      regime switch, long enough to be a stable feature.  (The HMM
      z-scores each feature internally, so this window sets the vol
      feature's RESPONSIVENESS, not its scale.)
    valid_range: [5, 126]

  # ---------------------------------------------------------------------------
  # Realized-vol feature: return method
  # ---------------------------------------------------------------------------
  realized_vol_return_method:
    value: diff
    source: industry_standard_yield_changes
    rationale: >-
      Realized vol is computed on yield LEVEL CHANGES (first differences,
      in the level's unit), the standard rates convention — not percent
      returns, which are ill-defined near zero yields.

  # ---------------------------------------------------------------------------
  # Realized-vol feature: annualization day-count
  # ---------------------------------------------------------------------------
  realized_vol_annualization_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading days per year used to annualize the rolling std of daily
      yield changes (× sqrt(252)) so the per-regime realized-vol means are
      desk-readable.  Cosmetic for the FIT (the HMM z-scores the feature);
      load-bearing for the DISPLAYED vol level.
    valid_range: [248, 262]

  # ---------------------------------------------------------------------------
  # Regime naming — which feature orders the names, and the order
  # ---------------------------------------------------------------------------
  regime_naming_feature:
    value: realized_vol
    source: desk_convention_vol_regimes
    rationale: >-
      Regimes are NAMED (the finance) by their mean of this feature.
      Realized-vol is the desk-canonical axis for "calm vs stressed"
      curve regimes.

  regime_naming_order:
    value: ascending
    source: desk_convention_vol_regimes
    rationale: >-
      Ascending ⇒ the regime with the LOWEST realized-vol mean gets the
      'low_volatility' name, the highest gets 'high_volatility'.

  regime_label_low:
    value: low_volatility
    source: desk_convention_vol_regimes
    rationale: >-
      Descriptive name for the lowest-realized-vol regime (the calm
      state).  A label of observed structure, not a signal.

  regime_label_mid:
    value: intermediate_volatility
    source: desk_convention_vol_regimes
    rationale: >-
      Descriptive name stem for any middle regime when n_states > 2
      (suffixed by rank).

  regime_label_high:
    value: high_volatility
    source: desk_convention_vol_regimes
    rationale: >-
      Descriptive name for the highest-realized-vol regime (the stressed
      state).  A label of observed structure, not a signal.

  # ---------------------------------------------------------------------------
  # Display rounding for the surfaced metrics
  # ---------------------------------------------------------------------------
  metric_round_decimals:
    value: 4
    source: display_convention
    rationale: >-
      Decimal places for the surfaced per-regime feature means,
      persistence, and loglik.  Display-only — never affects the fit.
    valid_range: [2, 8]

methodology:
  what_it_does: |
    Assembles a four-feature panel for one sovereign curve — level (the
    long-tenor yield), 2s10s slope (long − short, bps), curvature
    (2×belly − short − long, bps), and realized-vol (annualized rolling
    std of daily level changes) — then passes the RAW (natural-unit)
    features to the finance-blind fit_regime_hmm operator, which
    z-scores them internally and fits a Gaussian HMM with n_states
    regimes (Baum-Welch + Viterbi).  Reads the fitted model state back
    out of the operator's lineage and surfaces the current regime, its
    descriptive name (ordered by the realized-vol mean), its persistence
    (the transition-matrix diagonal), the per-regime feature means, and
    the full regime time series.
  assumptions:
    - "Yields stored as percent (4.25 = 4.25%); slope/curvature reported in bps (×100)."
    - "FULL-SAMPLE fit — describes which regime each HISTORICAL date sat in (fit_scope='full_sample'); NOT point-in-time and NOT a forecast of the next regime."
    - "The HMM z-scores each feature internally — the primitive must pass RAW features (no pre-standardization)."
    - "Regime NAMES are descriptive labels of the observed realized-vol structure, never a trade signal or recommendation."
  citations: []
  planned_extensions:
    - "Posterior (gamma) confidence per date when fit_regime_hmm exposes the state-probabilities Panel."
    - "Point-in-time / walk-forward regime fits (a separate as-of variant) once the operator ships a rolling-window scope."
    - "Multi-curve / cross-market regime features (a wider feature panel)."
