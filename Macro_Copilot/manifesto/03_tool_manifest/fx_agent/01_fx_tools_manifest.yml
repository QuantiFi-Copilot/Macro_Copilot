    related_tools:
      - get_fx_trade_setup_tool
      - get_fx_macro_risk_overlay_tool

    validation_status: tested

  - name: scan_usd_pressure
    domain: fx
    sub_agent: spot
    bucket: 1B
    status: built
    workspace_surface: false

    implementation:
      mcp_server: fx_agent/mcp_server.py
      tool_function: scan_usd_pressure_tool
      schema: fx_agent/spot/tools/usd_pressure/schemas.py::FXUSDPressureInput
      compute: fx_agent/spot/tools/usd_pressure/compute.py::scan_usd_pressure
      config: fx_agent/spot/tools/usd_pressure/config.yaml

    one_liner: >-
      Aggregate broad USD pressure across core G10 spot pairs and compare it
      with DXY momentum.

    related_tools:
      - get_fx_spot_level_tool
      - scan_fx_extremes_tool
      - get_fx_macro_risk_overlay_tool

    validation_status: tested

  - name: build_fx_carry_basket
    domain: fx
    sub_agent: forwards
    bucket: 1B
    status: built
    workspace_surface: false

    implementation:
      mcp_server: fx_agent/mcp_server.py
      tool_function: build_fx_carry_basket_tool
      schema: fx_agent/forwards/tools/carry_basket/schemas.py::FXCarryBasketInput
      compute: fx_agent/forwards/tools/carry_basket/compute.py::build_fx_carry_basket
      config: fx_agent/forwards/tools/carry_basket/config.yaml

    one_liner: >-
      Build candidate long/short FX carry baskets after filtering for spot
      stretch and realized volatility risk.

    related_tools:
      - get_fx_carry_tool
      - get_fx_realized_vol_tool
      - get_fx_spot_level_tool

    validation_status: tested

