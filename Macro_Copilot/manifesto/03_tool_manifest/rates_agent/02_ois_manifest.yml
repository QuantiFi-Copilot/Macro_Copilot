  # ---------------------------------------------------------------------------
  # POLICY-PATH REGIME (Bucket-2 model-state: HMM on the policy-futures strip)
  # ---------------------------------------------------------------------------

  - name: calculate_ois_policy_path_regime
    domain: rates
    sub_agent: ois
    bucket: 2
    category: model_fits
    status: built

    implementation:
      mcp_server: rates_agent/ois/mcp_server.py
      tool_function: calculate_ois_policy_path_regime_tool
      schema: rates_agent/ois/tools/ois_policy_path_regime/schemas.py::OISPolicyPathRegimeInput
      compute: rates_agent/ois/tools/ois_policy_path_regime/compute.py::calculate_ois_policy_path_regime
      config: rates_agent/ois/tools/ois_policy_path_regime/config.yaml

    one_liner: >-
      Gaussian-HMM regime of the PRICED policy path on a policy-futures STIR
      strip (SOFR/SONIA/EUR_SHORT_RATE) — labels which regime the market is
      currently pricing (easing/neutral/tightening) by the strip's front
      level, slope, curvature, and front-rate realized vol, with the regime
      persistence and the fitted HMM model state. A Bucket-2 model-state
      primitive over the shipped fit_regime_hmm operator. Describes what is
      priced; never a forecast.

    bucket_rationale: >-
      Bucket-2: the fitted HMM model state (transition matrix, per-regime
      means) rides in the operator's lineage and is surfaced in
      current_metrics. The primitive carries the FINANCE (the strip choice,
      the metadata-driven implied-rate conversion, naming the priced regime)
      and ZERO statistical math — the HMM is the finance-blind fit_regime_hmm
      operator. Consumes the cross-domain policy-futures strip substrate.

    pm_overridable:
      - curve_family
      - n_states
      - lookback_days

    related_tools:
      - build_policy_futures_strip_panel_tool
      - calculate_wirp_meeting_pricing_tool

    workflows:
      - analysis

    references:
      - tmp/fable_plan_2.md  # §7-B — Bucket-2 model-state primitives

    built_date: 2026-06-13
    validation_status: >-
      Not validated yet

  # ---------------------------------------------------------------------------
  # SWAP CARRY & ROLL (§7-C analytic: OIS curve carry + roll-down)
  # ---------------------------------------------------------------------------

  - name: calculate_swap_carry_and_roll
    domain: rates
    sub_agent: ois
    bucket: 1B
    category: carry_roll
    status: built

    implementation:
      mcp_server: rates_agent/ois/mcp_server.py
      tool_function: calculate_swap_carry_and_roll_tool
      schema: rates_agent/ois/tools/swap_carry_and_roll/schemas.py::SwapCarryAndRollInput
      compute: rates_agent/ois/tools/swap_carry_and_roll/compute.py::calculate_swap_carry_and_roll
      config: rates_agent/ois/tools/swap_carry_and_roll/config.yaml

    one_liner: >-
      Carry + roll-down of a par OIS swap held over a horizon, decomposed
      from the OIS par curve: roll = s(T) − s(T−h) (the curve slide-down),
      carry = s(T) − s(h) (coupon minus the horizon financing), total = roll
      + carry, in bps for a receiver under the curve-unchanged assumption.
      A §7-C data-ready analytic primitive (deterministic, no model) — NOT a
      forecast and NOT the data-gated cash-bond carry/roll.

    bucket_rationale: >-
      Bucket-1B: deterministic curve interpolation (s(T), s(T−h), s(h)) — no
      model state, no fit.  The analytic OIS carry/roll explicitly distinct
      from the cash-bond carry/roll, which stays deferred (no per-bond
      price/coupon/financing data).

    pm_overridable:
      - curve_family
      - tenor
      - horizon
      - lookback_days

    related_tools:
      - calculate_ois_forward_rate_tool
      - calculate_ois_curve_spread_tool

    workflows:
      - analysis

    references:
      - tmp/fable_plan_2.md  # §7-C — data-ready analytic primitives

    built_date: 2026-06-13
    validation_status: >-
      Not validated yet

