# =============================================================================
# get_real_yield_level_tool — tool configuration
# =============================================================================
# This file is the canonical record of the linker real-yield-level tool's
# conventions and methodology.  Loaded by
# ``shared.config.load_tool_config`` at compute() time.  Mirrors the
# sovereign ``yield_levels`` tool's config structure 1:1 — every shared
# convention (z_score_window_days, ffill_limit_days, default_field_name,
# rounding) carries the same numeric value, so the
# ``shared.config.lint`` cross-tool check stays clean as the
# inflation-indexed-bonds domain comes online.
#
# The concept is genuinely new (real yields are not nominal yields), but
# the level-statistic methodology a desk uses on top of a real-yield
# series is the same canonical level-stat math the nominal sovereign
# tool uses — so the conventions stay aligned by design.
#
# In V1 deterministic mode there is NO LLM-facing override path for
# conventions.  The LLM cannot ask for non-standard windows or
# thresholds.  See docs/architecture/tool_architecture.md.
# =============================================================================

tool:
  name: get_real_yield_level_tool
  domain: inflation_indexed_bonds
  description: |
    Single-tenor sovereign-linker real-yield level — emits both:

      - ``current_metrics``: snapshot of the latest observation
        (current real yield, daily/weekly/monthly bps changes,
        252-day rolling z-score, trailing 252-day high/low/percentile,
        observation count).

      - ``time_series``: canonical
        ``shared.schemas.time_series.TimeSeries`` (units = PERCENT)
        carrying the historical real-yield levels over the displayed
        ``lookback_days`` window.  Each row is rounded with the same
        ``yield_round_decimals`` convention the snapshot uses, so the
        snapshot's ``real_yield_pct`` equals
        ``time_series.rows[-1].value`` strictly.

    "Real yield" terminology — distinct from the nominal sovereign
    ``yield_levels`` tool — because the underlying series is the
    inflation-protected (TIPS / linker) bond's real yield-to-maturity,
    not a nominal sovereign yield.  Field name on the wire is
    ``real_yield_pct``; series_name carries the ``_real_yield``
    suffix.  Distinguishing in the wire surface keeps downstream
    operator panels from silently mixing real and nominal series.

conventions:

  # ---------------------------------------------------------------------------
  # Z-score window length (trading days)
  # ---------------------------------------------------------------------------
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading-day count for a 1-year rolling window.  Matches every
      sovereign rates tool (curve_spread, yield_levels,
      curve_move_classifier, butterfly, cross_market_spread) and the
      OIS rate_level tool — the cross-config lint enforces the match.
    valid_range: [60, 1260]
    exposure:
      expose: true
      rationale: >-
        Criterion A passes: changing the window materially changes the
        z-score (252 vs 60 → tactical reframing of the same series).
        Criterion B passes: the window IS the rolling-z-score
        definition.  Desk-doc 04_inflation_indexed_bonds.md §10 + §3
        explicitly flag 60d / 126d / 504d as tactical / structural
        alternatives a PM may want at runtime.  Cross-config lint still
        enforces the DEFAULT value alignment; per-call overrides are
        runtime behaviour and do not violate the lint.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"
      input_field: z_score_window_days
      pydantic_type: Optional[int]
      default_source: yaml
      promoted_from_yaml_in_pr: "#TBD"

  # ---------------------------------------------------------------------------
  # Minimum observations before the rolling stat is emitted
  # ---------------------------------------------------------------------------
  z_score_min_periods:
    value: 60
    source: team_judgment_pending_review
    rationale: >-
      ~3 months of observations before the rolling mean / std are
      deemed trustworthy.  Matches sovereign yield_levels /
      curve_spread / OIS rate_level.
    valid_range: [20, 252]
    exposure:
      expose: true
      rationale: >-
        Criterion A passes: changing min_periods changes WHICH days
        emit a non-NaN z-score and therefore the early-window output.
        Criterion B passes: it parameterises the rolling-z-score model.
        Exposed as part of the cohesive rolling-z-score surface
        (together with z_score_window_days + z_score_ddof, per PR8
        cohesive-multi-knob admissibility) so callers tactically
        reconfiguring the window can scale min_periods consistently
        (e.g. window=60 → min_periods=20).
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"
      input_field: z_score_min_periods
      pydantic_type: Optional[int]
      default_source: yaml
      promoted_from_yaml_in_pr: "#TBD"

  # ---------------------------------------------------------------------------
  # Standard-deviation degrees of freedom
  # ---------------------------------------------------------------------------
  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Sample standard deviation (Bessel-corrected, ddof=1).  Matches
      pandas' default and the convention every other rates tool uses.
    exposure:
      expose: true
      rationale: >-
        Criterion A passes: ddof choice (sample vs population) changes
        the numerical z-score value.  Criterion B passes: it
        parameterises the std computation inside the rolling-z model.
        Exposed as part of the cohesive rolling-z-score surface
        (z_score_window_days + z_score_min_periods + z_score_ddof
        together specify the model, per PR8).  Practical values are
        {0, 1}; the Pydantic field constrains ge=0, le=1.  Default 1
        remains the industry standard; cross-config lint still enforces
        the DEFAULT alignment.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"
      input_field: z_score_ddof
      pydantic_type: Optional[int]
      default_source: yaml
      promoted_from_yaml_in_pr: "#TBD"

  # ---------------------------------------------------------------------------
  # Calendar-day buffer for the fetch window
  # ---------------------------------------------------------------------------
  z_score_buffer_multiplier:
    value: 1.5
    source: derived_from_window
    rationale: >-
      Calendar-day buffer added to the fetch window so the rolling
      z-score is fully populated from the first displayed trading day.
      1.5x trading-day window covers weekends + holidays.  Matches
      every sovereign rates tool and OIS rate_level.
    valid_range: [1.2, 2.0]
    exposure:
      expose: false
      rationale: >-
        Criterion A is weak — the buffer multiplier affects which days
        the warm-up rolling-z-score is populated for, but does NOT
        change the numerical value of the z-score on days already past
        the warm-up.  Criterion B fails — buffer math is fetch-window
        arithmetic, not part of the analytical z-score definition.
        Derived from z_score_window_days; keeping YAML-locked.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"

  # ---------------------------------------------------------------------------
  # Period-change offsets (in trading-day rows after ffill)
  # ---------------------------------------------------------------------------
  daily_change_offset_rows:
    value: 2
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-2] = 1 trading day back.
    valid_range: [2, 5]
    exposure:
      expose: false
      rationale: >-
        Criterion A passes (different offset → different change value).
        Criterion B fails — "daily / weekly / monthly" are canonical
        desk-language anchors; the OFFSET is the convention that pins
        what "daily" MEANS, not a parameter of the analytical math
        operating on the series.  Exposing per-call would let the
        output's "daily_change_bps" field-name lie about what it
        contains (PR14 wire-format honesty).  Keeping YAML-locked.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"

  weekly_change_offset_rows:
    value: 6
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-6] = 5 trading days back ≈ 1 calendar week.
    valid_range: [5, 10]
    exposure:
      expose: false
      rationale: >-
        Same rationale as daily_change_offset_rows — "weekly" is the
        desk-language anchor; the offset defines what the anchor means
        and is wire-encoded in the weekly_change_bps field name.
        Keeping YAML-locked.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"

  monthly_change_offset_rows:
    value: 22
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-22] = ~1 calendar month of trading days.
    valid_range: [20, 30]
    exposure:
      expose: false
      rationale: >-
        Same rationale as daily_change_offset_rows — "monthly" is the
        desk-language anchor; the offset defines what the anchor means
        and is wire-encoded in the monthly_change_bps field name.
        Keeping YAML-locked.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"

  # ---------------------------------------------------------------------------
  # Trailing range / percentile window — LOCKED at 252 in V1
  # ---------------------------------------------------------------------------
  # The output schema's field names (high_252d_pct, low_252d_pct,
  # percentile_252d) are wire-frozen because the number is embedded in
  # the identifiers.  compute() raises NotImplementedError if this is
  # set to anything other than 252; see methodology.planned_extensions
  # for the path to making it configurable.  Same wire-freeze as
  # sovereign yield_levels and OIS rate_level.
  trailing_range_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      1Y trailing for high/low/percentile.  Locked at 252 in V1
      because the wire field names embed the number — same situation
      as sovereign yield_levels and OIS rate_level.
    exposure:
      expose: false
      rationale: >-
        WIRE-FROZEN.  The output field names (high_252d_pct,
        low_252d_pct, percentile_252d) embed the number 252 on the
        wire (PR14 wire-format honesty); changing the convention
        without renaming the fields would silently lie about what the
        percentile is computed against.  compute._conventions_from_config
        raises NotImplementedError if this is set to anything other
        than 252.  Path to configurability documented in
        methodology.planned_extensions: rename schema fields to
        high_window_pct / low_window_pct / percentile_window + add
        trailing_window_days to the output; remove the
        NotImplementedError guard.  Until then, keeping YAML-locked.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"

  # ---------------------------------------------------------------------------
  # Forward-fill limit for missing observations
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Bridge up to one trading week of missing data across holiday
      gaps.  Matches every sovereign rates tool and OIS rate_level —
      the cross-config lint enforces the match.
    valid_range: [1, 10]
    exposure:
      expose: false
      rationale: >-
        Borderline.  Criterion A passes (different ffill changes which
        days enter the series).  Criterion B is weak — ffill is a
        data-cleaning step upstream of the analytical math, not a
        parameter of the math itself.  Per the methodology_exposure
        protocol §2.3 (borderline cases default to expose: false),
        keeping YAML-locked.  Revisit if a desk use case for per-call
        override emerges (e.g. a workflow that wants strict no-ffill
        treatment for a stress-replay).
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"

  # ---------------------------------------------------------------------------
  # Default Bloomberg observation field for linker real yield
  # ---------------------------------------------------------------------------
  # Linkers publish their real-yield-to-maturity under the same
  # Bloomberg mnemonic the nominal sovereigns use (``YLD_YTM_MID``) —
  # see ``rates_agent/playbooks/inflation_indexed_bonds.yml``'s
  # ``target_metrics``.  Reusing the convention name + value keeps the
  # cross-config lint clean across the sovereign and linker domains;
  # the rationale field below documents the linker-specific meaning so
  # the methodology is not laundered through a generic-sounding name.
  default_field_name:
    value: YLD_YTM_MID
    source: bloomberg_field_convention
    rationale: >-
      Linker real yield-to-maturity is published under the same
      Bloomberg ``YLD_YTM_MID`` mnemonic that nominal sovereigns use
      — the difference is the underlying instrument (linker tickers
      from ``rates_agent/playbooks/inflation_indexed_bonds.yml``), not
      the field code.  LLM/HTTP wrappers must use the empty/None
      sentinel so this default flows through — see the
      curve_move_classifier wrapper-shadowing fix (commit b2605ee).
    exposure:
      expose: true
      rationale: >-
        Criterion A passes (different Bloomberg field → different
        numerical value).  Criterion B passes (the field choice IS
        the data-source identity).  Already exposed via the existing
        ``RealYieldLevelInput.field_name: Optional[str]`` Pydantic
        field (empty-string sentinel at the MCP boundary, None
        sentinel in Python).  This exposure block documents the
        existing surface; no new field promotion required.  Pattern:
        the YAML default is the linker real-yield-to-maturity
        mnemonic; per-call override lets the caller request bid/ask
        or a different field code (e.g. YLD_YTM_BID).
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"
      input_field: field_name
      pydantic_type: Optional[str]
      default_source: yaml
      promoted_from_yaml_in_pr: "n/a"

  # ---------------------------------------------------------------------------
  # Boundary rounding — applied to both the snapshot's real_yield_pct
  # field AND every row of the canonical TimeSeries output, so the
  # snapshot value equals time_series.rows[-1].value exactly (not just
  # within tolerance).  Convention names reuse sovereign's
  # ``yield_round_decimals`` etc. so the cross-config lint enforces all
  # rates surfaces stay aligned at 4 decimals.
  # ---------------------------------------------------------------------------
  yield_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches the legacy hardcoded default in
      ``shared.analytics.levels.compute_level_metrics`` and every
      sovereign rates tool.  Threaded through both the snapshot path
      AND the canonical TimeSeries builder so the two cannot disagree
      numerically.
    valid_range: [0, 8]
    exposure:
      expose: false
      rationale: >-
        Criterion A fails — display precision; does not change the
        underlying answer, only the displayed digits.  Cross-tool lint
        enforces alignment across rates level tools.  Keeping YAML-
        locked.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"

  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals is the default ``compute_level_metrics`` was
      using prior to this convention being explicit.  Snapshot's
      ``z_score`` is rounded via this knob so YAML edits flow
      through to runtime behaviour.  Matches sovereign yield_levels
      and OIS rate_level.
    valid_range: [0, 8]
    exposure:
      expose: false
      rationale: >-
        Criterion A fails — display precision for the z-score scalar;
        does not change the underlying analytical answer.  Cross-tool
        lint enforces alignment.  Keeping YAML-locked.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"

  high_low_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches the legacy default in
      ``compute_level_metrics`` for the trailing high / low /
      percentile stats.  Matches sovereign yield_levels and OIS
      rate_level.
    valid_range: [0, 8]
    exposure:
      expose: false
      rationale: >-
        Criterion A fails — display precision for the trailing-range
        stats; does not change the underlying analytical answer.
        Cross-tool lint enforces alignment.  Keeping YAML-locked.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"

methodology:
  what_it_does: |
    Fetches one (curve_family, tenor) linker real-yield series, cleans
    it, and returns a snapshot: current real yield, period changes
    (daily / weekly / monthly), rolling z-score against the 252-day
    window, trailing range stats (high / low / percentile within the
    trailing 252 days), and the observation count over the user's
    lookback_days window.  Plus the canonical ``time_series`` payload
    over the displayed window.

  assumptions:
    - "Real yields stored as percent (1.85 = 1.85%).  Linker
       real-yield mnemonics are negative for parts of the post-2008
       and 2020-21 history — the math is unchanged."
    - "Same level-stat methodology as the nominal sovereign
       yield_levels and OIS rate_level — cross-config lint enforces
       the convention values match."
    - "Trading-day-based period offsets (after ffill the series is
       approx daily)."
    - "Trailing range / percentile window locked at 252 trading days
       in V1; see planned_extensions for the path to configurability."
    - "lookback_days controls fetch range and observation_count's
       cutoff window, NOT the rolling stat window or the trailing
       range window — those are independent conventions in this YAML."
    - "Observation-count cutoff is anchored to the data's latest
       observation date (not date.today()), matching the OIS
       rate_level convention.  Linker daily series can lag wall-clock
       by several business days; anchoring to date.today() would
       silently shrink the displayed window when data is stale.
       Sovereign yield_levels currently anchors to date.today(); the
       inconsistency is documented in sovereign yield_levels'
       planned_extensions and will be reconciled there."

  citations: []

  planned_extensions:
    - "trailing_range_window_days: configurable.  Currently locked at
       252 because the output fields high_252d_pct / low_252d_pct /
       percentile_252d embed the number.  Path to configurability
       mirrors sovereign yield_levels' planned_extensions: rename
       schema fields to high_window_pct / low_window_pct /
       percentile_window + add trailing_window_days to the output;
       remove the NotImplementedError guard in compute()."
    - "Sovereign-vs-linker observation_count anchoring consistency.
       Linker real_yield_level anchors observation_count's cutoff to
       the latest observation in the series (matching OIS
       rate_level); sovereign yield_levels anchors to date.today().
       Aligning these is a separate PR — it's a behaviour change,
       not a config one."
    - "Real-yield curve composition primitives
       (real_yield_curve_spread, breakeven_inflation_simple, etc.)
       documented in
       ``manifesto/01_instruments/rates_agent/04_inflation_indexed_bonds.md``
       Section 9 (Bucket 1A).  Those are separate primitives, not
       convention extensions of this tool."
