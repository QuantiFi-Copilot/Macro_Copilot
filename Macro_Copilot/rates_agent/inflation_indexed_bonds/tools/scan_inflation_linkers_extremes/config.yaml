# =============================================================================
# scan_inflation_linkers_extremes_tool — tool configuration
# =============================================================================
# Morning sweep across the linker real-yield universe — ranks every
# ``(curve_family, tenor)`` linker observation by absolute 252-day
# z-score of its real-yield level and returns the top-N extremes.
#
# Concept honesty
# ---------------
# This is the universe-wide REAL-YIELD level scan — the desk's morning
# "where is the linker curve stretched today?" screen, taken across
# every linker tenor pillar the playbook tracks. The scan ranks REAL
# YIELDS (not breakevens, not nominal yields, not inflation
# compensation). The catalog-listed dependency
# (``inflation_linkers__real_yield_level``) is the per-bond
# observation primitive this scan aggregates across the universe.
#
# Catalog (build_order 24, id
# ``inflation_linkers__scan_inflation_linkers_extremes``):
#
#   concept_summary: "Morning sweep across the linker universe (all
#     24 linkers from inflation_indexed_bonds.yml), ranked by absolute
#     252-day z-score of real yields."
#
#   methodology_guardrails:
#     - "Output rows must carry the per-bond methodology disclosure
#        tag so downstream consumers see why a bond ranked extreme."
#     - "Methodology card must state the z-score lookback window
#        explicitly."
#
# Both guardrails are honoured by this tool: the z-score lookback
# window is read from this YAML at runtime (the disclosure template
# is parameterised on ``z_score_window_days``), and the
# ``methodology_disclosure`` string is attached BOTH to the response-
# level methodology card AND to every result row, per the
# scan_bond_futures_extremes precedent.
#
# Index-family + market-structure caveat (load-bearing)
# -----------------------------------------------------
# Linker markets across countries reference DIFFERENT inflation
# indices (CPI-U non-seasonally adjusted for USD TIPS, HICP ex-tobacco
# for EUR-area linkers, RPI/CPIH for GBP linkers, Canada CPI for
# CAD_RRB) AND have materially different market-structure
# characteristics (issuance size, liquidity premium, benchmark
# availability at the same tenor pillar). A 252d z-score on a
# US 10Y real yield therefore reads against a different underlying
# distribution than a 252d z-score on a UK 10Y real yield; the desk
# can usefully rank both within the same morning screen but the
# methodology disclosure carries this caveat verbatim so a
# downstream consumer cannot mistake the scan for an apples-to-
# apples cross-country real-rate read. Mirrors the
# ``cross_country_real_yield_spread_simple`` precedent.
#
# Single-metric ranking
# ---------------------
# The catalog's literal wording is "ranked by absolute 252-day
# z-score of real yields" — one metric (real-yield LEVEL z-score).
# The sibling sovereign / OIS scanners ship single-metric rankings
# on the level z-score. The bond_futures scanner is multi-metric
# only because its catalog enumerated four metrics
# (price / Δprice / volume / OI); the linker catalog enumerates one
# (``yield_mid``), so this scan ranks on a single metric and carries
# daily_change_bps + monthly_change_bps as per-row snapshot context
# (matching the sovereign / OIS scanner row shape) rather than as
# separate rankings.
#
# Display thresholds
# ------------------
# ``top_n`` and ``min_abs_z_score`` are DISPLAY thresholds — they
# control which stems appear in the ranked output, not which stems
# are SCANNED. Their defaults live in this YAML and are read by
# compute when the LLM omits them (None-sentinel resolution). Mirrors
# the YAML-owned-default pattern reviewer round-1 imposed on the
# bond_futures scanner — keeps the per-query input optional while
# the methodology default lives in YAML per PR9 / PR10.
#
# In V1 deterministic mode there is NO LLM-facing override for
# methodology conventions. The LLM can scope the scan
# (``curve_families``), anchor it to a date (``as_of_date``), and
# set display thresholds (``top_n``, ``min_abs_z_score``) but cannot
# alter the z-score window, ddof, fill limit, fetch-window buffer,
# field mnemonic, or instrument_type.
# =============================================================================

tool:
  name: scan_inflation_linkers_extremes_tool
  domain: inflation_indexed_bonds
  description: |
    Universe-wide linker real-yield sweep — ranks every
    ``(curve_family, tenor)`` linker observation in the
    inflation_indexed_bonds universe (USD_TIPS / GBP_LINKER /
    EUR_FR_LINKER / CAD_RRB by default; scope-narrowable via
    ``curve_families``) by absolute 252-day rolling z-score of its
    real-yield LEVEL.  Returns the top-N extremes, each row tagged
    with the methodology disclosure (universe-wide linker
    real-yield scan; INDEX-FAMILY + MARKET-STRUCTURE caveats;
    morning screen, NOT a tactical trade signal).

conventions:

  # ---------------------------------------------------------------------------
  # Z-score window length (trading days) — the HEADLINE methodology
  # disclosure required by the catalog guardrail. Disclosed verbatim
  # on the response's methodology_disclosure string AND on every
  # result row. Mirrors the same 1y_window convention used by
  # real_yield_level / cross_country_real_yield_spread_simple / every
  # other rates level primitive — the cross-config lint enforces the
  # match across the inflation-linker family.
  # ---------------------------------------------------------------------------
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading-day count for a 1-year rolling window.  Same convention
      as real_yield_level, cross_country_real_yield_spread_simple,
      real_yield_curve_spread, real_yield_butterfly,
      breakeven_inflation_simple, and every sovereign / OIS rates
      level primitive.  Desk reads of "is X stretched?" are
      benchmarked against the trailing year — anchoring the scan's
      z-scores here keeps cross-tool comparability with the upstream
      per-bond ``real_yield_level`` primitive on the same as-of date.
      The MUST-DISCLOSE window per the catalog's methodology
      guardrail.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Minimum observations before a stem is included in the ranking
  # ---------------------------------------------------------------------------
  z_score_min_periods:
    value: 60
    source: team_judgment_pending_review
    rationale: >-
      ~3 months of observations before the rolling mean / std are
      deemed trustworthy. Matches real_yield_level,
      cross_country_real_yield_spread_simple, sovereign yield_levels,
      OIS rate_level, and the bond_futures scanner.  Stems with
      fewer observations are SKIPPED in the ranking — never silently
      promoted to "z = None" rows.
    valid_range: [20, 252]

  # ---------------------------------------------------------------------------
  # Standard deviation degrees of freedom
  # ---------------------------------------------------------------------------
  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Sample standard deviation (Bessel-corrected, ddof=1). Matches
      pandas' default and every other rates tool in this codebase.

  # ---------------------------------------------------------------------------
  # Calendar-day buffer for the fetch window
  # ---------------------------------------------------------------------------
  z_score_buffer_multiplier:
    value: 1.5
    source: derived_from_window
    rationale: >-
      Calendar-day buffer added to the fetch window so the rolling
      z-score is fully populated for every stem on the as-of date.
      1.5x trading-day window covers weekends + holidays. Matches
      every other rates level primitive in this codebase.
    valid_range: [1.2, 2.0]

  # ---------------------------------------------------------------------------
  # Period-change offsets (in trading-day rows after ffill)
  # ---------------------------------------------------------------------------
  # ``daily_change_bps`` and ``monthly_change_bps`` are surfaced on
  # every output row as per-row snapshot context (matches the
  # sovereign / OIS scanner row shape). They are NOT separate
  # rankings — the ranking key is the LEVEL z-score per the catalog.
  daily_change_offset_rows:
    value: 2
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-2] = 1 trading day back. Matches every other
      linker tool's ``daily_change_offset_rows``.
    valid_range: [2, 5]

  monthly_change_offset_rows:
    value: 22
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-22] = ~1 calendar month of trading days.
      Matches every other linker tool's ``monthly_change_offset_rows``.
    valid_range: [20, 30]

  # ---------------------------------------------------------------------------
  # Forward-fill limit for missing observations
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Bridge up to one trading week of missing data across holiday
      gaps. Same as every other rates level primitive in this
      codebase.  Per-stem, applied independently to each linker's
      real-yield series before z-scoring.
    valid_range: [1, 10]

  # ---------------------------------------------------------------------------
  # Bloomberg observation field — NOT an input-schema knob.
  # ---------------------------------------------------------------------------
  # Linkers publish their real-yield-to-maturity under the same
  # Bloomberg mnemonic the nominal sovereigns use (``YLD_YTM_MID``)
  # — see ``rates_agent/playbooks/inflation_indexed_bonds.yml``'s
  # ``target_metrics`` and the upstream ``real_yield_level``
  # primitive's ``default_field_name`` convention. Mirrored exactly
  # here so the scan reads the same underlying observations as the
  # per-bond ``real_yield_level`` monitor — guarantees the scan's
  # "USD_TIPS 10Y z = +2.3" equals the per-bond level snapshot's z
  # for the same instrument on the same as_of_date.
  default_field_name:
    value: YLD_YTM_MID
    source: bloomberg_field_convention
    rationale: >-
      Linker real yield-to-maturity is published under the same
      Bloomberg ``YLD_YTM_MID`` mnemonic that nominal sovereigns use
      — the difference is the underlying instrument
      (``instrument_type='inflation_linker'`` filter on every fetch),
      not the field code. Mirrors the upstream ``real_yield_level``
      primitive's ``default_field_name`` so the scan and the per-
      bond monitor share data byte-for-byte.

  # ---------------------------------------------------------------------------
  # Linker curve families recognised by the scanner
  # ---------------------------------------------------------------------------
  # Closed-family whitelist of the linker curve families the V1 scan
  # supports (sourced from ``rates_agent/playbooks/
  # inflation_indexed_bonds.yml``). Hardcoded here rather than
  # discovered at runtime so a stray non-linker curve_family mis-
  # routed by the LLM is REFUSED at schema-validation time rather
  # than silently included. A new linker curve added to the playbook
  # is added here in the same PR.
  inflation_linker_curve_families:
    value: "USD_TIPS,GBP_LINKER,EUR_FR_LINKER,CAD_RRB"
    source: bloomberg_field_convention
    rationale: >-
      Closed family of linker curve families currently ingested via
      the inflation_indexed_bonds playbook. Comma-separated string
      because ``Convention.value`` is scalar (str). The whitelist is
      intentionally explicit, not discovery-based, so a non-linker
      curve_family (e.g. nominal sovereign 'UST') passed by the LLM
      is REFUSED at the schema layer rather than silently swept
      into the scan.

  # ---------------------------------------------------------------------------
  # Boundary rounding — applied to each result row's snapshot values
  # and z-scores. Mirrors the precisions used by the sibling per-
  # bond ``real_yield_level`` so a "USD_TIPS 10Y real_yield_pct =
  # 1.7300" from the scan equals "real_yield_pct = 1.7300" from
  # real_yield_level on the same as_of_date.
  # ---------------------------------------------------------------------------
  yield_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches the upstream ``real_yield_level`` /
      sovereign yield_levels / OIS rate_level conventions and the
      cross_country_real_yield_spread_simple / real_yield_butterfly
      / real_yield_curve_spread family.  Cross-config lint enforces
      the match across the rates surfaces.
    valid_range: [0, 8]

  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals is the default ``compute_level_metrics`` uses
      across the rates family.  The z-score is the ranking key;
      preserving four decimals avoids ties from coarse rounding
      when two linkers have very similar z-scores.
    valid_range: [0, 8]

  bps_change_round_decimals:
    value: 2
    source: legacy_default_pre_pilot
    rationale: >-
      Two decimals on bps change snapshots — matches sovereign /
      OIS / per-bond real_yield_level conventions on bps display
      precision.  daily_change_bps and monthly_change_bps are
      per-row snapshot context (NOT ranking keys), so two-decimal
      bps precision is the right surface for the desk reader.
    valid_range: [0, 4]

  # ---------------------------------------------------------------------------
  # Display-threshold defaults — YAML-owned per PR9 / PR10. The LLM
  # may STILL override either knob per query at the input layer;
  # these conventions only kick in when the input is omitted
  # (None-sentinel resolution inside compute). The valid_range
  # mirrors the schema-level Field(ge=..., le=...) bound so an off-
  # range YAML edit is caught by `python -m shared.config.lint`.
  # ---------------------------------------------------------------------------
  default_top_n:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Default number of extreme stems to return when the LLM does
      not pass ``top_n`` explicitly. Five rows is enough coverage
      to read the desk question "where is the linker universe
      stretched today?" without flooding the response. Matches the
      bond_futures scanner's ``default_top_n`` and the sovereign /
      OIS scanner team-judgment wire-default rows-per-screen
      choice. The hard ceiling (50) remains a schema-level Field
      bound so an LLM cannot exceed it regardless of the YAML
      default.
    valid_range: [1, 50]

  default_min_abs_z_score:
    value: 1.5
    source: team_judgment_pending_review
    rationale: >-
      Default minimum absolute z-score floor when the LLM does not
      pass ``min_abs_z_score`` explicitly. 1.5σ matches the
      sovereign / OIS scanner conventions and the bond_futures
      scanner's ``default_min_abs_z_score`` — desk reads of
      "anything stretched today?" want to surface the >=1.5σ moves
      and ignore the noise band below.  The non-negative bound
      (ge=0.0) remains a schema-level Field invariant so an off-
      range YAML edit is structurally caught by the load.
    valid_range: [0.0, 10.0]

methodology:
  what_it_does: |
    For every linker ``(curve_family, tenor)`` in the
    inflation_indexed_bonds universe (USD_TIPS / GBP_LINKER /
    EUR_FR_LINKER / CAD_RRB by default; scope-narrowable via
    ``curve_families`` input), fetches the linker real-yield
    series (Bloomberg ``YLD_YTM_MID`` under
    ``instrument_type='inflation_linker'``) across the lookback
    window plus the YAML-owned z-score buffer, cleans each per-
    stem series (ffill bridges holidays up to 5 trading days),
    and computes the rolling 252-day z-score of the real-yield
    LEVEL.  Stems with fewer than ``z_score_min_periods`` aligned
    observations are SKIPPED (never silently demoted to z=None).
    Ranks remaining stems by absolute z-score, applies the
    ``min_abs_z_score`` filter, and returns the top ``top_n``
    rows — each row tagged with the methodology disclosure
    (universe-wide linker real-yield level scan; explicit z-score
    lookback window read from this YAML; INDEX-FAMILY +
    MARKET-STRUCTURE caveats; morning screen, NOT a tactical
    trade signal).  Per-row reference columns (maturity_date /
    country / vendor_ticker) are attached from the enriched view
    via the read-only ``fetch_scan_universe_reference`` helper so
    the desk reader can identify the security without a second
    tool call.

  assumptions:
    - "Single-metric ranking on real-yield LEVEL z-score per the
       catalog's literal wording (``ranked by absolute 252-day
       z-score of real yields``).  daily_change_bps and
       monthly_change_bps are surfaced on every output row as
       per-row snapshot context (matching the sovereign / OIS
       scanner row shape) but are NOT separate rankings.  The
       paired (level, change) ranking design used by the
       bond_futures scanner is rejected here because the linker
       catalog enumerates one upstream metric, not four."
    - "REAL-YIELD scan, NOT a breakeven scan, NOT a nominal-yield
       scan, NOT an inflation-compensation scan.  Breakevens are
       owned by the sibling ``breakeven_inflation_simple`` family;
       nominal-yield extremes are owned by the sovereign
       ``scanner`` tool; ZCIS inflation-swap reads are owned by
       the inflation_swaps domain.  The methodology disclosure
       surfaces this scope explicitly per the catalog's
       methodology guardrail."
    - "INDEX-FAMILY MISMATCH (load-bearing): different countries'
       linkers reference DIFFERENT inflation indices — USD TIPS
       reference CPI-U non-seasonally adjusted, EUR-area linkers
       reference HICP ex-tobacco, UK linkers reference RPI
       (legacy) or CPIH (newer issues), Canadian RRBs reference
       Canada CPI.  Ranking real-yield z-scores across this
       heterogeneity is a useful morning screen but the desk
       reader MUST interpret the output with that caveat in
       mind.  Mirrors the
       ``cross_country_real_yield_spread_simple`` disclosure
       language; the scan does NOT harmonise indices."
    - "MARKET-STRUCTURE MISMATCH (load-bearing): linker markets
       differ materially across countries in benchmark
       availability at the same tenor pillar, issuance size,
       linker-specific liquidity premium, deflation-floor
       treatment, and on-the-run / off-the-run dynamics.  USD
       TIPS, GBP linkers, EUR-area linkers and Canadian RRBs are
       NOT fungible at the same tenor.  A z-score extreme on one
       market may reflect liquidity / structural moves rather
       than pure real-rate divergence; surface accordingly."
    - "Morning screen, NOT a tactical trade signal.  The scan
       answers the desk question ``where is the linker curve
       stretched today?`` — it surfaces extremes for further
       analysis (curve shape via real_yield_curve_spread,
       breakeven decomposition via breakeven_inflation_simple,
       cross-country differential via
       cross_country_real_yield_spread_simple) rather than
       indicating a directional trade.  The methodology
       disclosure surfaces this scope explicitly per the
       catalog's methodology guardrail."
    - "Fetch window is derived from YAML — not an LLM input. The
       calendar-day buffer is ``z_score_window_days *
       z_score_buffer_multiplier`` (currently 252 * 1.5 = 378
       days), which guarantees a fully-populated 252d rolling
       z-score for every stem on the as-of date. Exposing the
       fetch window as an LLM-controlled input would be a PR8 /
       OPR8 input-schema overreach (methodology knob masquerading
       as a per-query choice).  ``min_abs_z_score`` and ``top_n``
       remain DISPLAY thresholds (per-query inputs, both YAML-
       defaultable via the ``default_min_abs_z_score`` /
       ``default_top_n`` conventions); they do not change which
       stems are SCANNED, only which appear in the ranked
       output."
    - "``as_of_date`` anchors the scan to a specific trading day —
       either the LLM-supplied date or, when omitted, the most-
       recent shared trading day across the fetched universe (max
       trade_date observed in the cleaned series after per-stem
       cleaning).  Determinism: same as_of_date + same DB state
       ⇒ same ranking.  Per-stem series are CAPPED at the
       resolved as_of_date before z-scoring so a future-dated row
       cannot contaminate the trailing rolling stats.  Mirrors
       the bond_futures scanner's deterministic-anchor
       convention."
    - "Per-row reference columns (maturity_date, country,
       vendor_ticker) come from the enriched view directly via
       the read-only ``fetch_scan_universe_reference`` helper
       added to ``shared/analytics/rates_fetch.py``. The view
       already exposes these natively; the helper does ONE extra
       SELECT (DISTINCT per (curve_family, tenor, contract_code))
       to attach them per row.  ``security_name`` is NOT
       surfaced: the linker universe's
       ``instrument_metadata_history.security_name`` is
       universally NULL on the current DB snapshot.  Surfacing
       NULL on every row would be dead-field noise; substituting
       ``vendor_ticker`` for it under the ``security_name``
       label would be a proxy violation per the no-proxy rule.
       ``vendor_ticker`` is surfaced under its own name as the
       Bloomberg-grade desk identifier (e.g. ``GTII10 Govt``)."

  citations:
    - "Plan §5 Group 1 #1 (catalog
       ``inflation_linkers__scan_inflation_linkers_extremes``,
       build_order 24)."
    - "Catalog methodology guardrail: ``Output rows must carry
       the per-bond methodology disclosure tag`` and ``Methodology
       card must state the z-score lookback window explicitly``."
    - "Sibling disclosure precedent:
       ``cross_country_real_yield_spread_simple`` — same INDEX-
       FAMILY + MARKET-STRUCTURE caveats apply to the universe
       scan."

  planned_extensions:
    - "Pair the level-z ranking with a 1-day Δ-yield-z ranking
       (the bond_futures-style multi-metric scan).  Requires a
       catalog amendment naming the additional metric explicitly;
       the V1 catalog wording binds this primitive to one metric
       (real-yield level z) so a multi-metric expansion would
       widen scope past the catalog entry — defer until the
       catalog says so."
    - "Surface ``security_name`` once the linker universe's
       ``instrument_metadata_history.security_name`` is populated
       upstream (the field is documented in the SCD2 schema but
       all linker rows currently carry NULL).  When that
       backfill lands, add ``security_name`` to the output row
       schema and to ``fetch_scan_universe_reference``'s
       projection without changing the surrounding ranking
       methodology."
    - "Add an index-family-stratified ranking mode — group stems
       by their underlying inflation index (CPI-U vs HICP vs RPI
       vs CAN_CPI) and rank within each group.  Would require an
       additional ingestion column linking curve_family to
       underlying inflation index family; defer until that
       metadata lands."
