# =============================================================================
# Alembic — Macro Copilot state-schema migrations
# =============================================================================
#
# Owns the `copilot_state` Postgres schema (sessions, turns, message_events,
# working_set, artifact_metadata, methodology_versions, dags, dag_nodes,
# dag_edges, workspaces, workspace_variants, application_version).
#
# The other Postgres schema in this project — `macro_data` — is NOT managed
# by Alembic.  It is hand-written SQL in `Macro_Copilot/database/schema.sql`
# and bootstrapped by the Docker entrypoint-initdb mount in
# `Macro_Copilot/docker-compose.yml`.  That is intentional: `macro_data`
# is stable market-data tables (instrument_master, load_audit,
# market_data_daily) whose schema rarely changes; `copilot_state` is the
# evolving Phase 0 substrate where Alembic earns its keep.
#
# Invocation:
#   alembic upgrade head        # apply all pending migrations
#   alembic downgrade base      # drop everything alembic created
#   alembic revision -m "..."   # create a new revision (hand-written)
#   alembic current             # print the current head version
#   alembic history             # print full revision history
#
# Connection string: built from environment variables matching the
# project's `database.database.get_db_engine` (DB_USER / DB_PASSWORD /
# DB_HOST / DB_PORT / DB_NAME).  See `migrations/env.py` for the
# resolution logic.  This file's `sqlalchemy.url` below is a no-op
# placeholder; the real URL is set in env.py at runtime.
# =============================================================================

[alembic]
# Path to migration scripts (relative to this file).
script_location = migrations

# Use the migrations/ directory as the version-locator path.  Each
# revision is a Python file under migrations/versions/.
prepend_sys_path = .

# Timezone-aware migration timestamps.  ISO 8601 form so revision file
# names sort lexicographically by timestamp.
timezone = UTC

# Path separator: os-native is `os`; we pin to `os` for cross-platform
# consistency.
sourceless = false

# Placeholder URL — overridden at runtime by env.py reading env vars.
# Kept here so `alembic` CLI commands that need a URL (e.g. for offline
# mode) have a syntactically valid default to fall back on.
sqlalchemy.url = postgresql://placeholder:placeholder@localhost:5432/placeholder


# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
