operator:
  name: conditional_aggregate
  method_family: aggregation
  version: "1.0.0"
  description: >-
    Reduce a WindowedPanel to per-offset (aggregator_value,
    dispersion, n_observations, low_n) tuples.  Finance-blind;
    output units inherited from the panel's units.  Final operator
    of Phase 1A — closes the event-study skeleton.

defaults:
  aggregator:
    value: mean
    source: operator_v1_default
    rationale: >-
      Default 'mean': the canonical event-study central tendency.
      Switch to 'median' for fat-tailed inputs, 'std' for spread
      analysis, 'count' for sample-size diagnostics.
    valid_values: [mean, median, count, std]

  dispersion:
    value: std
    source: operator_v1_default
    rationale: >-
      Default 'std': dispersion is REPORTED alongside the central
      tendency by design — a conditional mean without dispersion is
      not a useful answer.  Pass 'none' to skip the dispersion
      calculation when the workflow has decided dispersion is
      irrelevant; lineage records the choice.
    valid_values: [none, std]

  min_n:
    value: 5
    source: operator_v1_default
    rationale: >-
      Default 5: per-offset effective N below this triggers the
      ``low_n`` flag on that offset's row.  The operator does NOT
      suppress the value; the caller / template / UI decides how
      to surface low-N evidence.  5 is conservative — even a tiny
      event study should clear it; pin tighter (e.g., 30) at the
      workflow-template level for fragile inferences.

  ddof:
    value: 1
    source: operator_v1_default
    rationale: >-
      Default 1: sample standard deviation (Bessel's correction).
      Matches numpy's default for ``np.nanstd`` post-pandas-default
      and the convention used elsewhere in shared.analytics
      (e.g., zscore_custom, rolling_zscore in stats.py).  Pass 0
      for population std when N covers the full universe by design.

methodology:
  what_it_does: >-
    For each offset (column) in the WindowedPanel, computes the
    aggregator across events using NaN-aware reductions
    (np.nanmean / np.nanmedian / np.nanstd; for 'count', the count
    of finite cells).  The dispersion estimate is reported
    alongside the central tendency at every offset (or NaN when
    dispersion='none').  A per-offset ``low_n`` flag is set when
    the count of finite cells at that offset is below ``min_n``.
    Output is an EventResponseSeries — a typed terminal artifact
    indexed by the panel's integer event-relative offsets.  Units
    inherited from the panel.  Lineage chains the panel's chain
    plus this operator step.
  planned_extensions:
    - "aggregator ∈ {sum, min, max, quantile}"
    - "dispersion ∈ {iqr, mad, bootstrap_ci}"
    - "overlap-de-weighted aggregation (uses overlap_pairs from event_windows)"
    - "MaskedSeries input overload (Q2 regime-conditioned masking)"
