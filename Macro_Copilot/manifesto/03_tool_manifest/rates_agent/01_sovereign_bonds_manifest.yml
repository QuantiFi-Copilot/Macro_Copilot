# =============================================================================
# Sovereign Bonds — tool manifest
# =============================================================================
# Canonical source of truth for the sovereign-bonds tool catalogue.
# Read by the Library page UI.  Each entry must mirror what's actually
# registered in `rates_agent/sovereign_bonds/mcp_server.py` and what
# lives under `rates_agent/sovereign_bonds/tools/<tool>/`.  Adding a
# new tool = (1) implementation under tools/, (2) MCP registration,
# (3) entry here.  The library is rendered from this YAML — no
# hardcoding tool-by-tool in the frontend.
#
# Bucket convention:
#   1A  — strict deterministic arithmetic on stored market data; no
#         user-facing model inference; conventions YAML-locked.
#   1B  — statistical model fits (rolling OLS, PCA, OU/AR(1)) where
#         the user picks a window or factor count but the solver +
#         conventions are YAML-locked; bit-stable on same input.
#   2   — open-ended / scenario-generating / model-state tools.
#         (Not yet shipped.)
# =============================================================================

tools:
  # ---------------------------------------------------------------------------
  # SINGLE-INSTRUMENT LEVELS
  # ---------------------------------------------------------------------------

  - name: get_yield_levels
    domain: rates
    sub_agent: sovereign_bonds
    bucket: 1A
    category: snapshots
    status: built

    implementation:
      mcp_server: rates_agent/sovereign_bonds/mcp_server.py
      tool_function: get_yield_levels_tool
      schema: rates_agent/sovereign_bonds/tools/yield_levels/schemas.py::YieldLevelInput
      compute: rates_agent/sovereign_bonds/tools/yield_levels/compute.py::get_yield_levels
      config: rates_agent/sovereign_bonds/tools/yield_levels/config.yaml

    one_liner: >-
      Single-tenor sovereign yield snapshot — current yield, daily / weekly /
      monthly change in bps, rolling 252-day z-score, trailing 252-day
      high / low / percentile, observation count, and full chartable
      time series.

    bucket_rationale: >-
      Deterministic rolling z-score over stored daily yields.  Fixed
      252-day window; conventions are YAML-locked; no model inference
      and no LLM-facing override path in V1.

    pm_overridable: []

    related_tools:
      - calculate_curve_spread_tool
      - calculate_cross_market_spread_tool
      - calculate_butterfly_tool
      - scan_extremes_tool

    workflows:
      - yield_snapshot_card
      - sovereign_yield_workspace
      - sovereign_prompt_gauntlet

    references: []

    built_date: 2026-05-01
    validation_status: >-
      Not validated yet

  - name: get_otr_history
    domain: rates
    sub_agent: sovereign_bonds
    bucket: 1A
    category: snapshots
    status: built

    implementation:
      mcp_server: rates_agent/sovereign_bonds/mcp_server.py
      tool_function: get_otr_history_tool
      schema: rates_agent/sovereign_bonds/tools/get_otr_history/schemas.py::OtrHistoryInput
      compute: rates_agent/sovereign_bonds/tools/get_otr_history/compute.py::get_otr_history
      config: rates_agent/sovereign_bonds/tools/get_otr_history/config.yaml

    one_liner: >-
      On-the-run transition log for one (country, tenor) sovereign cash-bond
      slot — current OTR snapshot (CUSIP, ISIN, vendor_ticker, maturity_date,
      effective_from of the open window) plus the chronological list of OTR
      transitions intersecting the lookback window.  Pure-INGEST read of
      macro_data.otr_history (ADR 0003), forward-only per ADR 0007 / TD #27.

    bucket_rationale: >-
      Deterministic read-only monitor of the macro_data.otr_history SCD2
      table.  No arithmetic over market_data_daily; no recomputation of
      anything Bloomberg already provides (P12).  Categorical / list-shape
      output — NOT bridge-composable into workflow Series / Panel artifacts
      in V1 (matches the curve_move_classifier precedent); intentionally
      omitted from rates_agent/workflows/__init__.py.

    pm_overridable: []

    related_tools:
      - get_yield_levels_tool
      - calculate_curve_spread_tool
      - calculate_cross_market_spread_tool

    workflows: []

    references:
      - docs_revamped/05_decisions/0003-cash-bond-substrate.md
      - docs_revamped/05_decisions/0005-cash-bond-playbook-universe.md
      - docs_revamped/05_decisions/0007-otr-resolver.md
      - docs/technical_debt.md  # TD #27 — forward-only + detection-date

    built_date: 2026-05-24
    validation_status: >-
      Offline tests (compute + wiring + parity-driver) green.  SQL-validation
      runner ships in tests/test_get_otr_history_sql_validation.py and runs
      against the live macro_data.otr_history table; parity fixture capture
      script ships in tests/fixtures/get_otr_history_v1/_capture.py.  Both
      require the resolver to have populated otr_history before they can
      validate (TD #27a — forward-only) and are run against the live DB by
      the project operator.

  - name: calculate_otr_ofr_spread
    domain: rates
    sub_agent: sovereign_bonds
    bucket: 1A
    category: curve_shape
    status: built

    implementation:
      mcp_server: rates_agent/sovereign_bonds/mcp_server.py
      tool_function: calculate_otr_ofr_spread_tool
      schema: rates_agent/sovereign_bonds/tools/otr_ofr_spread/schemas.py::OtrOfrSpreadInput
      compute: rates_agent/sovereign_bonds/tools/otr_ofr_spread/compute.py::calculate_otr_ofr_spread
      config: rates_agent/sovereign_bonds/tools/otr_ofr_spread/config.yaml

    one_liner: >-
      Basis-point yield spread between the on-the-run (OTR) bond and the
      first-off-the-run (OFR) bond for one (country, tenor) sovereign
      cash-bond slot — the desk-standard rich-cheap / liquidity-premium
      signal — plus its 252-trading-day rolling z-score and full
      chartable time series.  Resolves OTR/OFR per trade-date from
      macro_data.otr_history (ADR 0003) and pulls per-bond YLD_YTM_MID
      from macro_data.market_data_daily; no Bloomberg-computed quantity
      is recomputed (P12).

    bucket_rationale: >-
      Strict deterministic arithmetic on stored daily cash-bond yields,
      with the OTR/OFR pair resolution sourced from the otr_history
      SCD2 substrate (ADR 0007's resolver).  The methodology lives in
      config.yaml; deterministic mode exposes no LLM-facing override
      path for it.  No model inference, no scenario generation.
      Categorical convention (ofr_definition) wire-frozen at the
      compute layer until methodology.planned_extensions widens it.

    pm_overridable: []

    related_tools:
      - get_otr_history_tool
      - calculate_curve_spread_tool
      - get_yield_levels_tool

    workflows: []

    references:
      - docs_revamped/05_decisions/0003-cash-bond-substrate.md
      - docs_revamped/05_decisions/0005-cash-bond-playbook-universe.md
      - docs_revamped/05_decisions/0007-otr-resolver.md
      - docs/technical_debt.md  # TD #27 — forward-only + detection-date

    built_date: 2026-05-24
    validation_status: >-
      Offline tests (compute + wiring + parity-driver) green.  SQL-validation
      runner ships in tests/test_otr_ofr_spread_sql_validation.py and runs
      against the live macro_data.otr_history + macro_data.market_data_daily
      stack; parity fixture capture script ships in
      tests/fixtures/otr_ofr_spread_v1/_capture.py.  Both require the
      resolver to have populated otr_history AND sovereign_cash_bonds.yml
      to have ingested per-CUSIP yields before they can validate (TD #27a
      — forward-only) and are run against the live DB by the project
      operator.

  # ---------------------------------------------------------------------------
  # ECONOMIC-RELEASE SURPRISES (front-end macro reads)
  # ---------------------------------------------------------------------------

  - name: calculate_nfp_surprise
    domain: rates
    sub_agent: sovereign_bonds
    bucket: 1A
    category: economic_release_surprises
    status: built

    implementation:
      mcp_server: rates_agent/sovereign_bonds/mcp_server.py
      tool_function: calculate_nfp_surprise_tool
      schema: rates_agent/sovereign_bonds/tools/nfp_surprise/schemas.py::NfpSurpriseInput
      compute: rates_agent/sovereign_bonds/tools/nfp_surprise/compute.py::calculate_nfp_surprise
      config: rates_agent/sovereign_bonds/tools/nfp_surprise/config.yaml

    one_liner: >-
      Per-release US nonfarm-payrolls (NFP) surprise series
      (actual − consensus_median, in THOUSANDS of jobs) plus a
      rolling z-score over a window of N RELEASES (NOT calendar
      days).  Surprise is computed at the primitive layer per
      ADR 0008 §2's P12 disclosure (event_calendar.surprise is
      intentionally NULL by ingestion; Bloomberg ECO screen
      reports the same number).  US-only, event_type=nfp — both
      country and event_type are YAML-locked, no LLM-facing
      instrument selector.  Lives under sovereign_bonds because
      NFP is the macro print most directly read into the
      2s/5s/10s front-end Treasury curve.

    bucket_rationale: >-
      Strict deterministic arithmetic on stored event_calendar rows.
      The methodology lives in config.yaml; deterministic mode
      exposes no LLM-facing override path for it.  No model
      inference, no scenario generation.  Categorical convention
      (surprise_formula) wire-frozen at the compute layer until
      methodology.planned_extensions widens it.

    pm_overridable: []

    related_tools:
      - calculate_cpi_surprise_tool
      - get_yield_levels_tool
      - calculate_curve_spread_tool

    workflows: []

    references:
      - docs_revamped/05_decisions/0004-event-calendar-substrate.md
      - docs_revamped/05_decisions/0008-event-playbook-contract.md
      - rates_agent/playbooks/economic_releases.yml
      - docs/technical_debt.md  # TD #28 — D-econ release-date window limit

    built_date: 2026-05-24
    validation_status: >-
      Offline tests (compute + wiring + parity-driver) green.
      Live-DB SQL validation green (single case: US — the only
      country for this US-only primitive).  Parity fixtures
      shipped at v1 land are live-DB captures
      (capture_method = live_db_v1) — strict PR15 compliance
      from day one (mirroring cpi_surprise's post-Codex-review
      approach).  One synthetic v1 edge-case fixture
      (empty_pre_extractor.json) pins the error-envelope shape
      that the live DB cannot reproduce now that the US slot has
      realised data.  Re-capture script ships at
      tests/fixtures/nfp_surprise_v1/_capture.py for when the
      event extractor's coverage advances (TD #28b history
      backfill).

