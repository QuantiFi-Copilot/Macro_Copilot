playbook_name: "fx_vol"
playbook_version: "5.0"
asset_class: "fx"
dataset_name: "fx_vol"
description: "Daily FX at-the-money (ATM) implied volatility. v2.0 G10 standard strip (6 pairs x 5 std tenors = 30). v3.0 added 11 EM/NDF currencies x 5 std tenors = 55 (total 85). v4.0 (Warehouse seeding 2026-05-25) added 6 more EM currencies x 5 std tenors = 30 (total 115). v5.0 (Warehouse seeding 2026-05-25) adds 5 EXTENDED tenors (VON / V2W / V2M / V9M / V2Y) across all 17 ATM-vol pairs that have liquid extended-tenor markets = 85 new rows. Total: 200 ATM vol instruments. Smile points (risk reversals, butterflies) live in a SEPARATE playbook fx_vol_smile.yml — the `smile_point: ATM` attribute on every row here makes the boundary clean. USDCNH and USDINR remain VOL-ONLY on the standard strip (NDF-currency vols, separated from spot-deliverable G10/EM). Tenor naming asymmetry: standard strip maps BBG V1Y -> internal '12M' (for cross-substrate join with fx_em_forwards '12M'); extended strip keeps BBG tenors verbatim (ON / 2W / 2M / 9M / 2Y) since no forwards equivalent exists for those tenors. SGD/TWD/THB/CLP/COP/PEN are NOT in the extended-tenor block — Phase 1 discovery showed extended-tenor coverage limited to the 17 majors."

extraction:
  start_date: "2000-01-01"
  incremental_window_days: 14

target_metrics:
  - metric_id: "atm_vol"
    bloomberg_field: "PX_LAST"

reference_metrics:
  - column_name: "security_name"
    bloomberg_field: "SECURITY_DES"

