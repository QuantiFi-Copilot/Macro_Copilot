# =============================================================================
# event_study — canonical conditional-vs-unconditional event-study template
# =============================================================================
# Per docs/architecture/workflow_architecture.md (lines 73–74), the
# ``event_study`` archetype is exactly:
#
#   threshold a signal → extract events → forward windows on a target
#   → conditional vs unconditional aggregate
#
# This template implements that full canonical shape: TWO parallel
# windowing-and-aggregation branches (conditional on event days,
# unconditional on every signal-defined day) joined by a final
# subtraction that emits the per-offset ABNORMAL forward move
# (``conditional_aggregate - unconditional_aggregate``).  The
# abnormal series is the canonical event-study deliverable — it
# answers "is the post-event move different from what you'd see on a
# random day".
#
# Proof question 1 (the canonical test prompt the architecture was
# chosen to prove):
#   "Over the last 5 years, when the 2Y OIS-Treasury spread WIDENS
#   by more than 1.5σ in a single day, what is the average 5-day
#   forward move in the 10Y UST yield, and how does it compare to
#   the unconditional 5-day forward move?"
#
# Single-day-widening signal semantics
# ------------------------------------
# The canonical Q1 binding uses
# ``calculate_swap_spread_tool.time_series_change_zscore`` — the
# rolling z-score of the day-over-day CHANGE in the swap spread
# (i.e. z-score of ``spread.diff()`` vs the trailing window).  A
# |z|>1.5 event on this series identifies "the spread WIDENED a lot
# today" — exactly the Q1 question shape.  Distinct from
# ``time_series_zscore``, which z-scores the spread LEVEL and would
# answer "the spread IS STRETCHED today" — a desk-meaningful but
# different event question.  Both fields co-exist on the swap_spread
# primitive's output so binding callers can pick the level-stretch
# OR the change-stretch event semantics explicitly (V1 1-template-
# per-archetype: variants ship as separate template instances when
# desk demand justifies a second slot binding).
#
# Slot binding for proof Q1 (single-day widening):
#   signal_tool_name: calculate_swap_spread_tool
#   signal_params:
#     sovereign_curve_family: UST
#     ois_curve_family: USD_SOFR_OIS
#     tenor: "2Y"
#     lookback_days: 1825
#   signal_output_field: time_series_change_zscore   # <-- canonical Q1
#   target_tool_name: get_yield_levels_tool
#   target_params:
#     curve_family: UST
#     tenor: "10Y"
#     lookback_days: 1825
#   target_output_field: time_series
#   threshold: 1.5
#   post_window: 5
#
# Index alignment (cross-calendar genericity)
# -------------------------------------------
# ``event_windows`` requires ``events.mask.index ==
# target.payload.index`` (operator-level invariant — see
# shared/operators/event_windows/operator.py).  This template's DAG
# ships with an EXPLICIT alignment branch — the signal and target
# Series feed into ``align`` (align_series with join_policy=inner)
# BEFORE the threshold_events / event_windows branches consume them,
# and ``signal_aligned`` / ``target_aligned`` (select_from_series_set)
# extract each member from the resulting SeriesSet onto a common
# DatetimeIndex.  This closes the cross-calendar genericity gap
# Codex P2 surfaced on PR #86: the SAME event_study template runs
# unchanged across instrument families with different trading-day
# calendars (e.g. UK gilts target with US-calendar OIS signal —
# different holiday sets).
#
# Template-controlled SeriesSet keys (Codex P2 follow-up to PR #87)
# ----------------------------------------------------------------
# The ``align`` node sets ``output_keys: ["signal", "target"]`` so
# the SeriesSet's per-key dicts use those template-controlled names
# instead of each input primitive's bridge-derived series_key (which
# would be a wire-naming detail like
# ``ust_usd_sofr_ois_2y_swap_spread_change_zscore``).  The two
# ``select_from_series_set`` nodes downstream then reference the
# literal strings ``"signal"`` and ``"target"`` directly — NO slot
# is exposed to template callers for this wiring detail.  The
# workflow-architecture contract's "templates expose only central
# analysis knobs, not wiring internals" discipline is preserved.
#
# Same-calendar bindings (the canonical case) are unaffected by the
# alignment step: align_series's inner-join produces the identical
# index when both inputs already share it.  The lineage records
# that alignment ran (and any rename), so cross-instrument
# workflows are honest about their alignment provenance.
#
# require_matching_missingness=false is set on the align node
# explicitly so cross-instrument bindings whose primitives carry
# different missingness policies (e.g. UST has a different
# clean_single_series fill_limit than UK_GILT) are accepted; the
# choice is recorded in the alignment step's lineage so a
# downstream consumer sees that mixed policies were resolved.
#
# Topology-locked methodology (NOT exposed as slots):
#   - threshold_events.rule = abs_above (canonical event-study extraction)
#   - threshold_events.threshold_basis = raw_value (signal already z-scored)
#   - event_windows.pre_window = 0 (forward-only windows)
#   - event_windows.inclusive_event_day = true
#   - event_windows.units_basis = level_change (cells = event-relative
#     forward MOVES, not raw target levels — a PERCENT target becomes
#     BPS via the operator's methodology-driven PERCENT→BPS transition)
#   - conditional_aggregate.aggregator = mean (canonical event-study stat)
#   - conditional_aggregate.dispersion = std (per the conditional_aggregate
#     architectural requirement to always report dispersion alongside
#     the central tendency)
#   - unconditional branch uses the SAME signal series with a sentinel
#     ``rule=above, threshold=-1e18`` to mark every signal-defined day
#     as an "event" — this is the V1 mechanism for the unconditional
#     baseline; a future ``constant_mask`` operator would replace the
#     sentinel.
#
# Variants of this archetype (different aggregators / windows / threshold
# rules) ship as separate templates per the V1 1-template-per-archetype
# discipline declared in workflow_architecture.md.

template_id: event_study
archetype: event_study
description: >-
  Canonical event-study workflow: threshold a signal series, extract
  events, forward-window a target series at each event, aggregate the
  conditional and unconditional event-relative moves in parallel, and
  emit the per-offset abnormal (conditional minus unconditional) Series
  with std dispersion recorded in the conditional branch's lineage.

# Structural cues the future ``route_to_template`` LLM step matches
# against prompts.  Per workflow_architecture.md:
#   "Each template carries an archetype_signature declaration: which
#    structural cues in a prompt indicate this template (e.g.
#    event_study requires 'conditional aggregation across event
#    windows')"
# Multiple cues = OR pattern; LLM router picks the best-matching template.
archetype_signature:
  - "average move after / forward move when X exceeds Y"
  - "conditional aggregation across event windows"
  - "what happens to Y when X crosses a threshold"
  - "event study around X moves of more than N sigma"
  - "abnormal forward move relative to unconditional baseline"

slot_schema:

  # -------------------------------------------------------------------------
  # Signal series — the series whose extreme moves trigger events.
  # -------------------------------------------------------------------------

  - name: signal_tool_name
    type: str
    required: true
    description: >-
      MCP tool name of the primitive that emits the signal series
      (e.g. calculate_swap_spread_tool, calculate_curve_spread_tool).
      The primitive must emit a TimeSeries whose units make the chosen
      threshold scale meaningful — Z_SCORE units paired with
      threshold_basis=raw_value (the template-locked default) gives the
      canonical "|z| > N" event extraction.

  - name: signal_params
    type: dict
    required: true
    description: >-
      Complete *Input dict for the signal primitive (e.g.
      {sovereign_curve_family: UST, ois_curve_family: USD_SOFR_OIS,
      tenor: '2Y', lookback_days: 1825} for swap_spread).  Caller
      assembles the dict shape; the primitive's *Input Pydantic
      validator catches any field-level errors at execution time.

  - name: signal_output_field
    type: str
    required: true
    description: >-
      Which time_series* field of the signal primitive's output to
      lift as the event signal.  Two canonical event-shape bindings
      ship today:
        - ``time_series_change_zscore`` — z-score of the day-over-day
          CHANGE (e.g. swap_spread daily widening).  Canonical signal
          for "WIDENED by more than Nσ today" event-study questions
          (rates-agent proof Q1).  Currently emitted ONLY by
          ``calculate_swap_spread_tool``; other spread primitives
          (curve_spread, cross_market_spread) ship the level z-score
          today (Codex P3 follow-up to PR #86 — adding change_zscore
          to those primitives is per-primitive follow-up work, not a
          template-side guarantee).
        - ``time_series_zscore`` — z-score of the LEVEL.  Emitted by
          every spread primitive (swap_spread, curve_spread,
          cross_market_spread) and by the OIS forward_rate primitive.
          Canonical signal for "spread IS STRETCHED today" event
          questions (a different event semantic).
      The binding caller picks which event semantics they want
      explicitly.

  # -------------------------------------------------------------------------
  # Target series — the series whose forward moves get aggregated around
  # each event.
  # -------------------------------------------------------------------------

  - name: target_tool_name
    type: str
    required: true
    description: >-
      MCP tool name of the primitive that emits the target series (e.g.
      get_yield_levels_tool, calculate_swap_spread_tool,
      calculate_ois_forward_rate_tool).  Must emit a TimeSeries that
      overlaps the signal series' date range.

  - name: target_params
    type: dict
    required: true
    description: >-
      Complete *Input dict for the target primitive.  The lookback_days
      should typically be ≥ signal lookback_days + post_window so the
      forward windows around late events have data to aggregate.

  - name: target_output_field
    type: str
    required: true
    description: >-
      Which time_series* field of the target primitive's output to lift
      (e.g. time_series for yield_levels, time_series_spread for a
      curve_spread, time_series_forward for the OIS forward-rate
      primitive).

  # -------------------------------------------------------------------------
  # Analysis knobs.
  # -------------------------------------------------------------------------

  - name: threshold
    type: float
    required: true
    description: >-
      Absolute-value threshold applied to the signal series (with the
      template-locked threshold_basis=raw_value, paired with rule=
      abs_above).  For Z_SCORE-typed signals, this is the |z| boundary
      — e.g. 1.5 means "events when |z| > 1.5".

  - name: post_window
    type: int
    required: false
    default: 5
    description: >-
      Trading-day count for the forward window after each event.  The
      pre_window is template-locked to 0 (event studies are about
      forward moves; backward inspection is a separate archetype).
      Default 5 = one calendar week of forward moves.

# DAG topology — locked.  Slots fill node params; topology is fixed.
#
# 12-node DAG.  ``align`` + ``signal_aligned`` + ``target_aligned``
# is the cross-calendar genericity layer added in this revision
# (Codex P2 follow-up).  Conditional + unconditional branches join
# at the terminal ``compare``:
#
#   signal ──┐
#            ├─ align ─┬─ signal_aligned ─┬─ events ────────> windows ──────> aggregate ──┐
#   target ──┘         │                  │                     ▲                          │
#                      │                  └─ uncond_events ──> uncond_windows ─> u_agg ──> ├─ compare (terminal)
#                      │                                        ▲                          │
#                      └─ target_aligned ───────────────────────┴──────────────────────────┘
#
# ``compare`` = series_arithmetic(op=subtract, left=aggregate,
#               right=unconditional_aggregate) → abnormal forward move.
nodes:

  - kind: primitive
    node_id: signal
    tool_name: {$slot: signal_tool_name}
    output_field: {$slot: signal_output_field}
    params: {$slot: signal_params}

  - kind: primitive
    node_id: target
    tool_name: {$slot: target_tool_name}
    output_field: {$slot: target_output_field}
    params: {$slot: target_params}

  # ---- Cross-calendar alignment branch (Codex P2 follow-up) ----
  #
  # Aligns signal + target onto a common DatetimeIndex BEFORE the
  # conditional / unconditional branches consume them.  Closes the
  # cross-calendar genericity gap: the SAME event_study template
  # now runs unchanged across instrument families with different
  # trading-day grids (e.g. UK gilts target with US-calendar OIS
  # signal — different holiday sets).  For the canonical same-
  # calendar bindings the inner-join is a no-op (both inputs
  # already share the index).

  - kind: operator
    node_id: align
    operator_name: align_series
    params:
      join_policy: inner                 # template-locked: only dates with both inputs
      fill_policy: raw                   # template-locked: no imputation
      require_matching_frequency: true   # template-locked: enforce frequency parity
      # require_matching_missingness=false explicitly so cross-
      # instrument bindings whose primitives carry different
      # missingness policies (e.g. UST vs UK_GILT differ on
      # ffill_limit) are accepted; the choice is recorded in
      # the alignment step's lineage so a downstream consumer
      # sees the resolution honestly.
      require_matching_missingness: false
      # Template-controlled SeriesSet member names.  Without this
      # rename, downstream select_from_series_set nodes would have
      # to know each primitive's bridge-derived series_key (a wire-
      # naming detail), which would force the template to expose
      # ``signal_series_key`` / ``target_series_key`` slots —
      # leaking implementation detail into the slot surface.  Codex
      # P2 follow-up to PR #87.
      output_keys: [signal, target]

  - kind: operator
    node_id: signal_aligned
    operator_name: select_from_series_set
    params:
      series_key: signal               # template-locked: matches align.output_keys[0]

  - kind: operator
    node_id: target_aligned
    operator_name: select_from_series_set
    params:
      series_key: target               # template-locked: matches align.output_keys[1]

  # ---- Conditional branch ----

  - kind: operator
    node_id: events
    operator_name: threshold_events
    params:
      rule: abs_above              # template-locked
      threshold: {$slot: threshold}
      threshold_basis: raw_value   # template-locked
      look_ahead_safe: true        # event-study hygiene: t-1 stats only

  - kind: operator
    node_id: windows
    operator_name: event_windows
    params:
      pre_window: 0                # template-locked: event studies are forward-looking
      post_window: {$slot: post_window}
      inclusive_event_day: true    # template-locked
      units_basis: level_change    # template-locked: cells = event-relative
                                   # forward moves, not raw levels
                                   # (PERCENT target → BPS via the operator's
                                   # methodology-owned PERCENT→BPS transition)

  - kind: operator
    node_id: aggregate
    operator_name: conditional_aggregate
    params:
      aggregator: mean             # template-locked: canonical event-study stat
      dispersion: std              # template-locked: always report dispersion

  # ---- Unconditional branch ----
  #
  # The unconditional baseline answers "what's the average forward move
  # on ANY signal-defined day, not just event days?".  V1 mechanism:
  # threshold the signal with a sentinel rule that catches every
  # finite observation, then run the same windows + aggregate chain
  # on the same target.  The final ``compare`` node subtracts the
  # unconditional baseline from the conditional aggregate.

  - kind: operator
    node_id: unconditional_events
    operator_name: threshold_events
    params:
      rule: above                  # template-locked: catches every finite signal value
      threshold: -1.0e+18          # template-locked sentinel: every finite signal
                                   # value is > -1e18 (deferred V2: a proper
                                   # ``constant_mask`` operator would replace this)
      threshold_basis: raw_value   # template-locked
      look_ahead_safe: true        # template-locked: same hygiene as conditional

  - kind: operator
    node_id: unconditional_windows
    operator_name: event_windows
    params:
      pre_window: 0                # template-locked: parity with conditional branch
      post_window: {$slot: post_window}
      inclusive_event_day: true    # template-locked
      units_basis: level_change    # template-locked: parity with conditional
                                   # branch (must match for series_arithmetic
                                   # subtract to be unit-coherent)

  - kind: operator
    node_id: unconditional_aggregate
    operator_name: conditional_aggregate
    params:
      aggregator: mean             # template-locked: parity with conditional
      dispersion: std              # template-locked: parity with conditional

  # ---- Comparison ----

  - kind: operator
    node_id: compare
    operator_name: series_arithmetic
    params:
      op: subtract                 # template-locked: abnormal = conditional - unconditional

  # ---- Present the abnormal move in basis points (F1 extraction) ----
  #
  # event_windows is finance-blind (ADR 0016 Decision 4): its
  # level_change output PRESERVES the target's unit (PERCENT for a yield
  # target), so the abnormal-move series above is in the target's unit.
  # A rates desk reads forward moves in basis points, so this template
  # converts the terminal explicitly via the sole conversion operator —
  # convert_units(PERCENT→BPS) is ×100; for a BPS target it is identity.
  - kind: operator
    node_id: convert
    operator_name: convert_units
    params:
      target_units: bps            # template-locked: present moves in basis points

edges:

  # ---- Cross-calendar alignment branch (Codex P2 follow-up) ----
  # signal + target → align_series → SeriesSet
  - source_node_id: signal
    target_node_id: align
    target_input_slot: series_list

  - source_node_id: target
    target_node_id: align
    target_input_slot: series_list

  # SeriesSet → per-key Series via select_from_series_set
  - source_node_id: align
    target_node_id: signal_aligned
    target_input_slot: series_set

  - source_node_id: align
    target_node_id: target_aligned
    target_input_slot: series_set

  # ---- Conditional branch (consumes ALIGNED inputs) ----
  - source_node_id: signal_aligned
    target_node_id: events
    target_input_slot: series

  - source_node_id: events
    target_node_id: windows
    target_input_slot: events

  - source_node_id: target_aligned
    target_node_id: windows
    target_input_slot: target

  - source_node_id: windows
    target_node_id: aggregate
    target_input_slot: panel

  # ---- Unconditional branch (consumes ALIGNED inputs) ----
  - source_node_id: signal_aligned
    target_node_id: unconditional_events
    target_input_slot: series

  - source_node_id: unconditional_events
    target_node_id: unconditional_windows
    target_input_slot: events

  - source_node_id: target_aligned
    target_node_id: unconditional_windows
    target_input_slot: target

  - source_node_id: unconditional_windows
    target_node_id: unconditional_aggregate
    target_input_slot: panel

  # ---- Comparison ----
  - source_node_id: aggregate
    target_node_id: compare
    target_input_slot: left

  - source_node_id: unconditional_aggregate
    target_node_id: compare
    target_input_slot: right

  # ---- Present in basis points (F1 extraction) ----
  - source_node_id: compare
    target_node_id: convert
    target_input_slot: series

literal_bindings: []

terminal_node_id: convert
