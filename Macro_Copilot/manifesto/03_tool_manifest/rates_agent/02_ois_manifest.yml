# =============================================================================
# OIS (overnight-index swaps) — tool manifest
# =============================================================================
# Canonical source of truth for the OIS sub-agent's tool catalogue.
# Read by the Library page UI alongside 01_sovereign_bonds_manifest.yml.
# Each entry must mirror what's actually registered in
# `rates_agent/ois/mcp_server.py` and what lives under
# `rates_agent/ois/tools/<tool>/`.
#
# Same bucket convention as the sovereign manifest:
#   1A  — strict deterministic arithmetic on stored OIS rates; no
#         user-facing model inference; conventions YAML-locked.
#   1B  — statistical model fits on OIS data (none yet in this file).
#   2   — open-ended / scenario-generating tools (none yet).
#
# `swap_spread` is structurally cross-domain (sovereign − OIS) but
# lives in the OIS sub-agent because it requires knowledge of OIS
# conventions (par-rate field name, tenor matching).  Surfaced here
# rather than duplicated.
# =============================================================================

tools:
  # ---------------------------------------------------------------------------
  # SINGLE-TENOR OIS LEVELS
  # ---------------------------------------------------------------------------

  - name: calculate_ois_rate_level
    domain: rates
    sub_agent: ois
    bucket: 1A
    category: snapshots
    status: built

    implementation:
      mcp_server: rates_agent/ois/mcp_server.py
      tool_function: calculate_ois_rate_level_tool
      schema: rates_agent/ois/tools/rate_level/schemas.py::OISRateLevelInput
      compute: rates_agent/ois/tools/rate_level/compute.py::get_ois_rate_level
      config: rates_agent/ois/tools/rate_level/config.yaml

    one_liner: >-
      Single-tenor OIS par-swap-rate snapshot — current rate, daily /
      weekly / monthly change, rolling 252-day z-score, trailing
      252-day high / low / percentile, plus full chartable time
      series.  OIS analogue of get_yield_levels.

    bucket_rationale: >-
      Deterministic rolling z-score over stored daily OIS par rates.
      Fixed 252-day window; conventions YAML-locked; no model
      inference and no LLM-facing override path in V1.

    pm_overridable: []

    related_tools:
      - calculate_ois_curve_spread_tool
      - calculate_ois_cross_market_spread_tool
      - calculate_ois_forward_rate_tool
      - get_yield_levels_tool

    workflows:
      - ois_snapshot_card
      - ois_yield_workspace
      - ois_prompt_gauntlet

    references: []

    built_date: 2026-05-01
    validation_status: >-
      Not validated yet

