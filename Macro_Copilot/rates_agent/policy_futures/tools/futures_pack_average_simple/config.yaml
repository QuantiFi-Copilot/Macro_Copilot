# =============================================================================
# policy_futures.get_futures_pack_average_simple_tool — tool configuration
# =============================================================================
# Pack-average implied rate for ONE policy-futures curve_family —
# arithmetic mean implied rate across the WHITES (strip positions 1-4)
# or the REDS (strip positions 5-8). The desk-recognised "pack" object
# is the canonical morning-call shorthand for the front year (whites)
# and second year (reds) of the STIR strip; this primitive owns that
# concept on the implied-rate axis.
#
# V1 pack-average primitive (per ADR 0011 — `policy_futures` ships
# strip-position-keyed monitors). The output card disclosure makes the
# scope-limited reading explicit (P5):
#
#   "Rolling-generic strip pack average (arithmetic mean of the four
#    implied rates on positions 1-4 for whites or 5-8 for reds) — NOT
#    a duration-weighted average; NOT a meeting-by-meeting policy-path
#    decomposition; NOT a CTD-of-futures-of-OIS read."
#
# ADR 0011 V1 scope (HARD): SOFR_FUT and SONIA_FUT pack averages build
# cleanly (quarterly serial strips with uniform delivery-month type).
# EUR_SHORT_RATE_FUT is REFUSED at compute time with the controlled
# PR11 NotImplementedError pattern (Euribor strip mixes serial and
# quarterly contracts and the playbook does not yet carry the
# `delivery_month_type` metadata needed to honestly average across
# heterogeneous delivery cadences). See methodology.planned_extensions
# below for the unblock path.
#
# In V1 deterministic mode there is NO LLM-facing override path for
# conventions. The LLM cannot ask for non-standard windows / pack
# definitions. The implied-rate conversion rule (raw_price →
# implied_rate_pct, per leg) is driven OFF METADATA (the per-strip
# `instrument_master.attributes->>'inverse_pricing'` flag read via
# fetch_strip_position_reference) — NOT off a hardcoded list in
# compute.py. Same convention pattern the sibling
# futures_price_level / futures_calendar_spread /
# futures_butterfly_simple tools use; the pack-average re-uses the
# conversion path verbatim. All four legs of the requested pack must
# agree on the flag; a mixed-flag pack is refused with the
# controlled-error envelope.
# =============================================================================

tool:
  name: policy_futures_get_futures_pack_average_simple_tool
  domain: policy_futures
  description: |
    Pack-average implied rate (arithmetic mean) for ONE policy-futures
    curve_family across either the WHITES (strip positions 1-4) or
    the REDS (strip positions 5-8). Emits a ``current_metrics``
    snapshot for the latest aligned bar:

      - ``pack_average_implied_rate_pct``: the desk-recognised pack
        average in PERCENT, computed as the arithmetic mean of the
        four per-leg implied rates on the aligned (intersection)
        trading-day series, where each per-leg implied rate is
        derived from the leg's raw_price via the per-strip
        ``inverse_pricing`` flag.

      - per-leg ``implied_rate_pct_position_N`` (one per pack member)
        — the latest implied rate on each of the four legs in
        PERCENT.

      - 1-day raw-subtraction change in the pack average (NOT bps
        multiplication).

      - rolling 252-day z-score of the PACK AVERAGE series.

      - trailing 252-day high / low / mid range on the pack-average
        series.

      - percentile rank of the current pack average within the
        trailing 252-day range (0-100).

      - the as_of-bounded SCD2 per-leg disclosure block
        (``contract_code_position_N``,
        ``underlying_contract_code_position_N``,
        ``security_name_position_N``, ``expiry_date_position_N``)
        plus the ``inverse_priced`` flag and ``short_rate_regime``
        label.

      - ``time_series``: per-row ``{date,
        pack_average_implied_rate_pct, z_score}`` history over the
        displayed window (bespoke list shape mirroring the sibling
        butterfly tool's frontend-friendly export).

      - ``time_series_pack_average`` + ``time_series_zscore``:
        canonical ``shared.schemas.TimeSeries`` with closed-enum
        ``TimeSeriesUnits.PERCENT`` (pack-average) and
        ``TimeSeriesUnits.Z_SCORE`` (z-score). Values match the
        bespoke ``time_series`` row-for-row.

conventions:

  # ---------------------------------------------------------------------------
  # Pack-definition convention — strip positions covered by WHITES /
  # REDS. STRICT STIR-desk convention; YAML-locked (NOT an LLM input).
  # ---------------------------------------------------------------------------
  # The CSV-encoded list of strip positions for each pack is the
  # canonical STIR-desk definition (whites = front year = positions
  # 1-4; reds = second year = positions 5-8). compute() parses each
  # CSV into an ordered tuple of positive integers at load time.
  # Stored as a CSV of integers because ``Convention.value`` is
  # scalar (str / int / float). Mirrors the CSV-encoded
  # ``short_rate_regime_map`` pattern the siblings use. Changing
  # these requires an ADR — they define what "whites" / "reds"
  # MEAN on the desk and are not configurable per query.
  whites_strip_positions:
    value: "1,2,3,4"
    source: team_judgment_pending_review
    rationale: >-
      Whites = front year of the STIR strip — strip positions 1-4
      (e.g. SFR1..SFR4 for SOFR_FUT). Canonical STIR-desk convention;
      the morning-call "whites average" reading IS the arithmetic
      mean of the implied rates on these four legs. Stored as a CSV
      of positive integers because ``Convention.value`` is scalar;
      compute parses it into an ordered tuple at load time. A future
      desk wanting a different pack composition (e.g. 6-pack /
      bundles) would land as a separate primitive — this one owns
      the standard whites / reds definitions only.

  reds_strip_positions:
    value: "5,6,7,8"
    source: team_judgment_pending_review
    rationale: >-
      Reds = second year of the STIR strip — strip positions 5-8
      (e.g. SFR5..SFR8 for SOFR_FUT). Canonical STIR-desk
      convention; the morning-call "reds average" reading IS the
      arithmetic mean of the implied rates on these four legs.

  # ---------------------------------------------------------------------------
  # Z-score window length (trading days) — applied to the PACK
  # AVERAGE series (not the per-leg series; the z lives on the pack
  # axis where the desk reads it).
  # ---------------------------------------------------------------------------
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading-day count for a 1-year rolling window. Same convention
      as the sibling futures_price_level / volume_open_interest_snapshot
      / futures_calendar_spread / futures_butterfly_simple /
      futures_cross_market_spread / futures_strip_snapshot so cross-
      tool z-score reads are comparable across the policy_futures
      domain. Disclosed verbatim on every methodology card per
      P5 + ADR 0011.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Minimum observations before the rolling stat is emitted
  # ---------------------------------------------------------------------------
  z_score_min_periods:
    value: 60
    source: team_judgment_pending_review
    rationale: >-
      ~3 months of observations before the rolling mean / std are
      deemed trustworthy. Matches every other policy_futures monitor.
    valid_range: [20, 252]

  # ---------------------------------------------------------------------------
  # Standard deviation degrees of freedom
  # ---------------------------------------------------------------------------
  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Sample standard deviation (Bessel-corrected, ddof=1). Matches
      pandas' default and every other rates tool in this codebase.

  # ---------------------------------------------------------------------------
  # Calendar-day buffer for the fetch window
  # ---------------------------------------------------------------------------
  z_score_buffer_multiplier:
    value: 1.5
    source: derived_from_window
    rationale: >-
      Calendar-day buffer added to the fetch window so the rolling
      z-score is fully populated from the first displayed trading
      day. 1.5x trading-day window covers weekends + holidays.
      Matches every other rates level primitive in this codebase.
    valid_range: [1.2, 2.0]

  # ---------------------------------------------------------------------------
  # Daily-change offset (in trading-day rows after ffill + alignment)
  # ---------------------------------------------------------------------------
  daily_change_offset_rows:
    value: 2
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-2] = 1 trading day back on the aligned pack-
      average series. Matches the daily-change convention used by
      every rates level primitive.
    valid_range: [2, 5]

  # ---------------------------------------------------------------------------
  # Trailing range / percentile window — LOCKED at 252 in V1
  # ---------------------------------------------------------------------------
  # The output schema's field names
  # (high_252d_pack_average_implied_rate_pct,
  # low_252d_pack_average_implied_rate_pct,
  # mid_252d_pack_average_implied_rate_pct, percentile_252d) are
  # wire-frozen and embed the 252 number. compute() raises
  # NotImplementedError if this is set to anything other than 252;
  # see methodology.planned_extensions for the path to making it
  # configurable. Mirrors the same guard in
  # futures_butterfly_simple / futures_calendar_spread /
  # futures_cross_market_spread.
  trailing_range_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      1Y trailing for high / low / mid / percentile on the pack-
      average series. Locked at 252 in V1 because the wire field
      names embed the number. Mirrors the same wire-freeze in the
      sibling policy_futures tools.

  # ---------------------------------------------------------------------------
  # Forward-fill limit for missing observations on each leg
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Bridge up to one trading week of missing data across holiday
      gaps on each leg's series. Same as every other rates level
      primitive in this codebase. Applied independently to each
      leg's series before the intersection-alignment step.
    valid_range: [1, 10]

  # ---------------------------------------------------------------------------
  # Default Bloomberg observation field
  # ---------------------------------------------------------------------------
  default_price_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: >-
      Last-traded price is the canonical front-month price
      observation. Maps onto the playbook's ``last_price`` metric
      (bloomberg_field PX_LAST). LLM/HTTP wrappers MUST use the
      empty-string / None sentinel so this default flows through —
      same shadowing-fix pattern as sovereign curve_move_classifier
      (commit b2605ee) / yield_levels / futures_price_level.

  # ---------------------------------------------------------------------------
  # Short-rate regime map per curve_family — methodology disclosure (P5)
  # ---------------------------------------------------------------------------
  # RFR = compounded risk-free rate (SOFR daily compounding for
  # SOFR_FUT; SONIA daily compounding for SONIA_FUT). IBOR = unsecured
  # term IBOR (3M Euribor for EUR_SHORT_RATE_FUT). The regime label is
  # carried on the methodology disclosure string so a desk reader
  # knows the underlying rate object behind the pack average. NOT a
  # load-bearing computation choice — but P5 (honest disclosure)
  # requires it on every response. Mirrors the sibling
  # futures_butterfly_simple / futures_calendar_spread entries
  # verbatim. Note: this primitive REFUSES EUR_SHORT_RATE_FUT at
  # compute time per ADR 0011 V1 scope (see methodology.planned_extensions
  # for the unblock path); the regime label is still surfaced on the
  # refusal envelope for disclosure consistency.
  short_rate_regime_map:
    value: "SOFR_FUT=RFR,SONIA_FUT=RFR,EUR_SHORT_RATE_FUT=IBOR"
    source: team_judgment_pending_review
    rationale: >-
      Disclosure-only mapping (P5 — does NOT alter computation). RFR
      vs IBOR labels the underlying short-rate object so a desk
      reader knows what the implied rate means: a compounded daily
      RFR (SOFR / SONIA) vs an unsecured 3M term IBOR (Euribor).
      Stored as a CSV of ``KEY=VALUE`` pairs because
      ``Convention.value`` is scalar; compute parses it into a dict
      at load time.

  # ---------------------------------------------------------------------------
  # Boundary rounding — applied to pack_average_implied_rate_pct,
  # each time_series row, high/low/mid, percentile, and z-score.
  # Per-leg implied_rate_pct uses the same precision as the sibling
  # tools' ``implied_rate_round_decimals`` for consistency across the
  # policy_futures domain.
  # ---------------------------------------------------------------------------
  pack_average_round_decimals:
    value: 4
    source: team_judgment_pending_review
    rationale: >-
      Four decimals for the pack average in PERCENT (≈ 0.01 bp
      precision). Matches the precision desks use to read STIR
      implied rates without losing tick-derived resolution.
      Threaded through both the snapshot's
      ``pack_average_implied_rate_pct`` and every row of the bespoke
      ``time_series`` output so the snapshot equals
      ``time_series[-1].pack_average_implied_rate_pct`` strictly at
      the latest row. Same precision the sibling
      futures_butterfly_simple uses on its butterfly snapshot field.
    valid_range: [0, 8]

  implied_rate_round_decimals:
    value: 4
    source: team_judgment_pending_review
    rationale: >-
      Four decimals for per-leg implied rates in PERCENT. Matches
      futures_price_level / futures_calendar_spread /
      futures_butterfly_simple / futures_cross_market_spread /
      futures_strip_snapshot.
    valid_range: [0, 8]

  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches every other policy_futures /
      bond_futures / sovereign rates monitor in this codebase.
    valid_range: [0, 8]

  pack_average_high_low_round_decimals:
    value: 4
    source: team_judgment_pending_review
    rationale: >-
      Four decimals for trailing high / low / mid on the pack-
      average axis so they round at the same precision as
      ``pack_average_implied_rate_pct`` (avoids the snapshot's pack
      average equalling neither high nor low because of rounding
      asymmetry on a single observation).
    valid_range: [0, 8]

  percentile_round_decimals:
    value: 1
    source: team_judgment_pending_review
    rationale: >-
      One decimal on percentile (0.0 - 100.0). Matches yield_levels /
      futures_price_level / futures_calendar_spread /
      futures_butterfly_simple.
    valid_range: [0, 4]

methodology:
  what_it_does: |
    Fetches the four same-curve policy-futures strip slots that
    make up the requested pack (whites = strip positions 1-4; reds
    = strip positions 5-8) via a single ``fetch_strip_group``
    round-trip, converts each to implied-rate space using the
    per-strip ``inverse_priced`` flag from
    ``instrument_master.attributes``, aligns the four on the
    intersection of trading days (intra-leg ffill bridges holidays
    up to 5 trading days), computes the pack average as the simple
    arithmetic mean of the four per-leg implied rates
    (``pack_average_implied_rate_pct = (rate_1 + rate_2 + rate_3 +
    rate_4) / 4`` for whites; symmetric for reds), and returns a
    snapshot: current pack average, 1-day delta, rolling 252-day
    z-score of the pack-average series, trailing 252-day high /
    low / mid on the pack-average axis, percentile rank of the
    current pack average, observation count over the lookback_days
    window, per-leg current implied rates, plus the as_of-bounded
    SCD2 per-leg disclosure block.

    The implied-rate conversion rule is driven off the per-strip
    ``inverse_priced`` flag from ``instrument_master.attributes`` —
    NOT a hardcoded list in compute.py — and is verified to be
    CONSISTENT across the four legs of the requested pack (a same-
    curve pack on legs with different ``inverse_pricing`` flags is
    rejected with the controlled-error envelope). The methodology
    card discloses the underlying short-rate regime (RFR / IBOR per
    curve_family), the simple arithmetic-mean weighting, the
    inverse-pricing rule, AND the explicit refusal of duration-
    weighted / meeting-by-meeting / CTD-of-OIS variants so a desk
    reader cannot misread the unit or the methodology.

    ADR 0011 V1 scope (HARD refusal): SOFR_FUT and SONIA_FUT pack
    averages build cleanly (quarterly serial strips with uniform
    delivery-month type). EUR_SHORT_RATE_FUT is REFUSED at compute
    time with ``NotImplementedError`` (Euribor strip mixes serial
    and quarterly contracts and ``policy_futures.yml`` does not yet
    annotate the per-row ``delivery_month_type`` metadata needed to
    honestly average across heterogeneous delivery cadences). The
    refusal is the canonical "honest until data lands" pattern —
    see methodology.planned_extensions for the unblock path.

  assumptions:
    - "Policy-futures strip slots are keyed by
       ``(curve_family, strip_position)``; this pack-average primitive
       is keyed by ``(curve_family, pack)`` where ``pack`` ∈
       {whites, reds}. The whites = positions 1-4 / reds = positions
       5-8 definitions live in this YAML's ``whites_strip_positions``
       / ``reds_strip_positions`` blocks — they are canonical STIR-
       desk conventions and are NOT LLM-overridable."
    - "All four legs of the requested pack are read from the same
       ``curve_family`` (same RFR vs IBOR regime). This is a SAME-
       CURVE pack average, NOT a cross-CB / cross-family average
       (the latter is not a V1 primitive)."
    - "Simple arithmetic-mean weighting: each pack member carries
       weight = 1/4. The catalog's methodology guardrail requires
       this weighting (the STIR-desk shorthand IS the simple
       arithmetic mean of the implied rates) and explicit disclosure
       thereof. Duration-weighted / DV01-weighted / regression-
       fitted variants are NOT supported by this primitive and are
       documented as planned_extensions."
    - "The per-strip ``inverse_priced`` flag drives the per-leg
       raw_price → implied_rate_pct conversion. All four legs must
       agree on the flag in V1; otherwise the controlled-error
       envelope is returned."
    - "The short-rate regime (RFR vs IBOR) is METHODOLOGY
       DISCLOSURE — NOT a load-bearing computation choice."
    - "The z-score lives on the PACK AVERAGE axis (not the per-leg
       implied-rate axis). The desk-recognised level IS the pack
       average; the z follows."
    - "ADR 0011 V1 hard scope: SOFR_FUT and SONIA_FUT build
       cleanly. EUR_SHORT_RATE_FUT is REFUSED at compute time with
       NotImplementedError naming the missing ``delivery_month_type``
       playbook metadata. The schema's curve_family Literal still
       includes EUR_SHORT_RATE_FUT so the LLM can ask for it; the
       refusal happens AT COMPUTE TIME inside the gate, NOT at
       schema parse — the resulting error envelope is the
       desk-facing signal that the universe is incomplete."
    - "The output is NOT a meeting-by-meeting policy-path
       decomposition. This is a same-curve simple arithmetic mean
       on strip-position rolling-generics; the FOMC / ECB / BOE
       per-meeting implied-step view is a different concept and is
       NOT a primitive in this build (would require the WIRP-time-
       series substrate that is deferred per ADR 0009)."
    - "The output is NOT a CTD-of-futures-of-OIS pack curve. The
       CTD-implied-OIS path is not yet a primitive in this build —
       that requires the CTD identification + OIS-curve
       interpolation stack (Phase-4 per ADR 0011)."
    - "lookback_days controls the fetch window and the
       observation_count cutoff. The rolling z-score window
       (z_score_window_days) and trailing range window
       (trailing_range_window_days) are independent conventions
       fixed in this YAML."

  citations:
    - "ADR 0011 (docs_revamped/05_decisions/0011-futures-domain-agents.md)"
    - "Catalog v2.1 PR14 (frozen field-name discipline: implied_rate_pct)"

  planned_extensions:
    - "pack_average_eur_buba_mix: Add per-row
       ``delivery_month_type`` (``serial`` | ``quarterly``) metadata
       to ``rates_agent/playbooks/policy_futures.yml`` for every
       EUR_SHORT_RATE_FUT (Euribor) strip slot. The Euribor strip
       interleaves serial and quarterly contracts at the front (ER1
       is often a serial month; ER2/ER3/... rotate through serial
       and quarterly cadences) so a 1-4 pack average that does NOT
       distinguish them silently mixes structurally different
       delivery cadences. Once the playbook carries the metadata,
       compute() can either (a) filter to a uniform cadence per
       pack and surface the cadence on the methodology disclosure,
       or (b) require a homogeneous-cadence pack and refuse mixed
       packs with a clearer error message. Until that lands the
       EUR refusal at compute time is the honest behaviour."
    - "trailing_range_window_days: configurable. Currently locked
       at 252 because the output fields
       high_252d_pack_average_implied_rate_pct /
       low_252d_pack_average_implied_rate_pct /
       mid_252d_pack_average_implied_rate_pct / percentile_252d
       embed the number. Path to configurability: rename schema
       fields to high_window_* / low_window_* / mid_window_* /
       percentile_window + add trailing_window_days to the output;
       remove the NotImplementedError guard in compute()."
    - "Duration-weighted / DV01-weighted pack average primitive
       (separate tool). Today's primitive is the FIXED simple
       arithmetic mean (the STIR-desk shorthand); a duration-
       weighted variant is a distinct desk object and would ship
       as its own primitive (with the DV01 computation surface
       added — gated on a duration-of-futures primitive that is
       not yet in V1). The methodology card refuses to mix the
       two under the ``pack_average_simple`` name."
    - "Meeting-by-meeting policy-path pack average. The FOMC / ECB
       / BOE per-meeting implied-step decomposition is a separate
       concept that requires a per-meeting contract calendar
       mapping + the WIRP-time-series substrate (ADR 0009). NOT a
       V1 primitive."
    - "CTD-of-futures-of-OIS pack average (Phase-4 per ADR 0011).
       Maps the strip pack onto a calibrated OIS forward-rate pack.
       Gated on the CTD identification + OIS-curve interpolation
       stack landing as primitives."
