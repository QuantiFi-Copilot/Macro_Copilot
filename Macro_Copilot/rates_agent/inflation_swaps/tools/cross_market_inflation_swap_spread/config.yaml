# =============================================================================
# cross_market_inflation_swap_spread — tool configuration
# =============================================================================
# This file is the canonical record of the same-tenor cross-market
# zero-coupon inflation swap (ZCIS) spread tool's conventions and
# methodology.  Loaded by ``shared.config.load_tool_config`` at
# compute() time.  Every shared convention (z_score_window_days,
# z_score_min_periods, z_score_ddof, z_score_buffer_multiplier,
# ffill_limit_days, period offsets, trailing range window,
# bps/yield/z-score rounding, window_years_round_decimals) carries
# the same numeric value as the sibling level / curve-spread / forward
# primitives, the linker breakeven_curve_spread, and the sovereign
# yield_levels / curve_spread / cross_market_spread tools — the
# cross-config lint enforces value-agreement across every tool that
# declares the same convention name.  Drift on any of those is caught.
#
# Concept honesty
# ---------------
# This tool returns the same-tenor cross-market ZCIS spread —
# i.e. the difference between two ZCIS curve families at the same
# pillar (e.g. USD_ZCIS 5Y minus EUR_ZCIS 5Y).  The two curves
# reference DIFFERENT inflation indices (US CPI-U / Eurozone HICP
# ex-tobacco / UK RPI), so this spread captures BOTH inflation-
# expectation differentials AND structural index-family differences;
# it is NOT a clean expected-inflation divergence.  The wire-honesty
# disclosure is threaded onto current_metrics.methodology_label from
# methodology.what_it_does at runtime so the load-bearing caveat
# cannot be lost in a refactor.
#
# Same-curve combinations (e.g. USD_ZCIS 5Y vs USD_ZCIS 10Y) are a
# separate primitive — ``inflation_swap_curve_spread`` — and are
# rejected at the schema layer here (leg_a_curve_family !=
# leg_b_curve_family).
#
# Spread formula
# --------------
# Per-trade-date, the displayed cross-market ZCIS spread is:
#
#   spread_pct = leg_a_pct - leg_b_pct
#   spread_bps = spread_pct * 100
#
# where ``leg_a_pct`` and ``leg_b_pct`` are the ZCIS rate levels at
# ``tenor`` on ``leg_a_curve_family`` and ``leg_b_curve_family``
# respectively (each computed by
# ``calculate_inflation_swap_rate_level``).  The two endpoint series
# are aligned per-trade-date via a strict pandas inner-join AFTER
# each is computed independently — no synthetic spread points are
# produced on dates where one endpoint has no data.
#
# In V1 deterministic mode there is NO LLM-facing override path for
# conventions.  See docs/architecture/tool_architecture.md.
# =============================================================================

tool:
  name: calculate_cross_market_inflation_swap_spread_tool
  domain: inflation_swaps
  category: desk_invariant_primitive
  description: |
    Same-tenor cross-market zero-coupon inflation swap (ZCIS) spread
    between two ZCIS curve families at the same pillar — emits both:

      - ``current_metrics``: snapshot of the latest aligned
        observation (current spread in bps + percent,
        daily/weekly/monthly bps changes, 252-day rolling z-score,
        trailing 252-day high/low/percentile, observation count)
        PLUS each leg's reference metadata
        (``inflation_index_family`` / ``index_lag`` /
        ``interpolation`` / ``underlying_index``) so a desk reader
        can interpret the spread under the index-family caveat
        without a second tool call.

      - ``time_series_spread``: canonical
        ``shared.schemas.time_series.TimeSeries`` (units = BPS)
        carrying the historical cross-market ZCIS spread over the
        displayed ``lookback_days`` window.

      - ``time_series_zscore``: canonical
        ``shared.schemas.time_series.TimeSeries`` (units = Z_SCORE)
        carrying the rolling z-score of the spread series over the
        same window.

      - ``time_series``: bespoke wire-frozen row list with per-row
        ``spread_pct`` / ``spread_bps`` / ``leg_a_pct`` /
        ``leg_b_pct`` for callers that want the spread + each leg
        in a single per-row shape.

    Composed by calling ``calculate_inflation_swap_rate_level`` once
    per leg, then aligning the two PERCENT-units canonical
    TimeSeries via a strict pandas inner-join on trade_date and
    applying the per-trade-date difference (leg_a - leg_b) in
    PERCENT, with the BPS form derived as spread_pct * 100.

    Cross-market only
    -----------------
    The two legs MUST share a single ``tenor`` and MUST have
    distinct ``curve_family`` values.  Same-curve, two-tenor spreads
    (e.g. USD_ZCIS 5Y vs USD_ZCIS 10Y) belong to
    ``inflation_swap_curve_spread`` and are rejected at the schema
    layer here.

conventions:

  # ---------------------------------------------------------------------------
  # Default lookback window (calendar days of displayed history)
  # ---------------------------------------------------------------------------
  default_lookback_days:
    value: 365
    source: legacy_default_pre_pilot
    rationale: >-
      One calendar year of displayed history matches the legacy
      default on every other rates spread / level tool's input
      schema.  Surfaced here so the YAML is the authoritative
      record even though the input schema's Field default duplicates
      the value (the schema layer's default is the load-bearing
      one for behaviour; this entry exists for cross-tool
      auditability and to keep the lint clean).
    valid_range: [30, 7300]

  # ---------------------------------------------------------------------------
  # Z-score window length (trading days)
  # ---------------------------------------------------------------------------
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading-day count for a 1-year rolling window.  Matches every
      sovereign rates tool, the OIS level/spread/forward tools, the
      linker real_yield_level / breakeven_inflation_simple /
      forward_breakeven_simple / breakeven_curve_spread tools, the
      inflation_swap_rate_level / inflation_swap_curve_spread /
      inflation_swap_forward tools — the cross-config lint enforces
      the match.
    valid_range: [60, 1260]

  # Window length actually used in compute, exposed under the
  # spec-required name ``zscore_window_days`` for symmetry with
  # ``zscore_ddof`` below.  Compute reads the canonical
  # ``z_score_window_days`` for cross-config-lint alignment with
  # every other rates tool; this duplicate entry is documentation-
  # only so the spec-mandated name is also part of the record.
  zscore_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Spec-mandated alias for ``z_score_window_days`` — both names
      carry the same numeric value (252).  Compute reads
      ``z_score_window_days`` for cross-config lint alignment.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Minimum observations before the rolling stat is emitted
  # ---------------------------------------------------------------------------
  z_score_min_periods:
    value: 60
    source: team_judgment_pending_review
    rationale: >-
      ~3 months of observations before the rolling mean / std are
      deemed trustworthy.  Matches every sibling rates tool that
      declares this convention.
    valid_range: [20, 252]

  # ---------------------------------------------------------------------------
  # Standard-deviation degrees of freedom
  # ---------------------------------------------------------------------------
  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Sample standard deviation (Bessel-corrected, ddof=1).  Matches
      pandas' default and the convention every other rates tool uses.

  # Spec-mandated alias mirroring ``z_score_ddof`` so the convention
  # name ``zscore_ddof`` is also part of the record.  Compute reads
  # the canonical ``z_score_ddof`` for cross-config lint alignment.
  zscore_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Spec-mandated alias for ``z_score_ddof`` — both names carry
      the same numeric value (1).  Compute reads ``z_score_ddof``
      for cross-config lint alignment with every other rates tool.

  # ---------------------------------------------------------------------------
  # Calendar-day buffer for the fetch window
  # ---------------------------------------------------------------------------
  z_score_buffer_multiplier:
    value: 1.5
    source: derived_from_window
    rationale: >-
      Calendar-day buffer added to the fetch window so the rolling
      z-score AND the trailing range stat are both fully populated
      from the first displayed trading day.  1.5x trading-day window
      covers weekends + holidays.  Matches every other rates tool.
    valid_range: [1.2, 2.0]

  # ---------------------------------------------------------------------------
  # Period-change offsets (in trading-day rows after ffill)
  # ---------------------------------------------------------------------------
  daily_change_offset_rows:
    value: 2
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-2] = 1 trading day back.  The cross-market
      ZCIS spread series is in bps so changes go through
      period_changes(already_bps=True), i.e. plain subtraction (no
      *100 multiplier).
    valid_range: [2, 5]

  weekly_change_offset_rows:
    value: 6
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-6] = 5 trading days back ≈ 1 calendar week.
    valid_range: [5, 10]

  monthly_change_offset_rows:
    value: 22
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-22] = ~1 calendar month of trading days.
    valid_range: [20, 30]

  # ---------------------------------------------------------------------------
  # Trailing range / percentile window — LOCKED at 252 in V1
  # ---------------------------------------------------------------------------
  # The output schema's field names (high_252d_bps, low_252d_bps,
  # percentile_252d) embed the number; compute() raises
  # NotImplementedError if this is set to anything else.  Same wire-
  # freeze as breakeven_curve_spread / sovereign curve_spread /
  # inflation_swap_rate_level / inflation_swap_curve_spread /
  # inflation_swap_forward.
  trailing_range_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      1Y trailing for high/low/percentile.  Locked at 252 in V1
      because the wire field names embed the number.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Forward-fill limit for missing observations
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Bridge up to one trading week of missing data across holiday
      gaps.  Matches every other rates tool; the consistency lint
      enforces the match where declared.  Applies inside the
      composed level primitive's clean step at each leg; the
      cross-market spread layer itself uses a strict inner join
      on trade_date to avoid synthesising spread points.
    valid_range: [1, 10]

  # ---------------------------------------------------------------------------
  # Output rounding precision — bps (cross-market spread, period
  # changes, range)
  # ---------------------------------------------------------------------------
  bps_round_decimals:
    value: 2
    source: team_judgment_pending_review
    rationale: >-
      Round bps output (current cross-market ZCIS spread,
      daily/weekly/monthly changes, trailing high/low) to 0.01 bps.
      Display precision; matches sovereign curve_spread /
      cross_market_spread / OIS spread tools / linker
      breakeven_curve_spread / breakeven_inflation_simple /
      forward_breakeven_simple / inflation_swap_curve_spread /
      inflation_swap_forward.  Threaded explicitly into
      period_changes(decimals=...) so the delta_bps default of 2
      cannot silently shadow a YAML override.
    valid_range: [0, 6]

  # ---------------------------------------------------------------------------
  # Output rounding precision — pct (cross-market spread)
  # ---------------------------------------------------------------------------
  pct_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches the legacy hardcoded default in
      ``shared.analytics.levels.compute_level_metrics`` and every
      sovereign / OIS / linker / ZCIS level tool's pct-units
      rounding.  Used here for the boundary-rounding parity
      between ``current_metrics.spread_pct`` and the bespoke
      ``time_series[-1].spread_pct``.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Output rounding precision — z-score
  # ---------------------------------------------------------------------------
  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches the legacy default in
      ``shared.analytics.spreads.rolling_zscore`` and every other
      rates tool that exposes this convention.  Threaded to
      safe_float at the output boundary so a YAML override above 4
      is not silently truncated by safe_float's own default of 4.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Output rounding precision — yields / pct (per-leg latest snapshots)
  # ---------------------------------------------------------------------------
  # Used here for the per-leg latest ZCIS rates surfaced in
  # current_metrics (leg_a_pct / leg_b_pct).  Matches every other
  # rates level tool's convention so the cross-config lint stays
  # clean.
  yield_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches the legacy hardcoded default in
      ``shared.analytics.levels.compute_level_metrics`` and every
      sovereign / OIS / linker / ZCIS level tool.  Used here for
      the per-leg ZCIS rate snapshots in current_metrics.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Per-window-year display rounding (tenor_years)
  # ---------------------------------------------------------------------------
  window_years_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Display-precision rounding for the tenor_years field in
      current_metrics.  4 decimals matches every sibling tool that
      exposes year-fraction display fields; the cross-config lint
      enforces the value.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Trailing high / low rounding precision (passed to the composed
  # level primitive's compute_level_metrics)
  # ---------------------------------------------------------------------------
  high_low_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches the legacy default in
      ``compute_level_metrics`` for the trailing high / low /
      percentile stats.  Matches the inflation_swap_rate_level /
      sibling level tools — required because this primitive's
      ToolConfig is threaded into the level primitive's compute.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Default Bloomberg observation field for both legs
  # ---------------------------------------------------------------------------
  # ZCIS quoted-rate mid is the canonical Bloomberg observation for
  # inflation swaps.  Same convention name as the level / curve-
  # spread / forward primitives (``default_zcis_rate_field``) so the
  # cross-config lint stays clean and the threaded config flows
  # through to both inner level calls.
  default_zcis_rate_field:
    value: PX_MID
    source: bloomberg_field_convention
    rationale: >-
      ZCIS quoted-rate mid is the canonical Bloomberg observation
      for inflation swaps and matches the playbook's
      ``target_metrics`` (``yield_mid`` → ``PX_MID``).  Resolved by
      compute when the input's optional ``field_name`` is None
      (the empty-string sentinel is coerced to None at the schema
      layer); the resolved value is threaded into BOTH the leg_a
      and leg_b inner ``inflation_swap_rate_level`` calls so the two
      legs are read off the same Bloomberg field by construction.
      Same convention name as the level / curve-spread / forward
      primitives so the cross-config lint stays clean.

  # ---------------------------------------------------------------------------
  # Sign convention — wire-load-bearing
  # ---------------------------------------------------------------------------
  # The cross-market ZCIS spread is a directional object.  This
  # primitive uses ``leg_a_pct - leg_b_pct`` (left minus right) so
  # the desk reader can predict the sign from the input ordering.
  # Exposed as a YAML convention so any future change to the sign
  # convention is auditable; compute reads this and refuses to run
  # if it ever differs from ``leg_a_minus_leg_b`` (V1 wire freeze).
  cross_market_sign_convention:
    value: leg_a_minus_leg_b
    source: team_judgment_pending_review
    rationale: >-
      Sign convention: spread = leg_a - leg_b.  Documents that the
      LEFT leg (leg_a) is the numerator and the RIGHT leg (leg_b)
      is the denominator so downstream consumers can predict the
      sign without re-reading code.  Wire-frozen in V1; any change
      requires a new convention value and a coordinated update to
      the SQL validator + the wire-disclosed methodology label.

methodology:
  what_it_does: |
    Same-tenor cross-market zero-coupon inflation swap (ZCIS) spread
    between two ZCIS curve families at the same pillar (e.g.
    USD_ZCIS 5Y minus EUR_ZCIS 5Y, USD_ZCIS 10Y minus GBP_ZCIS 10Y,
    EUR_ZCIS 5Y minus GBP_ZCIS 5Y).  Computed per-trade-date via
    the SPREAD formula:

      spread_pct = leg_a_pct - leg_b_pct
      spread_bps = spread_pct * 100

    where ``leg_a_pct`` and ``leg_b_pct`` are the ZCIS rate levels
    at ``tenor`` on ``leg_a_curve_family`` and ``leg_b_curve_family``
    respectively (each computed by
    ``calculate_inflation_swap_rate_level`` filtered by
    ``instrument_type='inflation_swap'`` AND
    ``pricing_type='zero_coupon_breakeven'`` AND
    ``curve_family=?`` AND ``tenor=?`` — the no-proxy guard
    inherited transitively).  The two endpoint series are aligned
    per-trade-date via a strict pandas inner-join on calendar
    trade_date AFTER each is computed independently; the spread
    is computed only on dates where BOTH legs exist (no synthetic
    spread points are produced).

    INDEX-FAMILY CAVEAT (load-bearing): USD_ZCIS, EUR_ZCIS, and
    GBP_ZCIS reference different inflation indices (US CPI-U /
    Eurozone HICP-xT / UK RPI), so this spread captures BOTH
    inflation-expectation differentials AND structural index-family
    differences; it is not a clean expected-inflation divergence.
    Each leg's ``inflation_index_family`` / ``index_lag`` /
    ``interpolation`` / ``underlying_index`` is surfaced on the
    wire (per-leg) so the desk reader can decompose the spread
    under the correct ZCIS conventions without a second tool call.

    Sign convention: spread = leg_a - leg_b.  The LEFT leg
    (``leg_a_curve_family``) is the numerator and the RIGHT leg
    (``leg_b_curve_family``) is the denominator, so the spread
    sign is predictable from the input ordering.  Same-curve,
    two-tenor spreads (e.g. USD_ZCIS 5Y vs USD_ZCIS 10Y) are NOT
    accepted by this primitive — the schema layer rejects
    ``leg_a_curve_family == leg_b_curve_family`` so cross-market
    semantics cannot be silently inverted to a curve spread.
    Same-curve curve spreads belong to
    ``inflation_swap_curve_spread``.

  assumptions:
    - "Cross-market invariant: ``leg_a_curve_family !=
       leg_b_curve_family`` (rejected at the schema layer).
       Same-curve, two-tenor spreads belong to
       ``inflation_swap_curve_spread``."
    - "Same-tenor invariant: a single ``tenor`` field is shared by
       both legs.  Same-forward-window cross-market spreads are
       documented under planned_extensions but not exposed as a
       knob in V1 — they would be a separate primitive shape."
    - "Each leg's ZCIS rate is computed by composing
       ``calculate_inflation_swap_rate_level`` once per leg,
       passing this primitive's ``ToolConfig`` so methodology
       stays consistent.  This inherits the level primitive's
       four-conjunct no-proxy guard (instrument_type +
       pricing_type + curve_family + tenor) for free."
    - "If either leg returns its own controlled error envelope,
       this tool surfaces a controlled error envelope of its own
       that names which leg failed (leg_a / leg_b) and propagates
       the inner error context."
    - "Per-trade-date alignment: the two endpoint ZCIS series are
       aligned via a strict pandas inner-join on trade_date AFTER
       each is computed independently from the level primitive.
       The level primitive's clean step ffills within
       ``ffill_limit_days``; the cross-market spread layer never
       adds its own ffill across the inner-join — dates where
       ONE leg has no data after the level's ffill window are
       dropped from the spread series."
    - "The ZCIS rates from the inner level primitive arrive in
       PERCENT; the cross-market spread is reported in BOTH
       PERCENT and BPS (the *100 multiplier is applied once at
       compute time and rounded to ``bps_round_decimals`` for the
       BPS form, ``pct_round_decimals`` for the PERCENT form).
       ``daily/weekly/monthly`` changes use
       ``period_changes(already_bps=True)`` (plain subtraction);
       ``bps_round_decimals`` is threaded through explicitly so
       the YAML is authoritative."
    - "The snapshot's ``spread_bps`` equals
       ``time_series[-1].spread_bps`` and
       ``time_series_spread.rows[-1].value`` bit-for-bit at the
       YAML's ``bps_round_decimals``; same boundary-rounding
       discipline as breakeven_curve_spread /
       inflation_swap_curve_spread /
       cross_country_breakeven_spread_simple."
    - "INDEX-FAMILY CAVEAT: USD_ZCIS, EUR_ZCIS, and GBP_ZCIS
       reference different inflation indices (US CPI-U /
       Eurozone HICP-xT / UK RPI) — this spread is NOT a clean
       expected-inflation divergence, it captures both inflation-
       expectation differentials AND structural index-family
       differences.  Per-leg ``inflation_index_family`` /
       ``index_lag`` / ``interpolation`` / ``underlying_index``
       are surfaced on the wire so the desk reader can decompose
       the spread."
    - "lookback_days controls the *display* window (and the
       bespoke time_series row count + canonical TimeSeries
       length), NOT the rolling z-score window or the trailing
       range window — those are independent conventions in this
       YAML."
    - "Latest-observation cutoff for the displayed window is
       anchored to the data's latest aligned trade_date (matching
       inflation_swap_rate_level / inflation_swap_curve_spread /
       inflation_swap_forward / breakeven_curve_spread /
       OIS rate_level)."

  citations:
    - "trading_day_convention (registered in
       docs/architecture/methodology_sources.md)."
    - "industry_standard_1y_window (registered in
       docs/architecture/methodology_sources.md)."
    - "industry_standard_sample_std (registered in
       docs/architecture/methodology_sources.md)."
    - "bloomberg_field_convention (registered in
       docs/architecture/methodology_sources.md)."
    - "derived_from_window (registered in
       docs/architecture/methodology_sources.md)."
    - "team_judgment_pending_review (registered in
       docs/architecture/methodology_sources.md)."
    - "legacy_default_pre_pilot (registered in
       docs/architecture/methodology_sources.md)."

  planned_extensions:
    - "Same-forward-window cross-market spread (e.g. USD_ZCIS
       5Y5Y minus EUR_ZCIS 5Y5Y).  V1 supports same-tenor only;
       same-forward-window would be a separate primitive shape
       composing two ``calculate_inflation_swap_forward`` calls,
       NOT a config knob on this tool.  Deferred so the wire
       shape stays minimal."
    - "Swap-breakeven basis (ZCIS rate minus same-tenor linker
       bond-implied breakeven) — the canonical desk read of the
       relative-value spread between the inflation-swap and the
       linker-bond inflation-compensation curves
       (``swap_breakeven_basis_simple``, build_order 13)."
    - "trailing_range_window_days: configurable.  Currently
       locked at 252 because the output fields high_252d_bps /
       low_252d_bps / percentile_252d embed the number.  Path to
       configurability mirrors sibling level / curve-spread /
       forward tools' planned_extensions: rename schema fields to
       high_window_bps / low_window_bps / percentile_window + add
       trailing_window_days to the output; remove the
       NotImplementedError guard in compute()."
    - "Date-window input mode (``start_date`` / ``end_date``) for
       ad-hoc display windows aligned to specific calendar events
       (e.g. central-bank meeting dates).  Deferred from V1 so
       the wire shape stays minimal — same-tenor mode is the
       canonical desk read for cross-market ZCIS spreads."
    - "Explicit cross-tenor cross-market combinations
       (e.g. USD_ZCIS 5Y vs EUR_ZCIS 10Y).  V1 enforces a single
       shared ``tenor`` for both legs because the same-tenor
       cross-market spread is the only directly-observable desk
       quote and the wire surface stays predictable.  A two-tenor
       cross-market shape would require a separate primitive (per-
       leg ``tenor_a`` / ``tenor_b`` inputs, distinct year-fraction
       fields on current_metrics, and a methodology disclosure that
       calls out the additional curve-shape contribution to the
       spread); deferred until a desk requirement explicitly
       motivates it."
    - "Alternative ``cross_market_sign_convention`` values beyond
       ``leg_a_minus_leg_b`` (e.g. ``dv01_weighted`` for tenor-
       weighted DV01-equivalent spreads, ``duration_weighted`` for
       duration-equivalent spreads).  V1 pins the convention to
       ``leg_a_minus_leg_b`` to keep the wire deterministic — the
       wire-disclosed methodology_label and the SQL validator must
       move in lockstep with any sign-convention change so the desk
       user can never see a label that disagrees with the math.
       The compute-layer guard refers callers here when an
       unsupported value is set."
