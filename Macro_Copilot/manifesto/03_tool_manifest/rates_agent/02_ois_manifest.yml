      compute: rates_agent/ois/tools/cross_market_spread/compute.py::calculate_ois_cross_market_spread
      config: rates_agent/ois/tools/cross_market_spread/config.yaml

    one_liner: >-
      Cross-market OIS rate differential between the same tenor on two
