catalog_name: primitive_automation_initial_remaining_instruments
catalog_version: "2.1"
branch: primitive_automation
execution_mode: one_primitive_at_a_time
status_policy:
  allowed_statuses:
    - todo
    - in_progress
    - changes_required
    - waiting_quota
    - blocked
    - done
runtime_managed_fields:
  - status
  - active_step
  - review_round
  - human_action_required
  - last_error
  - last_review_heading
  - block_reason
selection_principles:
  - Include only primitives from the three remaining instrument families selected for the first automation batch.
  - Include only primitives whose required market data and reference metadata already exist in the current repo playbooks or already-built upstream tool surfaces.
  - Exclude anything that would require proxies, hidden assumptions, or missing CTD / conversion-factor / repo inputs.
  - Keep the initial batch biased toward desk-recognizable standard primitives rather than Bucket 2 research models.
  - Every entry names its substrate playbook(s) in `pre_flight_load_audit` so the orchestrator's pre-flight gate (PRE_FLIGHT_LOAD_AUDIT.md) can verify `load_audit` SUCCESS before any builder dispatch.
notes:
  - v2.1 — appended 11 primitives covering the rest of the original Primitive-Expansion plan (excluding the 4 event primitives, which await the events-sub-agent placement decision, and excluding templates / coverage extensions / ADR-only items, which the factory does not handle). Net effect on this run, factory keeps grinding on the v2.0 todo set; once those 8 are done the factory advances to build_order 24+ without restart. Added 11 = Group 1 (3 — scan_inflation_linkers_extremes, scan_inflation_swaps_extremes, calculate_ois_butterfly) + Group 2 missing (3 — policy_futures futures_strip_snapshot, futures_pack_average_simple, scan_policy_futures_extremes) + Group 3 panels (3 — build_zcis_panel, build_linker_panel, build_policy_futures_strip_panel) + Group 5 (2 — ois asset_swap_spread, inflation_swaps realized_vs_implied_inflation).
  - v2.0 — bond_futures and policy_futures entries unblocked. Bond_futures now reflects ADR 0011 V1 scope (monitors only — price level, volume/OI, morning extremes scan). The Phase-4 RV stack (CTD basis, implied repo, DV01-weighted spreads) remains gated on D-repo + D-deliverable ingestion and is intentionally NOT in this catalog. Policy_futures uses the new strip-aware fetchers in shared/analytics/rates_fetch.py.
  - Inflation linker and inflation swap primitives are already shipped on this branch; their `status: done` reflects the actual on-disk state of `rates_agent/inflation_indexed_bonds/tools/` and `rates_agent/inflation_swaps/tools/`. The orchestrator must NOT re-build them.
  - The 8 remaining buildable primitives (3 bond_futures + 5 policy_futures) are what the factory will work through this run.
  - The orchestrator must resume unfinished work before starting new `todo` items.
  - The orchestrator may continue through the whole catalog in one run, stopping only for quota, blocker, hard error, pre-flight load_audit miss (per-primitive, not whole-loop), or catalog exhaustion.
  - When every entry is `done` or `blocked`, the orchestrator sets `orchestrator_status: catalog_exhausted` and the cron entry-point short-circuits subsequent wakes (BACKGROUND_EXECUTION_POLICY.md §8).

