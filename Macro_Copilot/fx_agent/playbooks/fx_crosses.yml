playbook_name: "fx_crosses"
playbook_version: "2.0"
asset_class: "fx"
dataset_name: "fx_crosses"
description: "G10 FX cross rates (non-USD pairs) for relative value, cross-asset analysis, and synthetic basket construction. Wave 1 expands from 6 to 11 crosses by adding NZD-side crosses (NZDJPY, EURNZD, AUDNZD) and EUR-side crosses (EURCAD, EURAUD). The metadata is also harmonised — Wave 1 backfills `market_scope: G10` and `region: Global` on the pre-existing entries (these were missing from v1)."

extraction:
  start_date: "2000-01-01"
  incremental_window_days: 14

target_metrics:
  - metric_id: "spot_last"
    bloomberg_field: "PX_LAST"

reference_metrics:
  - column_name: "security_name"
    bloomberg_field: "SECURITY_DES"

universe:
  - ticker: "EURGBP Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_CROSSES"
    market_scope: "G10"
    region: "Global"
    pair: "EURGBP"
    base_ccy: "EUR"
    quote_ccy: "GBP"

  - ticker: "EURJPY Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_CROSSES"
    market_scope: "G10"
    region: "Global"
    pair: "EURJPY"
    base_ccy: "EUR"
    quote_ccy: "JPY"

  - ticker: "GBPJPY Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_CROSSES"
    market_scope: "G10"
    region: "Global"
    pair: "GBPJPY"
    base_ccy: "GBP"
    quote_ccy: "JPY"

  - ticker: "AUDJPY Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_CROSSES"
    market_scope: "G10"
    region: "Global"
    pair: "AUDJPY"
    base_ccy: "AUD"
    quote_ccy: "JPY"

  - ticker: "EURCHF Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_CROSSES"
    market_scope: "G10"
    region: "Global"
    pair: "EURCHF"
    base_ccy: "EUR"
    quote_ccy: "CHF"

  - ticker: "AUDCAD Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_CROSSES"
    market_scope: "G10"
    region: "Global"
    pair: "AUDCAD"
    base_ccy: "AUD"
    quote_ccy: "CAD"

  # ============================================================
  # Wave 1 additions (NZD crosses + EUR crosses)
  # ============================================================
  - ticker: "NZDJPY Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_CROSSES"
    market_scope: "G10"
    region: "Global"
    pair: "NZDJPY"
    base_ccy: "NZD"
    quote_ccy: "JPY"

  - ticker: "EURNZD Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_CROSSES"
    market_scope: "G10"
    region: "Global"
    pair: "EURNZD"
    base_ccy: "EUR"
    quote_ccy: "NZD"

  - ticker: "AUDNZD Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_CROSSES"
    market_scope: "G10"
    region: "Global"
    pair: "AUDNZD"
    base_ccy: "AUD"
    quote_ccy: "NZD"

  - ticker: "EURCAD Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_CROSSES"
    market_scope: "G10"
    region: "Global"
    pair: "EURCAD"
    base_ccy: "EUR"
    quote_ccy: "CAD"

  - ticker: "EURAUD Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_CROSSES"
    market_scope: "G10"
    region: "Global"
    pair: "EURAUD"
    base_ccy: "EUR"
    quote_ccy: "AUD"
