playbook_name: "fx_forwards"
playbook_version: "3.0"
asset_class: "fx"
dataset_name: "fx_forwards"
description: "Daily G10 FX forward points across the standard tenor strip (1W, 1M, 3M, 6M, 12M) PLUS the long-tenor strip (2Y, 5Y) for carry, term-structure, and relative-value analysis. v2.0 added the 1W-12M strip (Phase A canonical, replacing v1 fx_forwards_1m + partial fx_forwards_curve). v3.0 (Phase B BBG batch 2026-05-25) adds 2Y/5Y — same G10 pairs, same forward-points unit, longer maturities (cross-currency-swap territory but still quoted as standard FX forward points in BBG). See fx_agent/ROADMAP.md for migration context."

extraction:
  start_date: "2000-01-01"
  incremental_window_days: 14

target_metrics:
  - metric_id: "forward_points"
    bloomberg_field: "PX_LAST"

reference_metrics:
  - column_name: "security_name"
    bloomberg_field: "SECURITY_DES"

