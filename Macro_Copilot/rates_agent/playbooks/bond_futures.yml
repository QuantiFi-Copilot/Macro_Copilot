  - ticker: "TU1 Comdty"
    instrument_type: "bond_future"
    curve_family: "UST_FUT"
    country: "US"
    currency: "USD"
    tenor: "2Y"
    contract_code: "TU1"
    bucket_label: "2Y"
    is_rolling_contract: true

