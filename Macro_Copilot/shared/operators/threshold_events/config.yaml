operator:
  name: threshold_events
  method_family: masking
  version: "1.0.0"
  description: >-
    Convert a typed Series into an EventSet by applying a
    threshold rule on either the raw values or a rolling z-score.
    Finance-blind; lookahead-safe by default.

defaults:
  threshold_basis:
    value: raw_value
    source: operator_v1_default
    rationale: >-
      Default basis is the raw series value — the simplest case
      where ``threshold`` is applied directly to the input.  Switch
      to ``rolling_zscore`` for event studies that need the
      threshold expressed in standard-deviations of recent history.
    valid_values: [raw_value, rolling_zscore]

  look_ahead_safe:
    value: true
    source: operator_v1_default
    rationale: >-
      Default true (strict): when threshold_basis='rolling_zscore',
      the rolling stats used at time t are computed using only
      data up to t-1 (shifted by one period).  This is the
      canonical event-study hygiene — an event at t cannot have
      been "predicted" by stats that included observation t
      itself.  Pass false to opt into in-sample contamination
      explicitly; the choice is recorded in lineage.
    valid_values: [true, false]

methodology:
  what_it_does: >-
    Builds a boolean EventSet from a Series + threshold rule.
    For raw_value basis, the threshold is applied directly to the
    series values.  For rolling_zscore basis, a rolling mean and
    rolling std are computed; the standardised value is compared
    against the threshold.  When look_ahead_safe is true, the
    rolling stats are shifted by one period so the threshold at
    time t uses only data up to t-1.  Output EventSet carries
    per-event metadata (date, triggering value, threshold context)
    and full lineage.
  planned_extensions:
    - "between / outside / abs_below rules"
    - "expanding_zscore / rolling_quantile bases"
    - "event_dedup policies (consecutive_collapse, min_gap_days)"
    - "ddof knob for rolling std (currently fixed at 1 — sample std)"

# ============================================================================
# CARD — the L3 Composer's view of this operator (PR-2 of open-DAG PoC).
# ============================================================================
card:
  one_line: >-
    Convert a Series into a boolean EventSet by applying a threshold rule
    (on raw value or rolling z-score) — the standard "find events" gate.
  when_to_use:
    - "User asks for dates when a Series crossed a threshold."
    - "User asks for the SET of regime / trigger dates that downstream operators (event_windows, apply_mask) will condition on."
    - "User asks for \"flag\" or \"event\" or \"trigger\" dates without specifying further processing."
  when_not_to_use:
    - "If the user wants the VALUES at the qualifying dates (not just the dates), use apply_mask downstream of this operator."
    - "If the user wants per-event windows of another series around each event, pass the EventSet to event_windows."
    - "If the user wants the threshold expressed as a percentile rather than a value, run percentile_rank first and threshold on the result."
  upstream_requirements:
    - "One Series.  For threshold_basis='rolling_zscore', the operator internally computes its own rolling stats (no upstream rolling_zscore needed)."
  downstream_pattern:
    - "Output is an EventSet (boolean mask aligned to the input Series's DatetimeIndex)."
    - "Common downstream: event_windows (for windowed event studies), apply_mask (to subsample another Series by the event dates)."
  knobs_quick_ref:
    rule: "above | below | abs_above (and planned: between, outside, abs_below)."
    threshold: "Numeric threshold compared against threshold_basis."
    threshold_basis: "raw_value (default — threshold on series values) | rolling_zscore (threshold on standardised z)."
    look_ahead_safe: "true (default; rolling stats use only data up to t-1 — event-study hygiene)."
  example_shapes:
    - description: "Above-threshold events on a raw Series."
      shape: "Series -> threshold_events(rule='above', threshold=X) -> EventSet"
    - description: "Find dates when a Series was > 2σ from its own trailing history."
      shape: "Series -> threshold_events(rule='above', threshold=2.0, threshold_basis='rolling_zscore') -> EventSet"
  sibling_operators:
    - apply_mask: "Pair downstream when the user wants the qualifying dates' VALUES from a target Series."
    - event_windows: "Pair downstream when the user wants per-event sequences of another Series around each event."
  intent_hints: [event_regime]
