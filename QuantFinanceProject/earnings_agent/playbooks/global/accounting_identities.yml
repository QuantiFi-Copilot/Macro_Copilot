version: "1.0"
description: "Enforces fundamental, non-negotiable accounting equations. A failure here is a critical data error and a strong signal for PDF escalation."

rules:
  - rule_name: "balance_sheet_identity"
    description: "Verifies that Assets are approximately equal to Liabilities + Equity. This is the most fundamental accounting law."
    # This condition signals the engine to run its specific, hardcoded function for this three-variable check.
    condition: "special_check_balance_sheet" 
    tolerance: 0.02 # A 2% tolerance is reasonable for initial runs.
    flag:
      type: "ACCOUNTING_IDENTITY_FAILURE"
      message: "Balance Sheet does not balance: Assets != Liabilities + Equity."
      severity: "CRITICAL"

  - rule_name: "cash_flow_identity"
    description: "Verifies that the net change in cash reconciles with the three core cash flow activities (Operating, Investing, Financing)."
    # Signals the engine to run the specific logic for this check.
    condition: "special_check_cash_flow"
    tolerance: 0.05 # Cash flow statements can have more rounding/minor items.
    flag:
      type: "ACCOUNTING_IDENTITY_FAILURE"
      message: "Cash Flow activities do not sum up to the net change in cash."
      severity: "CRITICAL"
  
  - rule_name: "gross_profit_identity"
    description: "Verifies that Revenue minus Cost of Goods Sold equals Gross Profit."
    condition: "special_check_gross_profit"
    tolerance: 0.01 # This should be very tight.
    flag:
      type: "ACCOUNTING_IDENTITY_FAILURE"
      message: "Gross Profit does not equal Revenue - COGS."
      severity: "WARNING" # Usually a mapping error, less critical than balance sheet failure.