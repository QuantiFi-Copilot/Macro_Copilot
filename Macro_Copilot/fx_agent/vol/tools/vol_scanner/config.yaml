tool:
  name: scan_fx_vol_tool
  domain: fx_vol
  description: |
    Cross-sectional FX ATM vol scanner — for one tenor, returns one
    row per pair in the requested market_scope (G10 / EM / G10_CROSSES
    / ALL) with the current vol, rolling 252-day z-score / percentile
    / range, ranked by vol_signed / abs_vol / abs_z_score. Mirror of
    scan_fx_spot for the ATM vol substrate.
  category: desk_invariant_primitive

conventions:
  default_vol_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: Bloomberg PX_LAST is the canonical ATM vol observation.

  default_tenor:
    value: 1M
    source: team_judgment_pending_review
    rationale: 1M is the standard cross-sectional vol monitor tenor.

  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: One trading year of rolling history.
    valid_range: [60, 504]

  z_score_min_periods:
    value: 60
    source: industry_standard_1y_window
    rationale: Min observations before z-score is emitted.
    valid_range: [20, 252]

  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: Sample (Bessel-corrected) standard deviation.
    valid_range: [0, 1]

  trailing_range_window_days:
    value: 252
    source: legacy_default_pre_pilot
    rationale: Locked at 252 in V1.
    valid_range: [252, 252]

  vol_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: Four decimals preserves precision for ATM vol values.
    valid_range: [2, 6]

  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: Four decimals for z-score.
    valid_range: [2, 6]

  percentile_round_decimals:
    value: 2
    source: legacy_default_pre_pilot
    rationale: Two decimals for percentile rank.
    valid_range: [0, 4]

methodology:
  what_it_does: |
    Cross-sectional fetch over the fx_vol substrate filtered by
    (tenor, market_scope -> fx_family list), then per-pair: rolling
    252-day z-score / high / low / percentile. Ranks the result by
    rank_by and optionally caps to top_n.
  assumptions:
    - "Standard tenors only (1W/1M/3M/6M/12M). Extended tenors (ON/2W/2M/9M/2Y) are in DB but not exposed here in V1."
    - "Cross vols (G10_CROSSES_FX_VOL family) are included in ALL scope. To filter to cross vols only, use market_scope='G10_CROSSES'."
    - "Pairs without enough history (< z_score_min_periods obs) still appear in the output but with z_score = None."
  citations: []
  planned_extensions:
    - "Add extended-tenor scanner mode (separate Literal) once tools need ON/2W/2M/9M/2Y cross-sections."
