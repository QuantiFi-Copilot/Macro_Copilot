# =============================================================================
# Inflation-Indexed Bonds — tool manifest
# =============================================================================
# Read by the Library page UI alongside the sibling per-agent manifests.
# Each entry mirrors a tool actually registered in
# ``rates_agent/inflation_indexed_bonds/mcp_server.py`` and the per-tool
# folder under ``rates_agent/inflation_indexed_bonds/tools/<tool>/``.
# Adding a new tool to this sub-agent = (1) implementation under tools/,
# (2) MCP registration in mcp_server.py, (3) entry here. The Library is
# rendered from this YAML — no hardcoding tool-by-tool in the frontend.
#
# Bucket convention (shared across the rates_agent manifests):
#   1A  — strict deterministic arithmetic on stored market data; no
#         user-facing model inference; conventions YAML-locked.
#   1B  — statistical model fits (rolling OLS, PCA, OU/AR(1)) where
#         the user picks a window or factor count but the solver +
#         conventions are YAML-locked; bit-stable on same input.
#   2   — open-ended / scenario-generating / model-state tools.
#         (Not yet shipped in this sub-agent.)
#
# Domain residence rationale (PR3, ADR 0006):
#   This file covers sovereign-linker primitives — real-yield levels +
#   bond-implied breakeven inflation. Distinct from inflation_swaps
#   (zero-coupon inflation swap primitives, manifest 05_). Linkers and
#   ZCIS share an instrument family ("inflation") but the desk owners,
#   underlying instruments, and curve families are disjoint; they are
#   two separate sub-agents per the ADR-0006 closed-family extension.
#
# Round-3 Stage 1 (work item A10): this manifest was created to close
# the gap between the 9 registered inflation_indexed_bonds primitives
# (shipped on the inflation-domain reconciliation PR, ADR 0006) and
# the Library catalogue. Prior to this file, those tools were not
# surfaceable on the Library page.
# =============================================================================

tools:
  # ---------------------------------------------------------------------------
  # SINGLE-TENOR REAL-YIELD LEVELS
  # ---------------------------------------------------------------------------

  - name: get_real_yield_level
    domain: rates
    sub_agent: inflation_indexed_bonds
    bucket: 1A
    category: snapshots
    status: built

    implementation:
      mcp_server: rates_agent/inflation_indexed_bonds/mcp_server.py
      tool_function: get_real_yield_level_tool
      schema: rates_agent/inflation_indexed_bonds/tools/real_yield_level/schemas.py::RealYieldLevelInput
      compute: rates_agent/inflation_indexed_bonds/tools/real_yield_level/compute.py::get_real_yield_level
      config: rates_agent/inflation_indexed_bonds/tools/real_yield_level/config.yaml

    one_liner: >-
      Where do real yields sit right now for US TIPS, UK linkers,
      French OATei, or Canadian RRBs?  See the level, today's move,
      and how stretched it is vs the past year — at a glance.
    # PM-facing tagline (shown on the Library card).  Lock convention
    # per docs_revamped/03_standards/lifecycle_checklist_template.md
    # Stage 1C: one_liner must be desk-PM-facing prose, NOT internal
    # engineer-facing.  Technical detail belongs in this tool's
    # README + the DB tool_metadata.desk_narrative field.

    bucket_rationale: >-
      Deterministic rolling z-score over stored daily real yields on the
      linker generic-ticker universe. Default 252-day window with the
      rolling-z-score model surface (window / min_periods / ddof) exposed
      as Pydantic Input overrides per the Phase-1 methodology-exposure
      standard (docs_revamped/03_standards/methodology_exposure.md);
      remaining conventions (period offsets, fetch buffer, ffill,
      rounding, trailing range) stay YAML-locked. `instrument_type='inflation_linker'`
      filter guards the linker universe per the ADR-0006 isolation
      rationale.

    # Mirror of config.yaml ``conventions.<name>.exposure.expose: true``
    # entries.  Derived; do not hand-edit without updating the YAML.
    # See docs_revamped/03_standards/methodology_exposure.md §4 (propagation chain).
    pm_overridable:
      - z_score_window_days
      - z_score_min_periods
      - z_score_ddof
      - default_field_name

    related_tools:
      - calculate_breakeven_inflation_simple_tool
      - calculate_real_yield_curve_spread_tool
      - get_yield_levels_tool

    workflows: []

    references:
      - docs_revamped/05_decisions/0006-inflation-domain-agents.md
      # Mirror of macro_data.tool_metadata.theoretical_reference for this
      # tool (set in database/migrations/2026-05-28_phase1_get_real_yield_level_curated.sql).
      # Per ADR 0015 the DB is the authoritative source; this mirror is
      # for human readability.
      - "Tuckman & Serrat (2022), Fixed Income Securities, 4th ed., Wiley, Ch. 22 (Inflation-Indexed Bonds)"
      - "Per-country primary issuer documentation: US Treasury / TreasuryDirect (TIPS); UK DMO (Index-Linked Gilts); Agence France Trésor (OATei); Bank of Canada (Real Return Bonds)"

    built_date: 2026-05-21
    validation_status: >-
      Stage 1–3 complete (Phase-1 pilot under the new standards);
      source-material verification pending — tracked at
      rates_agent/inflation_indexed_bonds/tools/real_yield_level/LIFECYCLE_CHECKLIST.md
      Stage 8.

  # ---------------------------------------------------------------------------
  # BOND-IMPLIED BREAKEVEN INFLATION (nominal − linker real yield)
  # ---------------------------------------------------------------------------

  - name: calculate_breakeven_inflation_simple
    domain: rates
    sub_agent: inflation_indexed_bonds
    bucket: 1A
    category: cross_market_rv
    status: built

    implementation:
      mcp_server: rates_agent/inflation_indexed_bonds/mcp_server.py
      tool_function: calculate_breakeven_inflation_simple_tool
      schema: rates_agent/inflation_indexed_bonds/tools/breakeven_inflation_simple/schemas.py::BreakevenInflationSimpleInput
      compute: rates_agent/inflation_indexed_bonds/tools/breakeven_inflation_simple/compute.py::calculate_breakeven_inflation_simple
      config: rates_agent/inflation_indexed_bonds/tools/breakeven_inflation_simple/config.yaml

    one_liner: >-
      What inflation rate is the bond market pricing in for the US, UK,
      France, or Canada?  See breakeven inflation — the gap between a
      nominal government bond yield and the matching inflation-linked
      bond's real yield — with today's move and how stretched it is vs
      the past year.  (Inflation compensation, not a clean
      expected-inflation read.)
    # PM-facing tagline (shown on the Library card).  Lock convention
    # per docs_revamped/03_standards/lifecycle_checklist_template.md
    # Stage 1C: one_liner must be desk-PM-facing prose, NOT internal
    # engineer-facing.  The inflation-compensation caveat is kept
    # because misreading a breakeven as expected inflation is a desk
    # error; the full methodology detail lives in this tool's README +
    # the DB tool_metadata.desk_narrative field.

    bucket_rationale: >-
      Deterministic arithmetic on two stored yield series (nominal −
      linker real, same country + tenor). Methodology pinned in
      config.yaml; no model state. The rolling-z-score model surface
      (window / min_periods / ddof) plus field_name are exposed as
      Pydantic Input overrides per the Phase-1 methodology-exposure
      standard (docs_revamped/03_standards/methodology_exposure.md);
      remaining conventions (period offsets, fetch buffer, ffill,
      rounding, trailing range) stay YAML-locked. Same z-score
      conventions as the other Bucket-1A simple-spread primitives;
      the same-country / no-proxy guards live in code.

    # Mirror of config.yaml ``conventions.<name>.exposure.expose: true``
    # entries.  Derived; do not hand-edit without updating the YAML.
    # See docs_revamped/03_standards/methodology_exposure.md §4 (propagation chain).
    pm_overridable:
      - z_score_window_days
      - z_score_min_periods
      - z_score_ddof
      - default_field_name

    related_tools:
      - get_real_yield_level_tool
      - get_yield_levels_tool
      - calculate_forward_breakeven_simple_tool
      - calculate_inflation_swap_rate_level_tool

    workflows: []

    references:
      - docs/technical_debt.md  # TD #32 — carry-adjusted breakeven blocker
      - docs/technical_debt.md  # TD #33 — composition cascade
      # Mirror of macro_data.tool_metadata.theoretical_reference for this
      # tool (set in database/migrations/2026-05-28_phase1_calculate_breakeven_inflation_simple_curated.sql).
      # Per ADR 0015 the DB is the authoritative source; this mirror is
      # for human readability.
      - "Tuckman & Serrat (2022), Fixed Income Securities, 4th ed., Wiley, Ch. 22 (Inflation-Indexed Bonds; breakeven decomposition)"
      - "Per-country primary issuer documentation: US Treasury / TreasuryDirect (TIPS); UK DMO (Index-Linked Gilts); Agence France Trésor (OATei); Bank of Canada (Real Return Bonds)"

    built_date: 2026-05-21
    validation_status: >-
      Stages 1–7 implemented under the Phase-1 standards; Stage 3
      curated-metadata migration checked in but not yet applied to the
      live DB, and source-material verification pending — tracked at
      rates_agent/inflation_indexed_bonds/tools/breakeven_inflation_simple/LIFECYCLE_CHECKLIST.md
      Stage 8.

