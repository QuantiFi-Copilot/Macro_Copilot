playbook_name: "sovereign_bonds"
playbook_version: "1.2"
asset_class: "rates"
dataset_name: "sovereign_bonds"
description: "Daily sovereign benchmark curve points for core liquid macro sovereign markets for PCA, slope/curvature, and z-score monitoring."

extraction:
  start_date: "2005-01-01"
  incremental_window_days: 14

target_metrics:
  - metric_id: "yield_mid"
    bloomberg_field: "YLD_YTM_MID"

# Static/reference fields are fetched once per ticker and stamped onto each row
# so instrument_master can be populated without changing ingest_parquet.py.
reference_metrics:
  - column_name: "maturity_date"
    bloomberg_field: "MATURITY"
  - column_name: "security_name"
    bloomberg_field: "SECURITY_DES"

