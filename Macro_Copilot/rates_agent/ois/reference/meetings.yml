# Central-bank meeting calendar.
# ==============================
# Used by the ois_meeting_pricing tool.  Dates are the day the rate
# decision / statement is published (end of meeting for the two-day FOMC,
# the single announcement day for others).
#
# The schema is:
#
#   <BANK_KEY>:
#     - date: YYYY-MM-DD
#       label: "Human-readable label"
#     - date: ...
#
# BANK_KEY values are the canonical uppercase identifiers used in
# CENTRAL_BANK_TO_OIS_CURVE (FED, ECB, BOE, BOJ, RBA, BOC).
#
# Seed data below covers FOMC through end-2027 (fully scheduled), and
# approximate schedules for ECB / BoE / BoJ / RBA / BoC.  Update as the
# calendars are officially announced.  No math depends on these dates
# being exactly right — they're just reference points the pricing tool
# walks between when computing forwards.

