      - bond_futures
    concept_summary: Front-month bond-futures price level, 252-day historical range, and z-score. CTD-of-rolling-generic price (NOT a clean tenor-anchored yield).
    why_new_concept: Futures price level is a futures-native object with its own quote units and activity context; it is not a sovereign yield-level clone.
    why_standard: A rates PM immediately recognizes TY/RX/Gilt futures level as a standard desk object — even in the V1 monitors-only form.
    required_playbooks:
      - rates_agent/playbooks/bond_futures.yml
    required_metrics:
      - last_price
    required_reference_metrics:
      - quote_units
      - contract_size
      - expiry_date
      - security_name
    reference_manifest: manifesto/01_instruments/rates_agent/03_bond_futures.md:337
    reference_tools:
      - rates_agent/sovereign_bonds/tools/yield_levels
    methodology_guardrails:
      - Output methodology card must disclose "rolling-generic price; CTD-implied yield is not yet a primitive in this build" per ADR 0011 and P5 (honest disclosure).
      - Must use the `contract_code` disambiguator (TY1 / UXY1 / US1 / WN1 / RX1 / JB1 / ...) as the canonical instrument identifier per TD#11.
    no_go_if_missing:
      - last_price history
      - quote_units
      - contract_size

