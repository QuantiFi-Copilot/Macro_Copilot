# =============================================================================
# calculate_forward_breakeven_simple_tool — tool configuration
# =============================================================================
# Canonical record of the forward-breakeven-inflation tool's
# conventions and methodology.  Loaded by ``shared.config.load_tool_config``
# at compute() time.  Every shared convention (z_score_window_days,
# z_score_min_periods, z_score_ddof, z_score_buffer_multiplier,
# ffill_limit_days, default_field_name, period offsets, trailing range
# window, bps/yield/z-score rounding) carries the same numeric value as
# the linker breakeven_inflation_simple, real_yield_level, and sovereign
# yield_levels tools — the cross-config lint enforces value-agreement
# across every tool that declares the same convention name.  Drift on
# any of those is caught.
#
# Concept honesty
# ---------------
# This tool returns a FORWARD bond-implied breakeven inflation —
# i.e. the implied inflation-compensation differential between a
# nominal sovereign and a sovereign linker over a forward window
# (5Y5Y, 5Y10Y, 2Y3Y, etc.) at the same country.  Like its spot
# counterpart, the result is INFLATION COMPENSATION, NOT a clean
# forward expected-inflation read: each endpoint breakeven carries an
# inflation risk premium and a relative liquidity premium between the
# nominal sovereign and the linker bond, and the year-weighted
# differential inherits both.  The honesty disclosure lives in
# ``methodology.what_it_does`` below and is threaded onto the wire
# via ``current_metrics.methodology_label`` — sourced from this YAML
# at runtime, NOT hardcoded in Python.
#
# Forward formula (year-weighted linear)
# --------------------------------------
# The desk-recognisable read for a forward breakeven (5Y5Y in
# particular) is the year-weighted differential of the two endpoint
# breakevens:
#
#   forward_breakeven = (BE_long * T_long − BE_short * T_short)
#                     / (T_long − T_short)
#
# where BE_short / BE_long are the spot bond-implied breakevens at
# ``start_tenor`` / ``end_tenor`` (each computed by
# ``breakeven_inflation_simple``) and T_short / T_long are the
# corresponding year fractions.  This is what most rates desks
# actually display when they say "5Y5Y breakeven" and avoids
# inventing a discount-factor decomposition for what is already an
# inflation-compensation differential rather than a true zero-coupon
# rate.  See ``methodology.assumptions`` for the rationale and
# ``forward_compounding_mode`` below for the convention key that
# encodes the choice.
#
# In V1 deterministic mode there is NO LLM-facing override path for
# conventions.  See docs/architecture/tool_architecture.md.
# =============================================================================

tool:
  name: calculate_forward_breakeven_simple_tool
  domain: inflation_indexed_bonds
  description: |
    Forward bond-implied breakeven inflation between two same-country
    curve points (e.g. 5Y5Y, 5Y10Y, 2Y3Y).  Composes two spot
    breakevens computed by
    ``calculate_breakeven_inflation_simple`` (one at ``start_tenor``,
    one at ``end_tenor``) into a year-weighted forward:

      forward_breakeven_bps =
          (BE_long_bps * T_long − BE_short_bps * T_short)
          / (T_long − T_short)

    where T_short / T_long are the calendar year fractions of the
    two endpoint tenors.  Inputs are restricted to tenor-pair mode
    in this primitive's V1 (date-window mode is documented in
    ``methodology.planned_extensions``).

    Returns the current forward breakeven (in pct AND bps),
    daily/weekly/monthly bps changes, rolling 252-day z-score (in
    bps), trailing 252-day high/low/percentile (in bps), the
    rolling-window length, plus the two endpoint breakevens and
    year fractions used to form the forward so the desk can
    sanity-check the decomposition.  Also emits a bespoke
    wire-frozen ``time_series`` history of the forward breakeven
    (in bps) over the displayed ``lookback_days`` window AND the
    canonical ``shared.schemas.time_series.TimeSeries`` payloads
    (BPS for the forward breakeven, Z_SCORE for the rolling
    z-score) so the workflow / operator layer can compose without
    per-tool custom shapes.

    Same-country invariant
    ----------------------
    The two legs MUST come from the same issuer — i.e. share both
    ``country`` and ``currency`` as stored in
    ``macro_data.instrument_master``.  The invariant is enforced
    in code by the spot breakeven primitive's
    ``_enforce_same_country_invariant`` helper, which fires
    BEFORE either market-data SELECT.  Cross-country pairs (e.g.
    ``DE_BUND + EUR_FR_LINKER`` — same currency, different
    country; or ``UK_GILT + USD_TIPS`` — different currency) are
    refused with a controlled error envelope.

    Wire honesty: the output's ``methodology_label`` field is
    sourced from ``methodology.what_it_does`` below — NOT a
    hardcoded literal — so a YAML edit to the disclosure flows
    through to runtime.

  category: desk_invariant_primitive

conventions:

  # ---------------------------------------------------------------------------
  # Z-score window length (trading days)
  # ---------------------------------------------------------------------------
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading-day count for a 1-year rolling window.  Matches every
      sovereign rates tool, the OIS level/spread/forward tools, and
      the linker real_yield_level / breakeven_inflation_simple tools
      — the cross-config lint enforces the match.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Minimum observations before the rolling stat is emitted
  # ---------------------------------------------------------------------------
  z_score_min_periods:
    value: 60
    source: team_judgment_pending_review
    rationale: >-
      ~3 months of observations before the rolling mean / std are
      deemed trustworthy.  Matches sovereign yield_levels /
      cross_market_spread / OIS rate_level / linker real_yield_level
      / linker breakeven_inflation_simple.
    valid_range: [20, 252]

  # ---------------------------------------------------------------------------
  # Standard deviation degrees of freedom
  # ---------------------------------------------------------------------------
  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Sample standard deviation (Bessel-corrected, ddof=1).  Matches
      pandas' default and the convention every other rates tool uses.

  # ---------------------------------------------------------------------------
  # Calendar-day buffer for the fetch window
  # ---------------------------------------------------------------------------
  z_score_buffer_multiplier:
    value: 1.5
    source: derived_from_window
    rationale: >-
      Calendar-day buffer added to the fetch window so the rolling
      z-score AND the trailing range stat are both fully populated
      from the first displayed trading day.  1.5x trading-day window
      covers weekends + holidays.  Matches every other rates tool.
    valid_range: [1.2, 2.0]

  # ---------------------------------------------------------------------------
  # Period-change offsets (in trading-day rows after ffill)
  # ---------------------------------------------------------------------------
  daily_change_offset_rows:
    value: 2
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-2] = 1 trading day back.  The forward
      breakeven series is in bps so changes go through
      period_changes(already_bps=True), i.e. plain subtraction (no
      *100 multiplier).
    valid_range: [2, 5]

  weekly_change_offset_rows:
    value: 6
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-6] = 5 trading days back ≈ 1 calendar week.
    valid_range: [5, 10]

  monthly_change_offset_rows:
    value: 22
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-22] = ~1 calendar month of trading days.
    valid_range: [20, 30]

  # ---------------------------------------------------------------------------
  # Trailing range / percentile window — LOCKED at 252 in V1
  # ---------------------------------------------------------------------------
  # The output schema's field names (high_252d_bps, low_252d_bps,
  # percentile_252d) embed the number; compute() raises
  # NotImplementedError if this is set to anything else.  Same
  # wire-freeze as breakeven_inflation_simple / cross_market_spread /
  # yield_levels / real_yield_level / OIS rate_level / OIS forward_rate.
  trailing_range_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      1Y trailing for high/low/percentile.  Locked at 252 in V1
      because the wire field names embed the number.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Forward-fill limit for missing observations
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Bridge up to one trading week of missing data across holiday
      gaps.  Matches every other rates tool; the consistency lint
      enforces the match where declared.
    valid_range: [1, 10]

  # ---------------------------------------------------------------------------
  # Output rounding precision — bps (forward breakeven, period changes,
  # range, endpoint breakevens)
  # ---------------------------------------------------------------------------
  bps_round_decimals:
    value: 2
    source: team_judgment_pending_review
    rationale: >-
      Round bps output (current forward breakeven, daily/weekly/
      monthly changes, trailing high/low, endpoint breakevens) to
      0.01 bps.  Display precision; matches sovereign
      cross_market_spread / OIS spread tools / linker
      breakeven_inflation_simple.  Threaded explicitly into
      period_changes(decimals=...) so the delta_bps default of 2
      cannot silently shadow a YAML override.
    valid_range: [0, 6]

  # ---------------------------------------------------------------------------
  # Output rounding precision — z-score
  # ---------------------------------------------------------------------------
  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches the legacy default in
      ``shared.analytics.spreads.rolling_zscore`` and every other
      rates tool that exposes this convention.  Threaded to
      safe_float at the output boundary so a YAML override above 4 is
      not silently truncated by safe_float's own default of 4.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Output rounding precision — yields / pct (the forward breakeven in
  # pct on the snapshot)
  # ---------------------------------------------------------------------------
  yield_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches the legacy hardcoded default in
      ``shared.analytics.levels.compute_level_metrics`` and every
      sovereign / linker level tool, including
      breakeven_inflation_simple's ``breakeven_pct`` field.  Used
      here for the snapshot's ``forward_breakeven_pct`` field.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Per-window-year display rounding (start_years, end_years)
  # ---------------------------------------------------------------------------
  # Endpoint year fractions are constants in tenor-pair mode (the
  # only mode supported in V1) — but rounding keeps display precision
  # uniform with OIS forward_rate's ``start_years`` / ``end_years``
  # fields and prepares the wire shape for date-window mode (planned
  # extension), where day-count arithmetic produces non-integer
  # values like 1.0027777….
  window_years_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Display-precision rounding for the start_years / end_years
      fields in current_metrics.  4 decimals matches the OIS
      forward_rate value the cross-config lint enforces; this tool
      reuses the same convention name + value.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Default Bloomberg observation field for both legs (both endpoints)
  # ---------------------------------------------------------------------------
  # Linkers and nominal sovereigns publish their yield-to-maturity
  # under the same Bloomberg ``YLD_YTM_MID`` mnemonic.  Reusing the
  # convention name + value keeps the cross-config lint clean.
  # LLM/HTTP wrappers MUST use the empty/None sentinel so this
  # default flows through.  This default is passed unchanged to BOTH
  # the start-tenor and end-tenor inner breakeven_inflation_simple
  # calls (both legs of both endpoints).
  default_field_name:
    value: YLD_YTM_MID
    source: bloomberg_field_convention
    rationale: >-
      Mid yield-to-maturity is the canonical observation for both
      nominal sovereigns AND inflation linkers — the difference is the
      underlying instrument_type, not the field code.  The
      instrument-type discriminator is enforced in code on the DB
      read for both legs at both endpoints (inherited from the spot
      breakeven primitive's no-proxy guard); this default applies to
      every leg of every endpoint unless the caller explicitly
      overrides per query.

  # ---------------------------------------------------------------------------
  # Forward-formula compounding mode — code-honest declaration of the
  # math the tool actually runs
  # ---------------------------------------------------------------------------
  # The desk-recognisable read for a forward bond-implied breakeven
  # (5Y5Y in particular) is the year-weighted differential of the
  # two endpoint breakevens:
  #
  #   forward_breakeven = (BE_long * T_long - BE_short * T_short)
  #                     / (T_long - T_short)
  #
  # ``year_weighted_linear`` encodes that choice.  The alternative
  # ``dual_compounding`` mode (mirrors OIS forward_rate's
  # discount-factor bootstrap) is documented in
  # ``methodology.planned_extensions`` and is NOT yet implemented;
  # ``compute()`` raises NotImplementedError if this convention is
  # set to anything other than ``year_weighted_linear``.  The
  # methodology_label on the wire surfaces the chosen formula and
  # moves in lockstep with this convention so a desk user can
  # never see a label that disagrees with the math.
  forward_compounding_mode:
    value: year_weighted_linear
    source: team_judgment_pending_review
    rationale: >-
      Year-weighted linear is the standard desk read for "5Y5Y
      breakeven".  It avoids inventing a discount-factor
      decomposition for what is already an inflation-compensation
      differential rather than a true zero-coupon rate, and it
      composes the two spot bond-implied breakevens additively so
      the snapshot decomposition (start_breakeven_bps,
      end_breakeven_bps, start_years, end_years) is auditable
      directly from the wire.  Tagged as
      ``team_judgment_pending_review`` because the alternative
      ``dual_compounding`` mode (the OIS forward_rate bootstrap
      shape) is desk-recognised and may ship as a separate
      convention value once the trade-off has been validated
      against external desk pricing.  Until then the only legal
      value is ``year_weighted_linear``; a YAML edit to anything
      else fails fast in compute() with a NotImplementedError
      pointing back to ``methodology.planned_extensions``.  The
      Convention schema does not accept a ``valid_values`` list
      for string conventions (only ``valid_range`` for numerics);
      the closed-set constraint therefore lives in
      ``compute._conventions_from_config`` and is part of the
      contract this rationale documents.

methodology:
  what_it_does: |
    Forward bond-implied breakeven inflation / forward inflation
    compensation between two same-country curve points
    (e.g. 5Y5Y, 5Y10Y, 2Y3Y).  Computed via the YEAR-WEIGHTED
    LINEAR formula:

      forward_breakeven_bps =
          (BE_long_bps * T_long - BE_short_bps * T_short)
          / (T_long - T_short)

    where ``BE_short_bps`` and ``BE_long_bps`` are the spot
    bond-implied breakevens at ``start_tenor`` and ``end_tenor``
    respectively (each computed by
    ``calculate_breakeven_inflation_simple`` — same instrument-type
    no-proxy guard, same same-country invariant), and ``T_short`` /
    ``T_long`` are the calendar year fractions of the two endpoint
    tenors.

    Same-country construction only: the nominal sovereign and linker
    legs must share country and currency (e.g. UST + USD_TIPS,
    UK_GILT + GBP_LINKER, FR_OAT + EUR_FR_LINKER, CANADA_GOVT +
    CAD_RRB).  Cross-country pairs (e.g. DE_BUND vs EUR_FR_LINKER,
    or UK_GILT vs USD_TIPS) are refused at compute time with a
    controlled error envelope; this invariant is enforced in code
    (not via a YAML allow-list) per DESIGN_PRINCIPLES.md §5 and
    is inherited from the spot breakeven primitive's
    ``_enforce_same_country_invariant`` helper which fires BEFORE
    any market-data SELECT.

    The output is FORWARD INFLATION COMPENSATION, NOT a clean
    forward expected-inflation read, because each endpoint
    breakeven carries an inflation risk premium and a relative
    liquidity premium between the nominal sovereign and the linker
    — the year-weighted forward inherits both.  Use as a proxy for
    forward inflation expectations only with that caveat in mind.

  assumptions:
    - "Year-weighted linear forward formula
       (``forward_compounding_mode = year_weighted_linear``).  Chosen
       because it is the desk-standard read for 5Y5Y / 5Y10Y / 2Y3Y
       breakeven forwards and because it avoids inventing a
       discount-factor decomposition for what is already an
       inflation-compensation differential rather than a true
       zero-coupon rate.  The dual-compounding alternative (mirrors
       OIS forward_rate's bootstrap) is documented in
       ``planned_extensions`` and is NOT implemented in V1; compute()
       raises NotImplementedError on any other value of
       ``forward_compounding_mode`` so the wire-disclosed formula
       cannot drift from the math."
    - "Tenor year fractions are computed via
       ``shared.analytics.curve_bootstrap.tenor_to_years`` so the
       parser is shared with OIS forward_rate (no bespoke parser).
       Tenor mode is the only input mode supported in V1 — see
       ``planned_extensions`` for date-window mode."
    - "Each endpoint breakeven is computed by composing
       ``calculate_breakeven_inflation_simple`` twice (once per
       endpoint tenor), passing the same ``ToolConfig`` so
       methodology stays consistent.  This inherits the spot
       primitive's no-proxy guard (instrument_type filter on each
       leg) and same-country invariant (instrument_master
       (country, currency) check before any market-data SELECT) for
       free.  The two inner calls are independent fetches; this is
       the deliberately-simple path documented in the build report."
    - "If either endpoint breakeven returns its own controlled
       error envelope, this tool surfaces a controlled error envelope
       of its own that names which endpoint(s) failed and propagates
       the inner error context so the operator can route the fix to
       the right slot."
    - "Forward breakeven series is in BPS throughout — both endpoints
       are converted to bps via the spot primitive (which already
       returns ``breakeven_bps`` per row) and the year-weighted
       arithmetic is performed in bps.  ``daily/weekly/monthly``
       changes use period_changes with already_bps=True (plain
       subtraction); ``bps_round_decimals`` is threaded through
       explicitly so the YAML is authoritative."
    - "The snapshot's ``forward_breakeven_bps`` equals
       ``time_series[-1].forward_breakeven_bps`` and
       ``time_series_forward.rows[-1].value`` bit-for-bit at the
       YAML's ``bps_round_decimals``; same boundary-rounding
       discipline as OIS forward_rate / breakeven_inflation_simple."
    - "lookback_days controls the *display* window (and the bespoke
       time_series row count + canonical TimeSeries length), NOT the
       rolling z-score window or the trailing range window — those
       are independent conventions in this YAML."
    - "Latest-observation cutoff for the displayed window is
       anchored to the data's latest aligned trade_date (matching
       OIS rate_level / linker real_yield_level / linker
       breakeven_inflation_simple).  Sovereign cross_market_spread
       anchors to date.today(); the inconsistency is documented in
       cross_market_spread's planned_extensions."
    - "Inputs disallow start_tenor == end_tenor and
       start_years >= end_years (computed via tenor_to_years); both
       are structural constraints enforced by the input schema /
       resolver in code (not YAML), per DESIGN_PRINCIPLES.md §5."

  citations: []

  planned_extensions:
    - "trailing_range_window_days: configurable.  Currently locked
       at 252 because the output fields high_252d_bps / low_252d_bps
       / percentile_252d embed the number.  Path to configurability:
       rename schema fields to high_window_bps / low_window_bps /
       percentile_window + add trailing_window_days to the output;
       remove the NotImplementedError guard in compute().  Same
       wire-freeze as breakeven_inflation_simple /
       cross_market_spread / yield_levels / real_yield_level."
    - "Date-window input mode (``start_date`` / ``end_date``) for
       ad-hoc forward windows aligned to specific calendar events
       (e.g. central-bank meeting dates).  Per-trade-date anchoring
       would re-compute year fractions per day from the curve's
       day-count basis, mirroring OIS forward_rate's date-window
       mode.  Deferred from V1 so the wire shape stays minimal —
       tenor mode is the canonical desk read for 5Y5Y-style
       forwards and covers the catalog's
       ``concept_summary``."
    - "Dual-compounding forward formula
       (``forward_compounding_mode = dual_compounding``).  Mirrors
       OIS forward_rate's bootstrap: build a discount factor per
       endpoint breakeven via
       ``shared.analytics.curve_bootstrap``'s simple-for-T<=1Y /
       annual-for-T>1Y dual compounding, then forward = (DF_short /
       DF_long - 1) / (T_long - T_short).  Not yet implemented;
       requires a desk-pricing validation against the year-weighted
       linear default to confirm whether a desk user expects either
       (depending on quoting context).  When implemented, the
       ``methodology_label`` MUST move in lockstep with the
       convention so the wire-disclosed formula cannot disagree with
       the math; the SQL validator must update its independent
       reproduction at the same time."
    - "Inflation-risk-premium- and liquidity-premium-adjusted
       forward breakeven.  The 'simple' suffix mirrors the spot
       primitive: a desk-grade forward expected-inflation read needs
       IRP / liquidity adjustments that depend on metadata the repo
       does not yet ingest.  When that lands, the adjusted variant
       ships as a separate primitive (different concept), NOT as a
       config knob on this one."
