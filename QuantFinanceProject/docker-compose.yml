# ─────────────────────────────────────────────────────────────
# docker-compose.yml  –  QuantFinanceProject
# One image powers both worker & streamer; credentials unified
# ─────────────────────────────────────────────────────────────

volumes:
  tsdata:
  pgadmin-data:
  grafana-storage:
  metabase-data:

services:
########################################## GENERAL PROJECT SERVICES ##########################################
  tsdb:
    image: timescale/timescaledb:latest-pg14
    container_name: tsdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: quantdata
      POSTGRES_USER: quantuser
      POSTGRES_PASSWORD: myStrongPass
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data
      - ./docker/00_set_timezone.sql:/docker-entrypoint-initdb.d/00_tz.sql:ro
      - ./market_data_agent/storage/schema.sql:/docker-entrypoint-initdb.d/10_market_data_schema.sql:ro
      - ./earnings_agent/storage/schema.sql:/docker-entrypoint-initdb.d/20_earnings_data_schema.sql:ro
      - ./earnings_agent/storage/30_earnings_data_views.sql:/docker-entrypoint-initdb.d/30_earnings_data_views.sql:ro
    # --- MODIFIED: Added healthcheck to ensure DB is ready ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantuser -d quantdata"]
      interval: 5s
      timeout: 5s
      retries: 5
    # --------------------------------------------------------

# ─────────────────────────────────────────────────────────────
  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: prefect-server
    restart: unless-stopped
    # --- MODIFIED: Now waits for tsdb to be healthy ---
    depends_on:
      tsdb:
        condition: service_healthy
    # --------------------------------------------------
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: "postgresql+asyncpg://quantuser:myStrongPass@tsdb:5432/quantdata"
      TZ: Asia/Kolkata
    ports:
      - "4200:4200"
    command: "prefect server start --host 0.0.0.0"

# ─────────────────────────────────────────────────────────────
  project-image:
    build:
      context: .
      dockerfile: Dockerfile
    image: quantfinanceproject:latest

# ─────────────────────────────────────────────────────────────
  prefect-worker:
    image: quantfinanceproject:latest
    container_name: prefect-worker
    restart: unless-stopped
    # --- MODIFIED: Now waits for server and healthy DB ---
    depends_on:
      prefect-server:
        condition: service_started
      tsdb:
        condition: service_healthy
    # -----------------------------------------------------
    working_dir: /app
    shm_size: 1g
    volumes:
      - .:/app
      - ./.env:/app/.env                      
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      TZ: Asia/Kolkata
    command: >
      bash -c "
        micromamba run -n quant-env prefect work-pool create default-agent-pool --type process || true &&
        micromamba run -n quant-env prefect worker start --pool default-agent-pool --type process
      "

  ########################################## MARKET DATA SERVICES ##########################################
  market-streamer:
    image: quantfinanceproject:latest
    container_name: market-streamer
    restart: unless-stopped
    # --- MODIFIED: Now waits for tsdb to be healthy ---
    depends_on:
      tsdb:
        condition: service_healthy
    # --------------------------------------------------
    working_dir: /app
    shm_size: 1g
    volumes:
      - .:/app
      - ./.env:/app/.env
    environment:
      MARKET_DB_NAME: quantdata
      MARKET_DB_USER: quantuser
      MARKET_DB_PASSWORD: myStrongPass
      MARKET_DB_HOST: tsdb
      MARKET_DB_PORT: "5432"
      TZ: Asia/Kolkata
    command: >
      micromamba run -n quant-env python -m market_data_agent.ingestion.stream_intraday_1m
  ######################################### EARNINGS DATA SERVICES ##########################################
  xbrl-ingestion:
    image: quantfinanceproject:latest      # same as project-image
    container_name: xbrl-ingestion
    restart: "no"
    depends_on:
      tsdb:
        condition: service_healthy         # wait for the DB :contentReference[oaicite:1]{index=1}
    working_dir: /app
    volumes:
      - .:/app                             # mount code
      - ./.env:/app/.env                   # mount creds/config
      - ./earnings_agent/storage:/app/earnings_agent/storage 
    environment:
      # ensure your DB_HOST is the Docker service name
      - EARNINGS_DB_HOST=tsdb              # default in database.py :contentReference[oaicite:2]{index=2}
      - EARNINGS_DB_USER=${EARNINGS_DB_USER}
      - EARNINGS_DB_PASSWORD=${EARNINGS_DB_PASSWORD}
      - EARNINGS_DB_NAME=${EARNINGS_DB_NAME}
      - EARNINGS_DB_SCHEMA=${EARNINGS_DB_SCHEMA}
      - TZ=Asia/Kolkata
    command: [
      "micromamba", "run", "-n", "quant-env",
      "python", "-m", "earnings_agent.ingestion.fetch_xbrl"
    ]
# ─────────────────────────────────────────────────────────────
  xbrl-parser:
    image: quantfinanceproject:latest
    container_name: xbrl-parser
    restart: "no" # This is a one-off task
    depends_on:
      tsdb:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./.env:/app/.env
    environment:
      # Pass database credentials to the container
      - EARNINGS_DB_HOST=tsdb
      - EARNINGS_DB_USER=${EARNINGS_DB_USER}
      - EARNINGS_DB_PASSWORD=${EARNINGS_DB_PASSWORD}
      - EARNINGS_DB_NAME=${EARNINGS_DB_NAME}
      - TZ=Asia/Kolkata
    command: [
      "micromamba", "run", "-n", "quant-env",
      "python", "-m", "earnings_agent.parsing.parse_xbrl"
    ]
# ─────────────────────────────────────────────────────────────

  earnings-validator:
    image: quantfinanceproject:latest
    container_name: earnings-validator
    restart: "no" # This is a one-off task
    depends_on:
      tsdb:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./.env:/app/.env
    environment:
      # Pass database credentials to the container
      - EARNINGS_DB_HOST=tsdb
      - EARNINGS_DB_USER=${EARNINGS_DB_USER}
      - EARNINGS_DB_PASSWORD=${EARNINGS_DB_PASSWORD}
      - EARNINGS_DB_NAME=${EARNINGS_DB_NAME}
      - TZ=Asia/Kolkata
    command: [
      "micromamba", "run", "-n", "quant-env",
      "python", "-m", "earnings_agent.validation.validate_earnings"
    ]
################################################################################
# DATABASE GUI stack
################################################################################
  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      PGADMIN_DEFAULT_EMAIL: saivenkatsriram@google.com
      PGADMIN_DEFAULT_PASSWORD: changeme123
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    # --- MODIFIED: Now waits for tsdb to be healthy ---
    depends_on:
      tsdb:
        condition: service_healthy
    # --------------------------------------------------

  grafana:
    image: grafana/grafana-oss:11.0.0
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    # --- MODIFIED: Now waits for tsdb to be healthy ---
    depends_on:
      tsdb:
        condition: service_healthy
    # --------------------------------------------------

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3001:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Kolkata"
    volumes:
      - metabase-data:/metabase-data
    # --- MODIFIED: Now waits for tsdb to be healthy ---
    depends_on:
      tsdb:
        condition: service_healthy
    # --------------------------------------------------