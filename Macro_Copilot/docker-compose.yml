volumes:
  macro-tsdata:
  macro-metabase-data:
  macro-prefect-data: # Added so Prefect state persists
  macro-superset-data:
  macro-redis-data:
services:
  ########################################## GENERAL INFRASTRUCTURE ##########################################
  tsdb:
    image: timescale/timescaledb:latest-pg14
    container_name: macro-tsdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: macrodata
      POSTGRES_USER: quantuser
      POSTGRES_PASSWORD: myStrongPass
      TZ: Europe/London
    ports:
      - "5433:5432"
    volumes:
      - macro-tsdata:/var/lib/postgresql/data
      # Layer A: The Global Foundation (Runs first)
      - ./database/schema.sql:/docker-entrypoint-initdb.d/10_schema.sql:ro
      # Layer B: The Rates Domain View (Runs second)
      - ./rates_agent/storage/views/sovereign_curves_view.sql:/docker-entrypoint-initdb.d/20_sovereign_curves_view.sql:ro
      # Rates Instruments Manifest View
      - ./rates_agent/storage/views/rates_instruments_view.sql:/docker-entrypoint-initdb.d/30_rates_instruments_view.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantuser -d macrodata"]
      interval: 5s
      timeout: 5s
      retries: 5
  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: macro-prefect-server
    restart: unless-stopped
    environment:
      TZ: Europe/London
    ports:
      - "4200:4200"
    volumes:
      - macro-prefect-data:/root/.prefect
    command: "prefect server start --host 0.0.0.0"

  ########################################## AGENT WORKSPACE ##########################################
  macro-base-image:
    build:
      context: .
      dockerfile: Dockerfile
    image: macro-project:latest

  prefect-worker:
    image: macro-project:latest
    container_name: macro-prefect-worker
    restart: unless-stopped
    depends_on:
      prefect-server:
        condition: service_started
    working_dir: /app
    volumes:
      - .:/app
      - ./.env:/app/.env                      
    environment:
      PREFECT_API_URL: http://macro-prefect-server:4200/api
      TZ: Europe/London
    command: >
      bash -c "
        micromamba run -n macro-env prefect work-pool create macro-agent-pool --type process || true &&
        micromamba run -n macro-env prefect worker start --pool macro-agent-pool --limit 5
      "

  rates-agent-dev:
    image: macro-project:latest
    container_name: rates-agent-dev
    restart: unless-stopped
    depends_on:
      tsdb:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./.env:/app/.env
    environment:
      DB_HOST: tsdb
      DB_PORT: 5432
      DB_USER: quantuser
      DB_PASSWORD: myStrongPass
      DB_NAME: macrodata
      TZ: Europe/London
    command: ["tail", "-f", "/dev/null"]

  ########################################## UTILITY JOBS ##########################################
  parquet-ingestion:
    image: macro-project:latest
    container_name: macro-parquet-ingestion
    restart: "no" # Runs once and exits cleanly
    depends_on:
      tsdb:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./.env:/app/.env
    environment:
      DB_HOST: tsdb
      DB_PORT: 5432
      DB_USER: quantuser
      DB_PASSWORD: myStrongPass
      DB_NAME: macrodata
      TZ: Europe/London
    # Executes the ingestion module
    command: ["micromamba", "run", "-n", "macro-env", "python", "-m", "ingestion.ingest_parquet"]

  push-playbooks:
    image: macro-project:latest
    container_name: macro-push-playbooks
    restart: "no" # Runs once and exits cleanly
    depends_on:
      tsdb:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./.env:/app/.env
    environment:
      # The render step (step 2 below) expands resolver-enabled playbooks
      # against macro_data.otr_history, so this service needs the DB.
      DB_HOST: tsdb
      DB_PORT: 5432
      DB_USER: quantuser
      DB_PASSWORD: myStrongPass
      DB_NAME: macrodata
      TZ: Europe/London
    # Pushes EVERY playbook in one run (ADR 0007):
    #   1. push_playbooks.py            — static playbooks, uploaded verbatim;
    #                                     resolver-enabled playbooks are
    #                                     deliberately skipped here.
    #   2. render_effective_universe.py — resolver-enabled playbooks, whose
    #                                     universe is expanded (seed + every
    #                                     non-matured bond in otr_history)
    #                                     before upload.
    command: ["micromamba", "run", "-n", "macro-env", "sh", "-c", "python utils/push_playbooks.py && python utils/render_effective_universe.py"]
    
  ########################################## BI & VISUALIZATION ##########################################
  metabase:
    image: metabase/metabase:latest
    container_name: macro-metabase
    ports:
      - "3001:3000"
    environment:
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Europe/London"
    volumes:
      - macro-metabase-data:/metabase.db
    depends_on:
      tsdb:
        condition: service_healthy  
  redis:
    image: redis:latest
    container_name: macro-superset-cache
    restart: unless-stopped
    volumes:
    - macro-redis-data:/data
  superset:
    image: apache/superset:4.1.1
    container_name: macro-superset
    ports:
      - "8088:8088"
    depends_on:
      tsdb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SUPERSET_CONFIG_PATH: "/app/superset_config.py"
    volumes:
      - ./docker/superset_config.py:/app/superset_config.py
      - macro-superset-data:/app/superset_home
    command: >
      bash -c "pip install psycopg2-binary &&
      superset db upgrade &&
      (superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@superset.com --password admin || true) &&
      superset init &&
      /usr/bin/run-server.sh" 
  api-server:
    build: .
    # PR 16: run ``alembic upgrade head`` BEFORE starting uvicorn so
    # the ``copilot_state`` schema (sessions / turns / message_events /
    # working_set / artifact_metadata / dags / workspaces / ...) AND
    # the ``langgraph_checkpoint`` schema namespace both exist on
    # every fresh ``docker compose up``.  Without this, the api comes
    # up but every WebSocket session falls back to InMemorySaver +
    # logs ``copilot_state.sessions does not exist``, which silently
    # disables PR 13's recent-conversation context (load_recent_turns
    # reads from ``copilot_state.turns``).  Migrations are idempotent:
    # a no-op when already at head, fast (<1s).
    #
    # PR 17: ``alembic.ini`` and ``migrations/`` live at the REPO
    # ROOT (one level ABOVE this docker-compose.yml), not inside
    # ``Macro_Copilot/``.  The default ``.:/app`` mount only exposes
    # ``Macro_Copilot/`` to the container, so alembic could not find
    # its config — ``FAILED: No 'script_location' key found in
    # configuration``.  Mount the repo root at ``/repo-root`` so
    # alembic can read its config + version scripts, run migrations
    # from there, then run uvicorn from the regular ``/app`` working
    # dir.  Two volumes, two working dirs, one container.
    command: >
      bash -c "
        cd /repo-root &&
        micromamba run -n macro-env alembic upgrade head &&
        cd /app &&
        micromamba run -n macro-env uvicorn api.server:app --host 0.0.0.0 --port 8000 --reload
      "
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ..:/repo-root
    env_file:
      - .env
    environment:
      - DB_HOST=tsdb
      - DB_PORT=5432
    depends_on:
      tsdb:
        condition: service_healthy