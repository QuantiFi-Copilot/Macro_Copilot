catalog_name: frontend_automation_initial_batch
catalog_version: "1.1"
branch: frontend_automation
execution_mode: one_tool_at_a_time
status_policy:
  allowed_statuses:
    - todo
    - in_progress
    - changes_required          # set after Dispatch 2 if going to Dispatch 3 fix pass
    - waiting_quota
    - blocked
    - done
runtime_managed_fields:
  - status
  - active_step
  - dispatch_round              # 1 (builder), 2 (reviewer), 3 (fix), per SINGLE_REVIEW_ROUND_POLICY.md
  - human_action_required
  - last_error
  - last_review_heading
  - last_gate_result
  - block_reason
selection_principles:
  - Include only backend tools that already pass BUILD_GUIDE.md Stages 1–3 (backend folder + tests + DB curated metadata; the curated migration file is sufficient — the DB write is deferred until human apply).
  - Exclude tools whose backend is blocked or pending source-material verification beyond what we accept.
  - Exclude tools requiring complex bespoke chart shapes (PCA loadings, rolling-regression diagnostics, panel builders) — those need per-tool human design.
  - Exclude tools that already have a real frontend (the Phase-1 dual-view pilots and the legacy regime classifier).
  - Every entry names its reference frontend module (the dual-view parity target the builder reads first).
  - Every entry's `pre_flight_backend_audit` names the four artifacts that must exist on disk BEFORE the builder dispatches (PRE_FLIGHT_BACKEND_AUDIT.md).
  - Every entry depends on the user committing `mockups/Compact.png` + `mockups/Extended.png` into the tool's frontend module folder BEFORE the cron job arms.
  - Every entry carries an explicit `endpoint_slug` for the standalone-bridge typed-detail endpoint at `/api/v1/rates/detail/<endpoint_slug>`.
notes:
  - v1.1 — dropped classify_curve_move_tool (legacy `typedView: 'regime'` + existing surfaces would conflict; deferred to a separate human-led migration). Initial batch is now 9 tools spread across 4 instrument families (3 inflation_indexed_bonds + 3 inflation_swaps + 2 ois + 1 policy_futures).
  - v1.0 — initial batch of 10 tools. Superseded.
  - Bias toward concrete visualisable shapes — 6 butterfly/spread shapes (direct charting), 1 snapshot (scalar), 1 scanner (ranked list), 1 cross-market spread.
  - Two parity targets in use:  `calculate_breakeven_inflation_simple_tool` for spread / multi-leg shapes (its dual-view + Monitor + Shared helper pattern is the most complete reference), and  `get_real_yield_level_tool` for snapshot / scanner shapes (cleaner single-leg shape).
  - Mockup PNGs are the design SOURCE-OF-TRUTH per BUILD_GUIDE.md §Stage 6. The builder reads them as images (Claude Opus vision); the reviewer compares the implementation against the same images.
  - The orchestrator must NOT dispatch the builder until the pre-flight backend audit shows both mockup files committed.
  - The `endpoint_slug` field is the curated kebab-case path the typed-detail route mounts at. These slugs were chosen to mirror the existing pattern in `api/routes/rates/detail.py` (`/detail/spread`, `/detail/cross-market`, `/detail/butterfly`, `/detail/regime`, etc.). The agent MUST use these slugs verbatim — do not invent variations.

