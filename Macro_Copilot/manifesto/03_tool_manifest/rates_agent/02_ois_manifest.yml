      and both canonical and bespoke wire-frozen time series.

    bucket_rationale: >-
      Deterministic arithmetic on two OIS rate series.  Same z-score
      conventions as the sovereign curve_spread tool, applied to swap
      curves; fixed 1Y rolling window; no model state.

    pm_overridable: []

    related_tools:
      - calculate_ois_rate_level_tool
      - calculate_ois_cross_market_spread_tool
      - calculate_ois_forward_rate_tool
      - calculate_curve_spread_tool

    workflows:
      - ois_curve_shapes_card
      - ois_spread_detail_workspace
      - ois_prompt_gauntlet

    references:
      - "Tuckman & Serrat (2022), Fixed Income Securities."

    built_date: 2026-05-01
    validation_status: >-
      Not validated yet

  - name: calculate_ois_cross_market_spread
