tool:
  name: get_fx_vol_risk_premium_tool
  domain: fx_vol
  description: |
    Single-(pair, tenor) FX vol risk premium snapshot — defined
    EXACTLY as VRP = implied_vol_pct - realized_vol_pct, quoted in
    ABSOLUTE vol points. Positive VRP = implied > realized (implied
    is rich vs the recent realized path); negative = implied <
    realized.

    POSITIONING SIGNAL ONLY — VRP measures the implied-vs-realized
    differential, NOT a P&L estimate. Net P&L of any vol-seller /
    vol-buyer trade depends on execution price, bid-ask, hedging
    path / gamma exposure, and forward realized path — none of which
    this primitive estimates.

    The canonical vol-carry primitive. Central methodology knob:
    realized_window_basis (PR8).
  category: desk_invariant_primitive

conventions:
  default_vol_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: >-
      Bloomberg PX_LAST is the canonical implied + spot observation;
      bid/ask override available via field_name.

  default_tenor:
    value: 1M
    source: team_judgment_pending_review
    rationale: >-
      1M is the standard vol-monitor tenor (matches atm_vol_level,
      risk_reversal, butterfly, vol_smile, and fx_carry conventions).

  default_realized_window_basis:
    value: tenor_matched
    source: team_judgment_pending_review
    rationale: >-
      tenor_matched is the methodologically clean default — the
      realized horizon matches the implied tenor (1M implied vs 21d
      realized, 3M implied vs 63d realized, ...). fixed_30d is
      retained for cross-tenor comparability of the realized leg.

  annualization_trading_days_per_year:
    value: 252
    source: industry_standard_sqrt_252
    rationale: >-
      Trading-day-count annualization factor. std(log_returns) *
      sqrt(252) * 100 = vol in PERCENT. Matches realized_vol.

  std_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: Sample (Bessel-corrected) standard deviation.
    valid_range: [0, 1]

  ffill_limit_days:
    value: 3
    source: legacy_default_pre_pilot
    rationale: >-
      Holiday-gap forward-fill limit on the spot series before realized
      vol computation. Matches realized_vol.

  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      One trading year of rolling history on the VRP series. Matches
      every other FX vol / level / curve tool so cross-asset readers
      see comparable z-scores.
    valid_range: [60, 504]

  z_score_min_periods:
    value: 60
    source: industry_standard_1y_window
    rationale: >-
      Minimum observations before a z-score is emitted; below this
      the rolling stat is too noisy and z_score is set to None
      (fail-loud).
    valid_range: [20, 252]

  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: Sample (Bessel-corrected) standard deviation.
    valid_range: [0, 1]

  trailing_range_window_days:
    value: 252
    source: legacy_default_pre_pilot
    rationale: >-
      Locked at 252 in V1; the schema field names (high_252d /
      low_252d / percentile_252d) embed the number — a convention
      change without renaming would silently lie (PR14).
    valid_range: [252, 252]

  daily_change_periods:
    value: 1
    source: industry_standard_daily_changes
    rationale: One trading-day offset for the daily change calculation.
    valid_range: [1, 3]

  weekly_change_periods:
    value: 5
    source: industry_standard_daily_changes
    rationale: One trading-week offset (5 trading days).
    valid_range: [5, 10]

  monthly_change_periods:
    value: 21
    source: industry_standard_daily_changes
    rationale: Approximate one trading month (21 trading days).
    valid_range: [20, 30]

  fixed_realized_window_days:
    value: 30
    source: legacy_default_pre_pilot
    rationale: >-
      Default realized-vol trading-day window when
      realized_window_basis='fixed_30d'. 30 trading days = ~6 weeks,
      a standard cross-tenor reference. Tunable here without code
      changes.
    valid_range: [5, 252]

  vol_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals preserves VRP precision (typical VRP magnitudes
      between -10 and +10 vol points). Matches atm_vol_level /
      realized_vol / risk_reversal precision (platform-wide rule).
    valid_range: [2, 6]

  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: Four decimals for z-score (platform-wide convention).
    valid_range: [2, 6]

  percentile_round_decimals:
    value: 2
    source: legacy_default_pre_pilot
    rationale: Two decimals for percentile rank (0-100 scale).
    valid_range: [0, 4]

methodology:
  what_it_does: |
    For one (pair, tenor):
      1. Fetch implied ATM vol history from fx_vol substrate.
      2. Fetch spot history from fx_spot substrate.
      3. Compute rolling realized vol on spot at window =
         TENOR_TO_TRADING_DAYS[tenor] (tenor_matched) OR
         fixed_realized_window_days (fixed_30d). Formula:
         std(log_returns) * sqrt(252) * 100.
      4. Inner-join the two series by trade_date — only dates where
         both have a non-null value contribute to the VRP series.
      5. Compute VRP_t = implied_t - realized_t per joined date.
      6. Snapshot + 1/5/21-day changes + rolling 252-day z-score /
         percentile / high / low on the VRP series.
  assumptions:
    - "VRP definition: VRP = implied_vol_pct - realized_vol_pct. Both legs quoted in PERCENT — subtraction yields ABSOLUTE vol points (e.g. implied=8.0pct, realized=6.5pct → VRP=+1.5 vol pts)."
    - "Sign convention: positive VRP = implied > realized (implied is rich vs the recent realized path); negative = implied < realized."
    - "VRP IS A POSITIONING SIGNAL, NOT A P&L ESTIMATE. The premium measures the implied-vs-realized differential at a point in time. Realized P&L of any vol-seller / vol-buyer trade depends on execution price, bid-ask spreads, hedging path / gamma exposure, and forward realized path — none of which this primitive estimates. Use VRP for ranking and historical extremeness comparisons; do not interpret a positive VRP as a guaranteed seller carry."
    - "Realized vol uses sqrt(252) annualization, ddof=1, std of daily log returns — identical to fx_realized_vol so any cross-tool VRP recompute matches."
    - "Realized window for tenor_matched: 1W→5, 1M→21, 3M→63, 6M→126, 12M→252. From fx_agent.vol._shared.TENOR_TO_TRADING_DAYS — single source of truth. Values = 252 / tenor_years, coherent with the 252 trading-days-per-year annualization shared with realized_vol."
    - "Inner-join on trade_date means the observation_count reflects the date intersection post-realized-vol-warmup, which is shorter than the raw fetch window."
  citations: []
  planned_extensions:
    - "Add bid/ask-aware VRP variant once Phase E3+ bid/ask consumers materialise."
    - "Add VRP scanner across pairs once the snapshot primitive stabilises and a downstream consumer requests it."
