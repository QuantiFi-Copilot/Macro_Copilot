operator:
  name: correlation
  method_family: statistical_relationship
  version: "1.0.0"
  description: >-
    Full-sample correlation coefficient between two index-aligned
    numeric Series. Finance-blind and unit-invariant: a correlation is a
    dimensionless statistic, so it imposes no same-unit requirement —
    only a shared DatetimeIndex and an agreed cadence. Output is a
    single ScalarMetric in RATIO units (the coefficient, in [-1, 1]).

# Every user-choosable method choice is offloaded here so the operator
# is not opinionated and the caller can switch seamlessly (OPR7/OPR8).
# All implemented methods are baked into the operator's Python; the
# declared-but-unbuilt method (kendall) refuses cleanly (OPR8 honest
# refusal). The schema defaults in schemas.py mirror these values and a
# test asserts they do not diverge.
defaults:
  method:
    value: pearson
    source: operator_v1_default
    rationale: >-
      Pearson is the desk-default linear correlation; Spearman (rank)
      captures monotonic non-linear association. Kendall is declared in
      valid_values as a planned extension but is not yet implemented.
    valid_values: [pearson, spearman, kendall]
  min_periods:
    value: 2
    source: operator_v1_default
    rationale: >-
      A correlation coefficient is undefined with fewer than two
      overlapping non-NaN observations; 2 is the mathematical floor.

methodology:
  what_it_does: >-
    Computes the correlation between two Series over the dates where
    both are present, after requiring an identical DatetimeIndex (align
    upstream with align_series — correlation does not align). Returns a
    single ScalarMetric in RATIO units. Strict-by-default on frequency
    and missingness; unit-invariant by design (a correlation is
    dimensionless, so cross-unit inputs are accepted and both inputs'
    units are recorded in lineage for provenance). Raises
    CorrelationError when the overlap is below min_periods or either
    series has zero variance over the overlap — an undefined coefficient
    is a typed refusal, never a non-finite value.
  planned_extensions:
    - "method='kendall' (Kendall's tau): declared in valid_values but not yet implemented; raises NotImplementedError (OPR8 honest refusal)."
    - "rolling_correlation: a separate operator emitting a Series (constant output type per OPR2) — NOT a window parameter on this full-sample operator."

# ============================================================================
# CARD — the L3 Composer's view of this operator (PR-2 of open-DAG PoC).
# Description content lives ONLY here; slot / output structure lives ONLY in
# shared.workflow.OPERATOR_REGISTRY.  The renderer at
# shared.workflow.operator_catalogue fuses both at L3-prompt-build time.
# Token-budget cap: ≤600 tokens per rendered card (tests/workflow enforce).
# ============================================================================
card:
  one_line: >-
    Full-sample correlation coefficient between two index-aligned numeric Series.
  when_to_use:
    - "User asks how strongly two series move together over the full sample."
    - "User asks for a single summary number of pair association — not time-varying."
    - "Relationship is expected to be roughly linear (pearson) or monotonic (spearman)."
  when_not_to_use:
    - "User asks for time-varying / rolling correlation — use rolling_correlation."
    - "User asks whether a linear combination of the two series is stationary — use cointegration."
    - "User asks for the slope of one series on another (hedge ratio / beta) — use rolling_regression."
  upstream_requirements:
    - "Both Series must share an identical DatetimeIndex.  Canonical upstream: align_series → select_from_series_set ×2."
  downstream_pattern:
    - "Output is a ScalarMetric (RATIO units, in [-1, 1]); feeds the terminal answer directly — no further wiring required."
  knobs_quick_ref:
    method: "pearson (default) | spearman (rank, monotonic) | kendall (declared, refuses with NotImplementedError)."
    min_periods: "2 by default (mathematical floor); raise for noisier inputs."
  example_shapes:
    - description: "Full-sample correlation of two index-aligned numeric Series."
      shape: "[Series A, Series B] -> align_series -> select_from_series_set ×2 -> correlation -> ScalarMetric"
  sibling_operators:
    - rolling_correlation: "Time-varying (windowed) correlation — emits a Series of coefficients, not a single ScalarMetric."
    - cointegration: "Stationarity of a linear combination of the two series (Engle-Granger ADF on residuals).  Same input shape, different question."
    - rolling_regression: "Slope (beta) of one Series on another.  Emits {beta, alpha, r_squared} SeriesSet.  Use when the question is 'how much per unit of the regressor', not 'how correlated'."
