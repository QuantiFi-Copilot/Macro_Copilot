playbook_name: "spot_fx"
playbook_version: "5.0"
asset_class: "fx"
dataset_name: "spot_fx"
description: "Daily G10 + EM spot FX pairs for level monitoring, cross-sectional scanner, relative move analysis, and z-score monitoring. v2.0 (Wave 1) extended G10 coverage from 6 to 9 majors (added NZDUSD, USDNOK, USDSEK). v3.0 (Phase B / Wave 1.5) added 9 EM majors. v4.0 (BBG top-up 2026-05-25) adds 3 APAC NDF-currency spot references (USDCNH offshore tradable, USDINR composite reference, USDCNY onshore PBOC fix). v5.0 (Warehouse seeding 2026-05-25) adds 6 additional liquid EM pairs to broaden APAC + LATAM coverage: USDSGD, USDTWD, USDTHB (APAC deliverable), USDCLP, USDCOP, USDPEN (LATAM deliverable). All 6 confirmed in Phase 1 discovery with full 2000+ history. Total: 38 spot_fx instruments."

extraction:
  start_date: "2000-01-01"
  incremental_window_days: 14

target_metrics:
  - metric_id: "spot_last"
    bloomberg_field: "PX_LAST"

reference_metrics:
  - column_name: "security_name"
    bloomberg_field: "SECURITY_DES"

universe:
