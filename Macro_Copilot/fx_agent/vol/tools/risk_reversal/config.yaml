tool:
  name: get_fx_risk_reversal_tool
  domain: fx_vol
  description: |
    Single-(pair, delta_anchor, tenor) FX risk reversal snapshot — RR
    is the call_Δ - put_Δ implied-vol differential at the given delta
    anchor (25Δ or 10Δ), the desk-standard skew indicator. Positive
    RR = call skew dominant (upside risk priced); negative RR = put
    skew (downside risk). Quoted in absolute vol points (vol pts).
    Mirror of get_fx_atm_vol_level for the smile substrate. Central
    methodology knob: delta_anchor (PR8).
  category: desk_invariant_primitive

conventions:
  default_vol_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: >-
      Bloomberg PX_LAST is the canonical RR observation; PX_BID / PX_ASK
      available for the 156 std-tenor smile instruments since PR #228.

  default_delta_anchor:
    value: 25
    source: team_judgment_pending_review
    rationale: >-
      25Δ is the desk-standard skew monitor delta. 10Δ available as a
      caller override for wing-side analysis.

  default_tenor:
    value: 1M
    source: team_judgment_pending_review
    rationale: >-
      1M is the standard vol monitor tenor (matches atm_vol_level and
      fx_carry conventions).

  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      One trading year of rolling history. Matches every other FX vol /
      level / curve tool so cross-asset readers see comparable z-scores.
    valid_range: [60, 504]

  z_score_min_periods:
    value: 60
    source: industry_standard_1y_window
    rationale: >-
      Minimum observations before a z-score is emitted; below this the
      rolling stat is too noisy and z_score is set to None (fail-loud).
    valid_range: [20, 252]

  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: Sample (Bessel-corrected) standard deviation.
    valid_range: [0, 1]

  trailing_range_window_days:
    value: 252
    source: legacy_default_pre_pilot
    rationale: >-
      Locked at 252 in V1; the schema field names (high_252d /
      low_252d / percentile_252d) embed the number — a convention
      change without renaming would silently lie (PR14).
    valid_range: [252, 252]

  daily_change_periods:
    value: 1
    source: industry_standard_daily_changes
    rationale: One trading-day offset for the daily change calculation.
    valid_range: [1, 3]

  weekly_change_periods:
    value: 5
    source: industry_standard_daily_changes
    rationale: One trading-week offset (5 trading days).
    valid_range: [5, 10]

  monthly_change_periods:
    value: 21
    source: industry_standard_daily_changes
    rationale: Approximate one trading month (21 trading days).
    valid_range: [20, 30]

  vol_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals preserves RR precision (typical RR magnitudes
      between -3.0 and +3.0 vol points; finer than ATM vol level
      precision is unwarranted but 4 matches the platform-wide rule).
    valid_range: [2, 6]

  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: Four decimals for z-score (platform-wide convention).
    valid_range: [2, 6]

  percentile_round_decimals:
    value: 2
    source: legacy_default_pre_pilot
    rationale: Two decimals for percentile rank (0-100 scale).
    valid_range: [0, 4]

methodology:
  what_it_does: |
    For one (pair, delta_anchor, tenor), fetches the fx_vol_smile
    observation history (smile_point = '<delta_anchor>R') from
    macro_data.market_data_daily over the lookback window. Computes
    snapshot RR, absolute vol-point changes over 1/5/21 trading days,
    rolling 252-day z-score / percentile / high / low.
  assumptions:
    - "RR values are quoted in ABSOLUTE vol points (e.g. +0.5 = 50 bps of vol differential), NOT in % of spot or % of ATM. Trader convention."
    - "Positive RR = call skew dominant; negative = put skew dominant. The skew sign aligns with the market's directional risk pricing."
    - "Bloomberg convention: 25R/25B/10R/10B tickers are stored under instrument_type='fx_vol_smile' with attributes.smile_point ∈ {'25R','25B','10R','10B'}. ATM lives in fx_vol substrate (separate tool)."
    - "Z-score min_periods (60) and window (252) match every other FX level tool so cross-asset extremeness comparisons are at the same horizon."
  citations: []
  planned_extensions:
    - "Add a bid/ask-aware RR variant once Phase E3 smile bid/ask consumers land."
    - "Add a regime-classifier output flag once Phase H regime operators land."
