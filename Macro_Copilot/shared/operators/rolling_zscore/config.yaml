operator:
  name: rolling_zscore
  method_family: single_series_transform
  version: "1.0.0"
  description: >-
    Rolling z-score of a Series over a trailing window:
    ``(x - rolling_mean) / rolling_std``.  Finance-blind — runs unchanged on
    rates, FX, equities, or any numeric series.  Output is ALWAYS in
    ``Z_SCORE`` units; output frequency inherits the input.  Strict
    look-ahead hygiene by default (the z at time ``t`` uses only
    observations <= ``t-1``).

# Every consequential method variant is offloaded here so the operator
# is not opinionated and the caller can switch seamlessly (OPR7/OPR8).
# The schema defaults in schemas.py mirror these values and a test
# asserts they do not diverge.
defaults:
  window:
    value: 60
    source: operator_v1_default
    rationale: >-
      60 is the conventional 3-month business-day rolling window for
      macro z-scores (≈ one quarter of trading days).  Callers should
      override for tactical (e.g. 20) or strategic (e.g. 252) horizons.
  min_periods:
    value: null
    source: operator_v1_default
    rationale: >-
      ``None`` defers to ``window`` at runtime — the strict choice
      (no partial-window stats).  Set explicitly to allow earlier
      warmup at the cost of noisier first observations.
  ddof:
    value: 1
    source: operator_v1_default
    rationale: >-
      Sample standard deviation (``ddof=1``) is the desk-default —
      consistent with ``threshold_events`` and ``summarize_series``.
      ``ddof=0`` (population / biased estimator) is supported.
    valid_values: [0, 1]
  look_ahead_safe:
    value: true
    source: operator_v1_default
    rationale: >-
      Default ``true`` so the z at time ``t`` reflects only data
      <= ``t-1`` (the rolling mean/std are shifted by one period).
      This is the canonical event-study hygiene — an in-sample z
      includes the observation it is trying to characterise.

methodology:
  what_it_does: >-
    Standardises a single Series via its own trailing rolling mean and
    standard deviation: ``z_t = (x_t - rolling_mean_t) / rolling_std_t``.
    Output is a Series of the SAME index and length as the input,
    always in ``Z_SCORE`` units, with input frequency preserved.  When
    ``look_ahead_safe=True`` (default), both rolling statistics are
    shifted by one period so the z at time ``t`` is the standardisation
    of the new observation against the *prior* window.  Warmup
    positions (fewer than ``min_periods`` valid observations in the
    window) emit ``NaN`` — that is legitimate missingness from
    insufficient history, not a refusal.  Where the rolling std is
    zero (a degenerate window of constants) the z is undefined and
    that position is also ``NaN``.  The operator raises
    ``RollingZscoreError`` when the ENTIRE output is ``NaN`` (e.g.
    ``window`` longer than the series), when the input is empty, or
    when the input is not a Series — an undefined refused is a typed
    operator refusal, never an empty payload.
  planned_extensions:
    - "ewma_zscore: a SEPARATE operator emitting a Series (not a basis switch here) per OPR2 constant-output discipline."
    - "cross_sectional_zscore: a SEPARATE operator in the cross_sectional family — standardises across series at each date, not within a series across time."

# ============================================================================
# CARD — the L3 Composer's view of this operator (PR-2 of open-DAG PoC).
# ============================================================================
card:
  one_line: >-
    Rolling z-score: standardises a Series via its own trailing rolling
    mean and std.  Output always in Z_SCORE units.
  when_to_use:
    - "User asks how a series compares to its own recent history in σ-units (e.g. \"z-score of SOFR 5Y vs 1y history\", \"how unusual is today's move\")."
    - "User wants a standardised signal to feed threshold_events (e.g. \"flag dates > 2σ from history\")."
    - "User wants the standardised form of a series for comparison across markets with different scales."
  when_not_to_use:
    - "If the user wants percentile RANK (where in the historical distribution), use percentile_rank instead."
    - "If the user wants the rolling mean / std SEPARATELY (not standardised), use rolling_statistic."
    - "If the user wants cross-sectional z-score (across markets at one date), this is the wrong operator (planned cross_sectional_zscore)."
  upstream_requirements:
    - "One Series.  No alignment needed (single input)."
  downstream_pattern:
    - "Output is a Series in Z_SCORE units, same index/length as input.  Common downstream: threshold_events (event detection on z), L6 directly (chart)."
  knobs_quick_ref:
    window: "60 by default (≈ 3 months daily); 20 for tactical, 252 for strategic."
    min_periods: "Defaults to window (strict)."
    ddof: "1 (default, sample) | 0 (population)."
    look_ahead_safe: "true (default — stats use only data up to t-1; event-study hygiene)."
  example_shapes:
    - description: "Z-score of SOFR 5Y rate vs its own 1y history."
      shape: "Series(sofr_5y) -> rolling_zscore(window=252) -> Series(Z_SCORE)"
    - description: "Event detection on z."
      shape: "Series -> rolling_zscore -> threshold_events(rule='abs_above', threshold=2.0) -> EventSet"
  sibling_operators:
    - percentile_rank: "Pick when the user wants percentile rank (0–100) instead of σ-units."
    - rolling_statistic: "Pick when the user wants raw rolling mean / std / min / max / sum, not standardisation."
    - threshold_events: "Common downstream for event detection on the standardised signal."
