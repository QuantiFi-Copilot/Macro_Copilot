playbook_name: "fx_vol_smile"
playbook_version: "1.0"
asset_class: "fx"
dataset_name: "fx_vol_smile"
description: "Daily FX implied volatility SMILE points (risk reversals + butterflies, 25-delta + 10-delta) across G10 and EM, at tenors 1M / 3M / 1Y. Combined G10 + EM in a single playbook per the Codex design (discriminator is market_scope, not file). Same unit family as fx_vol.yml (ATM) — vol points in percent for ATM-equivalent, signed for RR. Discovered + extracted in BBG batch 2026-05-25 (Preflight C established 1Y tenor format, NOT 12M). 156 instruments total: 72 G10 (6 pairs × 4 smile points × 3 tenors) + 84 EM (7 pairs × 4 smile points × 3 tenors). NOTE: USDIDR + USDPHP + USDCNH + USDINR smile NOT in this universe (illiquid or not tested in this BBG batch). Phase E smile tools will consume this substrate."

extraction:
  start_date: "2000-01-01"
  incremental_window_days: 14

target_metrics:
  - metric_id: "smile_vol"
    bloomberg_field: "PX_LAST"

reference_metrics:
  - column_name: "security_name"
    bloomberg_field: "SECURITY_DES"

universe:

  # ============================================================
  # G10 FX vol smile (72 instruments = 6 pairs × 4 smile × 3 tenors)
