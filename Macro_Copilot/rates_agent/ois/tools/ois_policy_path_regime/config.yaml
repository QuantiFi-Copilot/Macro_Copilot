# =============================================================================
# calculate_ois_policy_path_regime_tool — tool configuration
# =============================================================================
# The last Bucket-2 model-state primitive (plan §7-B).  Fits a Gaussian HMM
# to the PRICED policy path expressed by a policy-futures STIR strip (SOFR /
# SONIA / EUR_SHORT_RATE futures) and labels which policy regime the market
# is CURRENTLY PRICING (easing-priced / neutral / tightening-priced).
# Features: the strip's front level, slope (back − front = priced hiking /
# cutting tilt), curvature (the priced peak-rate hump), and front-rate
# realized vol.  The primitive carries THE FINANCE (the strip choice, the
# implied-rate conversion, naming the priced regime) and ZERO statistical
# math — the HMM is the finance-blind fit_regime_hmm operator.
#
# DESCRIBE WHAT IS PRICED, do NOT forecast: the strip already ENCODES the
# market's expected policy path; this reads its CURRENT shape and classifies
# it (fit_scope='full_sample', disclosed).  We describe the priced state; we
# do not produce an expectation (the opposite of the deferred ACM term
# premium, which would project future short rates).
#
# Bucket-2 model-state: the fitted HMM (transition matrix, per-regime means)
# rides in the operator's lineage and is surfaced in current_metrics.  No
# new artifact type.
#
# Cross-config consistency (shared.config.lint): ffill_limit_days MUST agree
# with the other rates tools.  Convention NAMES shared with sibling tools
# (realized_vol_*) carry IDENTICAL values; policy-specific names are unique.
# =============================================================================

tool:
  name: calculate_ois_policy_path_regime_tool
  domain: ois
  category: quant_standard_analytic
  description: |
    Gaussian-HMM regime of the priced policy path on a policy-futures STIR
    strip (SOFR / SONIA / EUR_SHORT_RATE).  Features: strip front level,
    slope (back − front), curvature, and front-rate realized vol.  Labels
    which policy regime is currently PRICED (easing / neutral / tightening),
    with its persistence and per-regime feature means + the fitted HMM model
    state.  Describes what the market prices; never a forecast.

conventions:

  # ---------------------------------------------------------------------------
  # Policy-futures price field (the strip is priced, then inverted to a rate)
  # ---------------------------------------------------------------------------
  strip_price_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: >-
      Last price of each rolling-generic strip contract.  Inverse-priced
      families (all V1: SOFR_FUT / SONIA_FUT / EUR_SHORT_RATE_FUT) are
      converted to an implied rate via 100 − price (the conversion + the
      inverse_pricing flag come from instrument_master metadata, never
      hardcoded).  Distinct name from the OIS swap-rate field convention.

  # ---------------------------------------------------------------------------
  # Holiday-gap forward-fill limit (cross-config consistency-linted)
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Maximum consecutive missing days bridged by forward-fill when
      assembling the strip panel.  Matches every other rates tool.
    valid_range: [0, 10]

  # ---------------------------------------------------------------------------
  # The three strip positions that anchor the level / slope / curvature
  # features (a methodology choice — which slots define the priced path —
  # disclosed here, never as code constants).
  # ---------------------------------------------------------------------------
  strip_front_position:
    value: 1
    source: desk_convention_policy_regimes
    rationale: >-
      The front strip slot = where policy is priced NOW (the level feature
      and the realized-vol base).
    valid_range: [1, 8]

  strip_belly_position:
    value: 4
    source: desk_convention_policy_regimes
    rationale: >-
      The belly strip slot = the curvature pivot (the priced peak-rate hump
      over the strip horizon).
    valid_range: [2, 7]

  strip_back_position:
    value: 8
    source: desk_convention_policy_regimes
    rationale: >-
      The back strip slot = the far end of the priced path (the slope =
      back − front captures the priced hiking/cutting tilt).
    valid_range: [2, 8]

  # ---------------------------------------------------------------------------
  # Realized-vol feature (SHARED names with sovereign_curve_regime — identical
  # values so the cross-config consistency lint passes)
  # ---------------------------------------------------------------------------
  realized_vol_window:
    value: 21
    source: team_judgment_pending_review
    rationale: >-
      ~1 trading month of daily front-rate CHANGES for the realized-vol
      feature.  Same value as sovereign_curve_regime (lint-shared name).
    valid_range: [5, 126]

  realized_vol_return_method:
    value: diff
    source: industry_standard_yield_changes
    rationale: >-
      Realized vol on the front implied-rate LEVEL CHANGES (first
      differences).  Same value/name as sovereign_curve_regime.

  realized_vol_annualization_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading days per year to annualize the rolling front-rate-change std
      for display.  Same value/name as sovereign_curve_regime.
    valid_range: [248, 262]

  # ---------------------------------------------------------------------------
  # Policy-regime naming (which feature orders the names + the label tokens)
  # ---------------------------------------------------------------------------
  policy_naming_feature:
    value: strip_slope
    source: desk_convention_policy_regimes
    rationale: >-
      Regimes are NAMED (the finance) by their mean strip slope (back −
      front).  A more positive slope prices tightening; more negative prices
      easing.

  policy_naming_order:
    value: ascending
    source: desk_convention_policy_regimes
    rationale: >-
      Ascending ⇒ the regime with the LOWEST (most negative) mean slope is
      'easing_priced'; the highest is 'tightening_priced'.

  policy_label_easing:
    value: easing_priced
    source: desk_convention_policy_regimes
    rationale: "Descriptive name for the most-easing-priced regime (lowest slope)."

  policy_label_neutral:
    value: neutral_priced
    source: desk_convention_policy_regimes
    rationale: "Descriptive name for the middle (flattest-priced) regime(s)."

  policy_label_tightening:
    value: tightening_priced
    source: desk_convention_policy_regimes
    rationale: "Descriptive name for the most-tightening-priced regime (highest slope)."

  # ---------------------------------------------------------------------------
  # Display rounding (unique name to clear the cross-config consistency lint)
  # ---------------------------------------------------------------------------
  policy_regime_round_decimals:
    value: 4
    source: display_convention
    rationale: >-
      Decimal places for the surfaced per-regime feature means, persistence,
      and loglik.  Display-only — never affects the fit.
    valid_range: [2, 8]

methodology:
  what_it_does: |
    Fetches a policy-futures STIR strip (front / belly / back positions of
    one curve_family) via the shared strip fetcher, converts each
    inverse-priced cell to an implied policy rate (100 − price, per the
    instrument_master inverse_pricing flag; refuses a mixed-flag family),
    and assembles four RAW features — front_level (position-1 implied rate),
    strip_slope (back − front, bps), strip_curvature (2×belly − front − back,
    bps), and front-rate realized-vol.  Passes the RAW features to the
    finance-blind fit_regime_hmm operator (which z-scores them internally and
    fits a Gaussian HMM), reads the fitted model state back out of the
    operator's lineage, names the regimes by their mean strip slope
    (easing / neutral / tightening priced), and surfaces the current priced
    regime, its persistence, the per-regime feature means, and the regime
    time series.  All statistical math is the operator / shared/quant/hmm.py.
  assumptions:
    - "Implied rate = 100 − price for inverse-priced strips (the V1 families); the conversion is metadata-driven, never hardcoded."
    - "FULL-SAMPLE fit (fit_scope='full_sample') — describes which regime history PRICED; NOT a forecast of the policy path (the strip already encodes the market's expectation)."
    - "The HMM z-scores each feature internally — the primitive passes RAW features (no pre-standardization)."
    - "Rolling-generic strip: each strip slot splices contracts across quarterly rolls; single curve_family per fit (RFR vs IBOR are different short-rate objects)."
    - "Regime labels are descriptive of the priced slope, never a trade signal."
  citations: []
  planned_extensions:
    - "Full 8-position strip features (pack averages, the priced terminal-rate position)."
    - "WIRP meeting-implied move-probability features once that history is deep enough to fit."
