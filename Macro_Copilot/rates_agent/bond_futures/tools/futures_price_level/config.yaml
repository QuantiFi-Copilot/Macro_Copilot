# =============================================================================
# get_futures_price_level_tool — tool configuration
# =============================================================================
# Front-month bond-futures price level + 252d range + z-score for ONE
# rolling-generic (TY1 / UXY1 / US1 / WN1 / RX1 / JB1 / OAT1 / ...).
#
# V1 monitor (per ADR 0011 — `bond_futures` ships monitors-only until
# the D-repo + D-deliverable substrate lands and the canonical CTD /
# basis / DV01-weighted RV stack becomes buildable). The output card
# disclosure makes the scope-limited reading explicit (P5):
#
#   "this is the rolling-generic price; the CTD-implied yield is not
#   yet a primitive in this build"
#
# In V1 deterministic mode there is NO LLM-facing override path for
# conventions. The LLM cannot ask for non-standard windows / thresholds.
# =============================================================================

tool:
  name: get_futures_price_level_tool
  domain: bond_futures
  description: |
    Single rolling-generic bond-futures price level — emits a
    ``current_metrics`` snapshot for the latest observation:

      - ``current_price``: latest price in the contract's native
        ``quote_units`` (price space, NOT yield bps). The
        snapshot carries ``quote_units`` and ``contract_size``
        alongside the level so downstream consumers cannot
        misread (e.g.) a TY1 ``110.45`` (``points``) as a yield.

      - daily / weekly / monthly price-unit changes (raw
        subtraction; NOT bps multiplication).

      - rolling 252-day z-score of the price level.

      - trailing 252-day high / low / percentile.

      - latest-effective ``expiry_date`` + ``security_name`` from
        the SCD2 rolling-contract metadata history so the snapshot
        names the underlying front contract.

      - ``time_series``: per-row ``{date, price}`` history over the
        displayed window. Bespoke list shape (NOT canonical
        ``shared.schemas.TimeSeries``) because the bond-futures
        rolling-generic price unit (e.g. ``points``, ``% of par``,
        ``100 - yield``, ``GBP``) does not map onto any closed-enum
        member of ``TimeSeriesUnits``; declaring PERCENT or BPS
        would silently lie under P8 (closed-family discipline) and
        P5 (honest disclosure). Per-contract ``quote_units`` is
        carried on the snapshot instead.

conventions:

  # ---------------------------------------------------------------------------
  # Z-score window length (trading days)
  # ---------------------------------------------------------------------------
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading-day count for a 1-year rolling window. Same convention
      as yield_levels / ois rate_level / curve_spread.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Minimum observations before the rolling stat is emitted
  # ---------------------------------------------------------------------------
  z_score_min_periods:
    value: 60
    source: team_judgment_pending_review
    rationale: >-
      ~3 months of observations before the rolling mean / std are
      deemed trustworthy. Matches yield_levels / ois rate_level.
    valid_range: [20, 252]

  # ---------------------------------------------------------------------------
  # Standard deviation degrees of freedom
  # ---------------------------------------------------------------------------
  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Sample standard deviation (Bessel-corrected, ddof=1). Matches
      pandas' default and every other rates tool in this codebase.

  # ---------------------------------------------------------------------------
  # Calendar-day buffer for the fetch window
  # ---------------------------------------------------------------------------
  z_score_buffer_multiplier:
    value: 1.5
    source: derived_from_window
    rationale: >-
      Calendar-day buffer added to the fetch window so the rolling
      z-score is fully populated from the first displayed trading day.
      1.5x trading-day window covers weekends + holidays. Matches
      yield_levels / ois rate_level.
    valid_range: [1.2, 2.0]

  # ---------------------------------------------------------------------------
  # Period-change offsets (in trading-day rows after ffill)
  # ---------------------------------------------------------------------------
  daily_change_offset_rows:
    value: 2
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-2] = 1 trading day back.
    valid_range: [2, 5]

  weekly_change_offset_rows:
    value: 6
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-6] = 5 trading days back ≈ 1 calendar week.
    valid_range: [5, 10]

  monthly_change_offset_rows:
    value: 22
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-22] = ~1 calendar month of trading days.
    valid_range: [20, 30]

  # ---------------------------------------------------------------------------
  # Trailing range / percentile window — LOCKED at 252 in V1
  # ---------------------------------------------------------------------------
  # The output schema's field names (high_252d_price, low_252d_price,
  # percentile_252d) are wire-frozen and embed the 252 number; changing
  # this convention without renaming the wire fields would silently lie
  # about what the percentile is computed against. compute() raises
  # NotImplementedError if this is set to anything other than 252; see
  # methodology.planned_extensions for the path to making it configurable.
  trailing_range_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      1Y trailing for high/low/percentile. Locked at 252 in V1 because
      the wire field names embed the number. Mirrors the same wire-
      freeze in yield_levels / ois rate_level.

  # ---------------------------------------------------------------------------
  # Forward-fill limit for missing observations
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Bridge up to one trading week of missing data across holiday
      gaps. Same as yield_levels / ois rate_level.
    valid_range: [1, 10]

  # ---------------------------------------------------------------------------
  # Default Bloomberg observation field
  # ---------------------------------------------------------------------------
  default_price_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: >-
      Last-traded price is the canonical front-month price observation.
      Maps onto the playbook's ``last_price`` metric (bloomberg_field
      PX_LAST). LLM/HTTP wrappers MUST use the empty-string / None
      sentinel so this default flows through — see the shadowing fix
      pattern from the curve_move_classifier migration (commit b2605ee)
      / yield_levels.

  # ---------------------------------------------------------------------------
  # Boundary rounding — applied to current_price, each time_series row,
  # high/low, and z-score. Price is reported with finer precision than
  # bps quantities because tick sizes on bond futures are sub-tick
  # (e.g. TY1 ticks in 1/32, UB1 in 1/32 of 1%).
  # ---------------------------------------------------------------------------
  price_round_decimals:
    value: 6
    source: team_judgment_pending_review
    rationale: >-
      Six decimals safely covers every quoted tick across the
      universe (TY1 1/32 ≈ 0.03125, UB1 1/32 of 1% = 0.0003125, JB1
      0.01, RX1 0.01, OAT1 0.01). Threaded through both the snapshot's
      ``current_price`` and every row of the bespoke ``time_series``
      output so the snapshot equals ``time_series[-1].price`` strictly
      at the latest row.
    valid_range: [0, 8]

  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches yield_levels / ois rate_level.
    valid_range: [0, 8]

  price_high_low_round_decimals:
    value: 6
    source: team_judgment_pending_review
    rationale: >-
      Six decimals for trailing high / low so they round at the same
      precision as ``current_price`` (avoids the snapshot's
      current_price equalling neither high nor low because of rounding
      asymmetry on a single observation). Distinct convention name
      (``price_high_low_round_decimals`` rather than the shared
      ``high_low_round_decimals``) because the bond-futures price-space
      precision contract differs from the yield-space contract every
      other rates tool uses — the consistency lint compares values by
      KEY, and forcing yield tools to 6 decimals (or this tool to 4)
      would silently degrade one universe to satisfy the other.
    valid_range: [0, 8]

methodology:
  what_it_does: |
    Fetches one (curve_family, contract_code) rolling-generic
    bond-futures price series, cleans it (ffill bridges holidays
    up to 5 trading days), and returns a snapshot: current price,
    period changes (daily / weekly / monthly in price units, NOT
    bps), rolling 252-day z-score, trailing 252-day high / low /
    percentile, observation count over the lookback_days window,
    plus the reference disclosure block (quote_units, contract_size,
    latest-effective expiry_date and security_name).

  assumptions:
    - "Prices are stored in the contract's native quote_units
       (e.g. ``points`` for TY1 / FV1 / US1 / WN1 / UXY1 / TU1,
       ``% of par value`` for RX1 / UB1 / DU1 / OE1 / OAT1 / BTS1 / IK1 / KOA1,
       ``100 - yield`` for YM1 / XM1, ``points`` for JB1 / CN1,
       ``GBP`` for G1). The snapshot surfaces ``quote_units`` per
       row so consumers cannot misread the level as a yield."
    - "Bond-futures rolling-generics are keyed by
       ``(curve_family, contract_code)`` where ``contract_code`` is
       the playbook stem (TY1 / UXY1 / ...) — not the per-window
       underlying contract (TYH6 / TYM6 / ...) that the enriched
       view's contract_code column rotates through."
    - "ADR 0011 V1 monitors-only scope: this primitive is the
       rolling-generic price level. CTD identification, gross / net
       basis, implied repo, and CTD-implied yield are documented-
       deferred Phase-4 work gated on D-repo + D-deliverable data
       (see docs/technical_debt.md 24/27). The output methodology
       card surfaces this caveat verbatim."
    - "lookback_days controls the fetch window and the
       observation_count cutoff. The rolling z-score window
       (z_score_window_days) and trailing range window
       (trailing_range_window_days) are independent conventions
       fixed in this YAML."

  citations:
    - "ADR 0011 (docs_revamped/05_decisions/0011-futures-domain-agents.md)"

  planned_extensions:
    - "trailing_range_window_days: configurable. Currently locked at
       252 because the output fields high_252d_price / low_252d_price /
       percentile_252d embed the number. Path to configurability:
       rename schema fields to high_window_price / low_window_price /
       percentile_window + add trailing_window_days to the output;
       remove the NotImplementedError guard in compute()."
    - "Add a canonical TimeSeries output once TimeSeriesUnits gains a
       PRICE member (ADR-gated extension per P8). Until that ADR
       lands, the bespoke ``time_series: List[FuturesPriceLevelTimeSeriesRow]``
       shape is the honest export because declaring PERCENT / BPS
       on a price series would silently lie."
    - "CTD identification + CTD-implied yield + DV01-weighted RV
       primitives (Phase 4). Gated on D-repo + D-deliverable data
       ingestion. Until then this primitive's methodology card
       carries the rolling-generic-price caveat verbatim."
