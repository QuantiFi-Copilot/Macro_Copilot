version: "1.1"
industry_name: "Banks"
description: "Extends the global playbook with bank-specific KPIs extractable from quarterly filings."

# --------------------------------------------------------------------------------
# Stage 2: Reconciliation Configuration
# --------------------------------------------------------------------------------
reconciliation_config:
  source_hierarchy:
    - xbrl_parser
    - nse_scraper

  comparison_thresholds:
    # Using standardized names. These map to the master_record keys.
    net_interest_margin:       0.005  # ±50 bps
    cost_of_deposits:          0.005
    cost_to_income_ratio:      0.01   # ±1 %
    return_on_assets:          0.005
    provision_coverage_ratio:  0.01
    credit_cost_ratio:         0.005
    slippage_ratio:           0.005
    capital_adequacy_ratio:    0.005
    cet1_ratio:               0.005
    casa_ratio:               0.01
    credit_to_deposit_ratio:    0.015

# --------------------------------------------------------------------------------
# Stage 3: Validation Configuration
# --------------------------------------------------------------------------------
custom_kpis:
    # Profitability
  - "net_interest_income"
  - "non_interest_income"
  - "fee_income"
  - "net_interest_margin"
  - "cost_of_deposits"
  - "cost_to_income_ratio"
  - "return_on_assets"
  - "return_on_equity" # ROE is kept as it can be derived from P&L/BS
  - "ppop"
  - "effective_tax_rate"
  - "advances"
  - "deposits"
  - "gross_npa"
  - "interest_income"
  # Asset Quality
  - "gnpa_ratio"
  - "nnpa_ratio"
  - "provision_coverage_ratio"
  - "credit_cost_ratio"
  - "slippage_ratio" # Kept, but is a prime candidate for failing validation if data is not in XBRL

  # Capital Adequacy
  - "capital_adequacy_ratio"
  - "cet1_ratio"
  - "tier1_ratio"

  # Funding & Liquidity
  - "casa_ratio"
  - "credit_to_deposit_ratio"
  - "deposits_growth_yoy"
  - "advances_growth_yoy"


suspicious_value_rules:
  - rule_name: negative_gross_npa
    target_metric: "gnpa_ratio"
    condition: is_negative
    flag:
      type: LOGICAL_CONSISTENCY_ERROR
      message: "Gross NPA Ratio cannot be negative."
      severity: CRITICAL

  - rule_name: car_below_regulatory_minimum
    target_metric: "capital_adequacy_ratio"
    condition: is_less_than
    value: 9.0
    flag:
      type: REGULATORY_BREACH_ALERT
      message: "Capital Adequacy Ratio is below the regulatory minimum of 9%."
      severity: CRITICAL

  - rule_name: casa_ratio_over_100pct
    target_metric: "casa_ratio"
    condition: is_greater_than
    value: 100.0
    flag:
      type: LOGICAL_CONSISTENCY_ERROR
      message: "CASA Ratio cannot exceed 100%."
      severity: WARNING