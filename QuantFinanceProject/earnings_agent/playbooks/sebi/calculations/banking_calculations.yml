pnl:
- parent: interest_earned
  children:
    - interest_or_discount_on_advances_or_bills: 1
    - revenue_on_investments: 1
    - interest_on_balances_with_reserve_bank_of_india_and_other_inter_bank_funds: 1
    - other_interest: 1
- parent: income
  children:
    - interest_earned: 1
    - other_income: 1
- parent: operating_expenses
  children:
    - employees_cost: 1
    - other_operating_expenses: 1
- parent: total_expenditure_excluding_provisions_and_contingencies
  children:
    - interest_expended: 1
    - operating_expenses: 1
- parent: operating_profit_before_provision_and_contingencies
  children:
    - income: 1
    - total_expenditure_excluding_provisions_and_contingencies: -1
- parent: net_profit_loss_from_ordinary_activities_before_tax
  children:
    - operating_profit_before_provision_and_contingencies: 1
    - provisions_other_than_tax_and_contingencies: -1
    - exceptional_items: -1
- parent: profit_loss_from_ordinary_activities_after_tax
  children:
    - net_profit_loss_from_ordinary_activities_before_tax: 1
    - tax_expense: -1
- parent: net_profit_loss_for_the_period
  children:
    - profit_loss_from_ordinary_activities_after_tax: 1
    - extraordinary_items: 1
    - profit_loss_of_minority_interest: -1

balance_sheet:
- parent: total_assets
  children:
    - cash_and_balances_with_reserve_bank_of_india: 1
    - balances_with_banks_and_money_at_call_and_short_notice: 1
    - investments: 1
    - advances: 1
    - fixed_assets: 1
    - other_assets: 1
- parent: total_capital_and_liabilities
  children:
    - capital: 1
    - reserves_and_surplus: 1
    - deposits: 1
    - borrowings: 1
    - other_liabilities_and_provisions: 1
    - policyholder_funds: 1   # harmless if 0 / not used for banks

cash_flow_indirect:
  # ---- (Optional) Rollups for QA/debug; align to playbook _abstract IDs ----
  - parent: adjustments_to_profit_loss_abstract
    children:
      - adjustments_for_depreciation_and_amortisation_expense: 1
      - profit_loss_on_revaluation_of_investments: 1
      - amortisation_of_premium_on_investments: 1
      - profit_loss_on_sale_of_fixed_assets: 1
      - profit_loss_on_sale_of_subsidiaries: 1
      - profit_loss_on_sale_of_investments: 1
      - provision_for_non_performing_assets: 1
      - provision_for_floating_provisions: 1
      - provision_for_standard_assets_and_contingencies: 1
      - dividend_income_from_subsidiaries: 1
      - adjustments_for_sharebased_payments: 1
      - other_adjustments_for_noncash_items: 1

  - parent: adjustments_for_working_capital_abstract
    children:
      - adjustments_for_decrease_increase_in_advances: 1
      - adjustments_for_increase_decrease_in_deposits: 1
      - adjustments_for_decrease_increase_in_other_current_assets: 1
      - adjustments_for_increase_decrease_in_other_current_liabilities: 1
      - adjustments_for_decrease_increase_in_investments: 1   # non-HTM WC; HTM flows go to CFI

  # ---- Net cash from/(used in) operating activities (flattened) ----
  - parent: net_cash_from_used_in_operating_activities
    children:
      - profit_before_tax: 1

      # Adjustments (non-cash / non-operating)
      - adjustments_for_depreciation_and_amortisation_expense: 1
      - profit_loss_on_revaluation_of_investments: 1
      - amortisation_of_premium_on_investments: 1
      - profit_loss_on_sale_of_fixed_assets: 1
      - profit_loss_on_sale_of_subsidiaries: 1
      - profit_loss_on_sale_of_investments: 1
      - provision_for_non_performing_assets: 1
      - provision_for_floating_provisions: 1
      - provision_for_standard_assets_and_contingencies: 1
      - dividend_income_from_subsidiaries: 1
      - adjustments_for_sharebased_payments: 1
      - other_adjustments_for_noncash_items: 1

      # Working capital (bank-native)
      - adjustments_for_decrease_increase_in_advances: 1
      - adjustments_for_increase_decrease_in_deposits: 1
      - adjustments_for_decrease_increase_in_other_current_assets: 1
      - adjustments_for_increase_decrease_in_other_current_liabilities: 1
      - adjustments_for_decrease_increase_in_investments: 1

      # Operating cash items (bank policy)
      - interest_received_classified_as_operating_activities: 1
      - interest_paid_classified_as_operating_activities: 1
      - income_taxes_paid_refund_classified_as_operating_activities: 1

  # ---- Net cash from/(used in) investing activities ----
  - parent: net_cash_from_used_in_investing_activities
    children:
      - purchase_of_tangible_assets_classified_as_investing_activities: 1
      - proceeds_from_sale_of_tangible_assets_classified_as_investing_activities: 1  # singular to match playbook
      - purchase_of_investments_classified_as_investing_activities: 1
      - proceeds_from_sale_of_investments_classified_as_investing_activities: 1
      - dividends_received_classified_as_investing_activities: 1
      - other_inflows_outflows_of_cash_classified_as_investing_activities: 1

  # ---- Net cash from/(used in) financing activities ----
  - parent: net_cash_from_used_in_financing_activities
    children:
      - proceeds_from_issuing_shares: 1
      - proceeds_from_issuing_other_equity_instruments: 1
      - proceeds_from_issue_of_tier_1_and_tier_2_capital_instruments: 1
      - redemption_of_tier_1_and_tier_2_capital_instruments: 1
      - proceeds_from_borrowings_classified_as_financing_activities: 1
      - repayments_of_borrowings_classified_as_financing_activities: 1
      - dividends_paid_classified_as_financing_activities: 1
      - other_inflows_outflows_of_cash_classified_as_financing_activities: 1
      - increase_in_minority_interest: 1

  # ---- Δ Cash & Cash Equivalents (EXCLUDES FX; FX reported separately in playbook) ----
  - parent: increase_decrease_in_cash_and_cash_equivalents
    children:
      - net_cash_from_used_in_operating_activities: 1
      - net_cash_from_used_in_investing_activities: 1
      - net_cash_from_used_in_financing_activities: 1

  # ---- Δ Cash & Cash Equivalents INCLUDING FX (A+B+C+D) ----
  - parent: net_increase_decrease_in_cash_and_cash_equivalents_including_fx
    children:
      - net_cash_from_used_in_operating_activities: 1
      - net_cash_from_used_in_investing_activities: 1
      - net_cash_from_used_in_financing_activities: 1
      - effect_of_exchange_rate_changes_on_cash_and_cash_equivalents: 1

  # ---- Calculated closing = Opening + ΔCash INCLUDING FX ----
  - parent: calc_cash_and_cash_equivalents_at_end_of_period
    children:
      - cash_and_cash_equivalents_at_beginning_of_period: 1
      - net_increase_decrease_in_cash_and_cash_equivalents_including_fx: 1

  # ---- Reconciliation difference: Reported Closing − Calculated Closing ----
  - parent: cash_and_cash_equivalents_reconciliation_difference
    children:
      - cash_and_cash_equivalents_at_end_of_period: 1
      - calc_cash_and_cash_equivalents_at_end_of_period: -1
