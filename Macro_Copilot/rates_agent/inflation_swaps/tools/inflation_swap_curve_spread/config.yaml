# =============================================================================
# inflation_swap_curve_spread — tool configuration
# =============================================================================
# This file is the canonical record of the same-curve ZCIS tenor-spread
# tool's conventions and methodology.  Loaded by
# ``shared.config.load_tool_config`` at compute() time.  Every shared
# convention (z_score_window_days, z_score_min_periods, z_score_ddof,
# z_score_buffer_multiplier, ffill_limit_days, period offsets, trailing
# range window, bps/yield/z-score rounding, window_years_round_decimals)
# carries the same numeric value as the sibling level primitive
# (inflation_swap_rate_level), the linker breakeven_curve_spread, and
# the sovereign yield_levels / curve_spread tools — the cross-config
# lint enforces value-agreement across every tool that declares the
# same convention name.  Drift on any of those is caught.
#
# The ZCIS-specific Bloomberg field convention is
# ``default_zcis_rate_field`` (= 'PX_MID') — distinct from sovereign /
# linker ``default_field_name`` (= 'YLD_YTM_MID') and OIS
# ``default_swap_rate_field`` (= 'PX_LAST') — to keep the cross-config
# lint clean across the four families.  This primitive composes
# inflation_swap_rate_level, which reads the same convention name from
# its own bundled config; threading ``config=config`` through to the
# inner level call keeps the resolved field consistent end-to-end.
#
# Concept honesty
# ---------------
# This tool returns the same-curve ZCIS tenor spread — i.e. the
# difference between two pillars on the same ZCIS curve family
# (e.g. USD_ZCIS 5s10s, EUR_ZCIS 5s30s).  Cross-curve combinations
# (e.g. USD_ZCIS 5Y vs EUR_ZCIS 5Y) are a separate primitive
# (``cross_market_inflation_swap_spread``) — different concept,
# different methodology.  This primitive's input layer accepts a
# single ``curve_family`` field by construction so the cross-curve
# attempt cannot be expressed.
#
# Spread formula
# --------------
# Per-trade-date, the displayed ZCIS curve spread is:
#
#   spread_bps = (long_zcis_pct - short_zcis_pct) * 100
#
# where ``short_zcis_pct`` and ``long_zcis_pct`` are the ZCIS rate
# levels at ``short_tenor`` and ``long_tenor`` respectively (each
# computed by ``calculate_inflation_swap_rate_level``).  The two
# endpoint series are aligned per-trade-date via a strict pandas
# inner-join AFTER each is computed independently — no synthetic
# spread points are produced on dates where one endpoint has no
# data.
#
# In V1 deterministic mode there is NO LLM-facing override path for
# conventions.  See docs/architecture/tool_architecture.md.
# =============================================================================

tool:
  name: inflation_swap_curve_spread
  domain: inflation_swaps
  category: desk_invariant_primitive
  description: |
    Same-curve zero-coupon inflation swap (ZCIS) tenor spread for a
    single curve family — emits both:

      - ``current_metrics``: snapshot of the latest aligned
        observation (current ZCIS curve spread in bps,
        daily/weekly/monthly bps changes, 252-day rolling z-score,
        trailing 252-day high/low/percentile, observation count) PLUS
        the load-bearing reference metadata
        ``inflation_index_family`` / ``index_lag`` / ``interpolation``
        / ``underlying_index`` (shared by both legs by the same-curve
        invariant) so a desk reader can interpret the spread
        honestly.

      - ``time_series_spread``: canonical
        ``shared.schemas.time_series.TimeSeries`` (units = BPS)
        carrying the historical ZCIS curve spread over the displayed
        ``lookback_days`` window.

      - ``time_series_zscore``: canonical
        ``shared.schemas.time_series.TimeSeries`` (units = Z_SCORE)
        carrying the rolling z-score of the spread series over the
        same window.

      - ``time_series``: bespoke wire-frozen row list for callers
        that want spread + z-score in a single per-row shape.

    Composed by calling ``calculate_inflation_swap_rate_level`` once
    for the short tenor and once for the long tenor, then aligning
    the two PERCENT-units canonical TimeSeries via a strict pandas
    inner-join on trade_date and applying the per-trade-date
    difference (long - short) * 100 in BPS.

    Same-curve invariant
    --------------------
    The two legs share a single ``curve_family``.  Cross-curve
    combinations (USD_ZCIS 5Y vs EUR_ZCIS 5Y) are a separate
    primitive (``cross_market_inflation_swap_spread``), NOT a config
    knob on this one.  The compute layer additionally re-asserts
    that the two endpoint reads share ``inflation_index_family``,
    ``index_lag``, ``interpolation``, and ``underlying_index``,
    surfacing a controlled error envelope if they do not (which
    would indicate a real instrument_master inconsistency, not a
    methodology choice).

conventions:

  # ---------------------------------------------------------------------------
  # Z-score window length (trading days)
  # ---------------------------------------------------------------------------
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading-day count for a 1-year rolling window.  Matches every
      sovereign rates tool, the OIS level/spread/forward tools, the
      linker real_yield_level / breakeven_inflation_simple /
      forward_breakeven_simple / breakeven_curve_spread tools, and
      the inflation_swap_rate_level tool — the cross-config lint
      enforces the match.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Minimum observations before the rolling stat is emitted
  # ---------------------------------------------------------------------------
  z_score_min_periods:
    value: 60
    source: team_judgment_pending_review
    rationale: >-
      ~3 months of observations before the rolling mean / std are
      deemed trustworthy.  Matches sovereign yield_levels /
      cross_market_spread / curve_spread / OIS rate_level / linker
      real_yield_level / breakeven_inflation_simple /
      forward_breakeven_simple / breakeven_curve_spread / ZCIS
      rate_level.
    valid_range: [20, 252]

  # ---------------------------------------------------------------------------
  # Standard-deviation degrees of freedom
  # ---------------------------------------------------------------------------
  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Sample standard deviation (Bessel-corrected, ddof=1).  Matches
      pandas' default and the convention every other rates tool uses.

  # ---------------------------------------------------------------------------
  # Calendar-day buffer for the fetch window
  # ---------------------------------------------------------------------------
  z_score_buffer_multiplier:
    value: 1.5
    source: derived_from_window
    rationale: >-
      Calendar-day buffer added to the fetch window so the rolling
      z-score AND the trailing range stat are both fully populated
      from the first displayed trading day.  1.5x trading-day window
      covers weekends + holidays.  Matches every other rates tool.
    valid_range: [1.2, 2.0]

  # ---------------------------------------------------------------------------
  # Period-change offsets (in trading-day rows after ffill)
  # ---------------------------------------------------------------------------
  daily_change_offset_rows:
    value: 2
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-2] = 1 trading day back.  The ZCIS curve
      spread series is in bps so changes go through
      period_changes(already_bps=True), i.e. plain subtraction (no
      *100 multiplier).
    valid_range: [2, 5]

  weekly_change_offset_rows:
    value: 6
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-6] = 5 trading days back ≈ 1 calendar week.
    valid_range: [5, 10]

  monthly_change_offset_rows:
    value: 22
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-22] = ~1 calendar month of trading days.
    valid_range: [20, 30]

  # ---------------------------------------------------------------------------
  # Trailing range / percentile window — LOCKED at 252 in V1
  # ---------------------------------------------------------------------------
  # The output schema's field names (high_252d_bps, low_252d_bps,
  # percentile_252d) embed the number; compute() raises
  # NotImplementedError if this is set to anything else.  Same
  # wire-freeze as breakeven_curve_spread / sovereign curve_spread /
  # inflation_swap_rate_level / OIS rate_level / linker real_yield_level.
  trailing_range_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      1Y trailing for high/low/percentile.  Locked at 252 in V1
      because the wire field names embed the number.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Forward-fill limit for missing observations
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Bridge up to one trading week of missing data across holiday
      gaps.  Matches every other rates tool; the consistency lint
      enforces the match where declared.  Applies inside the
      composed level primitive's clean step at each endpoint; the
      curve-spread layer itself uses a strict inner join on
      trade_date to avoid synthesising spread points.
    valid_range: [1, 10]

  # ---------------------------------------------------------------------------
  # Output rounding precision — bps (curve spread, period changes,
  # range)
  # ---------------------------------------------------------------------------
  bps_round_decimals:
    value: 2
    source: team_judgment_pending_review
    rationale: >-
      Round bps output (current ZCIS curve spread, daily/weekly/
      monthly changes, trailing high/low) to 0.01 bps.  Display
      precision; matches sovereign curve_spread / cross_market_spread
      / OIS spread tools / linker breakeven_curve_spread /
      breakeven_inflation_simple / forward_breakeven_simple.
      Threaded explicitly into period_changes(decimals=...) so the
      delta_bps default of 2 cannot silently shadow a YAML override.
    valid_range: [0, 6]

  # ---------------------------------------------------------------------------
  # Output rounding precision — z-score
  # ---------------------------------------------------------------------------
  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches the legacy default in
      ``shared.analytics.spreads.rolling_zscore`` and every other
      rates tool that exposes this convention.  Threaded to
      safe_float at the output boundary so a YAML override above 4 is
      not silently truncated by safe_float's own default of 4.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Output rounding precision — yields / pct
  # ---------------------------------------------------------------------------
  # Used here for the endpoint short_zcis_rate_pct / long_zcis_rate_pct
  # display fields (sourced from the inner level primitive's snapshot).
  # Kept aligned with the rest of the rates tools so the cross-config
  # lint stays clean.
  yield_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches the legacy hardcoded default in
      ``shared.analytics.levels.compute_level_metrics`` and every
      sovereign / OIS / linker / ZCIS level tool.  Kept here for
      cross-tool convention agreement; the curve spread itself is
      reported in bps.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Per-window-year display rounding (short_years, long_years)
  # ---------------------------------------------------------------------------
  window_years_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Display-precision rounding for the short_years / long_years
      fields in current_metrics.  4 decimals matches the OIS
      forward_rate / forward_breakeven_simple / breakeven_curve_spread
      value the cross-config lint enforces.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Trailing range high / low rounding precision (passed to the
  # composed level primitive's compute_level_metrics)
  # ---------------------------------------------------------------------------
  high_low_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches the legacy default in
      ``compute_level_metrics`` for the trailing high / low /
      percentile stats.  Matches the inflation_swap_rate_level /
      sibling level tools — required because this primitive's
      ToolConfig is threaded into the level primitive's compute.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Default Bloomberg observation field for both endpoint legs
  # ---------------------------------------------------------------------------
  # ZCIS quoted-rate mid is the canonical Bloomberg observation for
  # inflation swaps.  Reusing the same convention name as the level
  # primitive (``default_zcis_rate_field``) so the cross-config lint
  # stays clean and the threaded config flows through to both inner
  # level calls.
  default_zcis_rate_field:
    value: PX_MID
    source: bloomberg_field_convention
    rationale: >-
      ZCIS quoted-rate mid is the canonical Bloomberg observation
      for inflation swaps and matches the playbook's
      ``target_metrics`` (``yield_mid`` → ``PX_MID``).  This default
      is passed unchanged to BOTH the short-tenor and long-tenor
      inner inflation_swap_rate_level calls.  LLM/HTTP wrappers
      MUST use the empty/None sentinel so this default flows
      through.

methodology:
  what_it_does: |
    Same-curve zero-coupon inflation swap (ZCIS) tenor spread
    between two pillars of the same ZCIS curve family (e.g.
    USD_ZCIS 5s10s, EUR_ZCIS 5s30s, GBP_ZCIS 2s10s).  Computed
    per-trade-date via the SPREAD formula:

      spread_bps = (long_zcis_pct - short_zcis_pct) * 100

    where ``short_zcis_pct`` and ``long_zcis_pct`` are the ZCIS
    rate levels at ``short_tenor`` and ``long_tenor`` respectively
    (each computed by
    ``calculate_inflation_swap_rate_level`` filtered by
    ``instrument_type='inflation_swap'`` AND
    ``pricing_type='zero_coupon_breakeven'`` AND
    ``curve_family=?`` AND ``tenor=?`` — the no-proxy guard
    inherited transitively).  The two endpoint series are aligned
    per-trade-date via a strict pandas inner-join on calendar
    trade_date AFTER each is computed independently; the spread
    is computed only on dates where BOTH endpoints exist (no
    synthetic spread points are produced).

    Same-curve construction only: the input layer accepts a single
    ``curve_family`` field so cross-curve combinations cannot be
    expressed.  Compute additionally re-asserts that the two
    endpoint reads share ``inflation_index_family``, ``index_lag``,
    ``interpolation``, and ``underlying_index`` (load-bearing
    reference-metadata invariants of the curve), surfacing a
    controlled error envelope if they do not — that would indicate
    a real instrument_master inconsistency at the underlying
    pillars rather than a methodology choice.  Cross-curve ZCIS
    spreads (e.g. USD vs EUR) are a separate primitive
    (``cross_market_inflation_swap_spread``) — different concept,
    different methodology.

    The ``inflation_index_family`` / ``index_lag`` /
    ``interpolation`` / ``underlying_index`` fields thread to the
    wire on ``current_metrics`` AND in the canonical TimeSeries
    description so a desk reader can interpret the spread under
    the correct ZCIS convention without a second tool call.

  assumptions:
    - "Same-curve invariant: both legs share a single
       ``curve_family``.  Cross-curve ZCIS spreads (e.g. USD_ZCIS
       5Y vs EUR_ZCIS 5Y) are forbidden by this primitive's input
       shape — they belong to
       ``cross_market_inflation_swap_spread``."
    - "Reference-metadata equality across the two legs
       (``inflation_index_family``, ``index_lag``,
       ``interpolation``, ``underlying_index``) is assumed by the
       same-curve invariant and re-asserted in code.  A mismatch
       surfaces a controlled error envelope rather than a silently
       averaged or papered-over snapshot."
    - "Each endpoint ZCIS rate is computed by composing
       ``calculate_inflation_swap_rate_level`` once per endpoint
       tenor, passing the same ``ToolConfig`` so methodology stays
       consistent.  This inherits the level primitive's
       four-conjunct no-proxy guard (instrument_type +
       pricing_type + curve_family + tenor) for free."
    - "If either endpoint level returns its own controlled error
       envelope, this tool surfaces a controlled error envelope of
       its own that names which endpoint(s) failed (short_tenor /
       long_tenor) and propagates the inner error context."
    - "Tenor pair ordering is structural: short_tenor must map to
       a strictly smaller year fraction than long_tenor, computed
       via ``shared.analytics.curve_bootstrap.tenor_to_years``.  A
       caller passing short_tenor=10Y, long_tenor=2Y is rejected
       at the schema layer; the tool does NOT silently swap them."
    - "Per-trade-date alignment: the two endpoint ZCIS series are
       aligned via a strict pandas inner-join on trade_date AFTER
       each is computed independently from the level primitive.
       No ffill across the join — dates where ONE endpoint has no
       data are dropped from the spread series."
    - "The ZCIS rates from the inner level primitive arrive in
       PERCENT; the curve spread is converted to BPS at compute
       time via the *100 multiplier and rounded to
       ``bps_round_decimals``.  ``daily/weekly/monthly`` changes
       use ``period_changes(already_bps=True)`` (plain
       subtraction); ``bps_round_decimals`` is threaded through
       explicitly so the YAML is authoritative."
    - "The snapshot's ``spread_bps`` equals
       ``time_series[-1].spread_bps`` and
       ``time_series_spread.rows[-1].value`` bit-for-bit at the
       YAML's ``bps_round_decimals``; same boundary-rounding
       discipline as breakeven_curve_spread /
       cross_country_breakeven_spread_simple."
    - "lookback_days controls the *display* window (and the
       bespoke time_series row count + canonical TimeSeries
       length), NOT the rolling z-score window or the trailing
       range window — those are independent conventions in this
       YAML."
    - "Latest-observation cutoff for the displayed window is
       anchored to the data's latest aligned trade_date (matching
       inflation_swap_rate_level / breakeven_curve_spread /
       OIS rate_level)."

  citations:
    - "trading_day_convention (registered in
       docs/architecture/methodology_sources.md)."
    - "industry_standard_1y_window (registered in
       docs/architecture/methodology_sources.md)."
    - "industry_standard_sample_std (registered in
       docs/architecture/methodology_sources.md)."
    - "bloomberg_field_convention (registered in
       docs/architecture/methodology_sources.md)."
    - "derived_from_window (registered in
       docs/architecture/methodology_sources.md)."
    - "team_judgment_pending_review (registered in
       docs/architecture/methodology_sources.md)."
    - "legacy_default_pre_pilot (registered in
       docs/architecture/methodology_sources.md)."

  planned_extensions:
    - "Inflation-swap forward (e.g. 5Y5Y, 5Y10Y, 2Y3Y)
       constructed from two endpoint ZCIS rates via the year-
       weighted forward formula.  Will be the next primitive in
       this domain — ``inflation_swap_forward`` (build_order 11)."
    - "Cross-market inflation-swap spread (e.g. USD ZCIS 5Y minus
       EUR ZCIS 5Y) — same-tenor, cross-curve.  A different
       concept than this primitive (which is same-curve, two-
       tenor); ships as a separate primitive
       (``cross_market_inflation_swap_spread``, build_order 12)
       subject to the INDEX-FAMILY MISMATCH caveat the cross-
       country breakeven primitive carries."
    - "Swap-breakeven basis (ZCIS rate minus same-tenor linker
       bond-implied breakeven) — the canonical desk read of the
       relative-value spread between the inflation-swap and the
       linker-bond inflation-compensation curves
       (``swap_breakeven_basis_simple``, build_order 13)."
    - "trailing_range_window_days: configurable.  Currently locked
       at 252 because the output fields high_252d_bps /
       low_252d_bps / percentile_252d embed the number.  Path to
       configurability mirrors sibling level / curve-spread tools'
       planned_extensions: rename schema fields to high_window_bps
       / low_window_bps / percentile_window + add
       trailing_window_days to the output; remove the
       NotImplementedError guard in compute()."
    - "Date-window input mode (``start_date`` / ``end_date``) for
       ad-hoc display windows aligned to specific calendar events
       (e.g. central-bank meeting dates).  Deferred from V1 so the
       wire shape stays minimal — tenor-pair mode is the canonical
       desk read for ZCIS curves."
