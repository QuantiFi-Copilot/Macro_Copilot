# =============================================================================
# policy_futures.scan_policy_futures_extremes_tool — tool configuration
# =============================================================================
# Morning policy-futures sweep across the strip universe (SOFR /
# EUR_SHORT_RATE_FUT / SONIA) — ranks every (curve_family,
# strip_position) by absolute 252-day z-score across four metrics:
#
#   - ``implied_rate_level``   — z-score of the implied-rate LEVEL
#                                series (PERCENT). The headline
#                                "where is the strip stretched in
#                                rate space?" read for the STIR desk.
#   - ``implied_rate_change``  — z-score of the 1-day Δ in implied
#                                rate (BPS space — Δ × 100). The "Δ"
#                                metric in the catalog wording —
#                                answers "which strip moved most
#                                today relative to its own daily
#                                distribution?"
#   - ``volume_level``         — z-score of raw daily traded volume
#                                (in CONTRACTS).
#   - ``open_interest_level``  — z-score of end-of-day open-interest
#                                level (in CONTRACTS).
#
# V1 monitor under ``policy_futures`` (per ADR 0013 — strip-position-
# keyed monitors). The output card disclosure makes the scope-limited
# reading explicit (P5 + ADR 0013):
#
#   "Universe-wide policy-futures strip scan across SOFR / SONIA /
#    EUR_SHORT_RATE_FUT strip positions 1..8 — NOT a CTD-of-futures-
#    of-OIS curve scan, NOT a tenor-anchored OIS scan, NOT a pack-
#    average summary, NOT a curve-shape read, NOT a meeting-by-
#    meeting policy-path decomposition, NOT a tactical trade signal.
#    Z-score lookback = 252 trading days. Rolling-generic strip
#    (SFR1 / ER1 / SFI1 etc.) — the per-contract underlying rolls
#    quarterly so each strip slot mixes contracts across rolls; this
#    is the canonical desk read but does NOT equal the price of a
#    single underlying contract over time. Underlying short-rate
#    regime DIFFERS across curve_family rows: SOFR_FUT and SONIA_FUT
#    reference a compounded daily RFR; EUR_SHORT_RATE_FUT references
#    an unsecured 3M term IBOR (Euribor). Output rows MUST carry the
#    methodology disclosure tag so a desk consumer cannot mistake an
#    EUR_SHORT_RATE_FUT z-score for an RFR-curve z-score."
#
# In V1 deterministic mode there is NO LLM-facing override path for
# methodology conventions. The LLM can scope the scan
# (``curve_families``), anchor it to a date (``as_of_date``), set
# display thresholds (``top_n``, ``min_abs_z_score``), and choose
# which subset of metrics to rank (``metrics``) but cannot alter the
# z-score window, ddof, fill limit, fetch-window buffer multiplier,
# or the three field-name mnemonics (PX_LAST / PX_VOLUME / OPEN_INT).
# The implied-rate conversion rule (raw_price → implied_rate_pct,
# per stem) is driven OFF METADATA (the per-strip
# ``instrument_master.attributes->>'inverse_pricing'`` flag read via
# fetch_scan_universe_policy_future_reference) — NOT off a hardcoded
# list in compute.py. Mixed-flag universes are refused with the
# controlled-error envelope. ``top_n`` / ``min_abs_z_score`` /
# ``metrics`` are None-sentinel optionals that fall through to the
# YAML defaults (``default_top_n`` / ``default_min_abs_z_score`` /
# ``default_metrics``) — keeps display thresholds YAML-locked per
# PR9 / PR10 while still allowing per-query overrides at the input
# layer.
# =============================================================================

tool:
  name: policy_futures_scan_policy_futures_extremes_tool
  domain: policy_futures
  description: |
    Universe-wide policy-futures strip scan — ranks every
    (curve_family, strip_position) stem in the policy_futures
    universe (SOFR_FUT / EUR_SHORT_RATE_FUT / SONIA_FUT × strip
    positions 1..8 = 24 stems on the V1 playbook) by absolute
    252-day z-score across four metrics:

      - ``implied_rate_level``   — z-score of implied_rate_pct
        LEVEL (PERCENT).
      - ``implied_rate_change``  — z-score of the 1-day Δ in
        implied_rate_pct (BPS — Δ × 100; matches the bps wire
        convention sibling tools use for change-metric output).
      - ``volume_level``         — z-score of raw daily traded
        volume (CONTRACTS).
      - ``open_interest_level``  — z-score of end-of-day
        open-interest level (CONTRACTS).

    Returns the top-N extremes per metric, each row tagged with the
    methodology disclosure so downstream consumers cannot mistake
    the read for a tenor-anchored OIS call, a pack-average summary,
    a curve-shape read, or a tactical trade signal. Per-row regime
    disclosure (RFR vs IBOR) makes the SOFR / SONIA / Euribor
    heterogeneity explicit on every output row per ADR 0013.

conventions:

  # ---------------------------------------------------------------------------
  # Z-score window length (trading days). The HEADLINE methodology
  # disclosure required by the catalog guardrail — disclosed verbatim
  # on the response's methodology_disclosure string and on every
  # result row. Matches the 1y_window convention used by every
  # policy_futures sibling monitor (futures_price_level /
  # futures_calendar_spread / futures_butterfly_simple /
  # futures_cross_market_spread / futures_strip_snapshot /
  # futures_pack_average_simple / volume_open_interest_snapshot) and
  # the bond_futures + inflation scanner siblings so cross-tool
  # z-score reads are comparable across the rates domain.
  # ---------------------------------------------------------------------------
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading-day count for a 1-year rolling window. Same convention
      as yield_levels / ois rate_level / futures_price_level (policy
      AND bond futures) / scan_bond_futures_extremes /
      scan_inflation_swaps_extremes. Desk reads of "is X stretched?"
      are benchmarked against the trailing year — anchoring the
      scan's z-scores here keeps cross-tool comparability. The
      MUST-DISCLOSE window per the catalog's methodology guardrail
      (catalog entry
      ``policy_futures__scan_policy_futures_extremes``).
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Minimum observations before a stem is included in the ranking
  # ---------------------------------------------------------------------------
  z_score_min_periods:
    value: 60
    source: team_judgment_pending_review
    rationale: >-
      ~3 months of observations before the rolling mean / std are
      deemed trustworthy. Matches every other policy_futures sibling
      and the bond_futures / inflation_swaps scanners. Stems with
      fewer observations are SKIPPED in the ranking — never silently
      promoted to "z = None" rows.
    valid_range: [20, 252]

  # ---------------------------------------------------------------------------
  # Standard deviation degrees of freedom
  # ---------------------------------------------------------------------------
  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Sample standard deviation (Bessel-corrected, ddof=1). Matches
      pandas' default and every other rates tool in this codebase.

  # ---------------------------------------------------------------------------
  # Calendar-day buffer for the fetch window
  # ---------------------------------------------------------------------------
  z_score_buffer_multiplier:
    value: 1.5
    source: derived_from_window
    rationale: >-
      Calendar-day buffer added to the fetch window so the rolling
      z-score is fully populated for every stem on the as-of date.
      1.5x trading-day window covers weekends + holidays. Matches
      every other rates level primitive in this codebase.
    valid_range: [1.2, 2.0]

  # ---------------------------------------------------------------------------
  # 1-day Δ offset (in trading-day rows after ffill + alignment)
  # ---------------------------------------------------------------------------
  # iloc[-1] vs iloc[-daily_change_offset_rows] = 1 trading day back.
  # Same convention key the policy_futures sibling tools use for
  # their 1-day deltas.
  daily_change_offset_rows:
    value: 2
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-2] = 1 trading day back. Matches the daily
      change convention used by every policy_futures sibling and the
      bond_futures / sovereign / OIS level primitives. The "Δ"
      metric in the scan is the rolling z-score of the 1-day
      implied-rate change SERIES (in bps); the offset is used both
      for the per-row snapshot daily_change_implied_rate_bps and as
      the diff(1) period for the change-z-score series.
    valid_range: [2, 5]

  # ---------------------------------------------------------------------------
  # Forward-fill limit for missing observations
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Bridge up to one trading week of missing data across holiday
      gaps. Same as every other rates level primitive. Per-stem,
      applied independently to price / volume / open-interest series
      before the per-stem intersection alignment.
    valid_range: [1, 10]

  # ---------------------------------------------------------------------------
  # Bloomberg observation fields — NOT input-schema knobs.
  # ---------------------------------------------------------------------------
  # See ``schemas.py`` module docstring for the input-schema-overreach
  # rationale. Mirrored from futures_price_level /
  # volume_open_interest_snapshot / futures_strip_snapshot so the
  # scan reads exactly the same underlying observations as the
  # per-strip monitors — guarantees the scan's "SFR1 implied-rate
  # z = +2.3" equals the futures_price_level snapshot's z for SFR1
  # (same data, same window, same method).
  default_price_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: >-
      Last-traded price is the canonical front-month price
      observation. Mirrors futures_price_level's ``default_price_field``.
      An ingestion-side rename (PX_LAST → PX_FUT_LAST etc.) can be
      absorbed by a YAML edit rather than a code change.
  default_volume_field:
    value: PX_VOLUME
    source: bloomberg_field_convention
    rationale: >-
      Daily traded volume mnemonic. Mirrors
      volume_open_interest_snapshot's ``default_volume_field``.
      Policy-futures playbook ingests PX_VOLUME alongside PX_LAST /
      OPEN_INT.
  default_open_interest_field:
    value: OPEN_INT
    source: bloomberg_field_convention
    rationale: >-
      Daily end-of-day open-interest mnemonic. Mirrors
      volume_open_interest_snapshot's ``default_open_interest_field``.
      Policy-futures playbook ingests OPEN_INT alongside PX_LAST /
      PX_VOLUME.

  # ---------------------------------------------------------------------------
  # Policy-futures curve families recognised by the scanner
  # ---------------------------------------------------------------------------
  # ADR 0013 V1 scope: SOFR_FUT (RFR — compounded daily SOFR), SONIA_FUT
  # (RFR — compounded daily SONIA), EUR_SHORT_RATE_FUT (IBOR —
  # unsecured 3M term Euribor). Hardcoding here rather than discovering
  # at runtime so a stray bond-futures / sovereign / inflation /
  # OIS stem (mis-labelled at ingestion) is REFUSED at schema-
  # validation time rather than silently included in the scan.
  #
  # NOTE on ADR 0013 EUR refusal: unlike futures_pack_average_simple,
  # this scanner does NOT need a hard NotImplementedError refusal
  # gate for EUR_SHORT_RATE_FUT. The pack-average refusal is keyed on
  # the Buba-curve serial/quarterly mix that breaks the pack-
  # AVERAGING operation; a universe scan that ranks EACH stem on its
  # own implied-rate series does not run into that mixing problem
  # (it just ranks each ER1 / ER2 / ... independently). HOWEVER, the
  # methodology disclosure surfaces RFR-vs-IBOR regime per row so a
  # desk consumer cannot mistake an EUR_SHORT_RATE_FUT z-score for
  # an RFR-curve z-score.
  policy_futures_curve_families:
    value: "SOFR_FUT,EUR_SHORT_RATE_FUT,SONIA_FUT"
    source: bloomberg_field_convention
    rationale: >-
      Closed family of strip-position-keyed STIR futures curve
      families per ADR 0013 (V1 monitors-only scope).
      Comma-separated string because ``Convention.value`` is scalar
      (str). Excludes bond-futures curves (UST_FUT / DE_FUT / etc.,
      which are tenor-keyed rolling-generic — route to the
      bond_futures agent), sovereign curves (UST / DE_BUND / etc.),
      OIS curves, and inflation curves. A new STIR curve family
      added to the playbook is added here in the same PR — the
      whitelist is intentionally explicit, not discovery-based, so
      mis-labelled stems cannot leak into the scan.

  # ---------------------------------------------------------------------------
  # Short-rate regime label per curve_family (RFR vs IBOR). Disclosure-
  # only (P5 — does NOT alter computation). RFR = compounded daily
  # risk-free rate (SOFR / SONIA); IBOR = unsecured 3M term IBOR
  # (Euribor). Stored as a CSV of ``KEY=VALUE`` pairs because
  # ``Convention.value`` is scalar; compute parses it into a dict at
  # load time. Mirrors the sibling futures_price_level /
  # futures_strip_snapshot / futures_pack_average_simple entries
  # verbatim so the cross-tool disclosure reads the same across the
  # policy_futures domain.
  # ---------------------------------------------------------------------------
  short_rate_regime_map:
    value: "SOFR_FUT=RFR,SONIA_FUT=RFR,EUR_SHORT_RATE_FUT=IBOR"
    source: team_judgment_pending_review
    rationale: >-
      Disclosure-only mapping (P5 — does NOT alter computation). RFR
      vs IBOR labels the underlying short-rate object so a desk
      reader knows what the implied rate means: a compounded daily
      RFR (SOFR / SONIA) vs an unsecured 3M term IBOR (Euribor).
      Stored as a CSV of ``KEY=VALUE`` pairs because
      ``Convention.value`` is scalar; compute parses it into a dict
      at load time. New families added to the playbook are added
      here in the same PR — no hidden defaults.

  # ---------------------------------------------------------------------------
  # Boundary rounding — applied to each result row's snapshot values
  # and z-scores. Mirrors the precisions used by the sibling per-
  # strip monitors so a "SFR1 implied_rate_pct = 95.6700" from the
  # scan equals the futures_price_level snapshot's
  # implied_rate_pct for SFR1 on the same as-of date.
  # ---------------------------------------------------------------------------
  raw_price_round_decimals:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Five decimals safely covers every quoted tick across the
      policy-futures universe (SFR tick_size = 0.0025 / 0.005; ER /
      SFI ticks 0.005). Matches the sibling futures_price_level /
      futures_strip_snapshot precision.
    valid_range: [0, 8]

  implied_rate_round_decimals:
    value: 4
    source: team_judgment_pending_review
    rationale: >-
      Four decimals for the implied rate in PERCENT (≈ 0.01 bp
      precision). Matches the precision desks use to read STIR
      implied rates without losing tick-derived resolution. Same
      precision as futures_price_level / futures_strip_snapshot /
      futures_pack_average_simple's per-leg implied-rate fields.
    valid_range: [0, 8]

  bps_change_round_decimals:
    value: 2
    source: team_judgment_pending_review
    rationale: >-
      Two decimals on bps quantities (0.01 bp = 1/10 of a tick at
      the SFR/ER/SFI tick_size of 0.005 = 0.5bp). Matches the
      scan_inflation_swaps_extremes ``bps_change_round_decimals``
      precision so cross-scanner bps reads are comparable.
    valid_range: [0, 4]

  volume_round_decimals:
    value: 0
    source: bloomberg_field_convention
    rationale: >-
      Volume is a whole-contract count. Round to 0 decimals to
      surface the integer-valued count on the wire (matches
      volume_open_interest_snapshot's ``volume_round_decimals`` and
      scan_bond_futures_extremes's precision).
    valid_range: [0, 4]

  oi_round_decimals:
    value: 0
    source: bloomberg_field_convention
    rationale: >-
      Open interest is a whole-contract count. Round to 0 decimals
      (matches volume_open_interest_snapshot's ``oi_round_decimals``
      and scan_bond_futures_extremes's precision).
    valid_range: [0, 4]

  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches every other policy_futures /
      bond_futures / sovereign / OIS / inflation rates primitive in
      this codebase. The z-score is the ranking key; preserving
      four decimals avoids ties from coarse rounding when two stems
      have very similar z-scores.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Display-threshold defaults — YAML-owned per PR9 / PR10 (catalog
  # guardrail). The LLM may STILL override either knob per query at
  # the input layer; these conventions only kick in when the input
  # is omitted (None-sentinel resolution inside compute). The
  # valid_range mirrors the schema-level Field(ge=..., le=...) bound
  # so an off-range YAML edit is caught by `python -m
  # shared.config.lint` before it lands in production.
  # ---------------------------------------------------------------------------
  default_top_n:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Default number of extreme stems to return PER METRIC when the
      LLM does not pass ``top_n`` explicitly. Five rows per metric
      × four metrics = 20 rows on a default morning-sweep call —
      enough coverage to read the desk question "where is the
      strip universe stretched today?" without flooding the
      response payload. The hard ceiling (50 per metric) remains a
      schema-level Field bound so an LLM cannot exceed it
      regardless of the YAML default. Matches the sibling
      scan_bond_futures_extremes default.
    valid_range: [1, 50]

  default_min_abs_z_score:
    value: 1.5
    source: team_judgment_pending_review
    rationale: >-
      Default minimum absolute z-score floor when the LLM does not
      pass ``min_abs_z_score`` explicitly. 1.5σ matches the
      bond_futures / sovereign / OIS / inflation scanner
      team-judgment defaults — desk reads of "anything stretched
      today?" want to surface the >=1.5σ moves and ignore the noise
      band below. The non-negative bound (ge=0.0) remains a
      schema-level Field invariant so an off-range YAML edit is
      structurally caught by the load.
    valid_range: [0.0, 10.0]

  # ---------------------------------------------------------------------------
  # Default metrics to rank when the LLM omits the ``metrics`` input
  # ---------------------------------------------------------------------------
  # Stored as a CSV of metric identifiers (matching the closed
  # ScanMetric Literal in schemas.py). All four metrics by default —
  # the catalog wording "ranked by absolute z-score of implied rate,
  # Δ, volume, and OI" makes all four canonical.
  default_metrics:
    value: "implied_rate_level,implied_rate_change,volume_level,open_interest_level"
    source: team_judgment_pending_review
    rationale: >-
      All four metrics by default — the catalog wording binds the
      scan to all four ranked dimensions ("implied rate, Δ, volume,
      and OI"). An LLM may narrow the set per query (e.g.
      ``metrics=['implied_rate_level']`` for a rate-only screen);
      the schema validates against the closed ScanMetric Literal
      whitelist. CSV-encoded because ``Convention.value`` is
      scalar; compute parses into a tuple of ScanMetric values at
      load time.

methodology:
  what_it_does: |
    For every (curve_family, strip_position) stem in the
    policy_futures universe (SOFR_FUT / EUR_SHORT_RATE_FUT /
    SONIA_FUT × strip positions 1..8 by default;
    scope-narrowable via ``curve_families`` input), fetches the
    three strip-position-keyed series (PX_LAST / PX_VOLUME /
    OPEN_INT) across the lookback window plus z-score buffer,
    cleans each series (ffill bridges holidays up to 5 trading
    days), converts the raw_price series to implied_rate_pct via
    the per-strip inverse-pricing rule
    (implied_rate_pct = 100 - raw_price when inverse_pricing=true;
    raw_price direct when inverse_pricing=false), aligns the three
    series per-stem on the intersection of trading days, and
    computes a rolling 252-day z-score on four metrics:

      - implied_rate_level z-score (uses the cleaned implied-rate
        series in PERCENT),
      - implied_rate_change z-score (uses the diff of the cleaned
        implied-rate series in BPS — Δ × 100),
      - volume_level z-score (uses the cleaned volume series in
        CONTRACTS),
      - open_interest_level z-score (uses the cleaned OI series in
        CONTRACTS).

    Stems with fewer than ``z_score_min_periods`` aligned
    observations are SKIPPED for that metric (never silently
    demoted to z=None). Within each metric, ranks remaining stems
    by absolute z-score, applies the ``min_abs_z_score`` filter,
    and returns the top ``top_n`` rows per metric — each row tagged
    with the methodology disclosure (universe-wide strip-position
    sweep; rolling-generic strip; z lookback 252d; RFR-vs-IBOR
    regime per curve_family per ADR 0013).

  assumptions:
    - "Universe-wide strip-position sweep, NOT a tenor-anchored OIS
       scan, NOT a pack-average summary (those are
       futures_pack_average_simple), NOT a curve-shape read (those
       are futures_calendar_spread / futures_butterfly_simple /
       futures_cross_market_spread), NOT a meeting-by-meeting
       policy-path decomposition (Phase-4 work). Output rows MUST
       carry the methodology disclosure tag so downstream consumers
       cannot mistake the read for any of those. The catalog's
       methodology guardrail makes this disclosure load-bearing."
    - "The four metrics (implied_rate_level, implied_rate_change,
       volume_level, open_interest_level) are the CONCEPT — they
       are not user-overridable in their definition. The ``metrics``
       input lets the LLM scope the SUBSET ranked per query
       (whitelist-validated against the closed ScanMetric Literal)
       but the four definitions are fixed. The three field
       mnemonics (default_price_field / default_volume_field /
       default_open_interest_field) are YAML-locked so an
       ingestion-side rename can be absorbed by a YAML edit; the
       LLM cannot ask for a non-standard set of fields per query
       (input-schema overreach per PR8 / OPR8)."
    - "Policy-futures strip slots are keyed by
       ``(curve_family, strip_position)`` where ``strip_position``
       is a 1-based 1..8 slot index from
       ``instrument_master.attributes->>'strip_position'``. The
       enriched view's ``contract_code`` column COALESCEs the
       per-day-effective SCD2 history value (SFRH6, SFRM6, ...
       rotating as the front rolls) onto the master stem; for the
       universe scan the master stem (SFR1, ER1, SFI1, ...) lives
       only on ``instrument_master.contract_code`` and is sourced
       via the as_of-bounded SCD2 reference helper
       ``fetch_scan_universe_policy_future_reference``. The
       universe-series fetcher
       ``fetch_scan_universe_strip_position`` filters on
       ``instrument_type='policy_future'`` AND the
       ``policy_futures_curve_families`` whitelist (see
       conventions block)."
    - "Per-stem implied-rate conversion is METADATA-DRIVEN. The
       per-strip ``inverse_pricing`` flag from
       ``instrument_master.attributes`` decides whether
       ``implied_rate_pct = 100 - raw_price`` (inverse) or
       ``implied_rate_pct = raw_price`` (direct) — NOT a hardcoded
       list in compute.py (PR8 / P6 — no hidden methodology choice
       in code). Stems without the flag are refused with the
       controlled-error envelope. Mixed-flag universes (some
       inverse, some direct on the same call) are refused with the
       controlled-error envelope — the snapshot's
       quote_units disclosure cannot be honest under a mixed
       convention. In V1 every universe entry on SOFR_FUT /
       SONIA_FUT / EUR_SHORT_RATE_FUT carries
       ``inverse_pricing: true``."
    - "ADR 0013 V1 monitors-only scope: this primitive is the
       morning extremes scan across the policy_futures strip
       universe. CTD-of-futures-of-OIS curve mapping, term-premium
       decomposition, meeting-by-meeting policy-path
       extraction, and basis-vs-OIS reads are documented-deferred
       Phase-4 work. The methodology disclosure surfaces this
       limit on every row."
    - "Per-row RFR-vs-IBOR regime disclosure is REQUIRED on every
       output row per ADR 0013. The scan ranks across the
       heterogeneity (SOFR_FUT / SONIA_FUT = RFR — compounded
       daily risk-free rate; EUR_SHORT_RATE_FUT = IBOR — unsecured
       3M term Euribor); a desk consumer reading 'ER1 implied
       rate z = +2.3' must be able to see immediately that this is
       an IBOR-anchored rate, not an RFR-anchored rate."
    - "Fetch window is derived from YAML — not an LLM input. The
       calendar-day buffer is ``z_score_window_days *
       z_score_buffer_multiplier`` (currently 252 * 1.5 = 378
       days), which guarantees a fully-populated 252d rolling
       z-score for every stem on the as-of date. Exposing the
       fetch window as an LLM-controlled input would be a PR8 /
       OPR8 input-schema overreach (methodology knob masquerading
       as a per-query choice). ``min_abs_z_score`` / ``top_n`` /
       ``metrics`` remain DISPLAY thresholds (per-query inputs,
       all YAML-defaultable via the ``default_*`` conventions);
       they do not change which stems are SCANNED, only which
       appear in the ranked output."
    - "``as_of_date`` anchors the scan to a specific trading day —
       either the LLM-supplied date or, when omitted, the
       most-recent shared trading day across the fetched universe
       (max trade_date observed across per-stem aligned series).
       Determinism: same as-of date + same DB state ⇒ same
       ranking. Per-stem time series are CAPPED at the resolved
       as_of_date before z-scoring so a future-dated row cannot
       contaminate the trailing rolling stats. Mirrors the
       scan_bond_futures_extremes / scan_inflation_swaps_extremes
       convention. A future-dated anchor BEYOND the universe's
       last observed trade_date is REJECTED via a cheap
       MAX(trade_date) probe over the same source the series
       fetcher uses — controlled-error envelope, no silent
       relabelling of an unbounded read."
    - "Per-stem alignment: each (curve_family, strip_position)
       stem's implied-rate / volume / OI series are intersected on
       shared trading days BEFORE z-score computation. Stems where
       the three series disagree on date support are aligned
       per-stem, never across stems — a date hole on SFR1 does
       not affect ER1's z-scores."

  citations:
    - "ADR 0013 (docs_revamped/05_decisions/0013-futures-domain-agents.md)"
    - "Catalog v2.1 PR14 (frozen field-name discipline: implied_rate_pct)"

  planned_extensions:
    - "Direct-priced policy-futures family support (e.g.
       TIIE_FUT). No code change required — the implied-rate
       conversion is metadata-driven; the regime map gets a YAML
       edit to add the disclosure label, and the
