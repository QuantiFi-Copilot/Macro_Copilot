operator:
  name: apply_mask
  method_family: masking
  version: "1.0.0"
  description: >-
    Subsample a Series by a boolean EventSet mask.  Output is a new
    Series whose values are the input restricted to the dates where
    mask=True.  Finance-blind; the operator does NOT know whether
    the mask represents sparse trigger events (event_study archetype)
    or persistent regime states (regime_conditioned_relationship
    archetype) — that semantic is owned by the upstream operator
    that produced the EventSet (e.g. threshold_events with
    rule=above|below|abs_above) and surfaced via lineage.

defaults:
  index_policy:
    value: intersect
    source: operator_v1_default
    rationale: >-
      Real-world masks and target series can come from operators on
      slightly different calendars (e.g. a mask built from a 2s10s
      curve_spread fetcher and applied to a UST 10Y yield level
      series).  ``intersect`` (default) computes the index
      intersection and applies the mask on that common subset, so
      the operator works robustly across the canonical desk
      bindings.  Pass ``strict_match`` when the caller wants a hard
      guarantee that both inputs share the exact same index (e.g.
      both went through the same align_series step and any drift is
      a bug).
    valid_values: [intersect, strict_match]

  preserve_full_index:
    value: false
    source: operator_v1_default
    rationale: >-
      ``false`` (default): output is sparse — payload index contains
      only the dates where mask=True.  Matches the natural
      "subsample by regime" semantic and lets downstream
      summarization compute statistics over the regime sample
      directly.  Pass ``true`` when a downstream operator needs the
      full date axis preserved (e.g. for index-aligned arithmetic
      with another series); cells where mask=False become NaN in
      that mode.
    valid_values: [true, false]

  require_matching_frequency:
    value: true
    source: operator_v1_default
    rationale: >-
      OPR11 structural-metadata control (mirrors event_windows /
      series_arithmetic / align_series).  When true (default), the
      Series and the EventSet must declare the same ``frequency`` tag
      (or both be None).  The EventSet carries a real frequency
      propagated from its source Series by ``threshold_events``, so
      this is an ENFORCED check — masking a daily target with a mask
      detected on a weekly cadence is exactly the hazard the
      structural-metadata contract exists to catch.  Pass false to opt
      into mixed-frequency masking explicitly; the choice is recorded
      in lineage.
    valid_values: [true, false]

  require_matching_missingness:
    value: true
    source: operator_v1_default
    rationale: >-
      OPR11 structural-metadata control, exposed for uniformity so
      apply_mask carries BOTH require_matching_* flags like every other
      multi-artifact operator.  An EventSet is a boolean mask with no
      missingness regime, so there is no second policy to compare
      against — the flag is strict-by-default and recorded in lineage,
      but the check is vacuous and the output inherits the input
      Series's missingness policy unchanged.  Threading a missingness
      regime onto the EventSet was rejected: the mask-source and the
      subsampled target are frequently different series with
      legitimately different cleaning, so a strict match would reject
      valid regime/event workflows.
    valid_values: [true, false]

methodology:
  what_it_does: >-
    Given a typed ``Series`` and a typed ``EventSet`` (whose ``mask``
    is a per-date boolean Series), returns a new ``Series`` whose
    payload is the input subsampled to the dates where the mask is
    True.  Lineage records the operator step + the EventSet's
    upstream provenance (via ``auxiliary_lineages``) so a
    downstream lineage walker sees both the data chain and the mask
    chain.

    Index-policy detail:
      - ``intersect``    : payload becomes input.payload.loc[I & M]
                           where I = series.payload.index and M =
                           mask.mask.index.  Robust to small index
                           mismatches.
      - ``strict_match`` : raises ``ApplyMaskError`` unless
                           series.payload.index == mask.mask.index.

    Preserve-index detail:
      - false : output payload is the True-cell subset.
      - true  : output payload retains the (intersected) full index
                with mask=False cells set to NaN.

    Units / frequency / missingness propagate 1:1 from the input
    Series.  Before subsampling, the operator enforces the OPR11
    structural-metadata algebra: ``require_matching_frequency`` (real
    check — Series vs EventSet ``frequency`` tag) and
    ``require_matching_missingness`` (uniformity flag — vacuous because
    an EventSet carries no missingness regime).  Both flags default
    strict and are recorded in the lineage step.
  planned_extensions:
    - "categorical-mask support (when a CategoricalMask artifact lands)"
    - "negation knob (apply_mask with rule=invert returning the complement)"
    - "fail-fast empty-output refusal (raise when zero True dates)"

# ============================================================================
# CARD — the L3 Composer's view of this operator (PR-2 of open-DAG PoC).
# ============================================================================
card:
  one_line: >-
    Subsample a Series by a boolean EventSet mask.  Output is the input
    Series restricted to True dates.
  when_to_use:
    - "User wants the VALUES of a target Series on the dates flagged by an event detector."
    - "User wants a regime-conditioned subsample of a Series."
    - "Pair downstream of threshold_events when the user wants values at the qualifying dates, not windows."
  when_not_to_use:
    - "If the user wants WINDOWS (per-event sequences) around each event, use event_windows."
    - "If the user wants to combine two Series elementwise on a mask, this is the wrong shape — wire apply_mask first then arithmetic."
  upstream_requirements:
    - "TWO inputs: a Series on 'series' slot, and an EventSet on 'mask' slot."
    - "The Series and EventSet must declare the same frequency tag (strict by default)."
  downstream_pattern:
    - "Output is a Series (sparse by default — only the True dates).  Common downstream: summarize_series (per-regime central tendency), or any further single-series transform."
  knobs_quick_ref:
    index_policy: "intersect (default — works across slightly different calendars) | strict_match (requires identical index)."
    preserve_full_index: "false (default — sparse output) | true (keep full index with NaN at False cells; for downstream alignment)."
    require_matching_frequency: "true (default — strict on frequency tag)."
  example_shapes:
    - description: "Subsample a target Series on event dates produced by threshold_events."
      shape: "Series(target) + EventSet(threshold_events on Series(trigger)) -> apply_mask -> Series"
    - description: "Regime-conditioned per-regime summary."
      shape: "Series(target) + EventSet(regime_mask) -> apply_mask -> Series -> summarize_series -> Series(1-row)"
  sibling_operators:
    - threshold_events: "Required upstream to produce the EventSet."
    - event_windows: "Alternative when the user wants per-event WINDOWS rather than just values."
    - summarize_series: "Natural downstream for per-regime central-tendency summaries."
  intent_hints: [event_regime]
