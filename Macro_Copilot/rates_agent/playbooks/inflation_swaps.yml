playbook_name: inflation_swaps
playbook_version: "1.0"
asset_class: rates
dataset_name: inflation_swaps
description: "Daily zero-coupon inflation swaps (ZCIS) across USD, EUR, and GBP using the validation-backed 1Y+ tenor set for breakeven curve, relative-value, and cross-market inflation analysis."

extraction:
  start_date: "2005-01-01"
  incremental_window_days: 14

target_metrics:
  - metric_id: "yield_mid"
    bloomberg_field: "PX_MID"

reference_metrics:
  - column_name: "maturity_date"
    bloomberg_field: "MATURITY"
  - column_name: "security_name"
    bloomberg_field: "SECURITY_DES"
  - column_name: "underlying_index"
    bloomberg_field: "SWAP_PRIMARY_INDEX"

universe:
  # --------------------------------------------------------
  # United States - USD ZCIS
  # --------------------------------------------------------
  - ticker: "USSWIT1 Curncy"
    instrument_type: "inflation_swap"
    pricing_type: "zero_coupon_breakeven"
    curve_family: "USD_ZCIS"
    country: "US"
    currency: "USD"
    tenor: "1Y"
    inflation_index_family: "US_CPI_URBAN"
    index_lag: "3M"
    interpolation: "Daily"

