      config: fx_agent/vol/tools/vol_risk_premium/config.yaml

    one_liner: >-
      Compare implied volatility with realized volatility to classify FX vol
      risk premium as rich, cheap, or neutral.

    related_tools:
      - get_fx_realized_vol_tool
      - scan_fx_vol_risk_premium_tool

    validation_status: tested

  - name: scan_fx_vol_risk_premium
    domain: fx
    sub_agent: vol
    bucket: 1B
    status: built
    workspace_surface: false

    implementation:
      mcp_server: fx_agent/mcp_server.py
      tool_function: scan_fx_vol_risk_premium_tool
      schema: fx_agent/vol/tools/vol_risk_premium_scanner/schemas.py::FXVolRiskPremiumScannerInput
      compute: fx_agent/vol/tools/vol_risk_premium_scanner/compute.py::scan_fx_vol_risk_premium
      config: fx_agent/vol/tools/vol_risk_premium_scanner/config.yaml

    one_liner: >-
      Rank FX pairs by implied-minus-realized volatility premium.

    related_tools:
      - get_fx_vol_risk_premium_tool
      - get_fx_realized_vol_tool

    validation_status: tested

  - name: compare_fx_pairs
    domain: fx
    sub_agent: macro
    bucket: 1B
    status: built
    workspace_surface: false

    implementation:
      mcp_server: fx_agent/mcp_server.py
      tool_function: compare_fx_pairs_tool
      schema: fx_agent/macro/tools/pair_compare/schemas.py::FXPairCompareInput
      compute: fx_agent/macro/tools/pair_compare/compute.py::compare_fx_pairs
      config: fx_agent/macro/tools/pair_compare/config.yaml

    one_liner: >-
      Compare two FX pairs using deterministic trade-setup scores, carry,
