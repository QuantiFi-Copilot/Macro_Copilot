playbook_name: "spot_fx"
playbook_version: "3.0"
asset_class: "fx"
dataset_name: "spot_fx"
description: "Daily G10 + EM spot FX pairs for level monitoring, cross-sectional scanner, relative move analysis, and z-score monitoring. v2.0 (Wave 1) extended G10 coverage from 6 to 9 majors (added NZDUSD, USDNOK, USDSEK). v3.0 (Phase B / Wave 1.5) adds 9 EM majors (USDMXN, USDZAR, USDTRY, USDBRL, USDPLN, USDHUF, USDKRW, USDIDR, USDPHP) — uniform start_date 2000-01-01 across the full universe, validated against Bloomberg on 2026-05-25 (USDTRY confirmed Scenario A — clean back-adjusted series across the 1 Jan 2005 lira redenomination; all 9 EM pairs have PX_LAST available from ≤ 2000-01-03)."

extraction:
  start_date: "2000-01-01"
  incremental_window_days: 14

target_metrics:
  - metric_id: "spot_last"
    bloomberg_field: "PX_LAST"

reference_metrics:
  - column_name: "security_name"
    bloomberg_field: "SECURITY_DES"

universe:
  - ticker: "EURUSD Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_SPOT"
    market_scope: "G10"
    region: "Global"
    pair: "EURUSD"
    base_ccy: "EUR"
    quote_ccy: "USD"

  - ticker: "GBPUSD Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_SPOT"
    market_scope: "G10"
    region: "Global"
    pair: "GBPUSD"
    base_ccy: "GBP"
    quote_ccy: "USD"

  - ticker: "USDJPY Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_SPOT"
    market_scope: "G10"
    region: "Global"
    pair: "USDJPY"
    base_ccy: "USD"
    quote_ccy: "JPY"

  - ticker: "AUDUSD Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_SPOT"
    market_scope: "G10"
    region: "Global"
    pair: "AUDUSD"
    base_ccy: "AUD"
    quote_ccy: "USD"

  - ticker: "USDCAD Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_SPOT"
    market_scope: "G10"
    region: "Global"
    pair: "USDCAD"
    base_ccy: "USD"
    quote_ccy: "CAD"

  - ticker: "USDCHF Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_SPOT"
    market_scope: "G10"
    region: "Global"
    pair: "USDCHF"
    base_ccy: "USD"
    quote_ccy: "CHF"

  # ============================================================
  # Wave 1 additions (NZD + Nordics)
  # ============================================================
  - ticker: "NZDUSD Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_SPOT"
    market_scope: "G10"
    region: "Global"
    pair: "NZDUSD"
    base_ccy: "NZD"
    quote_ccy: "USD"

  - ticker: "USDNOK Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_SPOT"
    market_scope: "G10"
    region: "Global"
    pair: "USDNOK"
    base_ccy: "USD"
    quote_ccy: "NOK"

  - ticker: "USDSEK Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_SPOT"
    market_scope: "G10"
    region: "Global"
    pair: "USDSEK"
    base_ccy: "USD"
    quote_ccy: "SEK"

  # ============================================================
  # Phase B / Wave 1.5 additions — EM majors (9 pairs)
  # ------------------------------------------------------------
  # Uniform start_date 2000-01-01 per Bloomberg verification
  # 2026-05-25. USDTRY scenario A confirmed (clean back-adjusted
  # across the 1 Jan 2005 lira redenomination — no 1,000,000x
  # discontinuity). All 9 EM pairs have PX_LAST from <= 2000-01-03.
  # market_scope="EM" and fx_family="EM_SPOT" segregate them from
  # the G10 set so scan_fx_spot can filter by scope at the SQL
  # layer with zero code change (Codex Q3 lock).
  # ============================================================

  - ticker: "USDMXN Curncy"
    instrument_type: "fx_spot"
    fx_family: "EM_SPOT"
    market_scope: "EM"
    region: "LATAM"
    pair: "USDMXN"
