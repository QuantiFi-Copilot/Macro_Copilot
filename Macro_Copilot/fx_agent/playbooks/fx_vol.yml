playbook_name: "fx_vol"
playbook_version: "6.0"
asset_class: "fx"
dataset_name: "fx_vol"
description: "Daily FX at-the-money (ATM) implied volatility. v2.0 G10 std strip (30). v3.0 added 11 EM/NDF currencies (total 85). v4.0 (Warehouse seeding 2026-05-25) added 6 more EM currencies x 5 std (total 115). v5.0 (Warehouse seeding) added 5 EXTENDED tenors (VON/V2W/V2M/V9M/V2Y) across 17 ATM-vol pairs = 85 (total 200). v6.0 (Tradability 2026-05-26) adds 11 G10 CROSS-pair ATM vols x 5 std tenors = 55 NEW instruments with NEW fx_family='G10_CROSSES_FX_VOL'. Total: 255 ATM vol instruments. Cross pairs (EURGBP/EURJPY/EURCHF/EURAUD/EURCAD/EURNZD/GBPJPY/GBPCHF/AUDJPY/AUDNZD/CADJPY) are directly quoted ATM vols on Bloomberg, NOT derivable from USD legs. PX_LAST only for cross vols this wave; bid/ask cross vol is secondary priority. Smile points (RR/BF) live in fx_vol_smile.yml — `smile_point: ATM` here makes the boundary clean. USDCNH/USDINR remain VOL-ONLY on the std strip. Tenor naming: std strip maps BBG V1Y -> internal '12M' (cross-substrate join with fx_em_forwards '12M'); ext strip keeps BBG tenors verbatim (ON/2W/2M/9M/2Y) since no forwards equivalent exists. SGD/TWD/THB/CLP/COP/PEN NOT in extended-tenor block."

extraction:
  start_date: "2000-01-01"
  incremental_window_days: 14

target_metrics:
  - metric_id: "atm_vol"
    bloomberg_field: "PX_LAST"

reference_metrics:
  - column_name: "security_name"
    bloomberg_field: "SECURITY_DES"

