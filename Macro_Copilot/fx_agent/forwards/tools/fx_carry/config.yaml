tool:
  name: calculate_fx_carry_tool
  domain: fx_forwards
  description: |
    Cross-sectional FX forward carry snapshot — joins latest spot and
    same-tenor forward-points observations, converts points into spot
    units, and ranks pairs by annualized carry.
  category: desk_invariant_primitive

conventions:
  default_fx_spot_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: >-
      Bloomberg PX_LAST is the canonical spot observation used as the
      denominator for forward-points carry.

  default_fx_forward_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: >-
      Bloomberg PX_LAST is the canonical forward-points observation for
      the FX forward tickers in the playbook.

  default_tenor:
    value: 1M
    source: desk_default_pending_review
    rationale: >-
      One-month forwards are the default monitor tenor. Other supported
      tenors are 1W, 3M, 6M, 12M — all five are ingested via
      fx_agent/playbooks/fx_forwards.yml v2.0.

  tenor_1w_days:
    value: 5
    source: trading_day_convention
    rationale: >-
      Approximate one FX trading week.
    valid_range: [3, 10]

  tenor_1m_days:
    value: 21
    source: trading_day_convention
    rationale: >-
      Approximate one FX trading month.
    valid_range: [15, 30]

  tenor_3m_days:
    value: 63
    source: trading_day_convention
    rationale: >-
      Approximate three FX trading months.
    valid_range: [45, 90]

  tenor_6m_days:
    value: 126
    source: trading_day_convention
    rationale: >-
      Approximate six FX trading months.
    valid_range: [90, 180]

  tenor_12m_days:
    value: 252
    source: trading_day_convention
    rationale: >-
      One FX trading year. Uses the trading-day approximation, NOT a
      calendar 365, to stay consistent with ``annualization_days``
      below. With 12M / 252 = 1, the 12M annualised carry equals the
      raw 12M carry — which is what a trader expects.
    valid_range: [240, 270]

  annualization_days:
    value: 252
    source: industry_standard_trading_year
    rationale: >-
      Trading-day annualization convention used across the macro stack.
    valid_range: [240, 366]

  jpy_forward_points_divisor:
    value: 100
    source: bloomberg_field_convention
    rationale: >-
      JPY forward points are quoted in hundredths of one spot unit.
    valid_range: [1, 10000]

  default_forward_points_divisor:
    value: 10000
    source: bloomberg_field_convention
    rationale: >-
      Non-JPY G10 forward points are quoted in ten-thousandths of one
      spot unit.
    valid_range: [1, 100000]

  spot_round_decimals:
    value: 6
    source: legacy_default_pre_pilot
    rationale: >-
      Six decimals preserves major-pair spot precision.
    valid_range: [2, 8]

  forward_points_round_decimals:
    value: 3
    source: legacy_default_pre_pilot
    rationale: >-
      Three decimals matches the current monitor display precision for
      forward points.
    valid_range: [0, 6]

  carry_bps_round_decimals:
    value: 2
    source: legacy_default_pre_pilot
    rationale: >-
      Two decimals is sufficient for carry in basis points of spot.
    valid_range: [0, 6]

  carry_pct_round_decimals:
    value: 2
    source: legacy_default_pre_pilot
    rationale: >-
      Two decimals is sufficient for annualized carry percentage.
    valid_range: [0, 6]

  # Rolling-statistic conventions for the scanner / z-score path
  # added in Phase A step 6. Mirror fx_agent/forwards/tools/
  # forward_curve/config.yaml — different metric (carry_annualized_pct
  # series here, forward_points_spot_units in the curve tool), but
  # same window / min_periods / ddof so cross-asset z-scores compare
  # at the same horizon.

  z_score_window_days:
    value: 252
    source: industry_standard_trading_year
    rationale: >-
      One trading year of rolling history. Matches the rates and OIS
      yield-level tools so a cross-asset reader sees comparable
      z-scores at the same horizon.
    valid_range: [60, 504]

  z_score_min_periods:
    value: 60
    source: industry_standard
    rationale: >-
      Minimum observations before a z-score is emitted. Below this
      the rolling stat is too noisy; the output row's
      ``carry_z_score`` field is set to None instead.
    valid_range: [20, 252]

  z_score_ddof:
    value: 1
    source: industry_standard
    rationale: >-
      Sample (Bessel-corrected) standard deviation. Same convention
      as rates yield_levels and the forward_curve tool.
    valid_range: [0, 1]

  trailing_range_window_days:
    value: 252
    source: wire_frozen_v1
    rationale: >-
      Locked at 252 in V1; the output schema's field names
      (``carry_high_252d``, ``carry_low_252d``,
      ``carry_percentile_252d``) embed the number on the wire so
      changing the convention without renaming the fields would
      silently lie about what the percentile is computed against.
    valid_range: [252, 252]

  ffill_limit_days:
    value: 5
    source: industry_standard
    rationale: >-
      Maximum forward-fill window for missing daily observations
      before a gap is treated as a true NA. Five trading days covers
      every standard market holiday cluster.
    valid_range: [0, 10]

  daily_change_offset_rows:
    value: 2
    source: industry_standard
    rationale: >-
      One trading-day offset for the period-change calculation;
      currently consumed only by the shared ``compute_level_metrics``
      operator. Not surfaced on the carry tool's output schema in V1
      but kept consistent so a future ``period_changes`` field
      doesn't drift on convention.
    valid_range: [1, 3]

  weekly_change_offset_rows:
    value: 6
    source: industry_standard
    rationale: >-
      One trading-week offset; same status as ``daily_change_offset_rows``.
    valid_range: [5, 10]

  monthly_change_offset_rows:
    value: 22
    source: industry_standard
    rationale: >-
      One trading-month offset; same status as ``daily_change_offset_rows``.
    valid_range: [20, 30]

  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals for z-score and percentile. Matches the rates
      yield_levels rounding and the forward_curve tool.
    valid_range: [2, 6]

methodology:
  what_it_does: |
    Finds the latest spot and same-tenor forward-points observation for
    every FX pair with both legs in macro_data.market_data_daily, converts
    forward points into spot units, computes carry as forward_points /
    spot, annualizes by a trading-day tenor convention, and ranks the
    cross-section by annualized carry.
  assumptions:
    - "Forward tickers store forward points, not outright forwards."
    - "JPY pairs use a 100 divisor; non-JPY pairs use 10000."
    - "Carry is a deterministic points-over-spot approximation, not a full collateralized total-return model."
    - "The current implementation ranks only pairs with both spot and forward rows present."
    - "Z-score is computed on the per-date carry_annualized_pct series — spot and forward are joined per trade_date BEFORE the divisor / annualisation, so no historical row uses today's spot. This avoids a lookahead bias that would corrupt the z-score."
    - "The current row of each pair is the LAST common spot+forward date (typically today on fresh data, an older date if a tenor has gone stale). This is more honest than picking 'latest spot' and 'latest forward' independently."
    - "Z-score is on carry_annualized_pct, NOT on raw forward_points_spot_units. This is the trader-natural 'carry richness' measure for cross-sectional ranking. The forward_curve tool z-scores forward_points_spot_units instead — same substrate but a different question (curve stretchedness vs carry extremeness)."
  citations: []
  planned_extensions:
    - "Add CIP / collateral-currency adjustments using the OIS substrate (Sreeram's rates_agent/ois universe) and our forwards substrate — see fx_agent/ROADMAP.md Phase C."
    - "Add NDF-aware carry branch when NDFs land — NDF tickers are quoted as outrights, not points, so the (forward_points / divisor) formula does not apply. See ROADMAP Wave 2 discovery findings."
    - "Surface methodology_label / day-count convention per tenor so cross-asset tools can sanity-check carry vs OIS differentials at the same horizon."
