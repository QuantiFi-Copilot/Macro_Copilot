# =============================================================================
# get_asset_swap_spread_tool — tool configuration
# =============================================================================
# Per-bond INGESTED Bloomberg asset-swap spread (``ASSET_SWAP_SPD_MID``) for
# one sovereign cash bond identified by ``vendor_ticker`` (the canonical
# per-bond key, e.g. ``/isin/DE000BU22130``).  Pure INGEST primitive (P12) —
# the vendor's per-bond ASW is the source of record; this tool surfaces it
# VERBATIM with optional level-stat decoration (period changes, z-score,
# trailing range).  NEVER recomputes the spread from STIR / OIS / discount
# factors.
#
# PR4 DIFFERENTIATION (load-bearing — catalog guardrail)
# ------------------------------------------------------
# This tool is DISTINCT from ``rates_agent/ois/tools/swap_spread/``.
# BOTH methodology cards cross-reference each other per the catalog
# guardrail "Methodology cards of BOTH primitives must cite each other
# and explain the difference."  The swap_spread side cite lives in
# ``rates_agent/ois/tools/swap_spread/config.yaml`` under
# ``methodology.related_primitives``; this side's cite is in this file's
# ``methodology.related_primitives`` block below.
#
#   Concept       | THIS (asset_swap_spread)             | swap_spread
#   --------------+--------------------------------------+----------------------
#   What          | Bloomberg ASSET_SWAP_SPD_MID per bond| (sov_yield - ois) * 100
#   Source        | Vendor ingest (P12) — verbatim       | Computed in-process
#                 | from ``ASSET_SWAP_SPD_MID``          | par-par approximation
#   Granularity   | Per-bond (vendor_ticker key)         | Per (curve_family, tenor)
#   Universe      | sovereign_cash_bonds.yml             | sovereign_bonds.yml + OIS
#   Methodology   | None — pure ingest, NO rounding of   | Par-par approximation
#                 |   the raw ASW value                  |   over OIS forwards
#   Sign          | Vendor sign (positive ≈ sov cheap)   | sov - ois (positive cheap)
#   NULL handling | Raises AssetSwapSpreadUnavailableError| ffill / error envelope
#   Use when      | The per-bond Bloomberg ASW exists    | The per-bond field is
#                 |   for the requested bond/date.       |   unavailable / a
#                 |                                      |   curve view is needed.
#
# In V1 deterministic mode there is NO LLM-facing override path for
# conventions.  The LLM cannot ask for non-standard windows or
# thresholds.  See ``docs_revamped/02_components/primitive/README.md``.
# =============================================================================

tool:
  name: get_asset_swap_spread_tool
  domain: ois
  description: |
    Per-bond INGESTED Bloomberg asset-swap spread (``ASSET_SWAP_SPD_MID``)
    for one sovereign cash bond identified by ``vendor_ticker`` (e.g.
    ``/isin/DE000BU22130``).  Pure INGEST primitive (P12); the vendor's
    per-bond ASW is the source of record.

    Emits:

      - ``current_metrics``: snapshot of the latest (or as_of_date)
        observation.  ``current_asw_spread_bps`` is the RAW
        Bloomberg-ingested ``ASSET_SWAP_SPD_MID`` value — preserved
        bit-exact from the DB so a caller comparing the snapshot to
        a raw SQL probe gets parity within 1e-9.  Level-stat
        decoration (daily/weekly/monthly bps changes, 252-day
        rolling z-score, trailing 252-day high/low/percentile,
        observation count) is rounded per YAML.  Bond identity
        (country, currency, cusip, isin, vendor_ticker,
        maturity_date) echoes the catalog's
        ``required_reference_metrics``.

      - ``time_series``: canonical
        ``shared.schemas.time_series.TimeSeries`` (units = BPS)
        carrying the historical ASW spread series over the displayed
        lookback window — RAW, unrounded values for parity.

      - ``methodology_note``: plain-language disclosure of the
        P12 vendor-ingest discipline + the CAD ASW sparsity caveat
        + the security_name / issuer absence caveat (P5).

    Raises ``AssetSwapSpreadUnavailableError`` (typed P6 exception) on:
      - ``vendor_ticker`` not present in ``instrument_master`` with
        ``instrument_type='sovereign_cash_bond'``
      - NULL ``ASSET_SWAP_SPD_MID`` on the requested ``as_of_date``
        (no ffill, no proxy, no swap_spread fallback)
      - empty result set for the lookback window

  category: desk_invariant_primitive

conventions:

  # ---------------------------------------------------------------------------
  # Z-score window length (trading days) — shared catalogue value
  # ---------------------------------------------------------------------------
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading-day count for a 1-year rolling window.  Matches every
      other rates tool (curve_spread, yield_levels, butterfly,
      cross_market_spread, rate_level, swap_spread, real_yield_level
      …) — the cross-config lint enforces the match.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Minimum observations before the rolling stat is emitted
  # ---------------------------------------------------------------------------
  z_score_min_periods:
    value: 60
    source: team_judgment_pending_review
    rationale: >-
      ~3 months of observations before the rolling mean / std are
      deemed trustworthy.  Important for ASW because CAD government-
      bond ASW (per ``rates_agent/playbooks/sovereign_cash_bonds.yml``
      header note 4) is verifiably sparse — without this floor the
      rolling stat would emit z-scores on a handful of points.
    valid_range: [20, 252]

  # ---------------------------------------------------------------------------
  # Standard-deviation degrees of freedom
  # ---------------------------------------------------------------------------
  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Sample standard deviation (Bessel-corrected, ddof=1).  Matches
      pandas' default and every other rates tool.

  # ---------------------------------------------------------------------------
  # Calendar-day buffer for the fetch window
  # ---------------------------------------------------------------------------
  z_score_buffer_multiplier:
    value: 1.5
    source: derived_from_window
    rationale: >-
      Calendar-day buffer added to the fetch window so the rolling
      z-score is fully populated from the first displayed trading day.
      Matches every sovereign rates tool and OIS rate_level.
    valid_range: [1.2, 2.0]

  # ---------------------------------------------------------------------------
  # Period-change offsets (in trading-day rows after ffill)
  # ---------------------------------------------------------------------------
  daily_change_offset_rows:
    value: 2
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-2] = 1 trading day back.
    valid_range: [2, 5]

  weekly_change_offset_rows:
    value: 6
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-6] = 5 trading days back ≈ 1 calendar week.
    valid_range: [5, 10]

  monthly_change_offset_rows:
    value: 22
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-22] = ~1 calendar month of trading days.
    valid_range: [20, 30]

  # ---------------------------------------------------------------------------
  # Trailing range / percentile window — LOCKED at 252 in V1 (PR14)
  # ---------------------------------------------------------------------------
  # The output schema's field names (high_252d_bps, low_252d_bps,
  # percentile_252d) are wire-frozen because the number is embedded in
  # the identifiers.  compute() raises NotImplementedError if this is
  # set to anything other than 252.
  trailing_range_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      1Y trailing for high/low/percentile.  Locked at 252 in V1
      because the wire field names embed the number — same situation
      as sovereign yield_levels, OIS rate_level, swap_spread.

  # ---------------------------------------------------------------------------
  # Forward-fill limit for missing observations — applied to STAT decoration only
  # ---------------------------------------------------------------------------
  # The RAW asw_spread for an explicit ``as_of_date`` is NEVER ffilled
  # (P12 ingest + P6 typed refusal on NULL).  This ffill limit applies
  # only to the level-stat decoration (z-score / period changes /
  # trailing range) so a single holiday-style gap does not destroy a
  # 252-day rolling window.  The methodology card discloses this
  # asymmetry.
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Bridge up to one trading week of missing data across holiday
      gaps for the level-stat decoration ONLY (rolling z-score,
      trailing range, period changes).  The raw ``current_asw_spread_bps``
      on a caller's explicit ``as_of_date`` is NEVER ffilled —
      compute() raises ``AssetSwapSpreadUnavailableError`` on NULL,
      per the catalog guardrail and P6 honest refusal.  Matches every
      sovereign rates tool's ffill value (cross-config lint enforces
      the match).  Note CAD ASW sparsity (playbook header note 4) —
      the 5-day ffill does NOT paper over real multi-week absence;
      ``methodology_note`` in the output discloses CAD ASW is sparse.
    valid_range: [1, 10]

  # ---------------------------------------------------------------------------
  # Default Bloomberg observation field — DISTINCT convention name
  # ---------------------------------------------------------------------------
  # Distinct convention name (``default_asw_field_name``) from the
  # generic ``default_field_name`` used by yield-quoted tools
  # (yield_levels, curve_spread, swap_spread's two-per-leg overrides,
  # etc.).  The other tools' ``default_field_name`` is ``YLD_YTM_MID``;
  # ours must be ``ASSET_SWAP_SPD_MID``.  Per PR13's exception clause:
  # "Where two tools genuinely need different values for the same
  # convention concept, the right answer today is to name them
  # differently so the lint does not bucket them together."  The
  # swap_spread tool took the same approach with its
  # ``sovereign_leg_default_field`` + ``ois_leg_default_field``
  # naming.  This is asset-swap-spread-specific; the convention key
  # makes the meaning loud.
  default_asw_field_name:
    value: ASSET_SWAP_SPD_MID
    source: bloomberg_field_convention
    rationale: >-
      ``ASSET_SWAP_SPD_MID`` is the verified Bloomberg field for per-
      bond asset-swap spread on the sovereign_cash_bonds universe
      (A4-4 probe 2026-05-21, 13/14 markets full series; CAD govvies
      sparse per ``rates_agent/playbooks/sovereign_cash_bonds.yml``
      header note 4).  LLM/HTTP wrappers must use the empty/None
      sentinel so this default flows through — see the
      curve_move_classifier wrapper-shadowing fix (commit b2605ee).

  # ---------------------------------------------------------------------------
  # Data-source policy — P12 vendor-ingest discipline (LOAD-BEARING)
  # ---------------------------------------------------------------------------
  # Source tag ``vendor_ingested`` is the explicit disclosure that the
  # asw_spread value is the vendor's INGESTED number, never a computed
  # approximation.  An edit to this value to something other than
  # ``bloomberg_ingested_asw`` raises NotImplementedError in
  # compute._validate_conventions.  Registered in
  # docs_revamped/03_standards/methodology_disclosure.md (this PR).
  data_source_policy:
    value: bloomberg_ingested_asw
    source: vendor_ingested
    rationale: >-
      The asw_spread value surfaced by this primitive is the
      VENDOR-INGESTED Bloomberg ``ASSET_SWAP_SPD_MID`` per cash bond,
      never recomputed from OIS forwards / discount factors / par-par
      arithmetic.  This is the load-bearing P12 commitment that
      differentiates this primitive from
      ``rates_agent/ois/tools/swap_spread/`` (which IS a par-par
      approximation; see this file's header + the symmetric
      ``related_primitives`` block in swap_spread's config.yaml for
      the side-by-side).  Methodology source tag ``vendor_ingested``
      registered in ``docs_revamped/03_standards/methodology_disclosure.md``
      in the same PR — names the data-lineage policy explicitly so a
      future reviewer reading the YAML can verify the discipline
      without consulting code.

  # ---------------------------------------------------------------------------
  # Z-score rounding — for the DECORATION fields, not the raw ASW
  # ---------------------------------------------------------------------------
  # The raw ``current_asw_spread_bps`` is NOT rounded — it preserves
  # the DB value bit-exact so SQL parity within 1e-9 holds.  This
  # convention applies only to the z-score column on the snapshot.
  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches the default ``compute_level_metrics``
      uses.  Snapshot's ``z_score`` is rounded via this knob; the
      raw ``current_asw_spread_bps`` is NOT — see this file's
      ``methodology.assumptions`` for the no-rounding discipline.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Period-change rounding — for the bps period-change fields
  # ---------------------------------------------------------------------------
  bps_round_decimals:
    value: 2
    source: legacy_default_pre_pilot
    rationale: >-
      Two decimals (basis-point precision) for the
      daily/weekly/monthly bps change fields and the trailing
      high/low.  Matches swap_spread's ``bps_round_decimals``
      and the bps-quoted rates tools (curve_spread,
      cross_market_spread).  The RAW ``current_asw_spread_bps``
      is NOT rounded by this convention.
    valid_range: [0, 6]

methodology:
  what_it_does: |
    For one sovereign cash bond identified by ``vendor_ticker``
    (the canonical per-bond key against the sovereign_cash_bonds
    universe):

      1. Verifies the ``vendor_ticker`` exists in
         ``macro_data.instrument_master`` with
         ``instrument_type='sovereign_cash_bond'``.  Raises
         ``AssetSwapSpreadUnavailableError`` if not — refusal is
         loud, never a fall-through to a sibling bond or swap_spread.
      2. Fetches the per-bond ``ASSET_SWAP_SPD_MID`` series from
         ``macro_data.v_market_data_daily_enriched`` filtered by
         ``vendor_ticker`` + ``field_name`` + lookback window via
         ``shared.analytics.rates_fetch.fetch_single_bond_asw``
         (the catalog's ``fetcher_surface``, extended with a
         vendor_ticker filter — added in this PR alongside the new
         primitive).
      3. Resolves the snapshot date: ``as_of_date`` if supplied
         (loud refusal on NULL), else the latest observation in
         the lookback (must be non-NULL).  Raises
         ``AssetSwapSpreadUnavailableError`` on empty / all-NULL.
      4. Preserves the RAW asw_spread for the snapshot bit-exact
         (no rounding), so SQL parity within 1e-9 holds.
      5. Decorates with level-stats via
         ``shared.analytics.levels.compute_level_metrics`` for
         period changes / z-score / trailing range (these ARE
         rounded per YAML).
      6. Surfaces the bond's identity (country, currency, cusip,
         isin, vendor_ticker, maturity_date) by joining to
         ``instrument_master`` so the caller can verify exactly
         which bond they received data for.
      7. Emits canonical ``shared.schemas.time_series.TimeSeries``
         (units = BPS) over the displayed lookback window — RAW
         values, no rounding, for parity.
      8. Surfaces a ``methodology_note`` disclosing the P12
         vendor-ingest discipline + the CAD ASW sparsity caveat
         + the security_name / issuer absence caveat.

    Pure INGEST per P12: the asw_spread value is the vendor's
    Bloomberg ``ASSET_SWAP_SPD_MID``, never recomputed from OIS
    forwards or discount factors.

  assumptions:
    - "asw_spread values stored as bps (e.g. 47.3 = 47.3 bps).
       Bloomberg ``ASSET_SWAP_SPD_MID`` is in basis points; the
       playbook's ingester preserves that unit on the wire."
    - "Per-bond addressing via ``vendor_ticker`` (e.g. ``/isin/...``)
       is the canonical key — the live SCD2 / view shape has no
       ``security_name`` column on the cash-bond universe (universally
       NULL on cash-bond rows; ``security_name`` is populated only on
       rolling futures contracts via ``instrument_metadata_history``).
       The catalog's ``required_reference_metrics`` lists ``security_name``
       and ``issuer`` — both are P5-disclosed as absent in V1 (see
       ``methodology.field_availability_caveat`` below)."
    - "RAW ``current_asw_spread_bps`` is NOT rounded — preserved
       bit-exact from the DB so the SQL-validation runner can assert
       1e-9 parity against a raw SELECT.  Level-stat decoration
       (z-score, period changes, trailing range) IS rounded per the
       YAML round-decimal conventions."
    - "NULL ``asw_spread`` for the requested (vendor_ticker, date)
       raises ``AssetSwapSpreadUnavailableError`` — no ffill, no
       proxy, no swap_spread fall-through.  Per P6 and the catalog
       guardrail."
    - "CAD government bonds carry sparse ASW data (~2% of trading
       days) per playbook header note 4 — verified data
       characteristic, not a bug.  ``methodology_note`` discloses
       this; the rolling z-score may be empty for CAD when the
       60-observation floor is not met (honest absence)."
    - "Observation-count cutoff is anchored to the data's latest
       observation date (matching OIS ``rate_level`` and
       ``real_yield_level``), NOT to ``date.today()`` — unless a
       caller supplies an explicit ``as_of_date``, in which case
       the snapshot is computed for THAT date and the window
       trails it.  ASW publish calendars can lag wall-clock;
       anchoring to date.today() would silently shrink the
       displayed window when data is stale."
    - "PR4 DIFFERENTIATION FROM swap_spread (load-bearing — catalog
       guardrail).  ``rates_agent/ois/tools/swap_spread/`` is the
       CROSS-DOMAIN par-par approximation:
       ``(sovereign_yield - ois_rate) * 100`` in bps, computed in-
       process at matched tenor.  THIS primitive (asset_swap_spread)
       is the per-bond INGESTED Bloomberg ``ASSET_SWAP_SPD_MID``,
       surfaced verbatim with NO recomputation.  The per-bond
       ingested value is the source-of-record per P12; the curve-
       level par-par approximation exists for cases where the per-
       bond Bloomberg field is unavailable (e.g. an off-the-run
       bond not in the sovereign_cash_bonds universe) or where a
       smooth curve view is needed instead of the per-bond ladder.
       The two primitives are NOT interchangeable — the error
       magnitude between par-par and true ASW is typically 1-3
       bps for liquid sovereigns but can grow to 10+ bps for
       off-the-run / high-coupon bonds (see swap_spread's PR 21
       disclosure block).  Use this primitive when you have a
       specific bond and want its truthful ASW; use swap_spread
       when you have a curve point and want the par-par
       approximation.  CATALOG GUARDRAIL: both primitives'
       methodology cards cite each other; the symmetric cite is
       in ``rates_agent/ois/tools/swap_spread/config.yaml`` under
       its own ``methodology.assumptions`` block."
    - "FIELD AVAILABILITY CAVEAT (P5 honest disclosure).  The
       catalog's ``required_reference_metrics`` lists
       ``security_name`` and ``issuer``.  Both are NOT surfaced
       in V1: (1) ``security_name`` is universally NULL on cash-
       bond rows in the live SCD2 substrate
       (``macro_data.instrument_metadata_history`` and
       ``macro_data.v_market_data_daily_enriched``) —
       ``security_name`` is populated only for rolling-contract
       futures via ``instrument_metadata_history`` and is NOT
       mapped to cash bonds today.  The build_linker_panel /
       build_zcis_panel / build_policy_futures_strip_panel
       primitives took the same no-proxy treatment.  Caller can
       derive a human-readable bond label from ``vendor_ticker``
       + ``country`` + ``maturity_date``. (2) ``issuer`` is not
       present as a typed column or attribute on the
       sovereign_cash_bond playbook; ``country`` is the closest
       ingested proxy (e.g. country='Germany' implies
       issuer='Bund').  Both absences are P5-disclosed (loud)
       rather than silently omitted.  When a future playbook
       revision adds these fields, surface them in the output
       schema in the same PR — see methodology.planned_extensions."

  citations:
    - "rates_agent/playbooks/sovereign_cash_bonds.yml (universe + verified ASW field; header note 4 on CAD sparsity)."
    - "manifesto/01_instruments/rates_agent/07_sovereign_cash_bonds.md."
    - "docs_revamped/05_decisions/0003-cash-bond-substrate.md (substrate)."
    - "docs_revamped/05_decisions/0005-cash-bond-playbook-universe.md (V1 universe)."
    - "scripts/sovereign_bonds_realbond_bloomberg_check.py (Bloomberg verification 2026-05-21)."
    - "automation/primitive_automation/primitive_catalog.yaml entry ois__asset_swap_spread (catalog guardrails)."

  planned_extensions:
    - >-
      trailing_range_window_days: configurable.  Currently locked at
      252 because the output fields high_252d_bps / low_252d_bps /
      percentile_252d embed the number.  Path to configurability:
      rename schema fields to high_window_bps / low_window_bps /
      percentile_window + add trailing_window_days to the output;
      remove the NotImplementedError guard in compute().  Same shape
      as the documented extension on yield_levels / real_yield_level.
    - >-
      data_source_policy: widening.  Currently locked at
      ``bloomberg_ingested_asw``.  When the platform connects a
      second L1 adapter with its own ingested ASW (e.g. an internal
      data warehouse), add ``warehouse_ingested_asw`` to the
      supported set and surface the adapter name in the output.
    - >-
      security_name + issuer surfacing.  Both are P5-disclosed as
      absent in V1 (``field_availability_caveat`` block above).
      When a future sovereign_cash_bonds playbook revision adds
      these fields to ``instrument_metadata_history`` (or to the
      per-bond ``attributes`` JSONB on ``instrument_master``),
      surface them on the snapshot in the same PR.
    - >-
      CAD ASW backfill.  CAD government ASW is verifiably sparse on
      Bloomberg (playbook header note 4) — the ``methodology_note``
      already discloses this.  When a non-Bloomberg ingested source
      for CAD ASW becomes available, surface it under the
      widened data_source_policy convention.
