playbook_name: "fx_forwards_curve"
playbook_version: "1.0"
asset_class: "fx"
dataset_name: "fx_forwards_curve"
description: "G10 FX forward curve (multi-tenor) for carry and term structure analysis."

extraction:
  start_date: "2005-01-01"
  incremental_window_days: 14

target_metrics:
  - metric_id: "forward_points"
    bloomberg_field: "PX_LAST"

reference_metrics:
  - column_name: "security_name"
    bloomberg_field: "SECURITY_DES"

universe:
  # EURUSD
  - ticker: "EURUSD1W Curncy"
    instrument_type: "fx_forward"
    pair: "EURUSD"
    tenor: "1W"

  - ticker: "EURUSD1M Curncy"
    instrument_type: "fx_forward"
    pair: "EURUSD"
    tenor: "1M"

  - ticker: "EURUSD3M Curncy"
    instrument_type: "fx_forward"
    pair: "EURUSD"
    tenor: "3M"

  - ticker: "EURUSD6M Curncy"
    instrument_type: "fx_forward"
    pair: "EURUSD"
    tenor: "6M"


  # GBPUSD
  - ticker: "GBPUSD1M Curncy"
    instrument_type: "fx_forward"
    pair: "GBPUSD"
    tenor: "1M"

  - ticker: "GBPUSD3M Curncy"
    instrument_type: "fx_forward"
    pair: "GBPUSD"
    tenor: "3M"

  # USDJPY
  - ticker: "USDJPY1M Curncy"
    instrument_type: "fx_forward"
    pair: "USDJPY"
    tenor: "1M"

  - ticker: "USDJPY3M Curncy"
    instrument_type: "fx_forward"
    pair: "USDJPY"
    tenor: "3M"