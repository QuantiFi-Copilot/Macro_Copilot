playbook_name: "fx_forwards"
playbook_version: "2.0"
asset_class: "fx"
dataset_name: "fx_forwards"
description: "Daily G10 FX forward points across the standard tenor strip (1W, 1M, 3M, 6M, 12M) for carry, term-structure, and relative-value analysis. Canonical replacement of the v1 fx_forwards_1m playbook and the partial fx_forwards_curve scaffold — see fx_agent/ROADMAP.md Phase A for migration context."

extraction:
  start_date: "2000-01-01"
  incremental_window_days: 14

target_metrics:
  - metric_id: "forward_points"
    bloomberg_field: "PX_LAST"

reference_metrics:
  - column_name: "security_name"
    bloomberg_field: "SECURITY_DES"

universe:
