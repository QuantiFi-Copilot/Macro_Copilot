playbook_name: ois
playbook_version: '1.1'
asset_class: rates
dataset_name: ois_curves
description: Daily OIS curve data for prototype ingestion, with Bloomberg-validated market/reference fields and manually encoded stable curve conventions.
extraction:
  start_date: '2005-01-01'
  incremental_window_days: 14
target_metrics:
- metric_id: quoted_rate_mid
  bloomberg_field: PX_LAST
- metric_id: quoted_rate_bid
  bloomberg_field: PX_BID
- metric_id: quoted_rate_ask
  bloomberg_field: PX_ASK
reference_metrics:
- column_name: security_name
  bloomberg_field: SECURITY_DES
- column_name: maturity_date
  bloomberg_field: MATURITY
- column_name: effective_date
  bloomberg_field: SW_EFF_DT
- column_name: underlying_index
  bloomberg_field: SWAP_PRIMARY_INDEX
- column_name: calendar_code
  bloomberg_field: CALENDAR_CODE
