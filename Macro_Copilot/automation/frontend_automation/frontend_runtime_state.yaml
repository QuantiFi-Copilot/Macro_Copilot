human_required:
  reason: tool_27_backend_output_shape_divergence_from_catalog_reference
  tool_id: ois__financing_rate
  backend_tool_name: compute_financing_rate_tool
  catalog_claim: |
    category: snapshot
    reference_frontend_module: get_real_yield_level_tool (Phase-1 pilot snapshot shape)
    design_guardrail #1: "Mirror get_real_yield_level_tool snapshot shape (Phase-1 pilot)"
  actual_backend_output_shape: |
    class FinancingRateOutput(BaseModel):
        method: FinancingMethod
        as_of_start: str
        as_of_end: str
        n_observations: int
        mean_rate_pct: Optional[float]
        methodology_disclosures: List[str]
        panel: Optional[Panel]
    (rates_agent/ois/tools/financing_rate/schemas.py:148-187)
  divergence: |
    The catalog assumes a snapshot Output shape with current_metrics (z-score,
    percentile, 252d hi/lo, observation count, daily change) + time_series block —
    matching every snapshot tool shipped in batches 1/2/3 so far (the standalone-
    bridge endpoint mirrors the backend Pydantic Output 1:1 via response_model=...).
    The actual FinancingRateOutput has NEITHER block.  It returns a scalar
    mean_rate_pct + a per-day Panel artifact + a List[str] of methodology disclosures
    (plural, not the singular `methodology_label`/`methodology_disclosure` field
    every other tool uses).  Furthermore, the MCP layer DROPS the panel before
    serialising for the LLM, so the standalone-bridge endpoint would either need to
    (a) re-construct the panel on the route side, (b) re-derive snapshot stats
    server-side, or (c) re-design the frontend module to consume a panel + scalar
    contract.  None of these is a small fix; any choice is an architectural
    decision the human should make, not the builder.
  why_not_dispatch_builder: |
    The wake already shipped tool 26 (commit 7493683) successfully via the
    canonical snapshot path.  Dispatching the tool-27 builder against the catalog's
    "Mirror get_real_yield_level_tool snapshot shape" guardrail would force one of:
      - Builder refuses with the canonical "backend Output shape doesn't match
        what the mockup implies" blocker — wastes ~15-20 min of Claude quota.
      - Builder builds with creative adaptation — reviewer almost certainly emits
        STRUCTURAL: per SINGLE_REVIEW_ROUND_POLICY §3 (architectural mismatch
        beyond a fix-pass scope), routed to human_required anyway.
    Either way, the structural decision has to come from the human. Surfacing it
    now via this human_required block (per ORCHESTRATOR_PROMPT Stop conditions
    "the tool is not actually a backend tool that exists on this branch [in the
    shape the catalog claims]") is the honest stop.
  user_decision_needed:
    - Should the standalone-bridge route at api/routes/rates/detail.py construct
      a synthetic current_metrics + time_series view from the panel + mean_rate_pct?
      (Adds non-mirror translation logic to the route — first time the factory
      has done this; sets a precedent.)
    - OR amend the catalog to use a different reference module / a non-snapshot
      category?  (The tool's category may genuinely be "panel" not "snapshot".)
    - OR defer tool 27 to a human-led design pass and leave it blocked?
  pre_flight_audit_result: |
    All four pre-flight checks PASS (read-only):
      - backend folder rates_agent/ois/tools/financing_rate/ exists with the
        canonical 4-file shape (__init__.py 2070B + schemas.py 6580B +
        compute.py 9092B + config.yaml 4415B).
      - MCP wrapper compute_financing_rate_tool registered at
        rates_agent/ois/mcp_server.py:1112.
      - curated migration database/migrations/2026-06-07_phase1_compute_financing_rate_curated.sql
        exists (2032B).
      - mockups Compact.png (1356432B) + Extended.png (1658107B) present at
        UI/.../compute_financing_rate_tool/mockups/.
      - loader entry already at src/modules/index.ts:77 (import) + :150 (array).
    PRE_FLIGHT_BACKEND_AUDIT.md only checks artifact PRESENCE, not shape conformance
    (audit blind spot — same as tool 2's mockup-content-mismatch from 2026-05-29).
    The schema-shape concern surfaces at builder-dispatch readiness, NOT pre-flight.
  remediation_options:
    a_extend_bridge_route_with_synthesis: |
      Add a panel→current_metrics+time_series synthesis helper at
      api/routes/rates/detail.py for the financing-rate endpoint specifically;
      derive 252d stats / z-score / percentile from the panel data on the server.
      Document the synthesis as a per-tool deviation in surface_contract.md.
      Cost: 1-2h of human design + a builder pass with explicit synthesis spec.
    b_amend_catalog_to_panel_category: |
      Change category from `snapshot` to `panel`, switch reference module to a
      future panel-shaped tool (none ship yet), defer until a panel-shaped
      reference is built.
    c_defer_tool_27_block_and_proceed_to_tool_28: |
      Mark tool 27 status: blocked with block_reason capturing this concern;
      advance to tool 28 (ois__swap_spread) which uses the calculate_breakeven_inflation_simple_tool
      reference (Phase-1 snapshot pattern — the schema should be conformant).
      Cron resumes on tool 28 next wake.
