# =============================================================================
# calculate_real_yield_curve_spread_tool — tool configuration
# =============================================================================
# This file is the canonical record of the same-country linker real-yield
# curve-spread tool's conventions and methodology.  Loaded by
# ``shared.config.load_tool_config`` at compute() time.  Every shared
# convention (z_score_window_days, z_score_min_periods, z_score_ddof,
# z_score_buffer_multiplier, ffill_limit_days, period offsets, trailing
# range window, yield/z-score/bps/window_years rounding, default_field_name)
# carries the same numeric value as the sibling level primitive
# (real_yield_level), the linker breakeven_curve_spread / forward /
# cross-country breakeven primitives, the sovereign yield_levels /
# curve_spread tools, and the OIS / inflation-swap level tools — the
# cross-config lint enforces value-agreement across every tool that
# declares the same convention name.  Drift on any of those is caught.
#
# Concept honesty
# ---------------
# This tool returns the same-country linker real-yield curve spread —
# i.e. the difference between two real-yield tenors on the SAME
# sovereign linker curve (e.g. USD_TIPS 5s10s real-yield, GBP_LINKER
# 2s10s real-yield).  Distinct from a breakeven curve spread (which
# differences two nominal-minus-linker pairs) and from a nominal
# sovereign curve spread (which differences two nominal-sovereign
# yields).  Cross-country combinations are not expressible by this
# primitive's input shape (single ``curve_family``) and would be a
# different concept anyway.
#
# Spread formula
# --------------
# Per-trade-date, the displayed real-yield curve spread is:
#
#   spread_pct = long_real_yield_pct - short_real_yield_pct
#
# where ``short_real_yield_pct`` and ``long_real_yield_pct`` are the
# linker real-yield levels at ``short_tenor`` and ``long_tenor``
# respectively (each computed by ``get_real_yield_level``).  Linker
# real yields are quoted in PERCENT (e.g. 1.85 = 1.85%); the spread
# is reported in PERCENT — same units as the underlying — NOT in
# BPS.  The two endpoint series are aligned per-trade-date via a
# strict pandas inner-join AFTER each is computed independently — no
# synthetic spread points are produced on dates where one endpoint
# has no data.
#
# Phase-1 methodology-exposure surface
# ------------------------------------
# Per ``docs_revamped/03_standards/methodology_exposure.md`` (Phase 1
# of the ``revamp`` branch), the same four conventions the sibling
# linker real_yield_level tool exposes are exposed here as Pydantic
# Input fields with per-call overrides:
#
#     z_score_window_days   z_score_min_periods   z_score_ddof
#     default_field_name (via field_name)
#
# The three rolling-z-score overrides apply to the SPREAD's own
# rolling z-score AND the fetch-window buffer math; the inner
# get_real_yield_level endpoint calls intentionally use the YAML
# default z-score conventions because their z-scores are NOT consumed
# (only their real-yield level series feed the spread).  All four
# follow the None-sentinel / YAML-fallthrough pattern; the remaining
# conventions stay YAML-locked.  See each convention's ``exposure:``
# block for per-decision Criterion-A / Criterion-B rationale.

tool:
  name: calculate_real_yield_curve_spread_tool
  domain: inflation_indexed_bonds
  category: desk_invariant_primitive
  description: |
    Same-country linker real-yield curve spread between two
    real-yield tenors of the same sovereign linker curve (e.g.
    USD_TIPS 5s10s real-yield, GBP_LINKER 2s10s real-yield,
    EUR_FR_LINKER 5s10s real-yield, CAD_RRB 5s30s real-yield).
    Composes two real-yield levels computed by
    ``get_real_yield_level`` (one at ``short_tenor``, one at
    ``long_tenor``) into a per-trade-date difference:

      spread_pct = long_real_yield_pct - short_real_yield_pct

    Returns the current real-yield curve spread (in PERCENT),
    daily/weekly/monthly BPS changes, rolling 252-day z-score (on
    the percent-units spread), trailing 252-day high/low/percentile
    (in PERCENT), the rolling-window length, plus the two endpoint
    real yields and year fractions used to form the spread so the
    desk can sanity-check the decomposition.  Also emits a bespoke
    wire-frozen ``time_series`` history of the curve spread (in
    PERCENT) over the displayed ``lookback_days`` window AND the
    canonical ``shared.schemas.time_series.TimeSeries`` payloads
    (PERCENT for the spread, Z_SCORE for the rolling z-score) so
    the workflow / operator layer can compose without per-tool
    custom shapes.

    Same-country / same-curve-family invariant
    ------------------------------------------
    The two legs share a single linker ``curve_family``.  The input
    shape forbids cross-curve combinations; compute additionally
    re-asserts that the resolved instrument_master rows for that
    curve_family map to instrument_type='inflation_linker' AND a
    single (country, currency) tuple (using the same DISTINCT
    country/currency lookup the breakeven primitives use to enforce
    the same-country invariant on a single leg) — a mismatch
    surfaces a controlled error envelope rather than a silently
    averaged or papered-over snapshot.

    Wire honesty: the output's ``methodology_label`` field is
    sourced from ``methodology.what_it_does`` below — NOT a
    hardcoded literal — so a YAML edit to the disclosure flows
    through to runtime.

conventions:

  # ---------------------------------------------------------------------------
  # Z-score window length (trading days)
  # ---------------------------------------------------------------------------
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading-day count for a 1-year rolling window.  Matches every
      sovereign rates tool, the OIS level/spread/forward tools, the
      linker real_yield_level / breakeven_inflation_simple /
      forward_breakeven_simple / breakeven_curve_spread tools — the
      cross-config lint enforces the match.
    valid_range: [60, 1260]
    exposure:
      expose: true
      rationale: >-
        Criterion A passes: changing the window materially changes the
        z-score (252 vs 60 → tactical reframing of the same real-yield
        curve-spread series).  Criterion B passes: the window IS the
        rolling-z-score definition.  Exposed as part of the cohesive
        rolling-z-score surface (z_score_window_days +
        z_score_min_periods + z_score_ddof together specify the model,
        per PR8) — the same surface the sibling linker real_yield_level
        tool exposes, so a PM can ask for a tactical 60d / 126d or a
        structural 504d real-yield-curve-spread z-score at runtime.
        The override applies to the SPREAD's own rolling z-score AND
        the fetch-window buffer math; the inner endpoint level calls
        use the YAML default (their z-score is not consumed).
        Cross-config lint still enforces the DEFAULT value alignment;
        per-call overrides are runtime behaviour and do not violate
        the lint.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"
      input_field: z_score_window_days
      pydantic_type: Optional[int]
      default_source: yaml
      promoted_from_yaml_in_pr: "#TBD"

  # ---------------------------------------------------------------------------
  # Minimum observations before the rolling stat is emitted
  # ---------------------------------------------------------------------------
  z_score_min_periods:
    value: 60
    source: team_judgment_pending_review
    rationale: >-
      ~3 months of observations before the rolling mean / std are
      deemed trustworthy.  Matches sovereign yield_levels /
      cross_market_spread / curve_spread / OIS rate_level / linker
      real_yield_level / breakeven_inflation_simple /
      forward_breakeven_simple / breakeven_curve_spread.
    valid_range: [20, 252]
    exposure:
      expose: true
      rationale: >-
        Criterion A passes: changing min_periods changes WHICH days
        emit a non-NaN z-score and therefore the early-window output.
        Criterion B passes: it parameterises the rolling-z-score model.
        Exposed as part of the cohesive rolling-z-score surface
        (together with z_score_window_days + z_score_ddof, per PR8
        cohesive-multi-knob admissibility) so callers tactically
        reconfiguring the window can scale min_periods consistently
        (e.g. window=60 → min_periods=20).
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"
      input_field: z_score_min_periods
      pydantic_type: Optional[int]
      default_source: yaml
      promoted_from_yaml_in_pr: "#TBD"

  # ---------------------------------------------------------------------------
  # Standard-deviation degrees of freedom
  # ---------------------------------------------------------------------------
  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Sample standard deviation (Bessel-corrected, ddof=1).  Matches
      pandas' default and the convention every other rates tool uses.
    exposure:
      expose: true
      rationale: >-
        Criterion A passes: ddof choice (sample vs population) changes
        the numerical z-score value.  Criterion B passes: it
        parameterises the std computation inside the rolling-z model.
        Exposed as part of the cohesive rolling-z-score surface
        (z_score_window_days + z_score_min_periods + z_score_ddof
        together specify the model, per PR8).  Practical values are
        {0, 1}; the Pydantic field constrains ge=0, le=1.  Default 1
        remains the industry standard; cross-config lint still enforces
        the DEFAULT alignment.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"
      input_field: z_score_ddof
      pydantic_type: Optional[int]
      default_source: yaml
      promoted_from_yaml_in_pr: "#TBD"

  # ---------------------------------------------------------------------------
  # Calendar-day buffer for the fetch window
  # ---------------------------------------------------------------------------
  z_score_buffer_multiplier:
    value: 1.5
    source: derived_from_window
    rationale: >-
      Calendar-day buffer added to the fetch window so the rolling
      z-score AND the trailing range stat are both fully populated
      from the first displayed trading day.  1.5x trading-day window
      covers weekends + holidays.  Matches every other rates tool.
    valid_range: [1.2, 2.0]
    exposure:
      expose: false
      rationale: >-
        Criterion A is weak — the buffer multiplier affects which days
        the warm-up rolling-z-score is populated for, but does NOT
        change the numerical value of the z-score on days already past
        the warm-up.  Criterion B fails — buffer math is fetch-window
        arithmetic, not part of the analytical z-score definition.
        Derived from z_score_window_days; keeping YAML-locked.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"

  # ---------------------------------------------------------------------------
  # Period-change offsets (in trading-day rows after ffill)
  # ---------------------------------------------------------------------------
  daily_change_offset_rows:
    value: 2
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-2] = 1 trading day back.  The real-yield
      curve spread series is in PERCENT so changes go through
      period_changes(already_bps=False), i.e. (current - prior) *
      100 — produces BPS change of a PERCENT-units spread.
    valid_range: [2, 5]
    exposure:
      expose: false
      rationale: >-
        Criterion A passes (different offset → different change value).
        Criterion B fails — "daily / weekly / monthly" are canonical
        desk-language anchors; the OFFSET is the convention that pins
        what "daily" MEANS, not a parameter of the analytical math
        operating on the series.  Exposing per-call would let the
        output's "daily_change_bps" field-name lie about what it
        contains (PR14 wire-format honesty).  Keeping YAML-locked.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"

  weekly_change_offset_rows:
    value: 6
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-6] = 5 trading days back ≈ 1 calendar week.
    valid_range: [5, 10]
    exposure:
      expose: false
      rationale: >-
        Same rationale as daily_change_offset_rows — "weekly" is the
        desk-language anchor; the offset defines what the anchor means
        and is wire-encoded in the weekly_change_bps field name.
        Keeping YAML-locked.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"

  monthly_change_offset_rows:
    value: 22
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-22] = ~1 calendar month of trading days.
    valid_range: [20, 30]
    exposure:
      expose: false
      rationale: >-
        Same rationale as daily_change_offset_rows — "monthly" is the
        desk-language anchor; the offset defines what the anchor means
        and is wire-encoded in the monthly_change_bps field name.
        Keeping YAML-locked.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"

  # ---------------------------------------------------------------------------
  # Trailing range / percentile window — LOCKED at 252 in V1
  # ---------------------------------------------------------------------------
  # The output schema's field names (high_252d_pct, low_252d_pct,
  # percentile_252d) embed the number; compute() raises
  # NotImplementedError if this is set to anything else.  Same
  # wire-freeze as breakeven_curve_spread / sovereign curve_spread /
  # inflation_swap_curve_spread / real_yield_level / OIS rate_level.
  trailing_range_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      1Y trailing for high/low/percentile.  Locked at 252 in V1
      because the wire field names embed the number.
    valid_range: [60, 1260]
    exposure:
      expose: false
      rationale: >-
        WIRE-FROZEN.  The output field names (high_252d_pct,
        low_252d_pct, percentile_252d) embed the number 252 on the
        wire (PR14 wire-format honesty); changing the convention
        without renaming the fields would silently lie about what the
        percentile is computed against.  compute._conventions_from_config
        raises NotImplementedError if this is set to anything other
        than 252.  Path to configurability documented in
        methodology.planned_extensions: rename schema fields to
        high_window_pct / low_window_pct / percentile_window + add
        trailing_window_days to the output; remove the
        NotImplementedError guard.  Until then, keeping YAML-locked.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"

  # ---------------------------------------------------------------------------
  # Forward-fill limit for missing observations
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Bridge up to one trading week of missing data across holiday
      gaps.  Matches every other rates tool; the consistency lint
      enforces the match where declared.  Applies inside the
      composed level primitive's clean step at each endpoint; the
      curve-spread layer itself uses a strict inner join on
      trade_date to avoid synthesising spread points.
    valid_range: [1, 10]
    exposure:
      expose: false
      rationale: >-
        Borderline.  Criterion A passes (different ffill changes which
        days enter each endpoint's cleaned series).  Criterion B is
        weak — ffill is a data-cleaning step inside the composed level
        primitive, upstream of the spread math, not a parameter of the
        spread math itself.  Per the methodology_exposure protocol
        §2.3 (borderline cases default to expose: false), keeping
        YAML-locked.  Revisit if a desk use case for per-call override
        emerges.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"

  # ---------------------------------------------------------------------------
  # Output rounding precision — yields / pct (curve spread,
  # endpoint real yields, high/low)
  # ---------------------------------------------------------------------------
  yield_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches the legacy hardcoded default in
      ``shared.analytics.levels.compute_level_metrics`` and every
      sovereign / OIS / linker level tool.  Threaded through the
      curve-spread compute so the snapshot's current_spread_pct,
      the bespoke time_series rows' spread_pct, and the canonical
      TimeSeries rows all agree byte-for-byte at the latest aligned
      trade_date.  Also used for the endpoint short_real_yield_pct /
      long_real_yield_pct display fields and the trailing
      high_252d_pct / low_252d_pct fields.
    valid_range: [0, 8]
    exposure:
      expose: false
      rationale: >-
        Criterion A fails — display precision for the percent-scale
        spread / endpoint-yield / trailing-range fields; does not
        change the underlying answer, only the displayed digits.
        Cross-tool lint enforces alignment across rates level /
        spread tools.  Keeping YAML-locked.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"

  # ---------------------------------------------------------------------------
  # Output rounding precision — bps (period changes)
  # ---------------------------------------------------------------------------
  # Used for the daily / weekly / monthly bps change fields on the
  # snapshot.  The spread itself is in PERCENT, but the desk reads
  # spread *changes* in BPS — same as every other rates tool's
  # period-change convention.
  bps_round_decimals:
    value: 2
    source: team_judgment_pending_review
    rationale: >-
      Round bps period-change output (daily/weekly/monthly changes
      of the PERCENT-units spread) to 0.01 bps.  Display precision;
      matches sovereign curve_spread / OIS spread tools / linker
      breakeven_curve_spread / inflation_swap_curve_spread.
      Threaded explicitly into period_changes(decimals=...) so the
      delta_bps default of 2 cannot silently shadow a YAML override.
    valid_range: [0, 6]
    exposure:
      expose: false
      rationale: >-
        Criterion A fails — display precision for the bps-scale
        period-change fields; does not change the underlying answer.
        Cross-tool lint enforces alignment.  Keeping YAML-locked.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"

  # ---------------------------------------------------------------------------
  # Output rounding precision — z-score
  # ---------------------------------------------------------------------------
  z_score_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches the legacy default in
      ``shared.analytics.spreads.rolling_zscore`` and every other
      rates tool that exposes this convention.  Threaded to
      safe_float at the output boundary so a YAML override above 4
      is not silently truncated by safe_float's own default of 4.
    valid_range: [0, 8]
    exposure:
      expose: false
      rationale: >-
        Criterion A fails — display precision for the z-score scalar;
        does not change the underlying analytical answer.  Cross-tool
        lint enforces alignment.  Keeping YAML-locked.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"

  # ---------------------------------------------------------------------------
  # Per-window-year display rounding (short_years, long_years)
  # ---------------------------------------------------------------------------
  window_years_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Display-precision rounding for the short_years / long_years
      fields in current_metrics.  4 decimals matches the OIS
      forward_rate / forward_breakeven_simple / breakeven_curve_spread
      / inflation_swap_curve_spread value the cross-config lint
      enforces; this tool reuses the same convention name + value.
    valid_range: [0, 8]
    exposure:
      expose: false
      rationale: >-
        Criterion A fails — display precision for the short_years /
        long_years display fields; does not change the underlying
        answer.  Cross-tool lint enforces alignment.  Keeping YAML-
        locked.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"

  # ---------------------------------------------------------------------------
  # Trailing range high / low rounding precision (passed to the
  # composed level primitive's compute_level_metrics)
  # ---------------------------------------------------------------------------
  high_low_round_decimals:
    value: 4
    source: legacy_default_pre_pilot
    rationale: >-
      Four decimals matches the legacy default in
      ``compute_level_metrics`` for the trailing high / low /
      percentile stats.  Matches the real_yield_level / sibling level
      tools — required because this primitive's ToolConfig is
      threaded into the level primitive's compute.
    valid_range: [0, 8]
    exposure:
      expose: false
      rationale: >-
        Criterion A fails — display precision for the trailing-range
        stats inside the composed level primitive; does not change the
        underlying answer.  Cross-tool lint enforces alignment.
        Keeping YAML-locked.
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"

  # ---------------------------------------------------------------------------
  # Default Bloomberg observation field for both endpoint legs
  # ---------------------------------------------------------------------------
  # Linkers publish their real yield-to-maturity under the same
  # Bloomberg ``YLD_YTM_MID`` mnemonic that nominal sovereigns use —
  # see the linker playbook's ``target_metrics``.  Reusing the
  # convention name + value keeps the cross-config lint clean.
  # LLM/HTTP wrappers MUST use the empty/None sentinel so this
  # default flows through.  This default is passed unchanged to BOTH
  # the short-tenor and long-tenor inner get_real_yield_level calls.
  default_field_name:
    value: YLD_YTM_MID
    source: bloomberg_field_convention
    rationale: >-
      Linker real yield-to-maturity is published under the same
      Bloomberg ``YLD_YTM_MID`` mnemonic that nominal sovereigns use
      — the difference is the underlying instrument_type (linker
      tickers from rates_agent/playbooks/inflation_indexed_bonds.yml),
      not the field code.  The instrument-type discriminator is
      enforced in code on the DB read for both endpoints (inherited
      from the level primitive's no-proxy guard); this default
      applies to each endpoint unless the caller explicitly
      overrides per query.
    exposure:
      expose: true
      rationale: >-
        Criterion A passes (different Bloomberg field → different
        numerical value).  Criterion B passes (the field choice IS
        the data-source identity).  Already exposed via the existing
        ``RealYieldCurveSpreadInput.field_name: Optional[str]``
        Pydantic field (empty-string sentinel at the MCP boundary,
        None sentinel in Python).  This exposure block documents the
        existing surface; no new field promotion required.  The same
        field_name override flows to BOTH endpoint level calls (short
        + long tenor).
      decided_at: "2026-05-28"
      decided_in_pr: "#TBD"
      input_field: field_name
      pydantic_type: Optional[str]
      default_source: yaml
      promoted_from_yaml_in_pr: "n/a"

methodology:
  what_it_does: |
    Same-country linker real-yield curve spread between two
    real-yield tenors of the same sovereign linker curve (e.g.
    USD_TIPS 5s10s real-yield, GBP_LINKER 2s10s real-yield,
    EUR_FR_LINKER 5s10s real-yield, CAD_RRB 5s30s real-yield).
    Computed per-trade-date via the SPREAD formula:

      spread_pct = long_real_yield_pct - short_real_yield_pct

    where ``short_real_yield_pct`` and ``long_real_yield_pct`` are
    the linker real-yield levels at ``short_tenor`` and
    ``long_tenor`` respectively (each computed by
    ``get_real_yield_level`` filtered by
    ``instrument_type='inflation_linker'`` AND ``curve_family=?``
    AND ``tenor=?`` AND ``field_name=?`` — the no-proxy guard
    inherited transitively).  The two endpoint series are aligned
    per-trade-date via a strict pandas inner-join on calendar
    trade_date AFTER each is computed independently; the spread
    is computed only on dates where BOTH endpoints exist (no
    synthetic spread points are produced).

    Same-country / same-curve-family construction only: the input
    layer accepts a single linker ``curve_family`` field so cross-
    curve combinations cannot be expressed.  Compute additionally
    re-asserts that the resolved instrument_master rows for that
    curve_family map to a single (country, currency) tuple under
    ``instrument_type='inflation_linker'`` (a defensive guard
    against an instrument_master inconsistency), surfacing a
    controlled error envelope on mismatch.

    The output is the term structure of REAL YIELDS (real-yield
    curve shape), distinct from a breakeven curve spread (which
    differences two inflation-compensation pairs) and from a
    nominal sovereign curve spread (which differences two nominal
    yields).  Real yields are quoted in PERCENT and the spread is
    reported in PERCENT — same units as the underlying.  Daily /
    weekly / monthly *changes* of the spread are reported in BPS,
    matching the desk convention for change reporting on any rate
    level.

  assumptions:
    - "Same-country / same-curve-family invariant: both endpoints
       share a single linker ``curve_family`` (e.g. USD_TIPS /
       GBP_LINKER / EUR_FR_LINKER / CAD_RRB).  Cross-curve real-
       yield spreads would be a sovereign-credit / regime-hybrid
       differential, not a pure real-yield curve-shape object;
       they are not expressible by this primitive's input shape."
    - "Each endpoint real yield is computed by composing
       ``get_real_yield_level`` once per endpoint tenor, passing the
       same ``ToolConfig`` so methodology stays consistent.  This
       inherits the level primitive's no-proxy guard
       (instrument_type='inflation_linker' filter on the DB read)
       for free — passing a nominal sovereign curve_family at either
       endpoint returns a controlled error envelope from the inner
       level call which this tool surfaces with the offending
       endpoint named."
    - "Tenor pair ordering is structural: short_tenor must map to a
       strictly smaller year fraction than long_tenor, computed via
       ``shared.analytics.curve_bootstrap.tenor_to_years``.  A caller
       passing short_tenor=10Y, long_tenor=2Y is rejected at the
       schema layer; the tool does NOT silently swap them."
    - "Per-trade-date alignment: the two endpoint real-yield series
       are aligned via a strict pandas inner-join on trade_date
       AFTER each is computed independently from the level primitive.
       No ffill across the join — dates where ONE endpoint has no
       data are dropped from the spread series."
    - "The real yields from the inner level primitive arrive in
       PERCENT (rounded to ``yield_round_decimals`` upstream); the
       curve spread stays in PERCENT (no *100 multiplier) and is
       rounded to ``yield_round_decimals`` at compute time.  Daily /
       weekly / monthly changes use ``period_changes(already_bps=False)``
       which multiplies the percent-units change by 100 to produce a
       BPS delta; ``bps_round_decimals`` is threaded through
       explicitly so the YAML is authoritative."
    - "The snapshot's ``current_spread_pct`` equals
       ``time_series[-1].spread_pct`` and
       ``time_series_spread.rows[-1].value`` bit-for-bit at the
       YAML's ``yield_round_decimals``; same boundary-rounding
       discipline as real_yield_level / breakeven_curve_spread /
       inflation_swap_curve_spread."
    - "lookback_days controls the *display* window (and the
       bespoke time_series row count + canonical TimeSeries
       length), NOT the rolling z-score window or the trailing
       range window — those are independent conventions in this
       YAML."
    - "Three rolling-z-score conventions (z_score_window_days /
       z_score_min_periods / z_score_ddof) plus the field_name are
       exposed as per-call Pydantic Input overrides per
       docs_revamped/03_standards/methodology_exposure.md.  The
       z-score overrides apply to the SPREAD's own rolling z-score
       and the fetch-window buffer math; the inner endpoint level
       calls use the YAML default z-score (their z-score is not
       consumed).  Per-call overrides are runtime behaviour and do
       not violate the cross-config DEFAULT lint."
    - "Latest-observation cutoff for the displayed window is
       anchored to the data's latest aligned trade_date (matching
       real_yield_level / breakeven_curve_spread /
       inflation_swap_curve_spread / OIS rate_level).  Linker daily
       series can lag wall-clock by several business days; anchoring
       to the data's latest aligned trade_date avoids silently
       shrinking the displayed window when data is stale."
    - "Real-yield curve spreads can be negative across parts of the
       post-2008 / 2020-21 history (when long-end real yields fell
       below short-end real yields).  The math is unchanged; the
       wire types tolerate negative values."

