playbook_name: "spot_fx"
playbook_version: "2.0"
asset_class: "fx"
dataset_name: "spot_fx"
description: "Daily G10 spot FX majors for level monitoring, cross-sectional scanner, relative move analysis, and z-score monitoring. Wave 1 extends coverage from 6 to 9 majors by adding NZDUSD, USDNOK, USDSEK (the missing Nordic / antipodean members of the G10 majors set)."

extraction:
  start_date: "2000-01-01"
  incremental_window_days: 14

target_metrics:
  - metric_id: "spot_last"
    bloomberg_field: "PX_LAST"

reference_metrics:
  - column_name: "security_name"
    bloomberg_field: "SECURITY_DES"

universe:
  - ticker: "EURUSD Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_SPOT"
    market_scope: "G10"
    region: "Global"
    pair: "EURUSD"
    base_ccy: "EUR"
    quote_ccy: "USD"

  - ticker: "GBPUSD Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_SPOT"
    market_scope: "G10"
    region: "Global"
    pair: "GBPUSD"
    base_ccy: "GBP"
    quote_ccy: "USD"

  - ticker: "USDJPY Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_SPOT"
    market_scope: "G10"
    region: "Global"
    pair: "USDJPY"
    base_ccy: "USD"
    quote_ccy: "JPY"

  - ticker: "AUDUSD Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_SPOT"
    market_scope: "G10"
    region: "Global"
    pair: "AUDUSD"
    base_ccy: "AUD"
    quote_ccy: "USD"

  - ticker: "USDCAD Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_SPOT"
    market_scope: "G10"
    region: "Global"
    pair: "USDCAD"
    base_ccy: "USD"
    quote_ccy: "CAD"

  - ticker: "USDCHF Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_SPOT"
    market_scope: "G10"
    region: "Global"
    pair: "USDCHF"
    base_ccy: "USD"
    quote_ccy: "CHF"

  # ============================================================
  # Wave 1 additions (NZD + Nordics)
  # ============================================================
  - ticker: "NZDUSD Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_SPOT"
    market_scope: "G10"
    region: "Global"
    pair: "NZDUSD"
    base_ccy: "NZD"
    quote_ccy: "USD"

  - ticker: "USDNOK Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_SPOT"
    market_scope: "G10"
    region: "Global"
    pair: "USDNOK"
    base_ccy: "USD"
    quote_ccy: "NOK"

  - ticker: "USDSEK Curncy"
    instrument_type: "fx_spot"
    fx_family: "G10_SPOT"
    market_scope: "G10"
    region: "Global"
    pair: "USDSEK"
    base_ccy: "USD"
    quote_ccy: "SEK"
