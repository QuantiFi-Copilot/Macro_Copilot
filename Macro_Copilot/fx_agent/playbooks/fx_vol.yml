playbook_name: "fx_vol"
playbook_version: "3.0"
asset_class: "fx"
dataset_name: "fx_vol"
description: "Daily FX at-the-money (ATM) implied volatility across the standard tenor strip. v2.0 covered G10 only (6 pairs × 5 tenors = 30 instruments). v3.0 (Phase B BBG batch 2026-05-25) adds 11 EM/NDF currencies × 5 tenors = 55 instruments. Total: 85 ATM vol instruments. Smile points (risk reversals, butterflies) live in a SEPARATE playbook fx_vol_smile.yml — the `smile_point: ATM` attribute on every row here makes the boundary clean. Note: USDCNH and USDINR are VOL-ONLY in this universe — they are not in fx spot or fx forward substrates (CNH is offshore deliverable but we don't ingest the spot; INR is NDF only). Tenor naming: '12M' for forwards strip but '1Y' for ATM vol — Bloomberg convention asymmetry (verified Phase A + Preflight D 2026-05-25)."

extraction:
  start_date: "2000-01-01"
  incremental_window_days: 14

target_metrics:
  - metric_id: "atm_vol"
    bloomberg_field: "PX_LAST"

reference_metrics:
  - column_name: "security_name"
    bloomberg_field: "SECURITY_DES"

