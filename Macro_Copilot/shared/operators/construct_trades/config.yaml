operator:
  name: construct_trades
  method_family: trade_construction
  version: "1.0.0"
  description: >-
    Convert an EventSet (entry signals) plus a holding rule and a
    leg specification into a TradeSet.  Pure function; no pricing,
    no P&L.  Phase 1 V1: fixed_horizon holding rule only.

defaults:
  holding_rule:
    value: fixed_horizon
    source: operator_v1_default
    rationale: >-
      Phase 1 V1 ships only the fixed_horizon holding rule —
      entry date plus N business days = exit date.  ``signal_exit``
      (exit on the next event firing in the opposite direction)
      and ``stop_loss`` (exit when running P&L breaches a
      threshold) are declared values but the compute branch raises
      ``NotImplementedError`` with a pointer to
      ``planned_extensions``.  Surfacing them as values in the
      enum keeps the YAML schema stable across V1 → V2 — the
      change is purely compute-side.
    valid_values: [fixed_horizon, signal_exit, stop_loss]

  holding_window_days:
    value: 20
    source: methodology_judgement_pending_review
    rationale: >-
      Default holding window of 20 business days (~1 month).
      Caller can override per backtest within the schema's
      1-252 range (enforced by ConstructTradesParams.holding_window_days
      ``ge=1, le=252``).

  leg_construction_rule:
    value: equal_weight_signed
    source: operator_v1_default
    rationale: >-
      The leg weights supplied by the caller (in
      ``ConstructTradesParams.legs``) are used as-is, with signs
      preserved.  V1 does NOT normalise to gross-leverage caps
      or risk-parity — those are Phase 2 portfolio-construction
      concerns.  ``equal_weight_signed`` is honest about being
      pass-through; alternative methodologies (gross_unity,
      risk_parity) raise ``NotImplementedError`` at compute
      time with a pointer to planned_extensions.
    valid_values: [equal_weight_signed, gross_unity, risk_parity]

  methodology_policy_tag:
    value: fixed_horizon_v1
    source: operator_v1_default
    rationale: >-
      Methodology tag stamped on the produced TradeSet's
      ``methodology_policy`` field.  Surfaces on the workspace
      methodology card so a downstream reader can see at a glance
      which construction policy fired.

methodology:
  what_it_does: >-
    For each True date in the EventSet (entries), the operator
    emits one Trade with exit_date = entry_date + holding_window
    business days and the supplied leg specs.  Trades are
    ordered by entry date.  The output TradeSet's
    methodology_policy is stamped from ``methodology_policy_tag``
    so the workspace methodology card surfaces it.  V1 ships
    fixed-horizon-only and pass-through leg weights; alternative
    rules raise NotImplementedError per the honesty discipline.
  planned_extensions:
    - "signal_exit holding rule (exit at next opposite-direction event firing)"
    - "stop_loss holding rule (exit when running P&L breaches a configurable threshold)"
    - "gross_unity / risk_parity leg construction rules"
    - "Per-trade methodology_ref recording the specific methodology_versions.id that produced each trade (V1 stamps the operator-level policy tag only)"
    - "Real-calendar exit dates that skip bank holidays (V1 uses pd.tseries.offsets.BDay which only skips weekends)"
