# =============================================================================
# calculate_swap_spread_tool — tool configuration
# =============================================================================
# Canonical record of the cross-domain swap-spread tool's conventions
# and methodology.  Loaded by ``shared.config.load_tool_config`` at
# compute() time.
#
# This is a CROSS-DOMAIN primitive: it consumes one leg from a
# sovereign curve (e.g. UST 10Y yield) and one leg from an OIS curve
# (e.g. SOFR 10Y rate) and produces the asset-swap-spread style
# differential (sovereign yield − OIS rate) × 100 in bps.
#
# Why this primitive exists separately from cross_market_spread
# -------------------------------------------------------------
# The existing ``cross_market_spread`` tools (sovereign + OIS) are
# SAME-DOMAIN primitives — they take two curves of the same type
# (sovereign vs sovereign, or OIS vs OIS) and use a single
# ``field_name`` for both legs.  The cross-domain spread cannot use
# the same shape because the two legs use different field_name
# mnemonics on the wire: sovereign yields are typically
# ``YLD_YTM_MID``, OIS par swap rates are ``PX_LAST``.  The new
# ``shared.analytics.rates_fetch.fetch_cross_domain_pair`` fetcher
# accepts the two (curve_family, field_name) pairs explicitly.
#
# Sign convention
# ---------------
# spread = (sovereign_yield − ois_rate) × 100  (bps)
# Positive means the SOVEREIGN trades CHEAP to OIS (asset-swap-
# spread convention; matches how Bloomberg / DLib quote
# US-Treasury vs SOFR-OIS spreads).  Documented in the
# ``methodology.assumptions`` block as the locked convention.
# =============================================================================

tool:
  name: calculate_swap_spread_tool
  domain: ois
  description: |
    Cross-domain swap spread between a sovereign yield curve and an
    OIS curve at the same tenor (e.g. UST 10Y vs SOFR 10Y, BUND 5Y
    vs ESTR 5Y, GILT 2Y vs SONIA 2Y).

    Sign convention: spread = (sovereign_yield − ois_rate) × 100
    in bps.  Positive means the sovereign trades CHEAP to the OIS
    curve (the canonical "asset-swap spread" sign).

    Emits:
      - ``current_metrics``: snapshot of the latest observation
        (current spread, daily/weekly/monthly bps changes, 252-day
        rolling z-score, trailing 252-day high/low/percentile, plus
        each leg's latest level).
      - bespoke wire-frozen ``time_series``
        (List[SwapSpreadTimeSeriesRow]) preserved for the
        consistent shape every other rates primitive emits.
      - canonical ``time_series_spread`` (units = BPS) and
        ``time_series_zscore`` (units = Z_SCORE) for the
        primitive→operator bridge.

    All three time-series payloads are built from the same display
    DataFrame and cannot drift.

  category: desk_invariant_primitive

conventions:

  # ---------------------------------------------------------------------------
  # Z-score window length (trading days)
  # ---------------------------------------------------------------------------
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading-day count for a 1-year rolling window.  Matches every
      sovereign rates tool AND every OIS tool — the cross-config
      lint enforces the value match across all tools that declare
      this convention.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Minimum observations before the rolling stat is emitted
  # ---------------------------------------------------------------------------
  z_score_min_periods:
    value: 60
    source: team_judgment_pending_review
    rationale: >-
      ~3 months of observations before the rolling mean / std are
      deemed trustworthy.  Matches the other rates tools.
    valid_range: [20, 252]

  # ---------------------------------------------------------------------------
  # Standard-deviation degrees of freedom
  # ---------------------------------------------------------------------------
  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Sample standard deviation (Bessel-corrected, ddof=1).  Matches
      pandas' default and every other rates tool.

  # ---------------------------------------------------------------------------
  # Calendar-day buffer for the fetch window
  # ---------------------------------------------------------------------------
  z_score_buffer_multiplier:
    value: 1.5
    source: derived_from_window
    rationale: >-
      Calendar-day buffer added to the fetch window so the rolling
      z-score AND the trailing range stat are both fully populated
      from the first displayed trading day.  Matches every sovereign
      and OIS rates tool.
    valid_range: [1.2, 2.0]

  # ---------------------------------------------------------------------------
  # Period-change offsets (in trading-day rows after ffill)
  # ---------------------------------------------------------------------------
  daily_change_offset_rows:
    value: 2
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-2] = 1 trading day back.  The spread series
      is already in bps so changes go through period_changes(
      already_bps=True) — plain subtraction.
    valid_range: [2, 5]

  weekly_change_offset_rows:
    value: 6
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-6] = 5 trading days back ≈ 1 calendar week.
    valid_range: [5, 10]

  monthly_change_offset_rows:
    value: 22
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-22] = ~1 calendar month of trading days.
    valid_range: [20, 30]

  # ---------------------------------------------------------------------------
  # Trailing range / percentile window — LOCKED at 252 in V1
  # ---------------------------------------------------------------------------
  # The output schema's field names (high_252d_bps, low_252d_bps,
  # percentile_252d) are wire-frozen.  compute() raises
  # NotImplementedError if this is set to anything other than 252;
  # see methodology.planned_extensions.  Same wire-freeze rationale
  # as every other cross-market / curve-spread tool.
  trailing_range_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      1Y trailing for high/low/percentile.  Locked at 252 in V1
      because the wire field names embed the number.

  # ---------------------------------------------------------------------------
  # Forward-fill limit for missing observations
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Bridge up to one trading week of missing data across holiday
      gaps.  Matches every other rates tool (cross-config lint
      enforces the value match).
    valid_range: [1, 10]

  # ---------------------------------------------------------------------------
  # Output rounding precision — bps
  # ---------------------------------------------------------------------------
  bps_round_decimals:
    value: 2
    source: team_judgment_pending_review
    rationale: >-
      Round bps output (current spread, daily/weekly/monthly
      changes, trailing high/low) to 0.01 bps.  Threaded into
      period_changes(decimals=...) so daily/weekly/monthly_change_bps
      respect the YAML — same boundary-shadowing fix class as the
      OIS curve_spread P2 fix (PR #63).
    valid_range: [0, 6]

  # ---------------------------------------------------------------------------
  # Output rounding precision — z-score
  # ---------------------------------------------------------------------------
  z_score_round_decimals:
    value: 4
    source: team_judgment_pending_review
    rationale: >-
      Round z-score output to 4 decimals.  Threaded explicitly to
      every safe_float call on the z-score column at the output
      boundary (snapshot + bespoke time_series + canonical
      time_series_zscore) so a YAML override above 4 is NOT
      silently truncated by safe_float's own default of 4 — day-
      one application of the OIS curve_spread P2 fix.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Sovereign-leg default field — cross-domain-specific name
  # ---------------------------------------------------------------------------
  # Distinct convention name from sovereign tools' ``default_field_name``
  # because this primitive declares BOTH a sovereign-leg field and an
  # OIS-leg field.  If we reused either sibling name, the cross-config
  # lint would treat the conventions as a single shared knob; in fact
  # they are two distinct ones (one per leg).  The value still matches
  # the sovereign sibling tools' value (YLD_YTM_MID) so a future drift
  # in either side surfaces in human review even if the lint can't
  # mechanically catch it.
  sovereign_leg_default_field:
    value: YLD_YTM_MID
    source: bloomberg_field_convention
    rationale: >-
      Mid yield-to-maturity is the canonical sovereign observation —
      same value as the sovereign tools' ``default_field_name``.
      LLM/HTTP wrappers must use the empty/None sentinel so this
      default flows through (curve_move_classifier wrapper-shadowing
      pattern, commit b2605ee).

  # ---------------------------------------------------------------------------
  # OIS-leg default field — cross-domain-specific name
  # ---------------------------------------------------------------------------
  ois_leg_default_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: >-
      Mid par-swap rate is the canonical OIS observation — same
      value as the OIS tools' ``default_swap_rate_field``.  Distinct
      convention name from that sibling for the same cross-domain-
      double-leg reason as ``sovereign_leg_default_field``.

methodology:
  what_it_does: |
    Fetches one (sovereign_curve_family, tenor, sovereign_field) leg
    + one (ois_curve_family, tenor, ois_field) leg via
    ``fetch_cross_domain_pair``, pivots them into a wide frame on
    ``curve_family``, ffills holiday gaps, and computes the spread
    as ``(sovereign_yield − ois_rate) × 100`` in bps.  Returns a
    snapshot with the current spread, daily / weekly / monthly bps
    changes, rolling 252d z-score, trailing 252d high / low /
    percentile, each leg's latest level, the bespoke wire-frozen
    time_series, AND the two canonical TimeSeries payloads
    (spread + z-score) for the primitive→operator bridge.

  assumptions:
    - "Sovereign yields and OIS par swap rates are stored as percent
       (4.25 = 4.25%); spread output in bps."
    - "Sign convention: spread = (sovereign_yield − ois_rate) × 100.
       Positive means the sovereign trades CHEAP to OIS (asset-swap-
       spread convention).  This is locked in code; the validator
       does NOT support inverting the sign — pass the legs in the
       canonical order or apply a sign flip downstream."
    - "Same z-score conventions as the other rates tools (cross-
       config lint enforces value-agreement on shared convention
       names where applicable)."
    - "Daily / weekly / monthly bps changes use period_changes with
       already_bps=True (plain subtraction; the spread series is
       already in bps).  bps_round_decimals is threaded through
       explicitly so the YAML is authoritative."
    - "lookback_days controls the *display* window only.  The rolling
       z-score window and the trailing range window are independent
       conventions in this YAML."
    - "Observation cutoff is anchored to the data's latest observation
       date (not date.today()), matching the other OIS-rooted tools.
       The cutoff anchoring follows OIS convention because this
       primitive lives in the OIS package and shares the OIS MCP
       server."
    - "The two legs use DIFFERENT Bloomberg field_name mnemonics —
       sovereign_leg_default_field=YLD_YTM_MID, ois_leg_default_field
       =PX_LAST.  This is why we cannot reuse the same-domain
       cross_market_spread primitive (which assumes a single
       field_name across both legs)."
    - "PR 21 disclosure (par-par approximation).  This primitive
       computes the ``par-par`` asset-swap-spread approximation:
       (sovereign_yield − ois_rate) × 100 in bps at MATCHED tenor.
       This is the standard desk quick-and-dirty ASW used for
       relative-value screens.  The TRUE asset-swap-spread (the
       present-value-equivalent spread that prices the bond as a
       floating-rate note) requires bond-level metadata not yet
       ingested: coupon rate, accrued interest schedule, day-count
       convention, dirty-price.  The error magnitude between par-par
       and true ASW is typically 1-3 bps for liquid sovereigns but
       can grow to 10+ bps for off-the-run / high-coupon bonds.
       Workspace methodology cards MUST surface this disclosure
       (the lineage step's params include the convention so the
       methodology renderer reads it).  V2 work: ingest the
       bond-level metadata, add a ``convention: [par_par,
       present_value_asw]`` knob with PV_ASW computed when caller
       opts in."
    - "PR4 SYMMETRIC CROSS-REFERENCE TO asset_swap_spread (catalog
       guardrail — both primitives' methodology cards cite each
       other).  ``rates_agent/ois/tools/asset_swap_spread/`` is the
       per-bond INGESTED Bloomberg ASW: ``ASSET_SWAP_SPD_MID``
       surfaced VERBATIM (P12 vendor-ingest discipline, source tag
       ``vendor_ingested``).  THIS primitive (swap_spread) is the
       cross-domain par-par approximation
       ``(sovereign_yield - ois_rate) * 100`` computed in-process.
       The two primitives are NOT interchangeable:
       (1) Granularity — asset_swap_spread is per-bond (vendor_ticker
       key against the sovereign_cash_bonds universe); swap_spread
       is per (curve_family, tenor) on the GT-generic curve.
       (2) Source — asset_swap_spread surfaces the vendor's
       source-of-record per P12; swap_spread is a computed
       approximation.
       (3) Error — the par-par approximation error vs the true
       Bloomberg ASW is typically 1-3 bps for liquid sovereigns but
       can grow to 10+ bps for off-the-run / high-coupon bonds
       (PR 21 disclosure above).
       Choose asset_swap_spread when a specific cash-bond ASW is
       needed and the bond is in the sovereign_cash_bonds universe;
       choose swap_spread when a curve view is needed or the
       per-bond Bloomberg field is unavailable.  The symmetric cite
       FROM asset_swap_spread points back here under that primitive's
       methodology.assumptions."

  citations: []

  planned_extensions:
    - "trailing_range_window_days: configurable.  Currently locked
       at 252 because the output fields high_252d_bps / low_252d_bps
       / percentile_252d embed the number.  Path to configurability
       mirrors the other cross-market tools' planned_extensions:
       rename schema fields + add trailing_window_days to the
       output; remove the NotImplementedError guard in compute()."
    - "Effective trailing-range clipping by lookback_days.  Today
       compute() trims the series to lookback_days BEFORE computing
       the trailing high/low/percentile, so when lookback_days
       corresponds to fewer than 252 trading days the '252d' fields
       are actually min(252, available)-day stats.  Matches the same
       bug class on the other cross-market tools.  Fix in a separate
       PR: compute the trailing stats on the FULL fetched-and-
       cleaned series (pre-trim)."
    - "Spread sign convention (sovereign − ois, not ois − sovereign).
       Today the validator only enforces that the two legs come from
       different domains; the SIGN is locked.  An optional caller
       knob to invert is documented here so future readers know it
       was considered and deferred."
