# =============================================================================
# calculate_ois_cross_market_spread_tool — tool configuration
# =============================================================================
# Canonical record of the OIS cross-market spread tool's conventions
# and methodology.  Loaded by ``shared.config.load_tool_config`` at
# compute() time.  Mirrors sovereign cross_market_spread 1:1 — every
# convention with the same name carries the same numeric value, so
# the cross-config lint stays clean as the OIS domain comes online.
#
# In V1 deterministic mode there is NO LLM-facing override path for
# conventions.  See docs/architecture/tool_architecture.md.
# =============================================================================

tool:
  name: calculate_ois_cross_market_spread_tool
  domain: ois
  description: |
    OIS cross-market rate differential between the same tenor on two
    different OIS curves (e.g. SOFR 2Y − ESTR 2Y, the G4 policy
    differential; SOFR 5Y − SONIA 5Y; 10Y SOFR − ESTR).  The cleanest
    measure of relative central-bank policy stance across currencies:
    strips out every cross-border distortion except the reaction
    function itself.

    spread = (cf1_rate − cf2_rate) × 100  (bps)

    Emits:
      - ``current_metrics``: snapshot of the latest observation
        (current spread, daily/weekly/monthly bps changes, 252-day
        rolling z-score, trailing 252-day high/low/percentile, plus
        each leg's latest par swap rate).

      - bespoke wire-frozen ``time_series`` (List[
        OISCrossMarketSpreadTimeSeriesRow]) preserved for
        backward-compat with the legacy single-file tool, AND two
        canonical ``shared.schemas.time_series.TimeSeries`` payloads
        for the upcoming primitive-to-operator bridge:

        * ``time_series_spread`` (units = BPS)   — the spread series
        * ``time_series_zscore`` (units = Z_SCORE) — the rolling z-score

    All three series are built from the same display DataFrame so they
    cannot drift.  "Rate" rather than "yield" terminology because OIS
    quotes are par swap rates, not bond yields — see
    ``current_metrics.curve_family_1_rate`` / ``curve_family_2_rate``.

conventions:

  # ---------------------------------------------------------------------------
  # Z-score window length (trading days)
  # ---------------------------------------------------------------------------
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading-day count for a 1-year rolling window.  Matches every
      sovereign rates tool AND OIS rate_level / curve_spread — the
      cross-config lint enforces the match.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Minimum observations before the rolling stat is emitted
  # ---------------------------------------------------------------------------
  z_score_min_periods:
    value: 60
    source: team_judgment_pending_review
    rationale: >-
      ~3 months of observations before the rolling mean / std are
      deemed trustworthy.  Matches the other rates tools.
    valid_range: [20, 252]

  # ---------------------------------------------------------------------------
  # Standard-deviation degrees of freedom
  # ---------------------------------------------------------------------------
  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Sample standard deviation (Bessel-corrected, ddof=1).  Matches
      pandas' default and the convention every other rates tool uses.

  # ---------------------------------------------------------------------------
  # Calendar-day buffer for the fetch window
  # ---------------------------------------------------------------------------
  z_score_buffer_multiplier:
    value: 1.5
    source: derived_from_window
    rationale: >-
      Calendar-day buffer added to the fetch window so the rolling
      z-score AND the trailing range stat are both fully populated
      from the first displayed trading day.  1.5x trading-day window
      covers weekends + holidays.  Matches every sovereign rates tool.
    valid_range: [1.2, 2.0]

  # ---------------------------------------------------------------------------
  # Period-change offsets (in trading-day rows after ffill)
  # ---------------------------------------------------------------------------
  daily_change_offset_rows:
    value: 2
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-2] = 1 trading day back.  The spread series is
      already in bps so changes go through period_changes(already_bps=True),
      i.e. plain subtraction (no *100 multiplier).
    valid_range: [2, 5]

  weekly_change_offset_rows:
    value: 6
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-6] = 5 trading days back ≈ 1 calendar week.
    valid_range: [5, 10]

  monthly_change_offset_rows:
    value: 22
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-22] = ~1 calendar month of trading days.
    valid_range: [20, 30]

  # ---------------------------------------------------------------------------
  # Trailing range / percentile window — LOCKED at 252 in V1
  # ---------------------------------------------------------------------------
  # The output schema's field names (high_252d_bps, low_252d_bps,
  # percentile_252d) are wire-frozen for backward-compat with the
  # legacy single-file OIS tool and any future OIS UI that consumes
  # them.  compute() raises NotImplementedError if this is set to
  # anything other than 252; see methodology.planned_extensions for
  # the path to make it configurable.  Same wire-freeze rationale as
  # sovereign cross_market_spread.
  trailing_range_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      1Y trailing for high/low/percentile.  Locked at 252 in V1
      because the wire field names embed the number.

  # ---------------------------------------------------------------------------
  # Forward-fill limit for missing observations
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Bridge up to one trading week of missing data across holiday
      gaps.  Matches every sovereign rates tool.
    valid_range: [1, 10]

  # ---------------------------------------------------------------------------
  # Output rounding precision — bps
  # ---------------------------------------------------------------------------
  bps_round_decimals:
    value: 2
    source: team_judgment_pending_review
    rationale: >-
      Round bps output (current spread, daily/weekly/monthly changes,
      trailing high/low) to 0.01 bps.  Display precision; matches the
      precision Bloomberg / DLib use for swap-curve metrics.  This
      value is also threaded into period_changes(decimals=...) so
      daily/weekly/monthly_change_bps respect the YAML — the
      delta_bps default of 2 would otherwise silently shadow this
      override (same boundary-shadowing fix class as butterfly).
    valid_range: [0, 6]

  # ---------------------------------------------------------------------------
  # Output rounding precision — z-score
  # ---------------------------------------------------------------------------
  z_score_round_decimals:
    value: 4
    source: team_judgment_pending_review
    rationale: >-
      Round z-score output to 4 decimals.  Threaded explicitly to
      every safe_float call on the z-score column at the output
      boundary (snapshot, bespoke time_series, canonical
      time_series_zscore), so a YAML override above 4 is NOT silently
      truncated by safe_float's own default of 4.  This is the day-one
      application of the P2 fix Codex caught on OIS curve_spread
      (PR #63).
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Default Bloomberg observation field — OIS-specific name
  # ---------------------------------------------------------------------------
  # Sovereign tools use ``default_field_name: YLD_YTM_MID`` (mid
  # yield-to-maturity).  OIS quotes are par swap rates, so the
  # canonical Bloomberg observation is ``PX_LAST`` (mid par-swap
  # rate).  The two values are semantically distinct, so the
  # convention is named ``default_swap_rate_field`` here — otherwise
  # the cross-config lint would flag a value disagreement between
  # sovereign tools (YLD_YTM_MID) and OIS tools (PX_LAST) on the
  # same convention name.  Matches OIS rate_level + curve_spread.
  default_swap_rate_field:
    value: PX_LAST
    source: bloomberg_field_convention
    rationale: >-
      Mid par-swap rate is the canonical OIS observation.  LLM/HTTP
      wrappers must use the empty/None sentinel so this default flows
      through — see the wrapper-shadowing fix from sovereign
      curve_move_classifier (commit b2605ee).

methodology:
  what_it_does: |
    Fetches two (curve_family, tenor) OIS par-swap-rate series — one
    per curve — pivots them into a wide frame, ffills holiday gaps,
    and computes the spread as ``(cf1_rate − cf2_rate) × 100`` (bps).
    Returns a snapshot with the current spread, daily / weekly /
    monthly bps changes, rolling 252d z-score, trailing 252d high /
    low / percentile, each leg's latest par swap rate, the bespoke
    wire-frozen time_series, AND the two canonical TimeSeries
    payloads (spread + z-score) for the primitive-to-operator bridge.

  assumptions:
    - "OIS par swap rates stored as percent (4.25 = 4.25%); spread output in bps."
    - "Same z-score conventions as the other rates tools."
    - "Spread direction convention: cf1 - cf2 (e.g. for SOFR-ESTR pass
       cf1='USD_SOFR_OIS', cf2='EUR_ESTR_OIS').  Documented under
       planned_extensions because the choice is a desk-style call."
    - "Daily / weekly / monthly bps changes use period_changes with
       already_bps=True (plain subtraction; the spread series is
       already in bps).  bps_round_decimals is threaded through
       explicitly so the YAML is authoritative."
    - "lookback_days controls the *display* window, NOT the rolling
       z-score window or the trailing range window — those are
       independent conventions in this YAML."
    - "Observation cutoff is anchored to the data's latest observation
       date (not date.today()), matching the legacy single-file OIS
       cross_market_spread.  Sovereign cross_market_spread anchors to
       date.today() — the inconsistency mirrors the same divergence on
       yield_levels vs rate_level and curve_spread, and will be
       reconciled in a separate PR."

  citations: []

  planned_extensions:
    - "trailing_range_window_days: configurable.  Currently locked at
       252 because the output fields high_252d_bps / low_252d_bps /
       percentile_252d embed the number.  Path to configurability
       mirrors sovereign cross_market_spread's planned_extensions:
       rename schema fields to high_window_bps / low_window_bps /
       percentile_window + add trailing_window_days to the output;
       update any future OIS UI to read the new names; remove the
       NotImplementedError guard in compute()."
    - "Effective trailing-range clipping by lookback_days.  Today
       compute() trims the series to lookback_days BEFORE computing
       the trailing high/low/percentile, so when lookback_days
       corresponds to fewer than 252 trading days the '252d' fields
       are actually min(252, available)-day stats.  Matches the same
       bug class on sovereign cross_market_spread + butterfly.  Fix
       in a separate PR: compute the trailing stats on the FULL
       fetched-and-cleaned series (pre-trim)."
    - "Sovereign-vs-OIS cutoff anchoring divergence.  OIS
       cross_market_spread anchors the lookback cutoff to the latest
       data observation (wide.index[-1].date()); sovereign anchors to
       date.today().  Aligning them is a separate PR alongside the
       matching yield_levels / curve_spread anchoring fix."
    - "Spread direction convention (cf1 - cf2, not cf2 - cf1).  Today
       the validator only enforces cf1 != cf2; the DIRECTION is the
       caller's responsibility.  Subjective methodology choice;
       documented so future readers know it was considered and
       deferred."
