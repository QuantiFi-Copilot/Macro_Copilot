# =============================================================================
# calculate_butterfly_tool — tool configuration
# =============================================================================
# Canonical record of the butterfly (curvature) tool's conventions and
# methodology.  Loaded by `shared.config.load_tool_config` at compute()
# time.  Unlike yield_levels, this tool has NO separate batch/card
# reimplementation — only the MCP wrapper and /detail/butterfly endpoint
# call into compute(), so this YAML is the single source of truth.
#
# In V1 deterministic mode there is NO LLM-facing override path for
# conventions; the LLM cannot ask for non-standard windows.  See
# docs/architecture/tool_architecture.md.
#
# Bumping any value in `conventions:` is a deliberate methodology change.
# The cross-config consistency lint (shared.config.lint) enforces that
# z_score_window_days, z_score_min_periods, z_score_ddof,
# z_score_buffer_multiplier, ffill_limit_days, and default_field_name
# agree across curve_spread + curve_move_classifier + yield_levels +
# butterfly.  Editing any of those here must be matched in the others.
# =============================================================================

tool:
  name: calculate_butterfly_tool
  domain: sovereign_bonds
  description: |
    3-point butterfly (curvature) on a single sovereign yield curve:
    butterfly_bps = (2 × belly − short − long) × 100.  Positive ⇒ belly
    cheap, negative ⇒ belly rich.  Returns the current butterfly with
    daily change, rolling z-score, trailing 252-day high/low/percentile,
    component wing spreads, and the per-leg yields, plus the full
    time-series for charting.

conventions:

  # ---------------------------------------------------------------------------
  # Z-score window length (trading days)
  # ---------------------------------------------------------------------------
  z_score_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      Trading-day count for a 1-year rolling window.  Same convention
      as curve_spread / curve_move_classifier / yield_levels — the
      consistency lint enforces the match.
    valid_range: [60, 1260]

  # ---------------------------------------------------------------------------
  # Minimum observations before the rolling stat is emitted
  # ---------------------------------------------------------------------------
  z_score_min_periods:
    value: 60
    source: team_judgment_pending_review
    rationale: >-
      ~3 months of observations before the rolling mean / std are
      deemed trustworthy.  Matches the other rates tools.
    valid_range: [20, 252]

  # ---------------------------------------------------------------------------
  # Standard deviation degrees of freedom
  # ---------------------------------------------------------------------------
  z_score_ddof:
    value: 1
    source: industry_standard_sample_std
    rationale: >-
      Sample standard deviation (Bessel-corrected, ddof=1).  Matches
      pandas' default and the convention every other rates tool uses.

  # ---------------------------------------------------------------------------
  # Calendar-day buffer for the fetch window
  # ---------------------------------------------------------------------------
  z_score_buffer_multiplier:
    value: 1.5
    source: derived_from_window
    rationale: >-
      Calendar-day buffer added to the fetch window so the rolling
      z-score AND the trailing range stat are both fully populated
      from the first displayed trading day.  1.5x trading-day window
      covers weekends + holidays.  Matches curve_spread / yield_levels.
    valid_range: [1.2, 2.0]

  # ---------------------------------------------------------------------------
  # Daily-change row offset
  # ---------------------------------------------------------------------------
  daily_change_offset_rows:
    value: 2
    source: trading_day_convention
    rationale: >-
      iloc[-1] vs iloc[-2] = 1 trading day back.  Butterfly's daily
      change is a plain subtraction (the series is already in bps).
    valid_range: [2, 5]

  # ---------------------------------------------------------------------------
  # Trailing range / percentile window — LOCKED at 252 in V1
  # ---------------------------------------------------------------------------
  # The output schema's field names (high_252d_bps, low_252d_bps,
  # percentile_252d) are wire-frozen for frontend backward-compat —
  # ButterflyView.tsx reads them by name.  compute() raises
  # NotImplementedError if this is set to anything other than 252;
  # see methodology.planned_extensions for the path to make it
  # configurable.
  trailing_range_window_days:
    value: 252
    source: industry_standard_1y_window
    rationale: >-
      1Y trailing for high/low/percentile.  Locked at 252 in V1
      because the wire field names embed the number.

  # ---------------------------------------------------------------------------
  # Forward-fill limit for missing observations
  # ---------------------------------------------------------------------------
  ffill_limit_days:
    value: 5
    source: team_judgment_pending_review
    rationale: >-
      Bridge up to one trading week of missing data across holiday
      gaps.  Same as curve_spread + curve_move_classifier +
      yield_levels; the consistency lint enforces the match.
    valid_range: [1, 10]

  # ---------------------------------------------------------------------------
  # Output rounding precision — bps
  # ---------------------------------------------------------------------------
  bps_round_decimals:
    value: 2
    source: team_judgment_pending_review
    rationale: >-
      Round bps output (current butterfly, daily change, wing spreads,
      trailing high/low) to 0.01 bps.  Display precision; matches the
      precision Bloomberg / DLib use for sovereign curve metrics.  This
      value is also passed explicitly to delta_bps so daily_change_bps
      respects the YAML — see compute.py for the routing.
    valid_range: [0, 6]

  # ---------------------------------------------------------------------------
  # Output rounding precision — z-score
  # ---------------------------------------------------------------------------
  z_score_round_decimals:
    value: 4
    source: team_judgment_pending_review
    rationale: >-
      Round z-score output to 4 decimals.  Display precision; further
      decimals are noise given the underlying price precision.  Matches
      curve_spread / yield_levels.
    valid_range: [0, 8]

  # ---------------------------------------------------------------------------
  # Default Bloomberg observation field
  # ---------------------------------------------------------------------------
  default_field_name:
    value: YLD_YTM_MID
    source: bloomberg_field_convention
    rationale: >-
      Mid yield-to-maturity is the canonical sovereign-yield
      observation.  LLM/HTTP wrappers must use the empty/None
      sentinel so this default flows through — see the wrapper
      shadowing fix from the curve_move_classifier migration
      (commit b2605ee).

methodology:
  what_it_does: |
    Fetches three (curve_family, tenor) yield series — short, belly,
    long — pivots them into a wide frame, ffills holiday gaps, and
    computes the butterfly as `(2 * belly - short - long) * 100` (bps).
    Returns a snapshot with the current butterfly, 1-day change,
    rolling z-score, trailing 252d high/low/percentile, the two
    component wing spreads (belly-short and long-belly), and each
    leg's latest yield, plus the full butterfly+z_score time series
    for charting.

  assumptions:
    - "Yields stored as percent (4.25 = 4.25%); butterfly output in bps."
    - "Same z-score conventions as the other rates tools."
    - "Equal-weighted ('plain') butterfly = 2*belly - short - long.
       Some desks prefer 50-50 or duration-neutral weights; that is a
       methodology choice documented under planned_extensions, not a
       config knob."
    - "Daily change uses delta_bps (subtraction; series is already in
       bps), with the bps_round_decimals convention passed in
       explicitly so the YAML is authoritative."
    - "lookback_days controls the *display* window, NOT the rolling
       z-score window or the trailing range window — those are
       independent conventions in this YAML."

  citations: []

  planned_extensions:
    - "trailing_range_window_days: configurable.  Currently locked at
       252 because the output fields high_252d_bps / low_252d_bps /
       percentile_252d embed the number.  Path to configurability:
       rename schema fields to high_window_bps / low_window_bps /
       percentile_window + add trailing_window_days to the output;
       update ButterflyView.tsx to read the new names; remove the
       NotImplementedError guard in compute()."
    - "Effective trailing-range clipping by lookback_days.  Today
       compute() trims the series to lookback_days BEFORE computing
       the trailing high/low/percentile, so when lookback_days
       corresponds to fewer than 252 trading days the '252d' fields
       are actually min(252, available)-day stats.  The SQL parity
       fixture (tests/test_butterfly_sql_validation.py) encodes the
       same behaviour, so flipping it now would silently re-target the
       parity check.  Fix in a separate PR: compute the trailing stats
       on the FULL fetched-and-cleaned series (pre-trim), regenerate
       the SQL parity fixture, and bump the methodology citation."
    - "Equal-weighted vs duration-neutral butterfly.  Today: plain
       2*belly - short - long.  Some desks prefer 50-50 weights or
       duration-neutral weights for hedging analysis.  Subjective
       methodology choice; documented here so future readers know it
       was considered and deferred."
