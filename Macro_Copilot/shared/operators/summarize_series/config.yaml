operator:
  name: summarize_series
  method_family: aggregation
  version: "1.0.0"
  description: >-
    Collapse a typed Series to ONE scalar summary statistic
    (mean / median / std / sum / count / last / first), emitted as a
    ScalarMetric carrying the input's units.  This is the canonical
    "what is the average / std / current value of X" terminal.
    Always reports dispersion in lineage.  Finance-blind.

defaults:
  statistic:
    value: mean
    source: operator_v1_default
    rationale: >-
      Default ``mean`` matches the canonical desk summary (the average
      of X over the period).  ``median`` is the robust alternative;
      ``std``/``sum``/``count`` cover the dispersion / aggregation
      cases when the central tendency is not the deliverable; ``last``
      returns the latest finite observation (the "current value" of
      the series) and ``first`` the earliest.
    valid_values: [mean, median, std, sum, count, last, first]

  dispersion:
    value: std
    source: operator_v1_default
    rationale: >-
      Always report dispersion alongside the central tendency —
      mirrors the ``conditional_aggregate`` discipline so per-regime
      summaries have parity with event-study summaries.  Default
      ``std`` is the canonical sample standard deviation; ``mad``
      (median-absolute-deviation) is the robust alternative for
      heavy-tailed distributions; ``none`` opts out (rare; only when
      the caller has a methodology reason to suppress the
      dispersion record).
    valid_values: [std, mad, none]

methodology:
  what_it_does: >-
    Given a typed ``Series``, the operator:

      1. Drops NaN cells from the payload (the rolling-fit warmup
         and any per-regime no-coverage gaps would otherwise bias
         the statistic).
      2. Applies the chosen ``statistic`` — mean / median / std /
         sum / count / last / first — on the cleaned payload.
      3. Computes the chosen ``dispersion`` (std / mad) on the
         same cleaned payload, OR records "none" when dispersion
         is suppressed.
      4. Returns a ``ScalarMetric``: a single finite scalar with
         ``metric_key`` equal to the statistic name and units
         inherited 1:1 from the input.  Lineage records the central-
         tendency value, dispersion value, n_observations, and
         n_dropped (for diagnostic clarity).
  planned_extensions:
    - "weighted aggregations (weighted mean / weighted median)"
    - "trimmed-mean and winsorized statistics for tail-robust summaries"

# ============================================================================
# CARD — the L3 Composer's view of this operator (PR-2 of open-DAG PoC).
# ============================================================================
card:
  one_line: >-
    THE single-number summary operator: collapse a whole Series to ONE
    full-sample summary statistic (mean / median / std / sum / count /
    last / first), emitted as a ScalarMetric.  This is the operator for
    "what is the average / standard deviation / median / CURRENT value
    of X over the period" — a single scalar answer, NOT a time series.
  when_to_use:
    - "PRIMARY: User asks for the mean / average of a Series over the full sample (statistic='mean')."
    - "PRIMARY: User asks for the standard deviation / volatility of a Series as a single number over the full sample (statistic='std')."
    - "PRIMARY: User asks for the median / sum / count of a Series over the full sample (statistic='median'/'sum'/'count')."
    - "CURRENT / LATEST VALUE: User asks 'what is the current / latest X' (e.g. 'the current US 10Y yield') — wrap the Series leaf in summarize_series(statistic='last') to extract the latest finite observation as a ScalarMetric.  Use statistic='first' for the earliest."
    - "MEAN AND STD TOGETHER: a single summarize_series node with statistic='mean' AND dispersion='std' returns the mean as the ScalarMetric value and records the std in lineage.  This is the sanctioned single-node way to answer 'mean and std of X' (the primary scalar is the mean; the std is the reported dispersion)."
  when_not_to_use:
    - "If the user wants a ROLLING / time-varying statistic (a moving average / rolling vol AS A TIME SERIES, one value per date), use rolling_statistic — that emits a Series over time; summarize_series emits ONE value."
    - "If the user wants where today's value sits vs its own history (z-score / percentile), use rolling_zscore or percentile_rank."
    - "If the user wants the per-offset summary of an event-window panel, use conditional_aggregate (Panel → Series-by-offset)."
    - "If the user wants THREE OR MORE distinct statistics, or a statistic this operator does not support (min / max), one summarize_series node cannot bundle them — the catalogue has no multi-statistic bundler and a ShapeSpec has ONE terminal.  Pick the single most important statistic, or refuse with a clarification naming the limit."
  upstream_requirements:
    - "One Series.  No alignment needed for a standalone summary (single input).  For regime work the Series is typically masked by apply_mask first."
  downstream_pattern:
    - "Output is a ScalarMetric — a single finite scalar carrying the input's units, with metric_key equal to the statistic name.  This is a TERMINAL answer artifact: summarize_series IS the terminal node for any single-number summary, no further wiring needed."
  knobs_quick_ref:
    statistic: "mean (default) | median (robust) | std | sum | count | last (latest/current value) | first (earliest value).  NOTE: no min/max — use rolling_statistic for those (as a rolling Series)."
    dispersion: "std (DEFAULT — computed + reported in lineage alongside the statistic) | mad (robust) | none (suppress). RULE OF THUMB: for 'mean AND std' set statistic='mean', dispersion='std' (the mean is the ScalarMetric value; the std is recorded in lineage). For a SINGLE stat only (e.g. 'the average of X', nothing else) set dispersion='none' so you return strictly that one number. Do not leave dispersion at its 'std' default when the user asked for one stat only — that would report a std they did not request."
  example_shapes:
    - description: "STANDALONE single-stat summary — the average of a Series over the full sample.  summarize_series IS the terminal."
      shape: "Series -> summarize_series(statistic='mean') -> ScalarMetric(mean)  [terminal]"
    - description: "CURRENT / LATEST value — 'what is the current US 10Y yield'.  The Series leaf is collapsed to its latest finite point."
      shape: "Series -> summarize_series(statistic='last') -> ScalarMetric(last)  [terminal]"
    - description: "Mean AND std of a Series in ONE node (mean is the scalar value; std recorded in lineage)."
      shape: "Series -> summarize_series(statistic='mean', dispersion='std') -> ScalarMetric(mean; std in lineage)  [terminal]"
  sibling_operators:
    - rolling_statistic: "The TIME-VARYING sibling — use when the user wants the stat AS A SERIES over time (moving average / rolling vol), not a single number.  summarize_series = one scalar; rolling_statistic = a Series."
    - conditional_aggregate: "Per-offset (panel-flattening) sibling — use when input is WindowedPanel, not Series."
    - apply_mask: "Common upstream to produce a regime-conditioned sample for the secondary regime-delta pattern."
    - series_arithmetic: "Downstream for the cross-regime delta (subtract) in the secondary pattern."
  intent_hints: [transform, lookup]
